<style>
/* Layout: exam sheet on an ink-blue ground; single column, text and questions side by side only on wide screens. Highlighter yellow marks choices. */
:root{
  --bg:#eef1f6; --paper:#ffffff; --ink:#14213d; --muted:#5b6782; --line:#d6dce8;
  --accent:#2944a8; --accent-ink:#ffffff; --mark:#ffe45c; --mark-ink:#14213d;
  --ok:#17804f; --ok-bg:#e3f5ec; --bad:#c23a2b; --bad-bg:#fbe9e6; --warn:#a86a00; --warn-bg:#fff3d6;
  --soft:#f5f7fb;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1324; --paper:#161e33; --ink:#e7ecf7; --muted:#9aa6c2; --line:#2a3552;
  --accent:#8fa8ff; --accent-ink:#0d1324; --mark:#e9cf3f; --mark-ink:#14213d;
  --ok:#55d398; --ok-bg:#123326; --bad:#ff8a7a; --bad-bg:#3a1a17; --warn:#f5c15a; --warn-bg:#3a2e12; --soft:#1b2440; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1324; --paper:#161e33; --ink:#e7ecf7; --muted:#9aa6c2; --line:#2a3552;
  --accent:#8fa8ff; --accent-ink:#0d1324; --mark:#e9cf3f; --mark-ink:#14213d;
  --ok:#55d398; --ok-bg:#123326; --bad:#ff8a7a; --bad-bg:#3a1a17; --warn:#f5c15a; --warn-bg:#3a2e12; --soft:#1b2440; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(30px,5vw,46px);font-weight:800;letter-spacing:-.02em}
h2{font-size:24px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:10px 18px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.small{font-size:14px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px;border-bottom:1px solid var(--line);margin-bottom:28px}
.top .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em;background:none;border:0;padding:0}
.brand span{background:var(--mark);color:var(--mark-ink);padding:0 6px;border-radius:4px;margin-left:4px}
.timer{font-family:var(--f-mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:8px;background:var(--paper);border:1px solid var(--line)}
.timer.low{color:var(--bad);border-color:var(--bad)}

/* home */
.hero{display:grid;gap:18px;padding-block:8px 28px}
.hero p.lead{font-size:19px;max-width:62ch;color:var(--muted)}
.stats{display:flex;gap:28px;flex-wrap:wrap;font-family:var(--f-mono);font-size:14px;color:var(--muted)}
.stats b{display:block;font-size:28px;color:var(--ink);font-family:var(--f-display)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mode{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.mode.main{border:2px solid var(--accent)}
.mode .spec{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.mode .actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);border:1px solid var(--line)}
.setlist{display:grid;gap:8px}
.setitem{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:10px 12px}
.setitem:hover{border-color:var(--accent)}
.setitem .t{font-weight:600;min-width:0}
.setitem .m{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}
.history{margin-top:28px}
table.hist{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
table.hist td,table.hist th{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.tablebox{overflow-x:auto}

/* exam */
.sectionbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.progress{flex:1;min-width:160px;height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab.done{border-color:var(--ok)}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,32px)}
.sheet + .sheet{margin-top:16px}
.instr{font-style:italic;color:var(--muted);margin-bottom:18px;max-width:75ch}
.split{display:grid;gap:24px}
@media (min-width:960px){.split{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.split .passage{position:sticky;top:90px;max-height:calc(100vh - 120px);overflow:auto}}
.passage{min-width:0;background:var(--soft);border-radius:8px;padding:18px 20px;font-size:16.5px}
.passage p+p{margin-top:12px}
.passage .ttl{font-family:var(--f-display);font-weight:700;font-size:20px;margin-bottom:10px}
.gap{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:14px;font-weight:700;background:var(--paper);border:1px dashed var(--accent);border-radius:6px;padding:2px 8px;margin:2px 0}
.gap.filled{background:var(--mark);color:var(--mark-ink);border-style:solid;border-color:var(--mark)}
.qs{display:grid;gap:22px;min-width:0}
.q{display:grid;gap:10px}
.q .p{font-weight:600;white-space:pre-line}
.q .n{font-family:var(--f-mono);color:var(--muted);font-size:14px;margin-right:6px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;line-height:1.4}
.opt:hover{border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:13px;font-weight:700;min-width:22px;color:var(--muted);padding-top:1px}
.opt.sel{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.opt.sel .k{color:var(--mark-ink)}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{min-width:44px;font-family:var(--f-mono);font-weight:700;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 10px}
.key.sel{background:var(--mark);color:var(--mark-ink);border-color:var(--mark)}
.key.right{background:var(--ok-bg);border-color:var(--ok)}
.key.wrong{background:var(--bad-bg);border-color:var(--bad)}
.pool{display:grid;gap:6px;font-size:15px}
.pool div{display:flex;gap:10px}
.pool b{font-family:var(--f-mono)}
.pool .used{opacity:.45}
.fb{border-radius:8px;padding:10px 12px;font-size:15px}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.ko{background:var(--bad-bg);color:var(--bad)}
.fb .note{display:block;color:var(--ink);margin-top:4px}
.navbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:22px}
.player{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:8px;padding:14px 16px;margin-bottom:18px}
.player .big{width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:20px;display:grid;place-items:center}
.player .big[disabled]{opacity:.4}
.player .bar{flex:1;min-width:140px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.player .bar i{display:block;height:100%;width:0;background:var(--accent)}
.player .t{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
details.tr{margin-top:14px}
details.tr summary{cursor:pointer;font-weight:600;color:var(--accent)}
details.tr pre{white-space:pre-wrap;font-family:var(--f-body);font-size:15px;background:var(--soft);padding:12px;border-radius:8px;margin:8px 0 0}

/* results */
.score{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));margin-block:20px}
.scorebox{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:6px}
.scorebox .v{font-family:var(--f-display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.ko{background:var(--bad-bg);color:var(--bad)}.pill.mid{background:var(--warn-bg);color:var(--warn)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;position:relative}
.meter i{display:block;height:100%}
.meter::after{content:"";position:absolute;left:65%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.review{display:grid;gap:12px}
.rv{background:var(--paper);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.rv.ok{border-left-color:var(--ok)}.rv.ko{border-left-color:var(--bad)}
.rv .p{white-space:pre-line;font-weight:600}
.modal{position:fixed;inset:0;background:rgba(10,15,30,.55);display:grid;place-items:center;z-index:20;padding:16px}
.modal .box{background:var(--paper);border-radius:var(--r);padding:22px;max-width:420px;display:grid;gap:14px}
.wbox{width:100%;min-height:280px;margin-block:14px 8px;padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--soft);color:var(--ink);font:inherit;font-size:16.5px;line-height:1.6;resize:vertical}
.wbox:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

l people did not actually do very well at school.", "options": ["certificates", "abilities", "qualifications", "talents"], "answer": 2, "note": "C1-level question."}, {"prompt": "So how are education, intelligence and success … ?", "options": ["connected", "joined", "united", "tied"], "answer": 0, "note": "C1-level question."}, {"prompt": "But is there more … it than that?", "options": ["for", "to", "at", "with"], "answer": 1, "note": "C1-level question."}, {"prompt": "What about the … of emotions?", "options": ["role", "part", "situation", "work"], "answer": 0, "note": "C1-level question."}, {"prompt": "Successful people often show a … level of 'emotional intelligence'.", "options": ["big", "high", "tall", "huge"], "answer": 1, "note": "C1-level question."}, {"prompt": "This is described as self-awareness - they can understand their feelings, organise and … them.", "options": ["manage", "deal", "administer", "command"], "answer": 0, "note": "C1-level question."}, {"prompt": "And above … , this understanding means that they can motivate themselves, which seems to be the key to success.", "options": ["all", "each", "every", "whole"], "answer": 0, "note": "C1-level question."}], "reading": [{"title": "The Master Puppeteer", "type": "mcq", "instructions": "You are going to read an article about a puppeteer. For questions 1-7, choose the answer which you think fits best according to the text.", "text": "THE MASTER PUPPETEER\n\nPeter Roberts describes what it is like to work in the world of puppet theatre and explains what is so special about this art form.\n\nWatching wooden dolls come to life may not be one of the most popular forms of entertainment today, but with over twenty years' experience, talented puppeteer Peter Roberts has earned himself the title 'master puppeteer' due to his extraordinary ability to transform puppets into believable, almost living characters. \"People are quite often surprised to hear what I do for a living and have little appreciation of puppetry as a form of entertainment. But while the exact origins of puppet theatre are unknown, it has been popular in many cultures and may have been the very first kind of theatre,\" he explains.\nAs Roberts writes his own scripts and musical scores, his shows are highly original. \"A puppet show can involve anything from clowning to storytelling,\" he explains. Equally diverse is the audience he performs for. \"Some come to be entranced with the puppets themselves, while others enjoy the catchy tunes and witty dialogue.\" Roberts believes that this form of entertainment crosses international boundaries and can be appreciated by people of all ages and cultures.\nRoberts' fascination for puppets started when he received some beautiful glove puppets one Christmas. He started putting on shows with these for family and friends and then moved on to handmade Chinese string puppets. Learning mostly from books and personal experience, he continued with his 'hobby' while studying for a degree in architecture. \"By the time I left university,“ he explains, \"I was already spending, most of my free time carving puppets and putting on shows in the community, so I hardly noticed the transition from student to full-time professional puppeteer. I realised I had long since abandoned all thoughts of pursuing any other career!\"\nThe puppets are designed specifically for each show, which is extremely time-consuming. Each one effective educational tool is carved out of English limewood and then painted. According to Roberts: \"Sometimes what you anticipate and what you actually create in the end are two very different things, but I've made some of my best puppets 'accidentally', as it were.\" Some of his 'characters' then appear in exhibitions; others are used for puppeteering workshops. \"They have to be strong enough to withstand a great deal,\" Roberts says, \"as they are often thrown into boxes or dropped from a great height.\"\n\nAnyone interested in puppetry can be trained to assist, and not just with the actual puppet making. Puppet theatre companies in the U.K are usually small, but each one still needs writers, performers, musicians and even sound and lighting engineers. In China they can be huge, with literally hundreds involved, including a full orchestra!\n(line 14) An important sideline for Roberts is designing figures for the film industry, as there is relatively little money to be made in puppet making for theatre. This is a complicated and expensive business - it\ncan take a whole day to perfect something, like a smile on a puppet's face, (line 15) for example. Once captured on computer, however, it is there forever. Still, for Roberts, it's traditional puppet shows that are his passion. \"As the story is mainly communicated visually, it draws people in. The puppets come alive and immediately the audience are in a magical fantasyland. It's just so different from any other kind of theatre.\"\n\nWhen most people hear the word 'puppetry', they more than likely think of The Muppet Show or the Punch and Judy show at the English seaside, or a way of keeping children entertained at birthday parties. Certainly, the subject matter will be expected to be light-hearted rather than serious. However, Roberts is keen to point out that puppet theatre can often be used as a serious message coming through the mouths of puppets.", "pool": [], "questions": [{"prompt": "What do we learn about puppet theatre in the first paragraph?", "options": ["Its value as an art form is not fully recognised.", "It has always been highly valued as a form of entertainment.", "It is gaining popularity.", "It is a highly skilled art form."], "answer": 0}, {"prompt": "In the second paragraph, we learn that Roberts believes that his shows", "options": ["are most suitable for a particular kind of audience.", "are mainly appreciated for their originality.", "offer something for everyone.", "usually appeal to people with a good sense of humour."], "answer": 2}, {"prompt": "Roberts started working as a professional puppeteer", "options": ["after doing a puppetry course .", "when he realised he didn't want to be an architect.", "while he was still a student.", "after leaving university."], "answer": 2}, {"prompt": "The writer informs those who might be interested in puppetry that", "options": ["theatres in the U.K. need more people to get involved.", "they don't need any special skills to get involved.", "they would need to be able to work well in a team.", "there are more ways to get involved than you might think."], "answer": 3}, {"prompt": "What does 'this' refer to in line 14?", "options": ["puppet making for theatre shows", "Roberts' work for the film industry", "perfecting a detail of a puppet", "capturing figures on computer"], "answer": 1}, {"prompt": "Roberts says 'it draws people in' (line 15) to explain how puppet shows", "options": ["attract large audiences.", "are enjoyed by everyone.", "make an audience feel personally involved.", "bring characters to life."], "answer": 2}, {"prompt": "What would Roberts like people to understand about puppet theatre?", "options": ["Its main purpose should be to educate.", "It can be educational as well as entertaining.", "It's not just a thing of the past.", "It should be kept light-hearted."], "answer": 1}]}, {"title": "Supermarket Shoppers", "type": "matching", "instructions": "You are going to read a magazine article in which four people describe their shopping experience. For questions 1-7, choose from the people (A-D). The people may be chosen more than once or not chosen at all.", "text": "A MELANIE ROGERS\n\nFor a mother of two young children, supermarket shopping can be an absolute nightmare. They get bored and restless and start to play up. It can be really embarrassing when everyone stares at you because both your kids are sobbing their hearts out! And if you're not watching them, they can take goods off the shelves without you noticing. Once I even managed to briefly lose my two-year-old son.\n\nHe'd wandered off down another aisle while I was comparing the prices on some items. I was frantic when I realised he wasn't by my side. Luckily one of the assistants saw him and picked him up, but it was a scary five minutes until I got him back. I'm glad to say that things have improved in my shopping centre recently, as they've opened a supervised play area where I can drop the kids off while I shop, and pick them up when I've finished. It really makes life much easier.\n\nB JULIAN KENT\n\nI'm not keen on shopping with other people, because it always seems to take much longer, so I usually go on my own. Nowadays big British supermarkets are open all night, which is very convenient for me. I prefer to go as late as possible, when there are no queues at the checkout and I can get all my shopping done very quickly. I usually only go once a month and make sure I stock up on everything I'm likely to need. It means you have to plan all your meals, and you need to have a big freezer, but at least I don't waste my all-too-precious time going to the shops every couple of days. If I do run out of something, or realise I've forgotten something I need, then I'll grab it from the local mini-market. I try to make sure I don't have to do this too often, as small local shops are much more expensive.\n\nC BOB CARTER\n\nMy wife and I retired ten years ago and we recently gave up the car as it was too expensive to run on our pensions. We get the bus into town once a week to do our shopping. We're not as fast on our feet as we once were, and some young people can be very inconsiderate, pushing you out of the way at the counters or losing their patience when you are not moving down the aisles as fast as they'd like. Others, of course, are very helpful and will give you a hand when they see you need it. Even though it can wear you out carrying all the bags, we try to make a nice outing of it. We'll treat ourselves to a bit of lunch at one of the cafes, or we'll go for tea and sandwiches at one of the nice tea rooms in the centre. We actually look forward to our shopping trips!\n\nD SALLY WALKER\n\nI suppose I'm a bit of a scatterbrain, as I never seem to have what I need when I need it. This means that I end up popping out to the supermarket at least three times a week to get in more supplies. I don't mind, though, because unlike most people, I find supermarkets to be quite relaxing places. I enjoy wandering slowly down all the aisles, checking out any new products or searching for special offers. I always take a calculator with me, as I like to know how much I'm spending, and I prefer to buy the shop's own-brand products because they cost a lot less than the big name brands. My kids complain that we never have the \"proper\" breakfast cereal or the \"really nice\" baked beans, but I just point out that it leaves us with more money to do the really fun things. I'm sure they know I'm right.", "pool": [{"key": "A", "text": "Melanie Rogers"}, {"key": "B", "text": "Julian Kent"}, {"key": "C", "text": "Bob Carter"}, {"key": "D", "text": "Sally Walker"}], "questions": [{"prompt": "Which person doesn't like to spend a lot of time in the supermarket?", "answer": "B"}, {"prompt": "Which person is pleased with a new service that has been provided?", "answer": "A"}, {"prompt": "Which person doesn't like company when they go to the supermarket?", "answer": "B"}, {"prompt": "Which person looks out for bargain prices?", "answer": "D"}, {"prompt": "Which person criticises the behaviour of some other shoppers?", "answer": "C"}, {"prompt": "Which person is sometimes in an uncomfortable situation while shopping?", "answer": "A"}, {"prompt": "Which person organises their shopping carefully?", "answer": "B"}]}, {"title": "Martha (extract from a novel)", "type": "mcq", "instructions": "You are going to read an extract from a novel. For questions 1-8, choose the answer (A, B, C or D) which you think fits best according to the text.", "text": "At the office that day, Martha was left to ‘keep her eyes open’ until after the lunch hour. Then Mr Max Cohen brought her a document to copy. She was so tense, she had to start afresh three times; and when he came to fetch it, all that had been achieved were the words ‘Memorandum of an Agreement of Sale’ typed raggedly across the top of the sheet. She shrank under his impatient assurance that it did not matter in the least, and she must take her time. Her fingers were heavy and trembling, and her head was thick. To type two pages of his small neat writing into something clean and pleasant to look at seemed to her, just then, an impossibly difficult task. He went home without coming to her desk again; and she flung a dozen sheets of paper into the wastepaper basket, and decided she would come early next morning and do it before anyone else arrived.\n\nMrs Buss, on her way out, asked, “Have you got any certificates?” Martha said no, she had learned to type at home. Mrs Buss said nothing consoling, but merely nodded absent-mindedly, for her eyes were on the elegant Mrs Jasper Cohen. Martha could barely see where she was going as she left the office. She was filled with a violent revulsion against the law and everything connected with it. What she said to herself was, I won’t spend the rest of my life typing this stupid jargon.\n\nShe stood at the corner of the street and watched a crowd of carefree young people going into McGrath’s Hotel, and felt sick with envy. Then she crossed the street and went into the offices of the Zambesi News. She was going to see if Mr Spur, an old journalist, whom she had known ‘as a child’ – that is to say, she had spent a month’s holiday with him and his wife about four years before – could offer her any kind of position. She was in the building about half an hour, and when she came out her face was hot with embarrassment. It had been so painful she could not bear to remember what had happened. What she must remember was that she had no qualifications whatsoever.\n\nShe understood, finally, the extent of the favour Mr Cohen was doing her; and next morning she was at her desk in a very chastened frame of mind. Her eyes were certainly opened, but she had no time to use them, for long before that first document was finished, several more arrived on her desk, and it was lunchtime before she knew it. She tried to persuade herself that the papers she sent in, neatly clipped and tied with green tape in the form of the exquisite, faultless documents Mrs Buss turned out with such ease, were satisfactory. Mr Max Cohen received them with a noncommittal glance and a nod; and later Martha saw Mrs Buss doing them again. She was given no more. For a whole day she sat idle at her desk, feeling sick and useless, wishing that she could run away, wondering what would happen.\n\nThe fair, plump girl, Maisie Gale, who sat next to her said consolingly, “Don’t lose any sleep. Just do what you can get away with, that’s my motto.”\n\nMartha was offended, and replied a stiff smile.", "pool": [], "questions": [{"prompt": "Why did Martha find her first day at the office difficult?", "options": ["She was not used to working under pressure.", "The task given to her was very difficult.", "She was too nervous to think.", "Mr Cohen was not easy to please."], "answer": 2}, {"prompt": "As Mrs Buss left the office, what impression do we get of her attitude towards Martha?", "options": ["She seemed disinterested in her.", "She seemed concerned about her lack of qualifications.", "She seemed to have taken a dislike to her.", "She seemed eager to help her."], "answer": 0}, {"prompt": "The writer tells us that Martha left the office feeling.", "options": ["determined to find another occupation.", "angry with Mrs Buss.", "frustrated at her failure that day.", "worried that she would lose her job."], "answer": 0}, {"prompt": "Why did Martha go to see Mr Spur?", "options": ["to help him out.", "to ask him for advice.", "to pay him a social call.", "to ask him for a job."], "answer": 3}, {"prompt": "How had Martha’s attitude towards her job changed by the following day?", "options": ["She was starting to feel more enthusiastic about it.", "She now realized she was lucky to have a job at all.", "She had made her mind up to try harder.", "She was now feeling more confident of her abilities."], "answer": 1}, {"prompt": "Martha was given no more documents to type because", "options": ["she seemed to have been forgotten about.", "she was taking too long to type them.", "the standard of her work was poor.", "Mrs Buss preferred to do them herself."], "answer": 2}, {"prompt": "When Maisie Gale says ‘just do what you can get away with’, she is advising Martha to", "options": ["do whatever is necessary to make a good impression.", "do her best to find another job.", "just do the best she can.", "only do the least amount of work acceptable."], "answer": 3}, {"prompt": "By the end of the day, which of the following was true of Martha?", "options": ["She knew that Mr Cohen was disappointed in her.", "She still hadn’t handed in any work.", "She had handed in her work unfinished.", "She had decided she would work better when the office was empty."], "answer": 0, "note": "Martha did hand in her documents; Mrs Buss later redid them, so she knew Mr Cohen was not satisfied."}]}, {"title": "A Far Cry from Sherlock", "type": "gapped", "instructions": "You are going to read an article about what it takes to become a detective. Seven sentences have been removed from the article. Choose from the sentences A-H the one which fits each gap. There is one extra sentence which you do not need to use.", "text": "Being a huge Sherlock Holmes fan, our reporter Anne Carlisle decided to do a bit of investigating of her own to find out about the history and work of Britain's police detectives. Here's what she discovered. Way back in 1828, the world's first modern police force was created by Sir Robert Peel. The Metropolitan Police Force of London made its home at the famous Scotland Yard and quickly became the model for police forces around the world. But it would be another decade before the Detective Branch of Scotland Yard was set up. This branch later became the Criminal Investigation Department (commonly known as CID) and to this day remains the main police department in Britain responsible for major crime investigation. Becoming a plain clothes detective in the CID is no easy task. Firstly, a police officer needs to have served for at least two years as a uniformed officer.\n\n[[1]]\n\nOnce this period has been completed the officer can then apply to go to a detective training school. However, there's no guarantee they will be accepted. In order to become a detective, an officer needs to possess a wide range of skills and qualities, the most obvious being complete honesty and good character. They also need to be highly observant and to have good judgement.\n\n[[2]]\n\nAn officer with all these skills could more than likely find themselves being accepted to train as a detective. Most of these 'detectives-to-be' discover that the really hard work begins once they get to the training school.\n\n[[3]]\n\nFor instance, they will have to learn about psychology, which will come in handy when they are questioning suspects and witnesses. Perhaps the most difficult subjects though deal with learning all about the modern scientific methods now used in crime detection. Once our future Sherlocks have completed their initial training, they begin life as detective constables and start working on unsolved crime cases in the CID. Most of the work they do is not nearly as glamorous as it seems on TV and in novels.\n\n[[4]]\n\nNot exactly enthralling, but essential duties all the same. Apart from having to do painstaking investigative work, detectives also have a lot of paperwork to deal with.\n\n[[5]]\n\nEvery detail of a crime and its investigation must be recorded. Most detectives find the amount of clerical work they have to do the most frustrating part of their job. Nonetheless, it can be a very rewarding job; a detective gets great satisfaction knowing they have solved a major crime. However, a detectives job is still not over after a suspect has been arrested and charged.\n\n[[6]]\n\nOnly when the offender is actually behind bars is the detectives goal achieved. Then there's always the next case to tackle, of course. In many ways the detectives of today are similar to the ones of the past. Much of the work has hardly changed at all.\n\n[[7]]\n\nThe main difference is the technology and modern science now available to help them. Whether it be using computers or looking through a microscope, it all helps to get the crime solved. In the end, just like the detectives we avidly watch on TV, they are heroes doing everything in their power to get the bad guys off our streets.", "pool": [{"key": "A", "text": "For every investigation, forms have to be filled in and reports written."}, {"key": "B", "text": "During this time, the officer learns all the basics of general police work."}, {"key": "C", "text": "In addition to catching criminals, they have to give evidence in court."}, {"key": "D", "text": "Last but not least, a high degree of patience is an absolute must as, believe it or not, crime investigations can often be a very lengthy and boring process."}, {"key": "E", "text": "In fact, it is nothing like it used to be."}, {"key": "F", "text": "Detectives still have to ask questions and find answers."}, {"key": "G", "text": "Typical mundane tasks include going house to house asking questions or searching carefully through a suspect’s phone records for clues to a crime."}, {"key": "H", "text": "There the officers receive intensive instructions in all areas related to solving a major crime."}], "questions": [{"prompt": "Gap 1", "answer": "B"}, {"prompt": "Gap 2", "answer": "D"}, {"prompt": "Gap 3", "answer": "H"}, {"prompt": "Gap 4", "answer": "G"}, {"prompt": "Gap 5", "answer": "A"}, {"prompt": "Gap 6", "answer": "C"}, {"prompt": "Gap 7", "answer": "E"}]}, {"title": "Something's Cooking", "type": "gapped", "instructions": "You are going to read an article about a chef. Seven sentences have been removed from the article. Choose from the sentences A-H the one which fits each gap (1-7). There is one extra sentence which you do not need.", "text": "Chris Armstrong is a successful London chef who has recently opened his second restaurant. He tells us all about his journey to the top.\n\nMy childhood wasn't easy. Both of my parents were in the army and consequently we never lived anywhere for more than a year or two. It was very difficult for me to settle into the different schools I went to, so I didn't try as hard as I should have and I often wasn't very well-behaved. When I was sixteen, I left school and signed up for a career in the army.\n\nI enjoyed the army training and really thought that I had made the right career choice. But then one day my whole world came crashing down when I fell awkwardly and badly injured my ankle.\n\n[[1]]\n\nI spent many months feeling sorry for myself until I realised that, during this time, I had become quite the amateur chef!\n\nYou see, during my recovery I'd started leafing through some of my mum's cookbooks in the kitchen. I tried out a few of the simpler recipes, just to occupy my time really, but then I started becoming more adventurous. I began substituting and adding my own ingredients and even making up entire new recipes. Then a friend jokingly suggested that I should train to be a chef.\n\n[[2]]\n\nBefore I had time to change my mind, I enrolled myself on a course at a local catering college.\n\nI gained a lot of valuable experience in my first few jobs after leaving college and had the opportunity to work alongside some very talented chefs.\n\n[[3]]\n\nI was offered the chance to train under the head chef at a very distinguished restaurant in Paris. Needless to say, I didn't agonise over my reply.\n\nThe time spent working as a sous-chef was a wonderful learning experience.\n\n[[4]]\n\nWhen you 're working under top chefs, you can expect to be on the receiving end of their world famous bad tempers a lot more often than you would like! Once, Mr Duvalier threw a saucepan at me because I let a dish go out to a customer cold. Still, however 'heated' it got in the kitchen, I still thrived on working hard as part of a team.\n\nAfter four years in Paris, I decided to take the plunge and try opening up my own restaurant.\n\n[[5]]\n\nThere was one point when the building was found to have major structural problems and I thought I would lose all my money. Fortunately, I was able to get the necessary repairs done without delaying the opening too long. Finally, about a year after I'd first had the idea, 'A Cappella' was open for business!\n\nThe restaurant was successful beyond my wildest dreams. There were some difficulties at first, but I was determined to overcome them.\n\n[[6]]\n\nSoon, I had made enough profit to start thinking about opening a second 'A Cappella' in Edinburgh.\n\nI was recently approached by a TV company about the possibility of filming a 'fly on the wall' television documentary about the London restaurant.\n\n[[7]]\n\nThis business certainly isn't easy, but if you are prepared to give it everything you've got, the world really is your oyster.", "pool": [{"key": "A", "text": "I managed to get a loan from a bank and for six months, a design team worked on my idea to turn an old building in East London into a brand new, stylish restaurant."}, {"key": "B", "text": "Well, I just couldn't get the idea out of my head!"}, {"key": "C", "text": "After a couple more years, I returned to London and became head chef at a newly opened restaurant."}, {"key": "D", "text": "I haven't decided whether to go ahead with that or not, but the whole thing has just made me realise how far I've come."}, {"key": "E", "text": "Within three years, the restaurant had started to win awards and appeared in various good food guides."}, {"key": "F", "text": "I was informed that I would never be fit enough for active duty."}, {"key": "G", "text": "It certainly had its share of difficult moments, though."}, {"key": "H", "text": "But it was only after moving to London that I felt that my career really started to take off."}], "questions": [{"prompt": "Gap 1", "answer": "F"}, {"prompt": "Gap 2", "answer": "B"}, {"prompt": "Gap 3", "answer": "H"}, {"prompt": "Gap 4", "answer": "G"}, {"prompt": "Gap 5", "answer": "A"}, {"prompt": "Gap 6", "answer": "E"}, {"prompt": "Gap 7", "answer": "D"}]}, {"title": "Guidebooks on Scotland", "type": "matching", "instructions": "You are going to read an article about guidebooks on Scotland. Choose from the guidebooks (A-F). The guidebooks may be chosen more than once or not chosen at all. Of which guidebook is the following stated?", "text": "A Island Fling\n\nA highly informative read, this book is a must for those wishing to explore the Western Isles. It is packed with essential information such as ferry timetables and descriptions of B&Bs, and also includes useful tips on how to fit in with the local way of life and dress suitably for the Scottish weather. Particularly interesting is the section on 'music festivals of the north', as well as the English-Gaelic phrasebook for those who fancy trying their hand at the local language.\n\nB Scotland's Heritage\n\nNot only does this guide take you on a tour of the main sites of historical significance, it also explores Scotland's Celtic heritage in depth and includes well thought out suggested travel itineraries. Whether you simply wish to read about Scotland from the comfort of your chair or are planning an actual tour of the country, this guide is well worth a read.\n\nC The Great Scottish Outdoors\n\nHelpfully divided into different sections for each region of the country, this guidebook focuses on action and adventure and is full of ideas about how to get the most out of your stay in Scotland, such as where to go, what you do there and where to get any equipment you might need. Written in a humorous tone, it assumes that the reader is travelling on a shoestring and would like to have a good time without breaking the bank.\n\nD Capturing the Magic\n\nWritten by experienced travellers, this guide contains absolutely everything you could ever need to know about Scotland. It is so comprehensive that it is quite clearly intended to appeal to Scots, too. Covering popular places as well as those off the beaten track, this guide provides a wealth of information on various day trips, as well as suggestions on places to stay and eat to suit every budget. Whether you are interested in historic towns and cities, beautiful lochs, cliff-top castles or quiet fishing villages along the north-east coast, this book is for you.\n\nE Essential Scotland\n\nThis has been revised for this year and so is the most up-to-date guide available on Scotland's top attractions, restaurants and hotels. It also now suggests a selection of tours aiming to cover the whole country in just ten days, including some of Scotland's finest sights, such as Loch Lomond, the Highlands and Edinburgh. This is ideal for those who simply want to get a 'taste' of Scotland but perhaps not for those who prefer a more relaxed approach to holidaying.\n\nF Secret Scotland\n\nScotland's quietest, most beautiful corners are explored in this guide along with plenty of suggestions for enjoying a stress-free holiday. As the key to a good holiday, according to the guide, is to have 'a unique experience in scenic surroundings', the book suggests a variety of ways in which to do this, such as staying in a lighthouse or going caving. This book stands out from its competitors, not least for its fantastic photographs, illustrations and maps.", "pool": [{"key": "A", "text": "Island Fling"}, {"key": "B", "text": "Scotland's Heritage"}, {"key": "C", "text": "The Great Scottish Outdoors"}, {"key": "D", "text": "Capturing the Magic"}, {"key": "E", "text": "Essential Scotland"}, {"key": "F", "text": "Secret Scotland"}], "questions": [{"prompt": "It is aimed at both locals and foreigners.", "answer": "D"}, {"prompt": "It is ideal for those who want a peaceful, relaxing break.", "answer": "F"}, {"prompt": "Its appearance makes it better than similar guidebooks.", "answer": "F"}, {"prompt": "It gives travellers some cultural advice.", "answer": "A"}, {"prompt": "It is full of information about the past.", "answer": "B"}, {"prompt": "It is written by people who have all the latest information.", "answer": "E"}, {"prompt": "It is interesting to read even if you aren't planning a trip.", "answer": "B"}]}, {"title": "Nightmare Journeys", "type": "matching", "instructions": "You are going to read about four people who have had bad experiences while travelling. For questions 1-7, choose from the travellers (A-D). The travellers may be chosen more than once or not chosen at all. Which traveller or travellers", "text": "A - The Pleasure Cruiser\n\nIt was meant to be the trip of a lifetime - a two-week cruise around the Mediterranean. My wife and I had been putting money aside for it for five years. Everything was wonderful for the first ten days. The ship was really luxurious with every facility you could wish for. We were really enjoying ourselves until disaster struck. The boat hit some rocks somehow and damaged the stern. We hadn't even realised that anything had happened until the captain announced that, for our own safety, all the passengers would have to be taken ashore. As there were over a thousand people on the cruise, you can imagine how long it took to get everyone into the lifeboats. The crew were really marvellous and very well organised, but it was a long night. Fortunately, the mainland was close by and we all arrived safe but exhausted. The tour company gave us a partial refund for the cruise, so we're going to put it towards the next one we take.\n\nB - The Commuter\n\nWhen I looked out the window that morning and saw heavy snow had fallen I knew that meant only one thing - transport chaos. It would be a nightmare getting into work. I walked to the station, taking great care on the icy pavements, so it took me 20 minutes rather than the usual ten. There were a lot of delays due to the weather conditions and all the trains were jam-packed. I couldn't get on the first couple of trains but I eventually managed to squeeze on one. When the doors opened at the next station there was a surge of people trying to get off, and as I stepped out of the train I didn't notice the large gap between the train door and the platform. I fell in the gap, right up to my hips. Luckily, the other passengers were really quick thinking and about five of them grabbed me to pull me out. I only had a few scrapes and bruises, but I was in such a state of shock that I just went home.\n\nC - The Plane Passenger\n\nI have always liked flying, but my husband has never been too keen on it. On this occasion, we were going to visit my daughter who was living in Germany. The weather wasn't that bad when we took off from London, but it got steadily worse during the flight. The flight captain warned us that we would experience some turbulence and explained there was nothing to worry about, so I wasn't expecting it to be that bad. It was absolutely terrifying. Not only was the plane shuddering and shaking, but it kept dropping quite dramatically. My husband was as white as a sheet, so I had to do my best to calm him down. Some of the passengers were crying and everyone looked very frightened.\nWhen we finally landed in Frankfurt you could see the relief on everyone's faces, and I have to say my knees were a bit wobbly getting off the plane, too. We had to go home by train and ferry because my husband swore he'd never get on a plane again.\n\nD - The Coach Passenger\n\nBeing a student on a tight budget, I decided to take the coach back to Wales for my summer holidays. It was already quite warm when we set off in the morning, and by midday, it was boiling. I didn't really mind, though, as I was just looking forward to going home. Then the coach slowed down to a virtual standstill. The holiday traffic was so bad on the motorway that the vehicles were just crawling along. To make matters worse, it was unbearably hot on the coach and I soon finished the small bottle of water I had with me. So I had to sit there with a raging thirst while the coach inched its way down the motorway. All the passengers were really angry about the conditions on the coach and kept shouting at the driver. I felt sorry for him because it wasn't his fault. I was overjoyed when we finally made it to our destination. I'll definitely get the train next time. You don't get traffic jams on trains.", "pool": [{"key": "A", "text": "The Pleasure Cruiser"}, {"key": "B", "text": "The Commuter"}, {"key": "C", "text": "The Plane Passenger"}, {"key": "D", "text": "The Coach Passenger"}], "questions": [{"prompt": "had chosen a cheaper way to travel?", "answer": "D"}, {"prompt": "will use another form of transport in the future?", "answer": "D"}, {"prompt": "had to reassure another person?", "answer": "C"}, {"prompt": "mentions someone who dislikes a method of transport?", "answer": "C"}, {"prompt": "was aware there would be a problem before setting off?", "answer": "B"}, {"prompt": "had saved up to take the trip?", "answer": "A"}, {"prompt": "mentions how afraid fellow travellers were?", "answer": "C"}]}, {"title": "Lights, Camera, Action!", "type": "gapped", "instructions": "You are going to read an article about a top female stunt performer. Seven sentences have been removed from the article. Choose from the sentences A-H the one which fits each gap (1-7). There is one extra sentence which you do not need to use.", "text": "Lights, Camera, ACTION!\n\nAnnie Fielding talks about her journey to becoming a successful female stunt performer.\n\nFalling face first through a plate of glass, being thrown from a moving car, diving off a tall building and being beaten up - this could all be the material from people's nightmares, but for me, it's all in a day's work.\n\nHaving trained as a professional dancer, I started out by choreographing dance routines in music videos and films. I was working on the set of a musical, over-seeing a particularly complex dance sequence when I was introduced to Dan Pullman, who was the senior stunt coordinator on the movie. We hit it off straight away. [[1]]\n\nWe enjoyed each other's company and gradually grew very close. Then we decided to get married.\n\nAt first I had absolutely no interest in stunt work, but just for fun, Dan started showing me a few basic stunts, such as falling and landing safely. [[2]]\n\nApparently, I was a natural. I didn't find these stunts too difficult, because my dance background had equipped me with a certain amount of physical strength and flexibility. Compared to dancing around a studio, I found it exhilarating because there were more risks involved. It prompted me to rethink my own career.\n\nSo then Dan started training me seriously. I learnt the martial art of judo and how to fight, and to ride horses and motorbikes. I remember the pain that I suffered in this short space of time. [[3]]\n\nBy the time I was hired for my first stunt job, I felt ready. I know that within the stunt community there was some talk that my connection with Dan had helped me to land jobs. Well, that may have been the case at first, but since then I believe I have proved myself on my own merit. I keep getting hired to do further jobs so I must be quite good at what I do.\n\nI only entered the stunt industry four years ago and now I have built up a fairly impressive list of stunt work experience. I have worked in music videos, television and major motion pictures. [[4]]\n\nIt isn't easy to get regular work in this field, especially if you are a woman. There are many unemployed stunt performers out there. The longest I have gone without a project is a month, so I consider myself really lucky.\n\nIt's great work if you can get it. You might get asked to do a stair fall or a car knock-down. [[5]]\n\nLast week I was strapped to a moving truck as it caught fire. The days tend to be long and, depending on what is being made, a job can last from a few hours to several months. Sometimes you get to travel. My last job - doubling for an actress in a horror film - involved spending three whole weeks in Mexico.\n\nIf I'm not working, I'm training. I take karate lessons and always find time to ride, as horse stunts are my speciality. I also make sure I rehearse driving stunts in deserted areas. Doing long falls is a common thing asked of stunt people but it is not something you can practice regularly. [[6]]\n\nThat way I am prepared for anything that is asked of me.\n\nOn the surface, my profession seems glamorous and daring, but I take every opportunity to tell young people that they must be prepared to work incredibly hard. [[7]]\n\nYes, you do get to live out your action fantasies and have the chance to work with top celebrities, but there is always the possibility that you may get injured in spite of all the safety precautions taken. It is, in my opinion, important to have a realistic idea about the profession.", "pool": [{"key": "A", "text": "I also point out how physically demanding and dangerous it is."}, {"key": "B", "text": "I like it when we work on a film together, because can see each other every day."}, {"key": "C", "text": "I think even he was surprised by what I could do."}, {"key": "D", "text": "I didn't know then that he would inspire me to follow a different path in life."}, {"key": "E", "text": "You never know what to expect, and no two stunt jobs will ever be exactly the same."}, {"key": "F", "text": "People in the industry say that such success so early in your career is very unusual."}, {"key": "G", "text": "I just need to keep my body lean and in peak physical condition."}, {"key": "H", "text": "I would go to bed every night covered in bruises, but I remained extremely focused."}], "questions": [{"prompt": "Gap 1", "answer": "D"}, {"prompt": "Gap 2", "answer": "C"}, {"prompt": "Gap 3", "answer": "H"}, {"prompt": "Gap 4", "answer": "F"}, {"prompt": "Gap 5", "answer": "E"}, {"prompt": "Gap 6", "answer": "G"}, {"prompt": "Gap 7", "answer": "A"}]}, {"title": "After the Tsunami", "type": "gapped", "instructions": "You are going to read an article about a man who spent a year as a volunteer. Seven sentences have been removed from the article. Choose from the sentences the one which fits each gap. There is one extra sentence which you do not need to use.", "text": "AFTER THE TSUNAMI\n\nPaul Green tells us about dedicating his time and skills to helping victims of the 2004 Asian tsunami rebuild their homes.\n\nI remember that day very clearly. It was 26 December 2004 and as we always did on this day, my friends and I had a barbecue, then went to the beach for a surf. We had a great day, completely unaware of the devastation that was about to be unleashed not so far from our hometown of Brisbane, Australia. When I returned home later that night, I heard the terrible news that a massive undersea earthquake in the Indian Ocean had triggered off a deadly tsunami. We would later learn, of course, that altogether it had killed around a quarter of a million people and left more than one-and-a-half million people homeless.\n\nMy friends and I had returned from a surfing trip to Indonesia earlier the same month, and I was particularly saddened by the destruction that occurred there, as I had felt a strong affection for the people I had met during my travels. [[1]]\n\nI was later to learn that Indonesia had sustained the worst physical damage of all the countries affected by the tsunami.\n\nAt the time, I was a successful florist in the city centre. I had spent years building up my client base and training staff. I really wanted to help, so I donated a percentage of the profits from my shop to the worst-affected areas in Indonesia. [[2]]\n\nI leased my business and flew over to Indonesia.\n\nI joined an organisation of volunteers called Shelter, committed to rebuilding homes. After the tsunami, over 160 aid organisations and UN agencies began operations in Indonesia to provide shelter, food and schooling, so I wasn't alone. Shelter's focus was on rebuilding homes. [[3]]\n\nI soon realised, however, that we weren't just rebuilding homes, we were creating hope for the future.\n\nI chose to join a housing charity, rather than a medical one, because I had previously trained as a carpenter and I believed I could make a difference with my talents. When I was a child, I was always fixing things. [[4]]\n\nI was just the type of person Shelter was looking for. Shelter found a role for me on building sites, teaching construction skills to the locals and supervising the production of materials such as bricks and roofing tiles.\n\nDisease was common because of poor water and sanitary conditions, so Shelter tried to move the homeless out of temporary camps and into permanent proper homes as soon as humanly possible. [[5]]\n\nMany of the volunteers also suffered from these. I frequently experienced high fevers and rashes, and it was during these times that I most longed for the comforts of home.\n\nLooking back, spending a year as a volunteer was the best decision I had ever made, but it wasn't easy. [[6]]\n\nMost people were happy to help, but a few said that if I was going to drop out of 'real life' for so long I'd have to finance my humanitarian adventures myself. There was also the sheer physical labour. By the end of the day I was both physically and mentally exhausted. Sometimes my muscles ached so much that I couldn't imagine continuing the next day.\n\nBack home in Brisbane, I continue to support Shelter by giving presentations on my year abroad and spreading the word about their charitable work. [[7]]\n\nI have also made countless lifelong friends.\nFurthermore, I am welcome in many homes in the area. My friends and I will definitely have somewhere to stay during our next surfing trip!", "pool": [{"key": "A", "text": "Common illnesses suffered by disaster victims include diarrhoea, fevers, skin irritations, respiratory infections and stomach problems."}, {"key": "B", "text": "I hoped that they had all escaped unharmed."}, {"key": "C", "text": "My story has inspired dozens of new recruits to sign up as volunteers."}, {"key": "D", "text": "Many people had lost loved ones and the sorrow of the locals could be felt all around us."}, {"key": "E", "text": "By the time I was in my twenties I could make furniture and had helped many friends with renovations and repairs to their homes."}, {"key": "F", "text": "I had to live off my savings, and when they ran out I asked friends and family for loans."}, {"key": "G", "text": "However, I soon realised that I wanted to do more than give money."}, {"key": "H", "text": "500,000 Indonesians didn't have a roof over their heads, so they were desperately needed."}], "questions": [{"prompt": "Gap 1", "answer": "B"}, {"prompt": "Gap 2", "answer": "G"}, {"prompt": "Gap 3", "answer": "H"}, {"prompt": "Gap 4", "answer": "E"}, {"prompt": "Gap 5", "answer": "A"}, {"prompt": "Gap 6", "answer": "F"}, {"prompt": "Gap 7", "answer": "C"}]}, {"title": "Antoine and Ena (extract from a novel)", "type": "mcq", "instructions": "You are going to read an extract from a novel. For questions 1-7, choose the answer (A, B, C or D) which you think fits best according to the text.", "text": "I chose a small house on the edge of the city. It was an ideal place for me, because I wanted fresh mountain air, space, privacy, a place where one could feel the presence of ancient gods and the spirits of nature. The house was merely an empty shell, but I chose it because it was on the sunny side of the valley, high enough to have a good view over the town, with sufficient breeze to diminish the occasionally stupefying heat. It took me a good year to make the place inhabitable.\n\nThe first thing that I did was to dig out the well at the side of the house, which had caved in on itself and was full of mud and rocks. I was helped in this by a Frenchman named Antoine, a man of considerable culture who had chosen to live here because he was attached to the people, with whom he had arrived in the original immigration. We repaired the walls and the roof of the house, and painted the rooms completely white so that they became suddenly clean, bright, and spacious.\n\nAntoine and I managed, at some danger to ourselves, to install electricity by connecting up a cable to the faltering system invented by a teacher. This man was Professor Luis, who had set up a row of windmills to generate power; this was perfectly adequate for lighting, but was somewhat feeble when high amperage was required, so that the electric cooker that I had flown in by helicopter turned out to be more use as a storage cupboard.\n\nIt often happens when setting up a house that one finds quite suddenly that there is an urgent need for some item overlooked during the last expedition. The track down from my house was a deeply pitted (line 18) one that served as a watercourse each time that it rained, and although I have stabilised it since, it was to begin with only negotiable on foot or by mule, or by Antoine's ancient three-wheeled tractor. This tractor had been half-buried in the mud of the flood at Chiriguana, but Senor Vivo's father, who is in fact General Sosa, governor of Cesar, had it dug out and brought in slung under a vast helicopter gunship, at his son's request. It is commonly said in this country that General Sosa is the only member of the military hierarchy who ever does anything useful.\n\nThere was, at the far end of the town, a tienda that sold goods brought in by mule-train from Ipasueno, and so every few days I would find myself rattling and bumping my way to it on Antoine's formidable old tractor. This shop was owned by a middle-aged couple who left the running of it to their daughter, a girl of twenty or so years whose name was Ena, as I discovered by overhearing the father asking her the price of a bottle of Ron Cana.\n\nEna was small and strongly built; usually she wore a plain, faded blue dress, and her feet were always bare. Sometimes I used to think that her head was very slightly too large for her, but she had an appealing and serene face framed by her long black hair. She reminded me forcibly of a Greek girl with whom I had once been in love, for she had the same smooth and soft olive skin, and big brown eyes beneath eyebrows almost heavy enough to meet in the middle. On her forearms were the traces of soft black downy hair, which to be frank, is something that has always driven me crazy, and her fingers were slim and elegant.\n\nThe best thing about her, however, was her elfin spirit; she had an air of quiet amusement, an innocent devilry, that gave her the aura of having existed from all eternity, and of being able to see the funny side of everything. I perceived that she had a streak of mischief in her, as was to be revealed when I discovered how it was that she had kept me for so long in ignorance.", "pool": [], "questions": [{"prompt": "What attracted the writer to the house?", "options": ["where it was located", "how big it was", "the view it gave of the valley", "the condition it was in"], "answer": 0}, {"prompt": "According to the writer, Antoine", "options": ["had recently arrived.", "liked to keep to himself.", "was a foreigner.", "painted for a living."], "answer": 2}, {"prompt": "What impression does the writer give of the electricity supply?", "options": ["It was too dangerous to use.", "It didn't always work properly.", "It only worked when it was windy.", "It was a very reliable system."], "answer": 1}, {"prompt": "The writer uses the phrase 'served as a watercourse' (line 18) to show that the path", "options": ["had many deep holes.", "was difficult to walk on.", "was sometimes flooded.", "needed to be repaired."], "answer": 2}, {"prompt": "Why was General Sosa unlike other military officers?", "options": ["He liked helping his relatives.", "He was in charge of the area.", "He managed to get things done.", "He had his own private helicopter."], "answer": 2}, {"prompt": "How did the writer find out what Ena's name was?", "options": ["Her father told him when he asked.", "Someone mentioned her name.", "He heard a customer asking for her.", "Antoine gave him the information."], "answer": 1}, {"prompt": "What criticism of Ena does the writer make?", "options": ["She never wore shoes.", "She wasn't interested in clothes.", "Her eyebrows were too thick.", "Her head seemed to be too big."], "answer": 3}]}, {"title": "From Rags to Riches", "type": "gapped", "instructions": "You are going to read an article about a woman who started her own business. Seven sentences have been removed from the article. Choose from the sentences A-H the one which fits each gap (1-7). There is one extra sentence which you do not need to use.", "text": "Penelope Travers turned her passion for recycling into a business. She tells us all about it, from its humble beginnings to its present-day success.\n\nIt was back in 1995, when my husband Eric was working as a rubbish collector for the local town council, that I first got the idea of recycling clothes. He would frequently find bags of perfectly good clothes just thrown into the rubbish. Obviously people who no longer wanted these clothes didn't know what else to do with them. I wondered if I would be able to do something with them which would make money for me and perhaps even help the community at the same time. I decided to give it a try.\n\nThe first thing I did was to place an advertisement in the newspaper inviting people in the neighbourhood to bring me their second-hand clothing, shoes and bedding instead of throwing them away. Within a week, our garage was bursting with black plastic bags. [[1]] This kept me busy for weeks.\n\nAt the same time, I was also looking for a shop to rent where I could sell these salvaged items. [[2]] But it wasn't until I contacted AdVenture, an organisation which helps people to set up their own businesses, that I finally got the assistance I needed. They helped me find the right shop and gave me advice about getting a business loan to get me started. That's how Second Best was born.\n\nFor my idea to work, I was going to need a steady supply of clothes. The town council already had recycling bins for paper, glass and the like. [[3]] I was able to make arrangements to have the clothes collected and brought to my shop, where I had installed laundry facilities to cope with all the washloads I needed to do! Once people got to know about the shop, they would also bring in their unwanted 'stuff' directly from their wardrobes.\n\nIt wasn't only making money in the shop that interested me, though. I was still eager for the community to benefit from my idea, too, so I started to find ways that the large quantities of very old or damaged clothing that I couldn't sell in the shop could be put to use. [[4]] Some of the old clothing is now turned into bandages for hospitals, for example, while one school in the area asks for old jeans to make into lunch bags. I've even been approached by an animal rescue looking for low-cost rags to use as bedding.\n\nAdVenture believes in encouraging people by giving an annual Special Merit Award to the most successful new business they have helped. [[5]] Not only had I helped so many others, they said, but I had also had to overcome a major difficulty. In 2000, my shop had been destroyed by fire and I had had to start the business all over again from scratch.\n\nGetting back on track wasn't easy. Not only did I have to search for another shop to rent, but I also had to spend time building up new stocks of clothes, as nearly all of the original stock had been destroyed. [[6]] Otherwise, I would have been forced to call it a day.\n\nToday, twelve years after I first started up, Second Best is now a very successful small business which employs a team of over twenty staff. I am still very passionate about recycling clothes and encourage others to do so at every opportunity. [[7]] Old styles regularly come back into fashion, which means there is always a market for second-hand clothes.", "pool": [{"key": "A", "text": "Eric and I managed to persuade them to provide ones for clothes, too."}, {"key": "B", "text": "I think the most valuable piece of advice I can give them is never to throw anything away."}, {"key": "C", "text": "In 2002, my turn came around."}, {"key": "D", "text": "You might think this would be a relatively easy task."}, {"key": "E", "text": "Once again, though, AdVenture came to my aid, providing me with financial support through this difficult time."}, {"key": "F", "text": "The contents had to be washed, ironed and sorted."}, {"key": "G", "text": "Once I had learnt the basic principles of managing my own business, I never looked back, they said."}, {"key": "H", "text": "It turned out that there were plenty!"}], "questions": [{"prompt": "Gap 1", "answer": "F"}, {"prompt": "Gap 2", "answer": "D"}, {"prompt": "Gap 3", "answer": "A"}, {"prompt": "Gap 4", "answer": "H"}, {"prompt": "Gap 5", "answer": "C"}, {"prompt": "Gap 6", "answer": "E"}, {"prompt": "Gap 7", "answer": "B"}]}, {"title": "Drink, Blink and Rest", "type": "gapped", "instructions": "You are going to read an article about how to reduce problems with your eyesight. Seven sentences have been removed from the article. Choose from the sentences A-H the one which fits each gap (1-7). There is one extra sentence which you do not need to use.", "text": "Not many people realise how much strain modern life can put on their eyesight. Working on a computer, watching television and driving at night are just some of the things that can affect your eyes. And with the ozone layer becoming thinner, even sunlight can be damaging to your eyes if you do not wear sunglasses to protect them from ultraviolet light.\n\nIt was traditionally believed that being long-sighted or short-sighted was a condition that was inherited. But recent studies have shown that this is not always the case. One study in Spain has shown that there has been an increase in eye problems among schoolchildren. [[1]] It appears that years of focusing on books causes most children to become slightly short-sighted by the age of ten. New problems, such as the massive increase in the number of people using computers at work, has added to the rising incidence of eye strain. Using a computer means that the eye works in a different way, and it has to work harder. [[2]] Experts have estimated that as many as 30 per cent of people have eye problems as a result of working on computers.\n\nOffice workers suffer from additional problems because of central heating and air conditioning. [[3]] One recommended way of combating this problem is to close the eyes for one minute every hour, to rest them and keep them moist. There are also many eye exercises that can help reduce the symptoms of eye strain. Apart from making sure you rest your eyes regularly throughout the day, it is also a good idea to increase your fluid intake. [[4]] Most doctors recommend at least a litre and a half a day, depending on the climate you live in, to prevent dehydration. Your fluid intake can be in the form of plain water or other beverages.\n\nAnother factor that can affect how well the eye works is diet. In World War II, for instance, it was rumoured that British fighter pilots were eating a lot of carrots to improve their ability to see well at night. [[5]] There is some evidence to suggest that the different functions of the eye, such as night vision or seeing long distances, require the right kinds of nutrients to keep them in good order. Some studies recently conducted in France have also found that people over the age of sixty who live in cities are more likely to be short-sighted than people of the same age who live in the country. [[6]] People living in the countryside tend to eat more fresh fruit and vegetables than those who live in the city. The more balanced your diet is, the less likely you are to have eye problems in later life.\n\nThere is no doubt that many people will have some problems that affect their eye-sight whatever they do. But there are many things that you can do either to minimise the problems, or, in some cases, avoid them altogether. [[7]] Rest your eyes regularly, drink plenty of fluids and eat a balanced healthy diet. What could be simpler?", "pool": [{"key": "A", "text": "Many eye problems can be improved by drinking lots of water."}, {"key": "B", "text": "And the problems become worse the longer you spend in front of a screen."}, {"key": "C", "text": "These can help your eyes to function better."}, {"key": "D", "text": "It is well known that they contain vitamin A, a nutrient beneficial to vision."}, {"key": "E", "text": "Another in America suggests that up to 80 per cent of children may be short-sighted."}, {"key": "F", "text": "The reason is said to be that people in rural areas eat healthier food."}, {"key": "G", "text": "Just remember the three simple rules."}, {"key": "H", "text": "The trouble here is that the eye becomes dry, which can make you feel tired."}], "questions": [{"prompt": "Gap 1", "answer": "E"}, {"prompt": "Gap 2", "answer": "B"}, {"prompt": "Gap 3", "answer": "H"}, {"prompt": "Gap 4", "answer": "A"}, {"prompt": "Gap 5", "answer": "D"}, {"prompt": "Gap 6", "answer": "F"}, {"prompt": "Gap 7", "answer": "G"}]}, {"title": "Health and fitness (C1 level)", "type": "mcq", "instructions": "You are going to read three extracts which are all concerned in some way with health and fitness. For questions 15-20, choose the answer (A, B, C or D) which you think fits best according to the text.", "text": "Text A: Grandeur and magnificence in a 10K run?\n\nIf ever you needed a reason to run a 10k, then this is it. Now in its fifth year, the Cancer Research UK fundraising series has proven to be a 'stayer' in the ever-increasing and competitive 10k marketplace. Where else would you get the chance to run through the grounds of the UK's most beautiful locations whilst at the same time raising money for charity? The courses pass through gardens, parkland, and woods, and include landscapes created by the famous eighteenth-century architect Capability Brown. With over thirty venues in the series, ranging from completely flat land to gentle slopes and challenging hills, there is bound to be one suitable for you - whether you are a complete novice or a seasoned competitor. In complete contrast to the type of settings, the entry process is entirely modern: online only, with no entries accepted on the day itself. The website contains all the information you need; choose a run suitable for your level, find tips on fundraising and collecting the money, download a training planner and get in contact with other runners. The aim is to raise £3.8 million - no mean task in this tough fundraising market - but the uniqueness of the venues on offer, coupled with the opportunity to run in areas of the grounds where no runners have ventured before, adds to the appeal of this very special series. Taking place in September and October, our target is to get 36,000 runners raising money for Cancer Research UK. To sign up for an event, or find out more, please visit: www.cancerresearchuk10.co.uk\n\nText B: Shaping up for the next century\n\nI read with interest Dr Hancock's article. While not disputing her prediction that it will be the norm a century from now to live to 100 and beyond, l would nevertheless argue there is a genetic limit that will impose a ceiling for everyone. My main concern, however, is what shape we will be in by then. The last 20 years have shown a startling rise in the number of obese people in the western world, and there is not a shred of evidence that the trend won't escalate. In fact I believe the change in body weight will be one of the most dramatic shifts in evolutionary history, continuing to have most impact on those under 20, for whom weight-related diseases and premature deaths will be an inevitable consequence. Every pharmaceutical company is pumping money into this area but I'm sceptical about the idea of a miracle cure. Drugs can only reinforce our voluntary efforts to cut down our food intake and the same is true of a 'fitness' cure. That is not to say that there aren't genes for body shape, good health and so on, but the benefits of exercise on body and mind are so complex that drugs will never be able to replicate these advantages. Although our great-grandchildren will still have to work out to be healthy, a great body might be easier to achieve. Research has already uncovered a single human gene that can increase muscle mass by almost thirty per cent. Ironically, rather than changing our attitudes, I fear that advances in science will mean that we will become even more obsessed by physical perfection and youth. It is likely that, as scientists develop ways of giving us wrinkle-free complexions, body ideals will also move on even further towards the increasingly unattainable - the very thin and beautiful.\n\nText C: £10,000 up for grabs!\n\nThe Mind gym is offering £10,000 in prize money for cutting-edge research into the latest thinking about thinking. To stay ahead of our game we are looking for the latest and best research in the field of hands-on psychology, so that we can use your findings in our books and workshops. The research can cover any subject with universal appeal to an adult population, such as how an optimistic nature affects your life - anything so long as it’s positive and can benefit everyone, not only certain sectors of the population. It should lead directly to plausible implications and the possibility of being applied in real world situations by the general population. Whether you’re a student, researcher, professor or policymaker, there’s more than a penny for your thoughts. The prize is open to everyone and submissions from new researchers are especially welcome. If the work has been done by more than one person, all authors must be signatories and divide any winnings accordingly. Submissions may be published or unpublished reports, carried out in the last two years, but it’s your responsibility to ensure that there are no competing claims for intellectual property rights or copyright. Since we are looking for quality rather than quantity, the research should be no more than 8,000 words. Your research must withstand critical scrutiny and be rigorous in terms of the framing of the research questions, data collection, analysis and interpretation of results. Not scared off? If you are still up for the challenge, submit your proposal here.", "pool": [], "questions": [{"prompt": "Text A. According to the advert, every route", "options": ["offers some kind of aesthetic interest.", "caters for all standards of running ability.", "will require participants to run over a variety of terrain.", "includes venues not previously visited by the general public."], "answer": 0}, {"prompt": "Text A. What do we learn about the run?", "options": ["It requires competitors to pre-register online.", "It requires sponsors to donate money online.", "It has broken records for the number of entrants.", "It has become the most successful 10K fundraiser."], "answer": 0}, {"prompt": "Text B. The writer believes that in the next hundred years", "options": ["people will be able to survive indefinitely.", "there will be fewer vastly overweight people.", "young people will be the ones most affected by weight gain.", "people will eventually become less obsessed by their appearance."], "answer": 2}, {"prompt": "Text B. According to the writer, in the future drugs will enable people to", "options": ["give up fitness training.", "appear toned and athletic.", "have younger looking skin.", "eat what they like and look thinner."], "answer": 2}, {"prompt": "Text C. Which research area would be appropriate for the competition?", "options": ["making effective life decisions", "using the mind to improve football skills", "getting inside the heads of male adolescents", "an investigation of common neurological problems"], "answer": 0}, {"prompt": "Text C. Entrants for this competition must", "options": ["have proven intellectual qualifications in the field of psychology.", "provide empirical evidence to support any theories put forward.", "prove that the work submitted has not previously appeared in print.", "ensure that the research is presented in an appropriately academic style."], "answer": 1}]}], "listening": [{"title": "Young people's eating habits", "type": "mcq", "instructions": "You will hear a news report on young people’s eating habits. Choose the best answer.", "audio": "audio/eating-habits.mp3", "pool": [], "transcript": "Young people's eating habits. Most young people today, unfortunately, have very unhealthy eating habits. Studies have shown that teenagers today eat more processed foods than ever before. When eating out, they choose fast food restaurants for the obvious reasons. They are cheap, noisy, and usually filled with people their own age. However, fast food restaurants are not their only source of unhealthy food. The modern-day family usually has both parents working outside the home, and this means parents don't often have the time to prepare healthy, nutritious meals for their family. Supermarkets today are filled with pre-packaged instant foods. For example, you can get mashed potatoes in a packet, just egg water, tinned or packaged soups, as well as a large variety of frozen, ready-made dishes such as lafanya, meat pies, and many others. Therefore, even home cooked meals might not be that
