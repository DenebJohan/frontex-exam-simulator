nutritious. Another contributing factor to young people's unhealthy eating habits is the fact that there seem to be no regular meal times these days. Most people skip breakfast because they don't have time, or, if they do have something, it is usually of little nutritious value such as toast and jam, or a donut or croissant. Lunch is also a problem. When you have a lunch break, a lot of people use their lunch hour to socialize or run errands, and they don't want to spend a lot of time eating. As a result, the most popular foods at lunchtime are snacks. These come in the form of burgers, fries, hot dogs or sandwiches, which are usually on white bread with plenty of mayonnaise or butter and processed foods such as cheese or lunch and meats. After school, most young people are hungry, so they fill up on biscuits, crisps or other unhealthy snacks. If they end their day with a meal of pizza or some other ready-made food, they have not had anything fresh or nutritious to eat all day. Combined with sugary soft drinks, the average young person's diet is unhealthier now than it has ever been.", "questions": [{"prompt": "The speaker says young people", "options": ["Had a healthier diet in the past", "Think fast food is nutritious", "Would be healthy if they did not eat fast food"], "answer": 0}, {"prompt": "Teenagers like fast food restaurants because", "options": ["They enjoy eating the processed food there", "There are many different dishes to choose from", "They find them sociable places to eat"], "answer": 2}, {"prompt": "The speaker says", "options": ["People should skip breakfast instead of eating doughnuts or croissants", "Home cooked meals are very nutritious", "No fixed meal times lead to bad eating habits"], "answer": 2}, {"prompt": "Young people eat junk food at lunchtime", "options": ["Because it is convenient", "Because it is filling", "Because they cannot afford anything else"], "answer": 0}, {"prompt": "The speaker says teenagers", "options": ["Eat unhealthy snacks all day long", "Sometimes eat nothing healthy all day", "Need to learn to cook healthy food"], "answer": 1, "note": "The speaker says “they have not had anything fresh or nutritious to eat all day”."}]}, {"title": "Rajio Taiso (radio calisthenics)", "type": "mcq", "instructions": "Listen to the radio interview and mark the best answers.", "audio": "audio/rajio-taiso.mp3", "pool": [], "transcript": "role in our lives as it keeps us healthy by maintaining the strength of our muscles, bones, heart and lungs. Every morning, like clockwork, the people of Japan work out en masse from 6:30 to 6.45 AM for another day of health and vitality. Matthew Carrington reports. Radio Taiso, or radio calisthenics, is a government program that was first broadcast live on the radio in Tokyo in 1928. These stretching exercises quickly spread out to other open spaces all over Japan, aired on public loudspeakers. In the early 1960s, at the peak of its popularity, the number of people participating in radio calisthenics was in the tens of millions. Today, all around Japan, public employees and company workers can be seen stretching and doing jumping jacks at their workplace. Even senior citizens are involved in groups that meet every morning. With us today is Dr. Carolyn McConaughey, a professor of social studies education, who will talk to us about this Japanese program. Well, although radio taiso is very different from popular forms of exercise in America, I'm interested in researching it because I feel it could also have a positive future here in the States. Of course, the program doesn't have to be as strict as it was in Japan when it first started. For example, oversleeping was discouraged during students' summer vacation. Elementary and junior high school students followed a strict routine. After group calisthenics at 6:30 a.m., they went home, had a proper breakfast and did a few hours of summer vacation homework. Schools even maintained attendance rosters and teachers used to patrol various recreation areas and schooled any child that was playing before 10 a.m. I don't believe we need to take such extreme measures here, but I do think we should put a greater emphasis on health and fitness in schools. Also, what I find so amazing about this Japanese program is that it not only aims at improving citizens' health, but it is also believed to help boost self-esteem, fight fatigue, and promote a strong sense of community. Is radio taiso still faithfully practiced? Well, today students are less likely to participate in it, especially in big cities and some schools don't even organize it anymore. This is a vivid illustration of change that's reflected in Japanese society today. Of course, this doesn't mean that it's dying out. Let's remember that the Japanese have one of the highest life expectancies in the world, and I think that this has a lot to do with their frame of mind concerning a healthy lifestyle. There are still many summer events which attract large crowds of people of all ages. I honestly think that radio taiso would be a great asset to the American workforce. It would improve their health and help keep them attentive throughout the day. I'm sure most people are probably aware of the fact that exercise is a vital part of healthy living. However, I don't think we'll be seeing many Americans doing such exercises at 6:30 a.m. There's no doubt that radio calisthenics encompasses an enduring fascination for the would-be health conscious.", "questions": [{"prompt": "What is 'rajio taiso'?", "options": ["a public broadcasting network", "an urban development project", "a workout program on public broadcasting networks"], "answer": 2}, {"prompt": "Why was 'rajio taiso' implemented by the Japanese government?", "options": ["to instill health consciousness among the public", "to raise public awareness about proper nutrition", "to improve public health care services"], "answer": 0}, {"prompt": "Why is Dr. McConaughey interested in studying 'rajio taiso'?", "options": ["to compare it to other exercise routines in Japan", "to compare it to similar exercise routines in America", "to show that it could be adapted in America"], "answer": 2}, {"prompt": "What is one reason for the decline of radio calisthenics in Japan?", "options": ["continuous monitoring", "traditional society", "social change"], "answer": 2}, {"prompt": "What prediction do the speakers make about radio calisthenics in America apart from improving health?", "options": ["It would extend workers’ lifespan.", "It would make workers more alert.", "It would make workers irritable."], "answer": 1}]}, {"title": "The imaginary diet", "type": "mcq", "instructions": "Listen to the discussion and choose the best answer.", "audio": "audio/imaginary-diet.mp3", "pool": [], "transcript": "It sounds too good to be true, but psychologists may have come up with a perfect diet. To stop cravings for particular foods, they suggest that you simply imagine eating them. Marcus White is here to tell us more about this imaginary diet. The research is still at an early stage, but has already raised some interesting questions about appetite and how to control it. Behavioral psychologist Linda Douglas has been studying how non-physiological factors can affect eating habits. That's right, Marcus. I'm sure that many people regard hunger as primarily a physical sensation. A groundbreaking experiment was carried out in 1998, which clearly demonstrated the role of mental function in appetite. In brief, the test involved subjects who suffer from severe amnesia and were unable to remember any event for longer than a minute. They were served three consecutive meals which they happily ate with no reported loss of appetite or feelings of fullness. A second control group with normal memory function was consistently less hungry after the first meal. The researchers concluded that the memory of what they had recently eaten had affected their appetites. So, the idea of the imaginary diet is that a subject imagines eating immediately before a meal. Their memory is tricked into thinking that they have already eaten, and as a result, suppresses their appetite. Well, that's the theory. In practice, only the appetite for individual foods was tested. In one trial, subjects were shown a photograph of a piece of cheese and then instructed to imagine eating it. This process was then repeated 30 times. By the end of the experiment, the subject showed little interest in eating real cheese, although they insisted that they still liked the taste. The psychological term for this process is habituation. Habituation is characterized by a decline of interest in something as well as a loss of motivation to obtain it. What is remarkable about this research is that it suggests that habituation can occur as a result of imagined actions. Did the participants in the trial make any of the physical movements associated with eating? I mean, did they mind cutting up their food or chewing it? No, no. They just looked at photographs of the food and then mentally pictured themselves eating it. Of course, the imaginary eating didn't make them feel full, so their appetite wasn't physically reduced. Nor did it alter their overall opinion of the food. By simply imagining themselves eating the food over and over again, they had lost the desire to eat it when it was offered to them soon afterwards. There could be numerous potential applications for this kind of treatment, couldn't there? Absolutely. It could be effective in treating a whole range of behavioral problems and addictions. Unfortunately, there will need to be comprehensive research and clinical trials before clients will be able to think themselves better. While all for one will be interested to see the outcome of future studies into this extraordinary phenomenon, I hope that you'll come back then to continue the discussion, Linda.", "questions": [{"prompt": "What is the subject of the discussion?", "options": ["how dieting can actually increase feelings of hunger", "how eating habits could possibly be controlled", "how some people can be affected by cravings"], "answer": 1}, {"prompt": "What did the 1998 study prove?", "options": ["Appetite is affected by memory.", "Appetite varies among individuals.", "Appetite is not connected to hunger."], "answer": 0}, {"prompt": "What did researchers use in the latest experiments?", "options": ["pictures of people eating cheese", "thirty different types of cheese", "images of a piece of cheese"], "answer": 2}, {"prompt": "What behavior can indicate habituation?", "options": ["a decline in physical activity", "decreased powers of imagination", "a diminished desire for something"], "answer": 2}, {"prompt": "What do the speakers agree on about the research topic?", "options": ["that it can replace other established treatments", "that it is an extraordinary phenomenon", "that it can be used in a variety of ways"], "answer": 2}]}, {"title": "Tristan da Cunha", "type": "mcq", "instructions": "You will hear an interview with a travel writer who has visited people living on a remote island. For questions 1-5, choose the best answer.", "audio": "audio/tristan-da-cunha.mp3", "pool": [], "transcript": "You will hear an interview with a travel writer who has visited people living on a remote island. For questions 1-5, choose the best answer. -- What would it be like to live in the middle of nowhere, far from civilisation with little contact with the rest of the world? Well, my next guest has experienced exactly this and is here to tell us about it. Terry Hellman is a travel writer and blogger who recently returned from a trip to Tristan da Cunha, the world's most remote inhabited island. Welcome to the show, Terry.\n— Thank you.\n— Let's start by telling us about the island of Tristan da Cunha. Where is it?\n— It's located in the South Atlantic Ocean about 2,500 kilometres from the nearest mainland of South Africa, making it the remotest inhabited island on the planet, with close to 300 people living there. Fascinatingly enough, it's a volcanic island with a harsh terrain, making it almost impossible to get to. There is no airport, no port, and it's too far from any mainland for a helicopter to reach, so only with an exhausting seven-day journey by boat was I able to get there.\n— That certainly is the middle of nowhere. Who are these people and why do they live there?\n— That's exactly what I wanted to know and the reason for my trip. The first settlers on the island were fishermen who arrived in the early 1800s from America. These settlers tried to establish a community that failed due to the harsh conditions on the island. Shortly afterwards, the British government took control of the island and slowly a community grew from these settlers. The island eventually became part of the British Empire and the people living on the island today are descendants of these original settlers.\n— So they live there cut off from the modern world?\n— Mostly, apart from the occasional supply boat that comes to the island. The people live in one village on the north end of the island where it is flat enough for housing and farming. They have lived there relatively undisturbed, except for 1961 when a dramatic volcanic eruption forced the evacuation of the island. The islanders were taken to England and temporarily put up in an army camp while awaiting permanent housing. The British government sent some experts back to check on the state of the island following the eruption. When they declared it safe, almost all of the islanders wanted their simple way of life back and chose to return.\n— Really? They weren't drawn to the allure of a modern city?\n— No, and I can tell you why. When I first arrived on the island, I was surprised at the warm reception I got. I mean, here I was, a stranger they knew nothing about, and instead of being cautious and reserved with me, they were all so hospitable. I later came to understand how supportive everyone is of each other there, something you don't easily find in today's fast-paced cities.\n— This is true. So what do the people do on the island?\n— Well, everyone has their own livestock and garden. Some people work as fishermen, while others work at the lobster factory, which is the island's main source of foreign income through exports. There are shops and a supermarket that sell much-needed items that are not made on the island. Everyone has a job and helps in the running of the island's economy, and as a result they all enjoy the same standard of living and income.\n— Sounds like a strong economy!\n— Yes, but not only that, there is no crime. Everyone knows everyone else and they help each other out. I was really amazed by how generous and helpful everyone was with each other. Every day is a bit different depending on what is needed in the village. On a good fishing day some people may not go to work in order to help out in transporting the fish. On another day some residents may stop their work to repair a building or help out with a project at the school.\n— How many children attend the school?\n— About 35, and they are eager to learn. The island now has internet access and the school recently set up a new computer room with new equipment. This will greatly affect the island, as these young people can now use the internet and send emails. Although few tourists will ever come to the island, these kids will grow up having a lot more contact with the outside world because of the internet.\n— Do you think that more contact with the outside world is good for the island?\n— It depends. I think learning about the world is a good thing, as long as it doesn't destroy the values the islanders have regarding their community. My time on the island allowed me to experience living in a cooperative environment. Although I enjoy living in a big city and plan to continue travelling as usual, I now realise how essential it is to be surrounded by supportive people.\n— Well, it sounds like it was an extraordinary experience with some incredible people. Thank you, Terry, for sharing some of it with us today.\n— My pleasure.", "questions": [{"prompt": "Why did Terry want to visit Tristan da Cunha?", "options": ["because he was curious about the people living there", "because it's very difficult to get there", "because it's the remotest inhabited island"], "answer": 0}, {"prompt": "Why did the people of Tristan da Cunha return to the island after the volcanic eruption?", "options": ["They were deported by the British government.", "They preferred the island lifestyle.", "They had nowhere else to go."], "answer": 1}, {"prompt": "What does Terry say about the economy of Tristan da Cunha?", "options": ["It relies solely on the local market.", "Everyone has the same wealth.", "It produces everything the people need."], "answer": 1}, {"prompt": "Terry thinks the way of life on the island in the future", "options": ["will be affected by increased tourism.", "will change due to new technology.", "will continue to stay the same."], "answer": 1}, {"prompt": "How has Terry's visit to the island changed him?", "options": ["He now appreciates the importance of a caring community.", "He wants to travel less often now.", "He is not interested in city life anymore."], "answer": 0}]}, {"title": "United Airlines crash", "type": "mcq", "instructions": "Listen to the dialogue and mark the correct answer.", "audio": "audio/united-airlines.mp3", "pool": [], "transcript": "This afternoon we welcome Nicole Svartek to the studio. Nicole runs special courses for the airline company Virgin Atlantic, and today we'll be discussing the 1989 United Airlines DC-10 Flight 232 crash, in which tragically over 100 people were killed. Good afternoon, Nicole.\n— Hello.\n— Perhaps you could tell us, first of all, what your courses involve, Nicole.\n— Well, pilots need to be trained to deal with dangerous situations, so they are able to stay calm and think clearly in the event of an emergency. This reduces the chances of human error, which often results in disaster.\n— Crash experts always look for the black box flight recorder at the crash scene. This is a really useful piece of equipment, isn't that correct?\n— Yes, the black box actually records everything that is said in the cockpit. So when the crash experts listen to the recording after they have found it, they can usually find out what caused the crash.\n— So what actually happened in the United Airlines crash?\n— Well, the number two engine failed at 37,000 feet over the western United States. Fortunately, as the captain had been on one of our courses, he was able to stay calm even though he knew that he might die. Because he didn't panic, he was able to concentrate on landing the plane as safely as possible.\n— So how did he do that?\n— Well, together with his crew and a trainee pilot who happened to be a passenger on the flight, the captain was able to plan a controlled crash landing in Sioux City. Unfortunately, as I mentioned earlier, over 100 people were killed in the crash, but miraculously 183 people survived.\n— So these people have the plane's captain to thank for saving their lives with his good training and self-control.\n— Absolutely. Nicole, thank you very much for joining us today.\n— Thank you.\n— Next week on The News Today we shall be discussing ...", "questions": [{"prompt": "In the United airlines crash", "options": ["more than 100 people died", "exactly 100 people died", "less than 100 people died"], "answer": 0}, {"prompt": "Nicole trains pilots to", "options": ["think clearly in everyday situations", "stay calm in an emergency", "fly aeroplanes"], "answer": 1}, {"prompt": "Where did the number two engine fail?", "options": ["over the eastern United States", "over the southern United States", "over the western United States"], "answer": 2}, {"prompt": "The plane's captain", "options": ["panicked when the plane's engine would not work", "decided to go on a CMR course after the crash", "tried to land the plane safely"], "answer": 2}, {"prompt": "Many people on the flight survived because", "options": ["a trainee pilot landed the plane", "the pilot behaved correctly", "the plane landed in the sea"], "answer": 1}]}, {"title": "Ways to relax", "type": "matching", "instructions": "You will hear five different people talking about the way they relax. Choose the right speaker", "audio": "audio/ways-to-relax.mp3", "pool": [{"key": "1", "text": "Speaker 1"}, {"key": "2", "text": "Speaker 2"}, {"key": "3", "text": "Speaker 3"}, {"key": "4", "text": "Speaker 4"}, {"key": "5", "text": "Speaker 5"}], "transcript": "Speaker 1: I've never really enjoyed passive forms of entertainment. I find that the best way to unwind at the end of a long day is to do something active. The minute I get home from work, I put on my trainers and go for a run in the park. It really gets rid of all the tension that builds up in me through the day. I go to the gym four times a week too. My friends don't understand why I don't just lounge in front of the TV like they do, but the truth is that I just don't feel relaxed when I'm sitting around doing nothing. Speaker 2: This machine has got to be the best thing I've ever bought. It was expensive of course, but it was worth every penny. Now I spend almost all my free time watching films. I've had a video before of course, but this is the next step up and much better. The quality is fantastic for a start, and you also get interviews with the actors and information about the making of the film, which you never got on videos. The digital quality is just so much better than videos, and of course the discs don't take up nearly as much room. My favourite way to relax in the evenings these days is to curl up on the sofa with the remote in my hand. Speaker 3: I was never a big fan of modern technology until I bought my computer and got online. I spend most of my evenings checking out different websites, just surfing, you know. There's so much information, it's amazing. I've learnt so many new things and I've even made some new friends in the chat rooms I've visited. Some people say that it's an anti-social way of passing the time, but I don't agree. My social life has improved, actually. I've found lots of brilliant sites and I've learnt all sorts of things that I never knew before. Speaker 4: It might seem a bit old-fashioned in this world of computers and hi-tech gadgets, but I have to say that I prefer to make my own entertainment. My family agrees with me. We hardly ever watch television, and we don't even own a computer. In the evenings, when the kids have finished their homework and we've all had dinner, we usually get together and play something fun. I think it's better for the kids. They can practise their spelling with Scrabble, and they learn lots of useful facts when we play Trivial Pursuit. It's a great way to improve your general knowledge. It's relaxing, but it exercises our brains at the same time. Speaker 5: My mum bought me this for my birthday and now I hardly ever put it down. I think it's much better than a computer because you can take it everywhere with you. I've got loads of games for it and I swap them with my friends at school, so I get to play lots of different things and I never get bored. I find it very relaxing. I just sit and play in my room after school and at the weekends. I'm always trying to beat my last score for each game, and to get a higher score than all of my friends.", "questions": [{"prompt": "I have the chance to exchange the things with others", "answer": "5"}, {"prompt": "I love learning new steps", "answer": "3", "note": "No speaker says it word for word; by elimination it is Speaker 3 (“I've learnt so many new things”)."}, {"prompt": "It makes you think but it is also relaxing", "answer": "4"}, {"prompt": "I like doing something energetic", "answer": "1"}, {"prompt": "I enjoy the improved quality it offers", "answer": "2"}]}, {"title": "Where is the speaker?", "type": "mcq", "instructions": "You will hear five recordings. Decide in which place the speaker is talking.", "audio": "audio/workplaces.mp3", "pool": [], "transcript": "18. Now I wonder where I'll find it. It could be here. Let's have a look. No, it's not here. Funny, that's where they are normally left for me. It's got my name on it. Perhaps they've sent it to the department. Let's look at the pigeonhole for sales. Oh, look at this. ... Ah, here it is. Thank goodness I didn't have to look through all the letters to find it. 19. Morning, Jeff. How are you? Cold today, isn't it? Are you okay? Can you get out? You haven't left yourself much room there. Mind the paintwork! We're going to be busy today. There are lots of visitors coming in today, so don't expect to have time for lunch. We'll be lucky if we find time to get some coffee. We'd better hurry up and get in. Oh, you go ahead. I've just remembered I've left some papers behind. If I can just find my keys again, I can get into the car. 20. So it's my job today to show you around. As you can see, it's pretty big, so we tend to get around by means of these forklift trucks. They run on rails and follow a particular route around the premises. If you'd like to get on, I'll take you around and show you how things work. So, let's suppose I have an order and I need to pick some items from Rack J8. We turn into the aisle which is signposted J, and then look for Rack 8. I can stop here, and then direct the arm up onto the rack, and the arm will then pick out however many items I program it to, and drop them into the collection basket. Easy, isn't it? 21. Hello Penny. Nice to see you back again. What was the matter with you? Flu? There's a lot of it about this time of year. Now, what tempts me today? Mmm, that looks nice. I can't make up my mind if I want something hot or cold today. Perhaps I'll go for something hot since the weather is so cold outside. And what did you say that was? Steak and kidney pie? Ooh, yes, I think I'll go for that. And a cup of tea to go with it, please. 22. I don't know what happened. It just started making this horrible noise. I tried switching it off and on again, but it obviously doesn't want to work. Perhaps it just needs something changed. No, perhaps not. Maybe it's something inside. How do you open this thing anyway? Ah, now I see. That's it. That's what's causing all the noise. There's a massive jam in here. So all we have to do now is to release all the bits of torn paper that have got stuck in here.", "questions": [{"prompt": "Recording 1: where is the speaker?", "options": ["Office", "Photocopying room", "Reception", "Car park", "Warehouse", "Post room", "Manager's office", "Canteen"], "answer": 5}, {"prompt": "Recording 2: where is the speaker?", "options": ["Office", "Photocopying room", "Reception", "Car park", "Warehouse", "Post room", "Manager's office", "Canteen"], "answer": 3}, {"prompt": "Recording 3: where is the speaker?", "options": ["Office", "Photocopying room", "Reception", "Car park", "Warehouse", "Post room", "Manager's office", "Canteen"], "answer": 4}, {"prompt": "Recording 4: where is the speaker?", "options": ["Office", "Photocopying room", "Reception", "Car park", "Warehouse", "Post room", "Manager's office", "Canteen"], "answer": 7}, {"prompt": "Recording 5: where is the speaker?", "options": ["Office", "Photocopying room", "Reception", "Car park", "Warehouse", "Post room", "Manager's office", "Canteen"], "answer": 1}]}, {"title": "Vikings, Celts and Maya", "type": "mcq", "instructions": "Listen and choose True or False", "audio": "audio/museum-exhibits.mp3", "pool": [], "transcript": "A. The Vikings. Exhibit A is the Gokstad, a burial ship from the Viking Ship Museum in Oslo, Norway. The ship was found in Norway in 1880, and it was built around 890 AD. It was used to bury a powerful chief who died around 900 AD. Many rich Vikings were buried under the earth in ships, along with their weapons, jewellery and other possessions. The Vikings thought that the ship would take them safely to the land of the dead. The Vikings are remembered as pirates. They were fierce warriors. They terrorised many seaside towns in Europe from the late 700s AD to about 1100 AD, but they were mainly farmers and traders as well as excellent craftsmen. The Vikings developed ships that could travel very far. Viking warships were light, so they could sail up shallow rivers and through rough seas. The Vikings reached as far as Baghdad in search of trade and conquest. They set up trading towns around Europe and discovered and settled in Greenland when it was still unknown. The Vikings were brave sailors and explorers. They landed in North America 500 years before Christopher Columbus. B. The Celts. Exhibit B is a model of a Celtic roundhouse, the traditional home of the Celts. The roundhouse was made of timber and had a thatched roof. This way smoke could filter out but rain couldn't get in. Cooking and washing were done on the central fire, while people slept around the inside of the wall. Historians say that the Celts came from southern Germany. Their influence spread to Spain, Britain, northern Italy, and even reached as far as Turkey. The Celts were mainly tribes of farmers, each with their own chief. Sometimes these tribes divided and spread through different areas. They were bound together by the druids, who were learned priests and lawmakers, wise men and bards. Bards were poets who travelled from place to place, singing poetic songs. They were a very important part of Celtic life. Through the bards' songs and poems, people learned about their history, laws, religion and news. The Celts also had gifted musicians, metalworkers and artists who made jewellery, weapons and pottery. Like the Vikings, the Celts were fierce warriors and used iron to make weapons. Around 80 AD, they came under Roman rule. After the fall of Rome, Celtic ways survived only in Ireland, Cornwall, Brittany and parts of Wales and Scotland. C. The Maya. Exhibit C is a replica of the famous Mayan city, Tikal, in Guatemala. The Maya were American Indian people. They developed a magnificent civilisation in southern Mexico and Central America which peaked from 250 AD to 900 AD. The Maya were greatly influenced by the Olmec people. The Olmec lived west of the Maya around 800 BC and were probably the Central American inventors of writing, numbers and a calendar. The Maya made huge progress in architecture, writing and the sciences. They were also skilled craftspeople. They made stone sculptures and carvings from jade, a precious green stone. The Mayan population increased rapidly. The Maya built grand and huge cities like El Mirador and Tikal. These cities were carefully planned with many beautiful temples that looked like Egyptian pyramids. They had well laid-out roads and large open spaces. From about [unclear: 1500?] AD the Mayan civilisation slowly declined. In the mid-1500s, the Spanish conquerors invaded and conquered almost all of the Mayan empire.", "questions": [{"prompt": "Wealthy Vikings were buried with their weapons and jewellery", "options": ["True", "False"], "answer": 0}, {"prompt": "Christopher Columbus discovered America before the Vikings", "options": ["True", "False"], "answer": 1}, {"prompt": "The Celts came from southern Spain", "options": ["True", "False"], "answer": 1}, {"prompt": "The Celts used iron weapons", "options": ["True", "False"], "answer": 0}, {"prompt": "The Spanish arrived peacefully in Central America in the 1500s", "options": ["True", "False"], "answer": 1}]}, {"title": "Who is the speaker talking to?", "type": "matching", "instructions": "You will hear five recordings. Five people are talking to other people. Decide who each speaker is talking to. Select one option for each. There are 2 options you do not need.", "audio": "audio/who-are-they-talking-to.mp3", "pool": [{"key": "A", "text": "Canteen worker"}, {"key": "B", "text": "Subordinate/Assistant"}, {"key": "C", "text": "Personnel manager"}, {"key": "D", "text": "Warehouse supervisor"}, {"key": "E", "text": "Maintenance engineer"}, {"key": "F", "text": "Customer"}, {"key": "G", "text": "Job applicant"}], "transcript": "18. ... Yes, I think you'll be very happy. It's good to know you've been with us before too, so you know that we always try to do our best for you. I'm going to put in a request for an express delivery on this order, so hopefully you should get it within the week. If all else fails, I'll bring it over myself. 19. Okay, so you tell me you always do a good job. I'm very glad to hear it. So now I'm going to ask you to tell me about a time when you were not satisfied with what you did: what happened, how you reacted to the situation, and what you learned from it afterwards. It's very important in the job we're talking about to be able to take the rough with the smooth and to learn from negative experiences. 20. Right, now today's going to be really busy, so I'm going to need all the help I can get. Would you please contact Mr Jones and let him know that I'll be there half an hour later than I said originally? You know, lots of apologies and all that, but there's just no way I'll get there in time. I hope he won't be too angry. And I need you to print off those letters we put together yesterday. They have to be sent out today. Oh, and could you please check my appointment diary for next week? I think I might need to make some changes. 21. Oh, do you need the office now? I thought you were coming in an hour's time. Okay, just give me a minute, and I'll see if I can find another office to work in. How long is it likely to take? About three hours? So there's a good chance I can have my office back in the afternoon then. You will tidy up when the work is done, won't you? Please? Yes, I know the cables are under the carpet, and taking up the carpets causes a mess, but I have a lot of work to do, and I really can't cope with having to re-lay carpets today. 22. Oh, I don't know. I can't make up my mind. What do you suggest? Any recommendations today? Yes, yes. That's got possibilities. Or, this one looks nice. No? You don't think so? All right, I'll go with your suggestion then. It looks rather nice, but I'm sure it will be terribly fattening. Oh well, if you can't spoil yourself occasionally with nice food, life wouldn't be worth living, would it?", "questions": [{"prompt": "Recording 1: who is the speaker talking to?", "answer": "F"}, {"prompt": "Recording 2: who is the speaker talking to?", "answer": "G"}, {"prompt": "Recording 3: who is the speaker talking to?", "answer": "B"}, {"prompt": "Recording 4: who is the speaker talking to?", "answer": "E"}, {"prompt": "Recording 5: who is the speaker talking to?", "answer": "A"}]}], "writing": [{"id": "dictionaries", "kind": "essay", "title": "Dictionaries in English exams", "prompt": "Should dictionaries be allowed during English exams? Write an essay discussing the pros and cons and give your opinion.", "min": 100, "max": 120, "model": "I believe that using dictionaries during English exams has both advantages and disadvantages.\n\nOn the one hand, dictionaries help to reduce lexical errors, because they show not only the meaning of a word but also its pronunciation and spelling. Moreover, they are useful both for understanding a text and for writing one.\n\nOn the other hand, looking words up takes time when a task has to be completed within a fixed period. In addition, a dictionary does not allow the examiner to check what the candidate really knows.\n\nIn my opinion, dictionaries should be allowed during English exams because they are a valuable reference, as long as the time limit is respected."}, {"id": "dog", "kind": "email-informal", "title": "Looking after my dog", "prompt": "Your friend has agreed to look after your dog for the weekend. Write an informal email to your friend with instructions on how to look after your dog (feeding, walks, activities, etc.).", "min": 80, "max": 120, "model": "Subject: Tips for looking after Bob\n\nHi Leila,\n\nFirst of all, thank you so much for helping me out with Bob this weekend!\n\nYou'll find his meals in the fridge, already divided into portions for each day. I usually feed him three times a day: in the morning, at lunchtime and in the evening. He also needs a walk once a day, preferably in the afternoon, and his lead is hanging behind the front door. He loves playing with his red ball in the garden, so feel free to throw it for him.\n\nDon't worry, he's very friendly, so I'm sure you'll get on well.\n\nTake care and see you on Monday!\n\nLove,\nAnna"}, {"id": "online-lessons", "kind": "letter-formal", "title": "Online lessons at school", "prompt": "A school has decided to teach some subjects online. Write a letter to the editor of a local newspaper saying whether you agree with this decision and why.", "min": 120, "max": 150, "model": "Dear Editor,\n\nI am writing regarding the decision of some schools to teach certain subjects online, and I would like to share my views.\n\nIn my opinion, online lessons bring several advantages. Firstly, they are more cost-effective for both schools and students: schools can reach more students without the cost of physical classrooms, while students save money on travel and textbooks. Secondly, they benefit students who live in remote areas, as they can follow lessons and contact teachers by email or chat. Finally, online learning is flexible, because students can review material and study at their own pace.\n\nHowever, technical problems may occur and some students might feel isolated, so schools should offer support when needed.\n\nOverall, I am in favour of this decision.\n\nYours faithfully,\nAnna Rossi"}, {"id": "canteen", "kind": "report", "title": "Problems in the staff canteen", "prompt": "You are the manager of your company's canteen. Write a report to your boss describing what is going wrong in the canteen and suggesting solutions.", "min": 120, "max": 160, "model": "Dear Mr Taylor,\n\nSince I started managing the canteen, a few problems have emerged. I would like to describe them and suggest some solutions.\n\nFirstly, a lot of food is wasted, as many people leave their meals half-finished. I believe this is linked to the pre-packaged snacks sold during the morning. I would suggest offering fresh fruit instead, which would reduce waste and encourage a healthier diet.\n\nSecondly, we have received complaints about foreign objects in the food. This could be solved by more frequent pest control and by having an external technician service the kitchen equipment every week.\n\nFinally, since working hours were extended, the number of people using the canteen has increased and it is often overcrowded. I propose extending the canteen into the empty room next door.\n\nI look forward to discussing these proposals with you.\n\nKind regards,\nAnna Rossi"}, {"id": "complaint-hotel", "kind": "email-formal", "title": "Complaint to a hotel", "prompt": "You recently stayed in a hotel and were disappointed with your room and the service. Write a formal email to the hotel manager explaining the problems and saying what you expect the hotel to do.", "min": 100, "max": 140, "model": "Subject: Complaint about my stay, 12–15 March\n\nDear Sir or Madam,\n\nI am writing to complain about my recent stay at your hotel.\n\nAlthough I had booked a double room with a sea view, I was given a small room overlooking the car park. In addition, the air conditioning did not work, and when I reported the problem at reception, nobody came to repair it. Breakfast was also disappointing, as several items had run out by 8:30.\n\nConsidering that I paid the full price, I would expect a partial refund for the three nights. I would also appreciate an explanation of why my booking was not respected.\n\nI look forward to hearing from you.\n\nYours faithfully,\nAnna Rossi"}, {"id": "remote-work", "kind": "essay", "title": "Working from home", "prompt": "More and more people work from home. Write an essay discussing the advantages and disadvantages of working from home and give your opinion.", "min": 100, "max": 140, "model": "Working from home has become very common in recent years, and it has both benefits and drawbacks.\n\nOn the one hand, employees save time and money because they do not have to commute. They can also organise their day more flexibly, which often helps them balance work and family life.\n\nOn the other hand, working from home can be lonely, and some people find it difficult to separate their working hours from their free time. Communication with colleagues may also become slower and less effective.\n\nIn my opinion, the best solution is a mix of both: working from home for part of the week and going to the office on the other days. This way, people can enjoy flexibility without losing contact with their team."}, {"id": "invite-friend", "kind": "email-informal", "title": "Invitation to visit", "prompt": "An English-speaking friend is planning a holiday in your country. Write an informal email inviting them to stay with you and suggesting what you could do together.", "min": 80, "max": 120, "model": "Subject: Come and stay with me!\n\nHi Sam,\n\nI was so happy to hear that you're coming to Greece this summer! Why don't you stay with me in Thessaloniki? I've got a spare room, so you're more than welcome.\n\nThere's plenty to do here. We could walk along the seafront to the White Tower, try some of the best street food in the city and spend a day at the beaches in Halkidiki, which are only an hour away by car. If you like history, I'd love to take you to Vergina too.\n\nLet me know your dates as soon as you can, and I'll pick you up at the airport.\n\nSee you soon!\n\nBest,\nAnna"}, {"id": "review", "kind": "review", "title": "A place to eat", "prompt": "An English-language website is asking readers to review a restaurant or café they know well. Write a review describing the place, the food and the service, and say whether you would recommend it.", "min": 100, "max": 140, "model": "The Blue Lemon, city centre\n\nThe Blue Lemon is a small family-run café just off the main square. It has a cosy, relaxed atmosphere, with wooden tables and plants everywhere, and it is a perfect place to escape from the noise of the city.\n\nThe menu is short but excellent. I strongly recommend the homemade pies and the fresh lemonade, which gives the café its name. Prices are reasonable, especially at lunchtime, when there is a fixed menu.\n\nThe staff are friendly and helpful, although service can be slow at weekends, when the café gets very busy.\n\nOverall, I would definitely recommend The Blue Lemon to anyone looking for good food in a pleasant setting. Just try to go on a weekday!"}], "speaking": [{"q": "How long have you been learning English?", "secs": 10, "model": "I've been learning English since I was fifteen. I started at school and then carried on with courses on my own."}, {"q": "What's your name? How do you spell that?", "secs": 15, "model": "My name is Anna Rossi. Anna is A-N-N-A, and Rossi is R-O-S-S-I."}, {"q": "Who are the most important people in your life?", "secs": 15, "model": "The most important people in my life are my parents. I'm very close to them and they've always been a role model for me."}, {"q": "What are you going to do this weekend?", "secs": 30, "model": "This weekend I'm going to visit Berat, a town in Albania about fifty kilometres from where I'm staying. It's famous for its old houses, and it's in a beautiful location between two hills, next to a river, so I'm really looking forward to it."}, {"q": "Is English more difficult than other languages? Why?", "secs": 30, "model": "I don't think English is the most difficult language to learn, because a lot of its vocabulary comes from Latin, like Italian. However, it can be tricky because of idioms and phrasal verbs, which make no sense out of context, and because words are often pronounced differently from how they are written."}, {"q": "Which home appliance couldn't you live without? Why?", "secs": 60, "model": "The home appliance I couldn't live without is the washing machine. First of all, it saves me a lot of time that I can spend on more enjoyable things. It's also very easy to use: I just choose the right programme and it does everything by itself. Finally, the result is much better than washing clothes by hand. For me, it's one of the cleverest inventions ever."}, {"q": "Do you think it is better to live in the city or in the countryside? Why?", "secs": 60, "model": "In my opinion, living in a city has more advantages. A city offers many services and facilities that make everyday life easier, especially for working people and families, and there's a wider range of leisure activities for all ages. On the other hand, the countryside offers things you can't find in a city, such as silence, less traffic and the chance to live close to nature. So for a holiday, I'd choose the countryside."}, {"q": "How do you prefer to travel: by train, car or plane? Why?", "secs": 60, "model": "It depends on where I'm going. For long distances I prefer flying, because it saves time. For medium distances, especially to big, well-connected cities, I prefer the train, and then I get around on foot or by bus. I only use the car for short trips or to reach places that aren't well served by public transport."}, {"q": "What sports do people play most in your country? And what do they enjoy watching?", "secs": 30, "model": "In Italy people love both playing and watching football. It's by far the most popular sport. People often get together to watch their favourite team, and many organise a game with friends on Sunday."}, {"q": "What is your favourite meal?", "secs": 15, "model": "My favourite meal is breakfast, especially pancakes. I make them with flour, milk, banana and oats, and they only take a few minutes."}, {"q": "What are you fond of doing in your spare time?", "secs": 30, "model": "In my spare time I'm fond of walking along the beach near my flat while listening to podcasts or music, usually Latin music. It helps me relax and it's good for my health too."}, {"q": "What is public transport like in your country?", "secs": 30, "model": "Public transport in my country is quite good in the big cities, where there are buses, trams and the metro. High-speed trains between the main cities are fast and comfortable. However, in small towns and in the countryside the service is less frequent, so most people use their cars."}, {"q": "Is there a TV show you can't stand? Why?", "secs": 30, "model": "Yes, I can't stand reality shows. I find them boring and quite artificial, because most situations are clearly staged. I'd rather watch a good documentary or a TV series with a strong story."}, {"q": "Could you tell me something about the area where you grew up? What did you like about living there?", "secs": 60, "model": "I grew up in a small town in the south of Italy, near the sea. It was a quiet place where everyone knew each other. What I liked most was the freedom: as children we could play outside all day and go to the beach in summer. The only drawback was that there weren't many opportunities for young people, so I moved away to study."}, {"q": "What is the most exciting thing you have ever done?", "secs": 60, "model": "The most exciting thing I've ever done was a skydiving jump for my thirtieth birthday. I was terrified on the plane, but the moment I jumped, the fear turned into pure excitement. The view from up there was amazing, and when I landed I couldn't stop smiling. It made me realise that sometimes you have to step out of your comfort zone."}, {"q": "Describe a person who has influenced you. How did they influence you?", "secs": 60, "model": "A person who has really influenced me is my first English teacher. She was patient and enthusiastic, and she made us feel that making mistakes was part of learning. Thanks to her, I started reading books and watching films in English, and I became much more confident. She also taught me the importance of being curious."}, {"q": "What did you do last summer?", "secs": 30, "model": "Last summer I spent two weeks on a Greek island with some friends. We rented a small house near the beach, went swimming every day and explored the villages by scooter. It was really relaxing."}, {"q": "Do you prefer working alone or in a team? Why?", "secs": 60, "model": "I generally prefer working in a team, because you can share ideas and learn from other people's experience. Difficult problems are often easier to solve together. That said, for tasks that need a lot of concentration, like writing a report, I prefer to work alone and then share the result with my colleagues."}]}</script>

  set(k, v){ try{ localStorage.setItem('b2sim:'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- helpers ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle = a => { a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const fmt = s => { s=Math.max(0,Math.round(s)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); };
const h = (html) => { const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; };
function level(p){ return p>=80 ? ['Above B2','ok'] : p>PASS ? ['Meets B2','ok'] : p>=50 ? ['Close to B2','mid'] : ['Below B2','ko']; }

/* Each "item" = one scorable question with a uniform shape:
   {uid, kind:'grammar'|'reading'|'listening', set (for reading/listening), q, answer, options|pool} */
function grammarItem(g, i){ return {uid:'g'+i, kind:'grammar', g, idx:i}; }
function setItems(kind, s, si){ return s.questions.map((q,qi)=>({uid:kind[0]+si+'.'+qi, kind, set:s, si, q, qi})); }
function correctOf(it){ return it.kind==='grammar' ? it.g.answer : it.q.answer; }
