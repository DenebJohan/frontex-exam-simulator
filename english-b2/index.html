/* ---------- WRITING ---------- */
const W_KIND = {
  'email-informal': {label:'informal email', checks:['greeting','closing','informal'], format:'Greeting (Hi …,) · short paragraphs for each point · friendly closing (See you soon, Best, Love)'},
  'email-formal':   {label:'formal email', checks:['greeting','closing','formal'], format:'Subject line · Dear Sir or Madam / Dear Mr … · reason for writing · details · what you expect · Yours faithfully / Kind regards'},
  'letter-formal':  {label:'formal letter', checks:['greeting','closing','formal'], format:'Dear Editor / Dear Sir or Madam · reason for writing · your arguments in separate paragraphs · conclusion · Yours faithfully'},
  'report':         {label:'report', checks:['greeting','closing','formal'], format:'Opening that states the purpose · one paragraph per problem with its solution · closing sentence and sign-off'},
  'essay':          {label:'essay', checks:['paras4'], format:'Introduction · advantages (pros) · disadvantages (cons) · conclusion with your opinion'},
  'review':         {label:'review', checks:['paras3'], format:'Name of the place · description · food and service · recommendation'}
};
const LINKERS = ['firstly','first of all','secondly','finally','moreover','in addition','furthermore','however','on the one hand','on the other hand','although','whereas','therefore','as a result','for example','for instance','in my opinion','overall','in conclusion','to sum up','because','since','while','also','lastly','despite','nevertheless'];
const COMMON = [
  [/\bin addiction\b/i,'“in addiction” → in addition'],
  [/\ballows? to \w+/i,'“allow(s) to do” → allow(s) doing / allow(s) us to do'],
  [/\bkeen to\b/i,'“keen to” (+ verb) is fine, but “keen on” + noun/-ing: keen on philosophy'],
  [/\bin my point of view\b/i,'“in my point of view” → from my point of view / in my opinion'],
  [/\bpeoples\b/i,'“peoples” → people (unless you mean nations)'],
  [/\binformations\b/i,'“informations” → information (uncountable)'],
  [/\badvices\b/i,'“advices” → advice (uncountable)'],
  [/\bexplain me\b/i,'“explain me” → explain to me'],
  [/\bdepend(s|ing)? from\b/i,'“depend from” → depend on'],
  [/\bmake a (photo|question)\b/i,'“make a photo/question” → take a photo / ask a question'],
  [/\bsince \d+ (years|months|weeks|days)\b/i,'“since 5 years” → for 5 years'],
  [/\bdiscuss about\b/i,'“discuss about” → discuss (no preposition)'],
  [/\bthe (nature|society|life) is\b/i,'general nouns usually take no article: nature is, society is, life is'],
  [/\bcause it\b/i,'“cause” → because (in written English)'],
  [/\bwanna|gonna\b/i,'avoid “wanna/gonna” in writing']
];
let W = null;
function wordCount(t){ return (t.trim().match(/[A-Za-zÀ-ÿ0-9'’-]+/g)||[]).length; }
function startWriting(idx, timed){
  stopTimer(); stopAudio(); window.scrollTo(0,0);
  W = {idx, cur:0, timed, end: timed ? Date.now()+40*60000 : null, texts: idx.map(i=>store.get('wdraft:'+BANK.writing[i].id,'')), checked:{}};
  S = null;
  if(timed){ timerId=setInterval(wTick,1000); wTick(); } else setTop('');
  renderWriting();
}
function wTick(){
  if(!W || !W.end) return;
  const left=(W.end-Date.now())/1000;
  setTop(`<span class="timer ${left<300?'low':''}" title="Time left">${fmt(left)}</span>`);
  if(left<=0){ stopTimer(); W.idx.forEach((_,k)=>W.checked[k]=true); renderWriting(); }
}
function renderWriting(){
  const k=W.cur, t=BANK.writing[W.idx[k]], kind=W_KIND[t.kind];
  const tabs = W.idx.length>1 ? `<div class="tabs" style="margin-bottom:14px">${W.idx.map((i,j)=>`<button class="tab ${j===k?'on':''}" data-wt="${j}" type="button">Task ${j+1}</button>`).join('')}</div>` : '';
  app.innerHTML = `
    <div class="sectionbar"><span class="eyebrow">${W.timed?'Writing test':'Writing practice'} · ${esc(kind.label)}</span></div>
    ${tabs}
    <div class="sheet">
      <h2 style="margin-bottom:6px">${esc(t.title)}</h2>
      <p style="font-weight:600;max-width:75ch">${esc(t.prompt)}</p>
      <p class="small muted" style="margin-top:6px">${t.min}–${t.max} words · Format: ${esc(kind.format)}</p>
      <textarea id="w-text" class="wbox" spellcheck="false" placeholder="Write your answer here…">${esc(W.texts[k])}</textarea>
      <div class="row" style="justify-content:space-between"><span id="w-count" class="small"></span>
        <span class="row"><button class="btn" id="w-check" type="button">Check my text</button>${W.idx.length>1&&k<W.idx.length-1?`<button class="btn primary" id="w-next" type="button">Next task →</button>`:''}</span></div>
      <div id="w-result"></div>
    </div>
    <div class="navbar"><button class="btn" id="w-home" type="button">← Back to start</button></div>`;
  const ta=document.getElementById('w-text');
  const upd=()=>{ W.texts[k]=ta.value; store.set('wdraft:'+t.id, ta.value); const n=wordCount(ta.value);
    const c=document.getElementById('w-count'); c.textContent=`${n} words`; c.style.color = n===0?'':(n<t.min?'var(--warn)':(n>t.max*1.1?'var(--bad)':'var(--ok)')); };
  ta.oninput=upd; upd();
  app.querySelectorAll('[data-wt]').forEach(b=>b.onclick=()=>{W.cur=+b.dataset.wt; renderWriting();});
  document.getElementById('w-check').onclick=()=>{ W.checked[k]=true; showWResult(); };
  const nx=document.getElementById('w-next'); if(nx) nx.onclick=()=>{W.cur++; renderWriting();};
  document.getElementById('w-home').onclick=()=>{ stopTimer(); W=null; home(); };
  if(W.checked[k]) showWResult();
}
function showWResult(){
  const k=W.cur, t=BANK.writing[W.idx[k]], kind=W_KIND[t.kind], txt=W.texts[k]||'';
  const n=wordCount(txt), low=txt.toLowerCase();
  const paras=txt.split(/\n\s*\n|\n/).map(x=>x.trim()).filter(x=>x.length>0).length;
  const items=[];
  const add=(ok,label)=>items.push([ok,label]);
  add(n>=t.min && n<=Math.round(t.max*1.1), `Length: ${n} words (target ${t.min}–${t.max})`);
  if(kind.checks.includes('greeting')){ const formal=kind.checks.includes('formal'); const g=(txt.match(/^\s*(?:subject:.*\n\s*)?(hi|hello|hey|dear)\b/i)||[])[1];
    add(formal ? /dear/i.test(g||'') : !!g, formal ? (g && !/dear/i.test(g) ? `“${g}” is too informal here: start with Dear Sir or Madam / Dear Mr …` : 'Opens with a formal greeting (Dear …)') : 'Opens with a greeting (Hi … / Dear …)'); }
  if(kind.checks.includes('closing')) add(/(best( wishes)?|love|regards|yours (faithfully|sincerely)|see you|take care|cheers|all the best|speak soon|look forward)/i.test(txt.split(/\n/).slice(-4).join(' ')) , 'Ends with a closing phrase (See you soon / Kind regards / Yours faithfully)');
  if(kind.checks.includes('formal')){ const cs=(txt.match(/\b\w+'(m|re|s|ve|ll|d|t)\b|n't\b/gi)||[]).length; add(cs<=1, cs ? `Formal register: ${cs} contraction(s) found (use I am, do not…)` : 'Formal register: no contractions'); }
  if(kind.checks.includes('paras4')) add(paras>=4, `Paragraphs: ${paras} (an essay needs introduction, pros, cons, conclusion)`);
  else if(kind.checks.includes('paras3')) add(paras>=3, `Paragraphs: ${paras} (aim for at least 3)`);
  else add(paras>=3, `Paragraphs: ${paras} (one idea per paragraph)`);
  const used=LINKERS.filter(l=>new RegExp('\\b'+l+'\\b','i').test(low));
  add(used.length>=4, `Linking words: ${used.length} different (${used.slice(0,8).join(', ')||'none'})${used.length<4?' — add some: firstly, however, in addition, therefore…':''}`);
  const errs=COMMON.filter(([re])=>re.test(txt)).map(x=>x[1]);
  document.getElementById('w-result').innerHTML = `
    <div style="margin-top:18px;display:grid;gap:14px">
      <h3>Automatic checks</h3>
      <div class="review">${items.map(([ok,l])=>`<div class="rv ${ok?'ok':'ko'}"><div class="small">${ok?'✓':'✗'} ${esc(l)}</div></div>`).join('')}
      ${errs.length?`<div class="rv ko"><div class="small"><b>Common mistakes found</b><br>${errs.map(esc).join('<br>')}</div></div>`:''}</div>
      <h3>Assess yourself</h3>
      <p class="small muted">The examiner marks four areas. Check each one honestly against your text.</p>
      <div class="review">
        <div class="rv"><div class="small"><b>Range</b>: varied vocabulary and structures, few repetitions.</div></div>
        <div class="rv"><div class="small"><b>Accuracy</b>: grammar, prepositions, articles and spelling are correct.</div></div>
        <div class="rv"><div class="small"><b>Coherence</b>: ideas are in a logical order and linked to each other.</div></div>
        <div class="rv"><div class="small"><b>Task completion</b>: every point of the task is covered, in the right format and register (${esc(kind.format)}).</div></div>
      </div>
      <details class="tr" open><summary>Model answer</summary><pre>${esc(t.model)}</pre><p class="small muted">${wordCount(t.model)} words</p></details>
    </div>`;
}

/* ---------- SPEAKING ---------- */
let SP = null, rec = null, recStream = null;
function startSpeaking(idx){
  stopTimer(); stopAudio(); S=null; W=null; setTop(''); window.scrollTo(0,0);
  SP = {idx, cur:0, clips:{}, phase:'ready', left:0};
  renderSpeaking();
}
function stopRec(){ try{ if(rec && rec.state!=='inactive') rec.stop(); }catch(e){} }
async function getMic(){
  if(recStream) return recStream;
  if(!navigator.mediaDevices || !window.MediaRecorder) return null;
  try{ recStream = await navigator.mediaDevices.getUserMedia({audio:true}); return recStream; }catch(e){ return null; }
}
function renderSpeaking(){
  const k=SP.cur, q=BANK.speaking[SP.idx[k]], last=k===SP.idx.length-1;
  const clip=SP.clips[k];
  app.innerHTML = `
    <div class="sectionbar"><span class="eyebrow">Speaking · question ${k+1}/${SP.idx.length}</span>
      <div class="progress"><i style="width:${(k+(SP.phase==='done'?1:0))/SP.idx.length*100}%"></i></div></div>
    <div class="sheet">
      <p class="eyebrow" style="margin-bottom:8px">Answer time: ${q.secs<60?q.secs+' seconds':'1 minute'}</p>
      <h2 style="font-size:clamp(22px,3.4vw,30px);max-width:30ch">${esc(q.q)}</h2>
      <div class="player" style="margin-top:20px">
        <button class="big" id="sp-go" type="button" aria-label="Start answering" ${SP.phase==='speaking'?'':''}>${SP.phase==='speaking'?'■':'●'}</button>
        <div class="bar"><i id="sp-bar" style="width:${SP.phase==='speaking'?(1-SP.left/q.secs)*100:SP.phase==='done'?100:0}%"></i></div>
        <span class="t" id="sp-time">${fmt(SP.phase==='speaking'?SP.left:q.secs)}</span>
        <span class="small muted" id="sp-info">${SP.phase==='ready'?'Press the red button and start speaking.':SP.phase==='speaking'?'Speaking… press ■ to stop early.':(clip?'Recording saved: listen back below.':'Time is up.')}</span>
      </div>
      ${clip?`<audio controls src="${clip}" style="width:100%;margin-top:6px"></audio>`:''}
      ${SP.phase==='done'?`<details class="tr"><summary>Model answer</summary><pre>${esc(q.model)}</pre></details>
        <p class="small muted" style="margin-top:10px">Check yourself: did you answer the question fully, without long pauses, using linking words and a range of vocabulary?</p>`:''}
    </div>
    <div class="navbar">
      <button class="btn" id="sp-home" type="button">← Back to start</button>
      <span class="row">${SP.phase==='done'?`<button class="btn" id="sp-again" type="button">Try again</button>`:''}
      ${last?`<button class="btn primary" id="sp-end" type="button" ${SP.phase==='done'?'':'disabled'}>Finish</button>`:`<button class="btn primary" id="sp-next" type="button" ${SP.phase==='speaking'?'disabled':''}>Next question →</button>`}</span>
    </div>`;
  document.getElementById('sp-home').onclick=()=>{ stopTimer(); stopRec(); SP=null; home(); };
  const nx=document.getElementById('sp-next'); if(nx) nx.onclick=()=>{ stopTimer(); stopRec(); SP.cur++; SP.phase='ready'; renderSpeaking(); };
  const ag=document.getElementById('sp-again'); if(ag) ag.onclick=()=>{ SP.phase='ready'; delete SP.clips[k]; renderSpeaking(); };
  const en=document.getElementById('sp-end'); if(en) en.onclick=speakingSummary;
  document.getElementById('sp-go').onclick=async()=>{
    if(SP.phase==='speaking'){ endSpeak(); return; }
    const stream = await getMic();
    SP.phase='speaking'; SP.left=q.secs; SP.hasMic=!!stream;
    if(stream){ const chunks=[]; try{ rec=new MediaRecorder(stream); rec.ondataavailable=e=>chunks.push(e.data); rec.onstop=()=>{ SP.clips[k]=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType||'audio/webm'})); if(SP && SP.cur===k) renderSpeaking(); }; rec.start(); }catch(e){ rec=null; } }
    renderSpeaking();
    if(!stream){ const i=document.getElementById('sp-info'); if(i) i.textContent='Microphone not available: answer out loud, the timer still runs.'; }
    const t0=Date.now();
    timerId=setInterval(()=>{ SP.left=q.secs-(Date.now()-t0)/1000; const b=document.getElementById('sp-bar'), t=document.getElementById('sp-time');
      if(b) b.style.width=Math.min(100,(1-SP.left/q.secs)*100)+'%'; if(t) t.textContent=fmt(SP.left);
      if(SP.left<=0) endSpeak(); },200);
  };
  function endSpeak(){ stopTimer(); SP.phase='done'; stopRec(); renderSpeaking(); }
}
function speakingSummary(){
  stopTimer(); stopRec(); window.scrollTo(0,0);
  setTop(`<button class="btn" id="again" type="button">Back to start</button>`); document.getElementById('again').onclick=home;
  app.innerHTML = `<section class="hero" style="padding-bottom:0"><p class="eyebrow">Speaking · summary</p><h1>${SP.idx.length} questions answered</h1>
    <p class="lead">Listen to your recordings and compare them with the model answers. The examiner looks at range, accuracy, fluency and coherence.</p></section>
    <div class="review" style="margin-top:20px">${SP.idx.map((i,k)=>{ const q=BANK.speaking[i]; return `<div class="rv"><div class="p">${k+1}. ${esc(q.q)} <span class="small muted">(${q.secs<60?q.secs+' s':'1 min'})</span></div>
      ${SP.clips[k]?`<audio controls src="${SP.clips[k]}" style="width:100%"></audio>`:''}<div class="small muted">${esc(q.model)}</div></div>`;}).join('')}</div>
    <div class="navbar"><button class="btn primary" id="sp-new" type="button">New speaking test</button></div>`;
  document.getElementById('sp-new').onclick=()=>startSpeaking(shuffle(BANK.speaking.map((_,i)=>i)).slice(0,8).sort((a,b)=>BANK.speaking[a].secs-BANK.speaking[b].secs));
}

/* ---------- session builders ---------- */
function pickSets(list, want, n){
  // prefer sets with exactly `want` questions and real audio; fall back to any
  const ok = list.map((s,i)=>({s,i})).filter(x=>x.s.questions.length>=want && (x.s.audio!==null || list===BANK.reading));
  const pool = ok.length>=n ? ok : list.map((s,i)=>({s,i}));
  return shuffle(pool).slice(0,n);
}
function startExam(){
  const gi = shuffle(BANK.grammar.map((_,i)=>i)).slice(0,20);
  const rs = pickSets(BANK.reading, 7, 2), ls = pickSets(BANK.listening, 5, 2);
  const sections = [
    {name:'Grammar', kind:'grammar', items: gi.map(i=>grammarItem(BANK.grammar[i], i))},
    ...rs.map((x,k)=>({name:'Reading '+(k+1), kind:'reading', set:x.s, items:setItems('reading',x.s,x.i).slice(0,7)})),
    ...ls.map((x,k)=>({name:'Listening '+(k+1), kind:'listening', set:x.s, items:setItems('listening',x.s,x.i).slice(0,5)})),
  ];
  S = {mode:'exam', sections, cur:0, answers:{}, plays:{}, start:Date.now(), end:Date.now()+EXAM_MIN*60000, done:false};
  timerId = setInterval(tick, 1000); tick();
  renderSection();
}
function startGrammar(n){
  let idx = shuffle(BANK.grammar.map((_,i)=>i)); if(n!=='all') idx=idx.slice(0,+n);
  S = {mode:'practice', sections:[{name:'Grammar', kind:'grammar', items: idx.map(i=>grammarItem(BANK.grammar[i],i))}], cur:0, answers:{}, plays:{}, revealed:{}, start:Date.now()};
  setTop(''); renderSection();
}
function startSet(kind, i){
  const s = BANK[kind][i];
  S = {mode:'practice', sections:[{name:s.title, kind, set:s, items:setItems(kind,s,i)}], cur:0, answers:{}, plays:{}, revealed:{}, start:Date.now()};
  setTop(''); renderSection();
}
function startWrong(){
  const wrong = store.get('wrong', {});
  const secs = [];
  const gi = Object.keys(wrong).filter(k=>k.startsWith('g')).map(k=>+k.slice(1)).filter(i=>BANK.grammar[i]);
  if(gi.length) secs.push({name:'Grammar', kind:'grammar', items: shuffle(gi).map(i=>grammarItem(BANK.grammar[i],i))});
  ['reading','listening'].forEach(kind=>{
    BANK[kind].forEach((s,si)=>{
      const its = setItems(kind,s,si).filter(it=>wrong[it.uid]);
      if(its.length) secs.push({name:s.title, kind, set:s, items:its});
    });
  });
  if(!secs.length) return home();
  S = {mode:'practice', sections:secs, cur:0, answers:{}, plays:{}, revealed:{}, start:Date.now()};
  setTop(''); renderSection();
}

/* ---------- timer ---------- */
function tick(){
  if(!S || S.mode!=='exam') return;
  const left = (S.end - Date.now())/1000;
  setTop(`<span class="timer ${left<300?'low':''}" aria-live="off" title="Time left">${fmt(left)}</span><button class="btn" id="finish-top" type="button">Submit</button>`);
  document.getElementById('finish-top').onclick=confirmFinish;
  if(left<=0){ finish(true); }
}

/* ---------- audio ---------- */
let audio = null, audioRAF = null;
function stopAudio(){ if(audio){ audio.pause(); audio=null; } if(audioRAF) cancelAnimationFrame(audioRAF); }
function playerHTML(set, key){
  if(!set.audio) return `<div class="player"><span class="small muted">The audio for this task is not available. You can still practise the questions${set.transcript?' and read the transcript':''}.</span></div>`;
  const max = S.mode==='exam' ? 2 : Infinity;
  const used = S.plays[key]||0;
  return `<div class="player" id="player">
    <button class="big" id="play" type="button" aria-label="Play" ${used>=max?'disabled':''}>▶</button>
    <div class="bar"><i id="pbar"></i></div>
    <span class="t" id="ptime">00:00</span>
    <span class="small muted" id="pinfo">${max===Infinity?'Unlimited plays (practice)':`Plays used: ${used} of ${max}`}</span>
  </div>`;
}
function wirePlayer(set, key){
  const btn=document.getElementById('play'); if(!btn) return;
  const max = S.mode==='exam' ? 2 : Infinity;
  btn.onclick=()=>{
    if(audio && !audio.paused){ audio.pause(); btn.textContent='▶'; return; }
    if(audio && audio.paused && audio.currentTime>0 && audio.currentTime<audio.duration && S.mode!=='exam'){ audio.play(); btn.textContent='❚❚'; return; }
    if((S.plays[key]||0)>=max) return;
    stopAudio();
    audio = new Audio(set.audio);
    S.plays[key]=(S.plays[key]||0)+1;
    const info=document.getElementById('pinfo'); if(info && max!==Infinity) info.textContent=`Plays used: ${S.plays[key]} of ${max}`;
    audio.play().catch(()=>{ const i=document.getElementById('pinfo'); if(i) i.textContent='The audio cannot be played on this device.'; });
    btn.textContent = S.mode==='exam' ? '…' : '❚❚';
    if(S.mode==='exam') btn.disabled=true;
    const loop=()=>{ if(!audio) return; const bar=document.getElementById('pbar'), t=document.getElementById('ptime');
      if(bar && audio.duration) bar.style.width=(audio.currentTime/audio.duration*100)+'%';
      if(t) t.textContent=fmt(audio.currentTime)+(audio.duration?' / '+fmt(audio.duration):'');
      audioRAF=requestAnimationFrame(loop); };
    loop();
    audio.onended=()=>{ const b=document.getElementById('play'); if(b){ b.textContent='▶'; b.disabled=(S.plays[key]||0)>=max; } };
  };
}

/* ---------- rendering a section ---------- */
function sectionTabs(){
  if(S.sections.length<2) return '';
  return `<div class="tabs">${S.sections.map((s,i)=>{
    const done = s.items.every(it=>S.answers[it.uid]!==undefined);
    return `<button class="tab ${i===S.cur?'on':''} ${done?'done':''}" data-sec="${i}" type="button">${esc(s.name)}</button>`;}).join('')}</div>`;
}
function renderSection(){
  stopAudio(); window.scrollTo(0,0);
  const sec = S.sections[S.cur];
  const total = S.sections.reduce((a,s)=>a+s.items.length,0);
  const answered = Object.keys(S.answers).length;
  const isExam = S.mode==='exam';
  let body = '';
  if(sec.kind==='grammar') body = grammarHTML(sec);
  else body = setHTML(sec);
  app.innerHTML = `
    <div class="sectionbar">
      <span class="eyebrow">${isExam?'Section '+(S.cur+1)+'/'+S.sections.length:'Practice'} · ${esc(sec.name)}</span>
      <div class="progress" aria-label="Progress"><i style="width:${answered/total*100}%"></i></div>
      <span class="small muted" style="font-variant-numeric:tabular-nums">${answered}/${total} answered</span>
    </div>
    ${sectionTabs()}
    <div style="height:14px"></div>
    ${body}
    <div class="navbar">
      <button class="btn" id="prev" type="button" ${S.cur===0?'disabled':''}>← Previous section</button>
      ${S.cur<S.sections.length-1
        ? `<button class="btn primary" id="next" type="button">Next section →</button>`
        : `<button class="btn primary" id="end" type="button">${isExam?'Submit the test':'See summary'}</button>`}
    </div>`;
  app.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.sec; renderSection();});
  const p=document.getElementById('prev'); if(p) p.onclick=()=>{S.cur--; renderSection();};
  const n=document.getElementById('next'); if(n) n.onclick=()=>{S.cur++; renderSection();};
  const e=document.getElementById('end'); if(e) e.onclick=isExam?confirmFinish:()=>finish(false);
  wireAnswers(sec);
  if(sec.kind==='listening') wirePlayer(sec.set, 'L'+sec.items[0].si);
}

function feedbackHTML(it){
  if(S.mode!=='practice' || S.answers[it.uid]===undefined) return '';
  const c = correctOf(it), a = S.answers[it.uid], ok = a===c;
  const note = it.kind==='grammar' ? it.g.note : it.q.note;
  let right = '';
  if(!ok){ right = typeof c==='number' ? ` The correct answer is “${esc((it.kind==='grammar'?it.g.options:it.q.options)[c])}”.` : ` The correct answer is ${esc(c)}.`; }
  return `<div class="fb ${ok?'ok':'ko'}">${ok?'Correct.':'Wrong.'}${right}${note?`<span class="note">${esc(note)}</span>`:''}</div>`;
}
function optClass(it, j){
  const a=S.answers[it.uid];
  if(S.mode==='practice' && a!==undefined){ const c=correctOf(it); if(j===c) return 'right'; if(j===a) return 'wrong'; return ''; }
  return a===j?'sel':'';
}
function mcqHTML(it, num, prompt, options){
  const locked = S.mode==='practice' && S.answers[it.uid]!==undefined;
  return `<div class="q" id="q-${esc(it.uid)}">
    <div class="p"><span class="n">${num}.</span>${esc(prompt)}</div>
    <div class="opts">${options.map((o,j)=>`<button class="opt ${optClass(it,j)}" type="button" data-uid="${esc(it.uid)}" data-v="${j}" ${locked?'disabled':''}><span class="k">${LETTERS[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>
    ${feedbackHTML(it)}
  </div>`;
}
function grammarHTML(sec){
  return `<div class="sheet"><p class="instr">Choose the correct answer.</p><div class="qs">${sec.items.map((it,k)=>mcqHTML(it,k+1,it.g.prompt,it.g.options)).join('')}</div></div>`;
}
function passageHTML(set, sec){
  const paras = (set.text||'').split(/\n\s*\n/).filter(Boolean);
  const gapAns = {}; if(set.type==='gapped') sec.items.forEach(it=>{ gapAns[it.qi+1]=S.answers[it.uid]; });
  return paras.map(p=>{
    let t = esc(p).replace(/\[\[(\d+)\]\]/g,(m,n)=>{ const v=gapAns[n]; return `<span class="gap ${v?'filled':''}">${n}${v?' · '+esc(v):''}</span>`; });
    return `<p>${t}</p>`;}).join('');
}
function keysHTML(it, num, prompt, pool){
  const a=S.answers[it.uid], c=correctOf(it), locked = S.mode==='practice' && a!==undefined;
  const cls = k => (S.mode==='practice' && a!==undefined) ? (k===c?'right':(k===a?'wrong':'')) : (a===k?'sel':'');
  return `<div class="q" id="q-${esc(it.uid)}">
    <div class="p"><span class="n">${num}.</span>${esc(prompt)}</div>
    <div class="keys">${pool.map(p=>`<button class="key ${cls(p.key)}" type="button" data-uid="${esc(it.uid)}" data-k="${esc(p.key)}" title="${esc(p.text)}" ${locked?'disabled':''}>${esc(p.key)}</button>`).join('')}</div>
    ${feedbackHTML(it)}
  </div>`;
}
function setHTML(sec){
  const set = sec.set;
  const isL = sec.kind==='listening';
  const pool = set.pool||[];
  const usedKeys = new Set(sec.items.map(it=>S.answers[it.uid]).filter(Boolean));
  const poolHTML = pool.length ? `<div class="pool">${pool.map(p=>`<div class="${set.type==='gapped'&&usedKeys.has(p.key)?'used':''}"><b>${esc(p.key)}</b><span>${esc(p.text)}</span></div>`).join('')}</div>` : '';
  const qs = sec.items.map((it,k)=>{
    const num = it.qi+1;
    if(set.type==='mcq') return mcqHTML(it,num,it.q.prompt,it.q.options);
    return keysHTML(it,num,it.q.prompt,pool);
  }).join('');
  const showTr = set.transcript && (S.mode==='practice' || S.done);
  const left = isL
    ? `${playerHTML(set,'L'+sec.items[0].si)}${set.type!=='mcq'?poolHTML:''}${showTr?`<details class="tr"><summary>Show transcript</summary><pre>${esc(set.transcript)}</pre></details>`:''}`
    : `<div class="passage">${set.type==='matching'?'':''}${passageHTML(set,sec)}</div>`;
  const right = `<div class="qs">${(!isL && set.type!=='mcq') ? `<div>${set.type==='gapped'?'<h3 style="margin-bottom:8px">Sentences</h3>':'<h3 style="margin-bottom:8px">Options</h3>'}${poolHTML}</div>`:''}${qs}</div>`;
  return `<div class="sheet"><h2 style="margin-bottom:6px">${esc(set.title)}</h2><p class="instr">${esc(set.instructions||'')}</p>
    ${isL ? `${left}<div class="qs">${qs}</div>` : `<div class="split">${left}${right}</div>`}</div>`;
}
function wireAnswers(sec){
  app.querySelectorAll('.opt[data-uid]').forEach(b=>b.onclick=()=>answer(b.dataset.uid, +b.dataset.v));
  app.querySelectorAll('.key[data-uid]').forEach(b=>b.onclick=()=>answer(b.dataset.uid, b.dataset.k));
}
function findItem(uid){ for(const s of S.sections) for(const it of s.items) if(it.uid===uid) return it; }
function answer(uid, v){
  if(S.mode==='practice' && S.answers[uid]!==undefined) return;
  if(S.mode==='exam' && S.answers[uid]===v){ delete S.answers[uid]; } else S.answers[uid]=v;
  if(S.mode==='practice'){ const it=findItem(uid); trackWrong(it, v===correctOf(it)); }
  // re-render in place, keep scroll
  const y = window.scrollY; const sec=S.sections[S.cur];
  const keepAudio = audio; audio=null; // don't stop playback on rerender
  const html = sec.kind==='grammar'?grammarHTML(sec):setHTML(sec);
  const sheet = app.querySelector('.sheet'); const fresh=h(html);
  const oldPlayer = sheet.querySelector('#player');
  if(oldPlayer && keepAudio){ const np=fresh.querySelector('#player'); if(np) np.replaceWith(oldPlayer); }
  sheet.replaceWith(fresh); audio = keepAudio;
  if(!(oldPlayer && keepAudio) && sec.kind==='listening') wirePlayer(sec.set,'L'+sec.items[0].si);
  wireAnswers(sec);
  const total = S.sections.reduce((a,s)=>a+s.items.length,0);
  const bar = app.querySelector('.progress i'); if(bar) bar.style.width=(Object.keys(S.answers).length/total*100)+'%';
  const cnt = app.querySelector('.sectionbar .small'); if(cnt) cnt.textContent=Object.keys(S.answers).length+'/'+total+' answered';
  window.scrollTo(0,y);
}
function trackWrong(it, ok){
  const w = store.get('wrong', {});
  if(ok) delete w[it.uid]; else w[it.uid]=1;
  store.set('wrong', w);
}

/* ---------- finish & results ---------- */
function confirmFinish(){
  const total = S.sections.reduce((a,s)=>a+s.items.length,0);
  const miss = total - Object.keys(S.answers).length;
  const root=document.getElementById('modal-root');
  root.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><div class="box">
    <h3>Submit the test?</h3>
    <p>${miss ? `You still have <b>${miss}</b> unanswered questions. They count as wrong.` : 'You have answered every question.'}</p>
    <div class="row"><button class="btn primary" id="m-yes" type="button">Submit</button><button class="btn" id="m-no" type="button">Continua il test</button></div>
  </div></div>`;
  document.getElementById('m-no').onclick=()=>root.innerHTML='';
  document.getElementById('m-yes').onclick=()=>{ root.innerHTML=''; finish(false); };
  document.getElementById('m-yes').focus();
}
function finish(timeUp){
  stopTimer(); stopAudio(); S.done=true; window.scrollTo(0,0);
  const per = {grammar:[0,0], reading:[0,0], listening:[0,0]};
  S.sections.forEach(s=>s.items.forEach(it=>{ per[it.kind][1]++; if(S.answers[it.uid]===correctOf(it)) per[it.kind][0]++; }));
  const tot = [0,0]; Object.values(per).forEach(v=>{tot[0]+=v[0]; tot[1]+=v[1];});
  const pct = tot[1] ? Math.round(tot[0]/tot[1]*1000)/10 : 0;
  const elapsed = (Date.now()-S.start)/1000;
  if(S.mode==='exam'){
    S.sections.forEach(s=>s.items.forEach(it=>trackWrong(it, S.answers[it.uid]===correctOf(it))));
    const hist = store.get('history', []);
    const d=new Date(); hist.push({date:d.toLocaleDateString('en-GB')+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), g:per.grammar.join('/'), r:per.reading.join('/'), l:per.listening.join('/'), pct, time:fmt(elapsed)});
    store.set('history', hist.slice(-50));
  }
  setTop(`<button class="btn" id="again" type="button">Back to start</button>`);
  document.getElementById('again').onclick=home;
  const box = (name, v) => { if(!v[1]) return ''; const p=Math.round(v[0]/v[1]*1000)/10; const [lab,c]=level(p);
    return `<div class="scorebox"><span class="eyebrow">${name}</span><span class="v">${v[0]}/${v[1]}</span><span class="row"><span class="pill ${c}">${lab}</span><span class="small muted">${p}%</span></span><div class="meter"><i style="width:${p}%;background:var(--${c==='ok'?'ok':c==='mid'?'warn':'bad'})"></i></div></div>`; };
  const passed = pct>PASS;
  app.innerHTML = `
    <section class="hero" style="padding-bottom:0">
      <p class="eyebrow">${S.mode==='exam'?'Mock test result':'Practice summary'}${timeUp?' · time is up':''}</p>
      <h1>${pct}% <span class="pill ${passed?'ok':'ko'}" style="font-size:18px;vertical-align:middle">${S.mode==='exam'?(passed?'Passed':'Not passed'):(passed?'Above pass mark':'Below pass mark')}</span></h1>
      <p class="lead">${tot[0]} correct out of ${tot[1]} in ${fmt(elapsed)}. The certificate requires more than ${PASS}% of Core test questions correct.</p>
    </section>
    <div class="score">${box('Grammar',per.grammar)}${box('Reading',per.reading)}${box('Listening',per.listening)}</div>
    <p class="small muted" style="margin-bottom:22px">Section level labels are a guide only: the official test does not publish exact thresholds.</p>
    <h2 style="margin-bottom:12px">Answers</h2>
    <div class="row" style="margin-bottom:14px"><button class="btn" id="only-wrong" type="button">Show mistakes only</button><button class="btn primary" id="retry" type="button">${S.mode==='exam'?'New mock test':'Try again'}</button></div>
    <div class="review" id="review">${reviewHTML()}</div>`;
  document.getElementById('retry').onclick = S.mode==='exam' ? startExam : ()=>{ const secs=S.sections; S={...S, answers:{}, revealed:{}, cur:0, done:false, start:Date.now(), sections:secs.map(s=>({...s,items:s.kind==='grammar'?shuffle(s.items):s.items}))}; renderSection(); };
  let only=false; document.getElementById('only-wrong').onclick=(e)=>{ only=!only; e.target.textContent=only?'Show all':'Show mistakes only'; document.querySelectorAll('.rv.ok').forEach(x=>x.hidden=only); };
}
function reviewHTML(){
  let out='';
  S.sections.forEach(s=>{
    out += `<h3 style="margin-top:10px">${esc(s.name)}${s.set?` · <span class="muted">${esc(s.set.title)}</span>`:''}</h3>`;
    if(s.kind==='listening' && s.set.transcript) out += `<details class="tr"><summary>Transcript</summary><pre>${esc(s.set.transcript)}</pre></details>`;
    if(s.kind==='reading') out += `<details class="tr"><summary>Read the text again</summary><div class="passage" style="margin-top:8px">${passageHTML(s.set,s)}</div></details>`;
    s.items.forEach((it,k)=>{
      const c=correctOf(it), a=S.answers[it.uid], ok=a===c;
      let prompt, yours, right, note;
      if(it.kind==='grammar'){ prompt=it.g.prompt; yours = a===undefined?'—':it.g.options[a]; right=it.g.options[c]; note=it.g.note; }
      else if(s.set.type==='mcq'){ prompt=it.q.prompt; yours=a===undefined?'—':it.q.options[a]; right=it.q.options[c]; note=it.q.note; }
      else { const pt=key=>{ const p=(s.set.pool||[]).find(x=>x.key===key); return p?key+' · '+p.text:key; }; prompt=it.q.prompt; yours=a===undefined?'—':pt(a); right=pt(c); note=it.q.note; }
      out += `<div class="rv ${ok?'ok':'ko'}"><div class="p"><span class="n">${it.kind==='grammar'?k+1:it.qi+1}.</span> ${esc(prompt)}</div>
        <div class="small">${ok?`<span style="color:var(--ok)">✓ ${esc(right)}</span>`:`<span style="color:var(--bad)">✗ Yours: ${esc(yours)}</span> · <span style="color:var(--ok)">Correct: ${esc(right)}</span>`}</div>
        ${note?`<div class="small muted">${esc(note)}</div>`:''}</div>`;
    });
  });
  return out;
}

document.getElementById('home-btn').onclick=()=>{ if(S && S.mode==='exam' && !S.done){ const root=document.getElementById('modal-root'); root.innerHTML=`<div class="modal"><div class="box"><h3>Leave the mock test?</h3><p>Your answers so far will be lost.</p><div class="row"><button class="btn primary" id="x-yes" type="button">Leave</button><button class="btn" id="x-no" type="button">Stay</button></div></div></div>`; document.getElementById('x-no').onclick=()=>root.innerHTML=''; document.getElementById('x-yes').onclick=()=>{root.innerHTML=''; home();}; return; } home(); };
home();
})();
</script>

</body>
