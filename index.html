s to the under-represented sex?",["Yes, any specific advantage constitutes prohibited discrimination","Only if such measures are approved in advance by the Council","Only in the field of pay, not in access to employment or promotion","No, it does not prevent the maintenance or adoption of such measures"],3,"Art. 23 second paragraph: equality 'shall not prevent the maintenance or adoption of measures providing for specific advantages in favour of the under-represented sex'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0753",1,5,18,"Art. 24(2)",0,"Under the Charter of Fundamental Rights of the European Union, in all actions relating to children, what must be a primary consideration?",["The wishes of the parents","Public security","The child's nationality","The child's best interests"],3,"Art. 24(2): in all actions relating to children, by public authorities or private institutions, 'the child's best interests must be a primary consideration'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0754",1,5,18,"Art. 24(1)",1,"Under the Charter of Fundamental Rights of the European Union, how shall the views of children be taken into consideration on matters which concern them?",["Only once they reach the age of 12 years","Only when expressed through a legal guardian","In accordance with their age and maturity","Only in judicial, not administrative, proceedings"],2,"Art. 24(1): children's views 'shall be taken into consideration on matters which concern them in accordance with their age and maturity'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0755",1,5,18,"Art. 24(3)",1,"Under the Charter of Fundamental Rights of the European Union, what right does Article 24(3) confer on every child?",["To acquire the nationality of the Member State in which he or she was born or habitually resides","To maintain regular personal contact with both parents, unless contrary to his or her interests","To be accommodated separately from adults in all circumstances, including family detention","To receive free legal aid and an interpreter in all administrative proceedings concerning him"],1,"Art. 24(3) grants the right to maintain regular personal relationship and direct contact with both parents unless contrary to the child's interests.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0756",1,5,18,"Art. 32",1,"Under the Charter of Fundamental Rights of the European Union, what is the rule on the minimum age of admission to employment?",["Fixed at 16 years throughout the Union, with no derogations permitted for any sector","Not below the school-leaving age, save more favourable rules and limited derogations","Fixed at 18 years for hazardous work and at 15 years for all other forms of employment","Left entirely to collective agreements concluded at national or sectoral level"],1,"Art. 32: the minimum age of admission to employment may not be lower than the minimum school-leaving age, without prejudice to more favourable rules and except for limited derogations.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0757",1,5,18,"Art. 41(1)",1,"Under the Charter of Fundamental Rights of the European Union, to whom is the right to good administration in Article 41 addressed?",["The institutions, bodies, offices and agencies of the Union","The national administrations of the Member States in all matters","Private companies providing public services","Only the European Commission"],0,"Art. 41(1) guarantees that affairs are handled impartially, fairly and within a reasonable time 'by the institutions, bodies, offices and agencies of the Union'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0758",1,5,18,"Art. 41(2)(a)",0,"Under the Charter of Fundamental Rights of the European Union, which right is expressly included in the right to good administration?",["The right to a free interpreter in all contacts with national and Union authorities","The right to be heard before any individual measure adversely affecting the person","The right to have any adverse decision reviewed by the European Ombudsman","The right to obtain a final decision within three months of the application"],1,"Art. 41(2)(a) includes the right of every person to be heard before any individual measure which would affect him or her adversely is taken.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0759",1,5,18,"Art. 41(2)(c)",0,"Under the Charter of Fundamental Rights of the European Union, what obligation does the right to good administration impose on the administration regarding its decisions?",["To publish all decisions in the Official Journal","To give reasons for its decisions","To translate decisions into all official languages","To adopt decisions by majority vote"],1,"Art. 41(2)(c) includes 'the obligation of the administration to give reasons for its decisions'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0760",1,5,18,"Art. 41(4)",1,"Under the Charter of Fundamental Rights of the European Union, in which language must a person who writes to the Union institutions in one of the languages of the Treaties receive an answer?",["In English, French or German","In the working language of the institution","In the same language","In the official language of his or her Member State of residence"],2,"Art. 41(4): every person may write to the institutions in one of the languages of the Treaties 'and must have an answer in the same language'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0761",1,5,18,"Art. 41(3)",2,"Under the Charter of Fundamental Rights of the European Union, according to what are damages caused by Union institutions or servants in the performance of their duties to be made good?",["The law of the Member State in whose territory the damage occurred","A schedule of standard compensation amounts adopted by the Council","The rules on just satisfaction of the European Convention on Human Rights","The general principles common to the laws of the Member States"],3,"Art. 41(3): the Union makes good damage 'in accordance with the general principles common to the laws of the Member States'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0762",1,5,18,"Art. 43",1,"Under the Charter of Fundamental Rights of the European Union, which body's activities are excluded from complaints of maladministration to the European Ombudsman?",["The European Council when acting at the level of Heads of State or Government","The European Central Bank when conducting the Union's monetary policy","The Court of Justice of the European Union acting in its judicial role","The European Parliament when acting in its legislative role with the Council"],2,"Art. 43 excludes 'the Court of Justice of the European Union acting in its judicial role'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0763",1,5,18,"Art. 42",1,"Under the Charter of Fundamental Rights of the European Union, who holds the right of access to documents of the Union institutions, bodies, offices and agencies?",["Only citizens of the Union who can demonstrate a direct and individual interest","Any person anywhere in the world, without any condition of residence or interest","Only Members of the European Parliament and of the national parliaments","Union citizens and any natural or legal person residing or registered in a Member State"],3,"Art. 42 grants the right to any citizen of the Union and any natural or legal person residing or having its registered office in a Member State.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0764",1,5,18,"Art. 45(2)",2,"Under the Charter of Fundamental Rights of the European Union, under Article 45(2), freedom of movement and residence may be granted to which persons in accordance with the Treaties?",["Nationals of third countries legally resident in the territory of a Member State","All persons physically present on the territory of a Member State, whatever their status","Refugees recognised by any third country and holding a valid travel document","Nationals of EEA and Swiss Confederation countries only, on a reciprocal basis"],0,"Art. 45(2): freedom of movement and residence 'may be granted ... to nationals of third countries legally resident in the territory of a Member State'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0765",1,5,18,"Art. 46",1,"Under the Charter of Fundamental Rights of the European Union, when is a citizen of the Union entitled to protection by the diplomatic or consular authorities of any Member State?",["In any country where he or she is in difficulty, at his or her own choice","Only within the territory of the EU, when detained by another Member State","Only when the EU Delegation in the third country has authorised it in advance","In a third country where his or her own Member State is not represented"],3,"Art. 46 grants such protection in a third country in which the citizen's own Member State is not represented, on the same conditions as that State's nationals.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0766",1,5,18,"Art. 47 first para.",0,"Under the Charter of Fundamental Rights of the European Union, what right does Article 47 give to everyone whose rights and freedoms guaranteed by Union law are violated?",["The right to an administrative review by the Commission","The right to an effective remedy before a tribunal","The right to petition the European Parliament","The right to compensation from the Member State"],1,"Art. 47 first paragraph: everyone whose Union-law rights are violated has the right to an effective remedy before a tribunal.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0767",1,5,18,"Art. 47 second para.",1,"Under the Charter of Fundamental Rights of the European Union, what characteristics must the tribunal have under Article 47?",["Composed of judges coming from at least two different Member States","Specialised exclusively in fundamental rights and asylum matters","Independent and impartial, and previously established by law","Attached to and supervised by the Court of Justice of the European Union"],2,"Art. 47: everyone is entitled to a fair and public hearing within a reasonable time 'by an independent and impartial tribunal previously established by law'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0768",1,5,18,"Art. 47 third para.",1,"Under the Charter of Fundamental Rights of the European Union, to whom shall legal aid be made available under Article 47?",["To every person in criminal proceedings, regardless of his or her financial means","To those lacking sufficient resources, where needed for effective access to justice","Only to citizens of the Union who are parties to proceedings in another Member State","Only to asylum seekers and refugees in proceedings concerning international protection"],1,"Art. 47 third paragraph provides legal aid for those who lack sufficient resources in so far as necessary to ensure effective access to justice.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0769",1,5,18,"Art. 48(1)",0,"Under the Charter of Fundamental Rights of the European Union, until when is everyone who has been charged presumed innocent?",["Until the indictment is confirmed by a judge","Until proved guilty according to law","Until the first-instance hearing begins","Until the evidence is disclosed to the defence"],1,"Art. 48(1): everyone charged shall be presumed innocent until proved guilty according to law.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0770",1,5,18,"Art. 49(1)",2,"Under the Charter of Fundamental Rights of the European Union, if, after an offence is committed, the law provides for a lighter penalty, what applies?",["The penalty in force at the time of the offence always applies","The court chooses freely between the two penalties","The lighter penalty shall be applicable","The heavier penalty applies to repeat offenders"],2,"Art. 49(1): 'If, subsequent to the commission of a criminal offence, the law provides for a lighter penalty, that penalty shall be applicable.'","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0771",1,5,18,"Art. 50",1,"Under the Charter of Fundamental Rights of the European Union, the right not to be tried or punished twice (ne bis in idem) applies to offences for which a person has already been finally acquitted or convicted where?",["Within the Union","Only within the same Member State","Anywhere in the world","Only within the Schengen area"],0,"Art. 50 covers offences for which a person has been finally acquitted or convicted 'within the Union in accordance with the law'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0772",1,5,18,"Art. 49(3)",0,"Under the Charter of Fundamental Rights of the European Union, what does Article 49(3) require of the severity of penalties?",["It must be harmonised across Member States","It must not be disproportionate to the criminal offence","It must be decided by a jury","It must take account of the offender's nationality"],1,"Art. 49(3): 'The severity of penalties must not be disproportionate to the criminal offence.'","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0773",1,5,18,"Art. 51(1)",0,"Under the Charter of Fundamental Rights of the European Union, when are the provisions of the Charter addressed to the Member States?",["Always, in all their activities","Only when they are implementing Union law","Only when acting in the field of criminal law","Only when the Commission has opened infringement proceedings"],1,"Art. 51(1): the Charter is addressed to the Member States 'only when they are implementing Union law'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0774",1,5,18,"Art. 51(2)",2,"Under the Charter of Fundamental Rights of the European Union, what does Article 51(2) state about the effect of the Charter on Union competences?",["It extends Union competence to all fundamental rights matters in the Member States","It confers on the Union a general competence to legislate on human rights matters","It does not extend Union law beyond the Union's powers or create new powers or tasks","It allows the Union to adopt criminal law in any field covered by the Charter"],2,"Art. 51(2): the Charter does not extend the field of application of Union law beyond the Union's powers, nor establish any new power or task, nor modify powers and tasks defined in the Treaties.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0775",1,5,18,"Art. 52(1)",1,"Under the Charter of Fundamental Rights of the European Union, which is a condition for any limitation on the exercise of Charter rights and freedoms?",["It must be approved unanimously by the Council after consulting Parliament","It must be temporary and must not exceed a period of six months","It must be provided for by law and respect the essence of the rights","It must be authorised in advance by a court of the Member State concerned"],2,"Art. 52(1): any limitation must be provided for by law and respect the essence of the rights; subject to proportionality, it must be necessary and genuinely meet objectives of general interest or protect the rights of others.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0776",1,5,18,"Art. 52(1)",2,"Under the Charter of Fundamental Rights of the European Union, subject to which principle may limitations on Charter rights be made only if necessary and genuinely meeting objectives of general interest?",["The principle of subsidiarity","The principle of proportionality","The principle of mutual recognition","The principle of sincere cooperation"],1,"Art. 52(1): 'Subject to the principle of proportionality, limitations may be made only if they are necessary and genuinely meet objectives of general interest...'","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0777",1,5,18,"Art. 52(3)",1,"Under the Charter of Fundamental Rights of the European Union, where Charter rights correspond to rights guaranteed by the European Convention on Human Rights, what is the rule on their meaning and scope?",["Same meaning and scope as in the ECHR, though Union law may protect more","The Charter always prevails and may give lower protection than the ECHR","The ECHR applies only where the Charter is silent on the matter in question","The Court of Justice decides case by case without reference to the ECHR"],0,"Art. 52(3): meaning and scope shall be the same as those laid down by the ECHR; this does not prevent Union law providing more extensive protection.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0778",1,5,18,"Art. 52(5)",2,"Under the Charter of Fundamental Rights of the European Union, Charter provisions containing 'principles' are judicially cognisable only in what context?",["Actions for damages brought by individuals against the Union institutions","Any individual claim brought by a private party before national courts","The interpretation of implementing acts and the ruling on their legality","Infringement proceedings brought by the Commission against Member States"],2,"Art. 52(5): principles 'shall be judicially cognisable only in the interpretation of such acts and in the ruling on their legality'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0779",1,5,18,"Art. 53",1,"Which article of the Charter of Fundamental Rights of the European Union provides that nothing in it shall be interpreted as restricting human rights recognised by Union law, international law, the ECHR and the Member States' constitutions?",["Article 53 (Level of protection)","Article 51 (Field of application)","Article 52 (Scope and interpretation)","Article 54 (Prohibition of abuse of rights)"],0,"Art. 53 'Level of protection' safeguards existing protection under Union law, international law, international agreements including the ECHR, and national constitutions.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0780",1,5,18,"Art. 54",1,"Under the Charter of Fundamental Rights of the European Union, what does Article 54 prohibit?",["Invoking Charter rights directly before national courts and tribunals","Relying on Charter rights in disputes against private persons or companies","Using Charter rights to challenge the validity of EU legislative acts","Reading it as a right to act to destroy or unduly limit Charter rights"],3,"Art. 54 'Prohibition of abuse of rights': nothing in the Charter implies any right to engage in any activity aimed at the destruction of Charter rights or their limitation beyond what is provided for.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0781",1,5,19,"Convention, Art. 1A(2)",0,"Under the 1951 Convention relating to the Status of Refugees, which of the following is NOT one of the five grounds of persecution in the refugee definition?",["Economic hardship","Membership of a particular social group","Political opinion","Nationality"],0,"Art. 1A(2) lists race, religion, nationality, membership of a particular social group or political opinion; economic hardship is not a ground.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0782",1,5,19,"Convention, Art. 1A(2)",0,"Under the 1951 Convention relating to the Status of Refugees, what kind of fear is required for a person to qualify as a refugee?",["A reasonable fear of generalised violence","A well-founded fear of being persecuted","A proven risk of serious harm","A credible fear of economic deprivation"],1,"Art. 1A(2) requires a 'well-founded fear of being persecuted' for one of the five Convention reasons.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0783",1,5,19,"Convention, Art. 1A(2)",1,"Under the 1951 Convention relating to the Status of Refugees, where must a person be in order to fall within the refugee definition of Article 1A(2)?",["Outside his country of nationality or, if stateless, of former habitual residence","On the territory of a Contracting State that has accepted the 1967 Protocol","In a UNHCR-administered camp or settlement in a neighbouring country","Outside his region of origin and in a State not bordering his own country"],0,"Art. 1A(2) requires the person to be outside the country of nationality or, for a stateless person, outside the country of former habitual residence.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0784",1,5,19,"Convention, Art. 1A(2), second subpara.",2,"Under the 1951 Convention relating to the Status of Refugees, how is 'the country of his nationality' understood for a person with more than one nationality?",["The country of his most recent residence","The country in which he was born","Each of the countries of which he is a national","The country whose nationality he acquired first"],2,"Art. 1A(2): for a person with more than one nationality the term means each of the countries of which he is a national; lacking protection of one without valid reason based on fear does not suffice.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0785",1,5,19,"Convention, Art. 1A(2)",1,"Under the 1951 Convention relating to the Status of Refugees, which dateline limited the original refugee definition?",["Events occurring before 28 July 1951","Events occurring before 1 January 1945","Events occurring before 22 April 1954","Events occurring before 1 January 1951"],3,"Art. 1A(2) referred to persons who became refugees 'as a result of events occurring before 1 January 1951'.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0786",1,5,19,"Convention, Art. 1B(1)",2,"Under the 1951 Convention relating to the Status of Refugees, what option did Article 1B give Contracting States regarding 'events occurring before 1 January 1951'?",["To choose between a 1 January 1945 and a 1 January 1951 dateline","To exclude refugees originating from certain named countries or regions","To declare whether it meant events in Europe only, or in Europe or elsewhere","To limit application to refugees arriving by land and not by sea"],2,"Art. 1B(1) allowed each State to declare whether it applied alternative (a) 'events occurring in Europe' or (b) 'events occurring in Europe or elsewhere'.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0787",1,5,19,"Convention, Art. 1C(1)",1,"Under the 1951 Convention relating to the Status of Refugees, which of the following is a ground on which the Convention ceases to apply to a refugee?",["He has voluntarily re-availed himself of the protection of his country of nationality","He has been absent from the country of refuge for more than one consecutive year","He has committed a minor offence in the country of refuge after his recognition","He has married a national of the country of refuge and acquired a residence permit"],0,"Art. 1C(1) lists voluntary re-availment of national protection as a cessation ground.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0788",1,5,19,"Convention, Art. 1C(3)",1,"Under the 1951 Convention relating to the Status of Refugees, under the cessation clauses, acquiring a new nationality ends refugee status when?",["Immediately upon lodging an application for the new nationality","When the person enjoys the protection of the country of his new nationality","Only after he has held the new nationality for at least five years","Only if the new nationality is that of a State party to the Convention"],1,"Art. 1C(3): the Convention ceases to apply if he has acquired a new nationality 'and enjoys the protection of the country of his new nationality'.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0789",1,5,19,"Convention, Art. 1C(5)",2,"Under the 1951 Convention relating to the Status of Refugees, which exception applies to the 'ceased circumstances' cessation clause in Article 1C(5)?",["A refugee who has resided lawfully in the country of refuge for at least ten years","A refugee who has close family members already settled in the country of refuge","An Article 1A(1) refugee with compelling reasons arising out of previous persecution","A refugee who has applied for naturalisation and whose application is still pending"],2,"The proviso to Art. 1C(5) and (6) excludes statutory refugees under Art. 1A(1) able to invoke compelling reasons arising out of previous persecution.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0790",1,5,19,"Convention, Art. 1C(4)",1,"Under the 1951 Convention relating to the Status of Refugees, which cessation ground concerns a refugee who has voluntarily returned to live in the country he fled?",["He has voluntarily re-established himself in that country","He has briefly visited that country for urgent family reasons","He has obtained a passport issued by that country's consulate","He has transferred part of his assets back to that country"],0,"Art. 1C(4): cessation where he has voluntarily re-established himself in the country which he left or outside which he remained owing to fear of persecution.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0791",1,5,19,"Convention, Art. 1D",2,"Under the 1951 Convention relating to the Status of Refugees, which persons are excluded under Article 1D?",["Persons who have already obtained temporary protection in another Contracting State","Persons who arrived in the country of refuge through a safe third country","Persons currently receiving protection or assistance from UN agencies other than UNHCR","Persons receiving humanitarian assistance from non-governmental organisations"],2,"Art. 1D excludes persons receiving protection or assistance from UN organs or agencies other than UNHCR; if it ceases without definitive settlement, they become ipso facto entitled to the Convention's benefits.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0792",1,5,19,"Convention, Art. 1E",2,"Under the 1951 Convention relating to the Status of Refugees, Article 1E excludes a person recognised by the authorities of his country of residence as having what?",["The rights and obligations attached to possession of that country's nationality","A permanent residence permit valid for at least five years in that country","Subsidiary or temporary protection status granted under that country's law","A valid work permit and stable employment for at least three years in that country"],0,"Art. 1E: the Convention does not apply to a person recognised as having the rights and obligations attached to the nationality of the country of residence.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0793",1,5,19,"Convention, Art. 1F",1,"Under the 1951 Convention relating to the Status of Refugees, what standard of proof applies to exclusion under Article 1F?",["A conviction of the person by a final judgment of a competent criminal court","Proof beyond reasonable doubt established before an independent tribunal","Serious reasons for considering that the person committed the listed acts","An indictment of the person issued by an international criminal tribunal"],2,"Art. 1F applies to persons 'with respect to whom there are serious reasons for considering' that they committed the listed acts.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0794",1,5,19,"Convention, Art. 1F(a)",0,"Under the 1951 Convention relating to the Status of Refugees, which of these crimes leads to exclusion under Article 1F(a)?",["Illegal entry into the country of refuge","A minor traffic offence","Use of a false passport to flee","A crime against humanity"],3,"Art. 1F(a) covers crimes against peace, war crimes and crimes against humanity as defined in international instruments.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0795",1,5,19,"Convention, Art. 1F(b)",1,"Under the 1951 Convention relating to the Status of Refugees, Article 1F(b) excludes a person who has committed what kind of crime?",["Any crime committed in the country of refuge after admission as a refugee","A political crime committed in the country of origin before his departure","A serious non-political crime outside the country of refuge before admission","Any offence against the immigration law of the country of refuge on arrival"],2,"Art. 1F(b): a serious non-political crime outside the country of refuge prior to his admission to that country as a refugee.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0796",1,5,19,"Convention, Art. 1F(c)",1,"Under the 1951 Convention relating to the Status of Refugees, Article 1F(c) excludes persons guilty of which acts?",["Acts contrary to the public order and national security of the host State","Acts of illegal border crossing or use of forged travel documents","Acts contrary to the constitution and laws of the country of origin","Acts contrary to the purposes and principles of the United Nations"],3,"Art. 1F(c): persons guilty of acts contrary to the purposes and principles of the United Nations are excluded.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0797",1,5,19,"Convention, Art. 2",0,"Under the 1951 Convention relating to the Status of Refugees, what general obligation does every refugee have towards the country in which he finds himself?",["To report to the police authorities of the place of residence every month","To apply for naturalisation within five years of being recognised as a refugee","To accept any employment offered by the labour authorities of that country","To conform to its laws and regulations and to measures maintaining public order"],3,"Art. 2: every refugee has duties to the country in which he finds himself, in particular to conform to its laws, regulations and public-order measures.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0798",1,5,19,"Convention, Art. 3",0,"Under the 1951 Convention relating to the Status of Refugees, Article 3 requires the Convention to be applied without discrimination as to which grounds?",["Sex, age or disability","Race, religion or country of origin","Language, property or birth","Political opinion, wealth or education"],1,"Art. 3 'Non-discrimination': provisions apply without discrimination as to race, religion or country of origin.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0799",1,5,19,"Convention, Art. 4",1,"Under the 1951 Convention relating to the Status of Refugees, what treatment must refugees receive with respect to freedom to practise their religion?",["The same as that accorded to aliens generally","At least as favourable as that accorded to nationals","As favourable as possible, subject to reciprocity","The most favourable treatment accorded to foreign nationals"],1,"Art. 4: treatment at least as favourable as that accorded to nationals regarding freedom to practise religion and religious education of children.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0800",1,5,19,"Convention, Art. 16(1)",0,"Under the 1951 Convention relating to the Status of Refugees, what does Article 16(1) guarantee to a refugee?",["Free legal aid in all civil and criminal proceedings in every Contracting State","Exemption from all court fees and from security for costs in every State","Free access to the courts of law on the territory of all Contracting States","The right to be tried by a judge of his own nationality or of his choosing"],2,"Art. 16(1): a refugee shall have free access to the courts of law on the territory of all Contracting States.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0801",1,5,19,"Convention, Art. 22(1)",1,"Under the 1951 Convention relating to the Status of Refugees, what treatment must refugees receive with respect to elementary education?",["Treatment not less favourable than aliens generally","The same treatment as is accorded to nationals","Treatment as favourable as possible","The same treatment only after three years' residence"],1,"Art. 22(1): Contracting States shall accord refugees the same treatment as nationals with respect to elementary education.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0802",1,5,19,"Convention, Art. 27",1,"Under the 1951 Convention relating to the Status of Refugees, to which refugees must Contracting States issue identity papers?",["Any refugee in their territory without a valid travel document","Only refugees who have been lawfully staying for over six months","Only refugees who have formally requested naturalisation","Only refugees already holding a valid residence permit"],0,"Art. 27: identity papers shall be issued to any refugee in their territory who does not possess a valid travel document.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0803",1,5,19,"Convention, Art. 28(1)",1,"Under the 1951 Convention relating to the Status of Refugees, on what grounds may a State refuse travel documents to refugees lawfully staying in its territory?",["Lack of reciprocity with the country of destination","Compelling reasons of national security or public order","Insufficient financial means of the refugee","Pending naturalisation proceedings"],1,"Art. 28(1): travel documents shall be issued unless compelling reasons of national security or public order otherwise require.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0804",1,5,19,"Convention, Art. 31(1)",1,"Under the 1951 Convention relating to the Status of Refugees, Article 31(1) protects refugees from penalties on account of illegal entry or presence provided that they meet which conditions?",["Coming directly from a threatening territory, reporting without delay and showing good cause","Holding a valid passport, having no criminal record and lodging a claim within one month","Applying for asylum within one year of arrival and having close family in the country","Entering at an official border crossing point and paying the prescribed entry fees"],0,"Art. 31(1) applies to refugees coming directly from a territory where their life or freedom was threatened, who present themselves without delay to the authorities and show good cause for illegal entry or presence.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0805",1,5,19,"Convention, Art. 31(2)",2,"Under the 1951 Convention relating to the Status of Refugees, what restrictions may be applied to the movements of refugees unlawfully in the country under Article 31(2)?",["Any restriction applicable to aliens generally in the same circumstances, without time limit","Detention for up to 18 months pending a decision on removal from the territory","No restrictions of any kind, since refugees enjoy full freedom of movement","Only necessary ones, until status is regularised or admission elsewhere is obtained"],3,"Art. 31(2): only necessary restrictions, applied only until status is regularised or admission into another country is obtained, with a reasonable period and facilities to obtain such admission.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0806",1,5,19,"Convention, Art. 32(1)",0,"Under the 1951 Convention relating to the Status of Refugees, on what grounds may a refugee lawfully in the territory be expelled under Article 32?",["Unemployment or reliance on social assistance","Any criminal conviction","Loss of travel documents","National security or public order"],3,"Art. 32(1): Contracting States shall not expel a refugee lawfully in their territory save on grounds of national security or public order.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0807",1,5,19,"Convention, Art. 32(2)",2,"Under the 1951 Convention relating to the Status of Refugees, what procedural guarantee applies to the expulsion of a refugee lawfully in the territory, except where compelling reasons of national security otherwise require?",["He may submit evidence to clear himself, appeal and be represented","He must be heard by UNHCR before the expulsion decision is adopted","He must be granted a suspension of the decision for at least six months","He must be tried by a jury composed partly of nationals of his country"],0,"Art. 32(2): expulsion only by a decision reached under due process; the refugee may submit evidence, appeal and be represented unless compelling national security reasons otherwise require.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0808",1,5,19,"Convention, Art. 33(1)",0,"Under the 1951 Convention relating to the Status of Refugees, what does the principle of non-refoulement in Article 33(1) prohibit?",["Returning a refugee in any manner to frontiers where his life or freedom would be threatened","Refusing a visa to a person who intends to apply for asylum on arrival in the country","Transferring a refugee to another Contracting State that has accepted responsibility for him","Detaining a refugee for a short period pending verification of identity and nationality"],0,"Art. 33(1): no Contracting State shall expel or return ('refouler') a refugee in any manner whatsoever to the frontiers of territories where his life or freedom would be threatened on account of race, religion, nationality, social group or political opinion.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0809",1,5,19,"Convention, Art. 33(2)",1,"Under the 1951 Convention relating to the Status of Refugees, which refugee may NOT claim the benefit of non-refoulement under Article 33(2)?",["One who entered the territory illegally or without valid documents and did not present himself to the authorities","One who has lived in the country of refuge for less than one year or has not yet registered as a refugee","One reasonably regarded as a danger to security, or a dangerous person convicted of a particularly serious crime","One who has no identity documents and refuses to cooperate in establishing his nationality and identity"],2,"Art. 33(2): the exception covers a refugee reasonably regarded as a danger to security, or convicted by final judgment of a particularly serious crime and constituting a danger to the community.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0810",1,5,19,"Convention, Art. 42(1)",2,"Under the 1951 Convention relating to the Status of Refugees, to which of the following articles may States NOT make reservations?",["Articles 17, 18, 19 and 24(1)","Articles 21, 22(2), 23 and 26","Articles 2, 28, 31 and 32(1)","Articles 1, 3, 4, 16(1) and 33"],3,"Art. 42(1): reservations may be made to articles other than 1, 3, 4, 16(1), 33 and 36-46 inclusive.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0811",1,5,19,"Convention, Art. 35(1)",0,"Under the 1951 Convention relating to the Status of Refugees, which body's duty of supervising the application of the Convention must Contracting States facilitate?",["The International Court of Justice in The Hague","The UN Human Rights Council and its special rapporteurs","The International Organization for Migration in Geneva","The Office of the UN High Commissioner for Refugees"],3,"Art. 35(1): States undertake to cooperate with UNHCR and facilitate its duty of supervising the application of the Convention.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0812",1,5,19,"Convention, Art. 38",1,"Under the 1951 Convention relating to the Status of Refugees, to which body must an unresolved dispute between parties on interpretation or application be referred at the request of any party?",["The UNHCR Executive Committee","The UN Security Council","The International Court of Justice","The Permanent Court of Arbitration"],2,"Art. 38: disputes that cannot be settled otherwise shall be referred to the International Court of Justice.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0813",1,5,19,"Protocol, Art. I(2)",0,"Under the 1967 Protocol relating to the Status of Refugees, how is the refugee definition of the 1951 Convention modified?",["The five persecution grounds are extended to include natural disasters and armed conflict","The words 'as a result of events occurring before 1 January 1951' are deemed omitted","The definition is extended to internally displaced persons within their own country","The requirement of being outside the country of nationality or residence is removed"],1,"Art. I(2) of the Protocol defines 'refugee' as in Art. 1 of the Convention as if the dateline words were omitted, removing the time limitation.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0814",1,5,19,"Protocol, Art. I(3)",1,"Under the 1967 Protocol relating to the Status of Refugees, how shall the Protocol be applied geographically?",["Only to refugees originating from Europe, as under the original 1951 Convention","Without geographic limitation, save existing Article 1B(1)(a) declarations unless extended","Only within the territory of Member States of the United Nations and its agencies","Only to refugees originating from States that are not party to the 1951 Convention"],1,"Art. I(3): the Protocol applies without any geographic limitation, save that existing Art. 1B(1)(a) declarations remain unless extended.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0815",1,5,19,"Protocol, Art. I(1); Art. VIII(1)",2,"Under the 1967 Protocol relating to the Status of Refugees, which statement is correct?",["States apply Articles 1 to 46 of the Convention; in force 90 days after the sixth ratification","States apply Articles 2 to 34 of the Convention; in force on deposit of the sixth accession","States choose which Articles of the Convention to apply; in force upon signature by any State","States apply Articles 1 to 11 of the Convention only; in force after deposit of 20 accessions"],1,"Art. I(1): States Parties apply Arts. 2-34 of the Convention; Art. VIII(1): the Protocol comes into force on the day of deposit of the sixth instrument of accession.","https://www.unhcr.org/media/convention-and-protocol-relating-status-refugees"],["Q0816",1,5,20,"IMO SOLAS page 'History of SOLAS'; Focus on IMO (1998) 'Background'",0,"Which disaster led to the adoption of the first International Convention for the Safety of Life at Sea (SOLAS) in 1914?",["The sinking of the Lusitania","The sinking of the Titanic","The capsizing of the Herald of Free Enterprise","The fire on the Morro Castle"],1,"IMO states the first SOLAS version was adopted in 1914 in response to the Titanic disaster (April 1912).","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0817",1,5,20,"IMO SOLAS page 'History of SOLAS'",1,"Before the current 1974 Convention, in which years were earlier versions of the SOLAS Convention adopted?",["1912, 1929, 1952 and 1965","1914, 1933, 1948 and 1966","1910, 1929, 1958 and 1960","1914, 1929, 1948 and 1960"],3,"IMO: the first version was adopted in 1914, the second in 1929, the third in 1948 and the fourth in 1960.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0818",1,5,20,"IMO SOLAS 1974 page 'Adoption/Entry into force'",1,"When was SOLAS 1974 adopted and when did it enter into force?",["Adopted 1 November 1974; entered into force 25 May 1980","Adopted 20 January 1974; entered into force 1 July 1977","Adopted 1 November 1974; entered into force 1 January 1976","Adopted 27 April 1974; entered into force 22 June 1985"],0,"IMO lists SOLAS 1974 as adopted on 1 November 1974 with entry into force on 25 May 1980.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0819",1,5,20,"IMO SOLAS 1974 page; Focus on IMO 'Tacit acceptance'",1,"Under the International Convention for the Safety of Life at Sea (SOLAS), what does the 'tacit acceptance' procedure introduced in 1974 provide?",["An amendment enters into force only after express ratification by two-thirds of Parties","An amendment enters into force on a set date unless enough Parties object beforehand","An amendment enters into force immediately upon its adoption by the IMO Assembly","An amendment must be expressly approved by every flag State before entering into force"],1,"IMO: tacit acceptance provides that an amendment enters into force on a specified date unless, before that date, objections are received from an agreed number of Parties.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0820",1,5,20,"Focus on IMO (1998) 'Tacit acceptance' (Art. VIII)",2,"Under the International Convention for the Safety of Life at Sea (SOLAS), amendments to the technical chapters (other than Chapter I) of the Annex are deemed accepted unless rejected by whom?",["One-third of Contracting Governments, or Governments with at least 50% of world gross tonnage","Two-thirds of Contracting Governments, or Governments with at least 75% of world gross tonnage","A simple majority of IMO Member States voting in the Maritime Safety Committee","Any five Contracting Governments whose fleets each exceed 5% of world gross tonnage"],0,"Under Art. VIII, amendments are deemed accepted unless rejected by one-third of Contracting Governments or by Governments with not less than 50 per cent of world gross tonnage.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0821",1,5,20,"Focus on IMO (1998) 'Tacit acceptance'",1,"Why was the amendment procedure of the 1960 SOLAS Convention considered ineffective?",["Amendments could only be proposed by the United Kingdom as depositary Government","Amendments required unanimous approval by the UN General Assembly before entry into force","Entry into force required acceptance by two-thirds of the Parties, which became too slow","Amendments could not cover the technical chapters of the Annex, only the Articles"],2,"The 1960 procedure required acceptance by two-thirds of Contracting Parties; as the number of Parties grew, amendments were out of date before entering into force.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0822",1,5,20,"IMO SOLAS 1974 page 'Technical provisions'",0,"Under the International Convention for the Safety of Life at Sea (SOLAS), what is the main objective of the Convention?",["To set minimum standards for construction, equipment and operation of ships, compatible with safety","To regulate the employment, working hours and wages of seafarers serving on merchant ships","To prevent pollution of the marine environment by oil and by noxious liquid substances","To define maritime boundaries and the extent of jurisdiction of coastal States over ships"],0,"IMO: the main objective of SOLAS is to specify minimum standards for the construction, equipment and operation of ships, compatible with their safety.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0823",1,5,20,"IMO SOLAS 1974 page 'Technical provisions'",1,"Under the International Convention for the Safety of Life at Sea (SOLAS), who is primarily responsible for ensuring that ships comply with its requirements?",["The port States","The classification societies","The International Maritime Organization","The flag States"],3,"IMO: flag States are responsible for ensuring that ships under their flag comply with SOLAS, with certificates as proof.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0824",1,5,20,"IMO SOLAS 1974 page 'Technical provisions'",1,"Under the International Convention for the Safety of Life at Sea (SOLAS), what is the procedure called that allows Contracting Governments to inspect ships of other Contracting States where there are clear grounds for believing they do not substantially comply?",["Flag State audit","Port State control","Coastal State enforcement","Hot pursuit"],1,"IMO: control provisions allowing inspection of foreign ships on clear grounds are known as port State control.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0825",1,5,20,"IMO SOLAS 1974 page, Chapter V",0,"Which chapter of the SOLAS Annex contains the general obligation for masters to proceed to the assistance of those in distress?",["Chapter V - Safety of navigation","Chapter III - Life-saving appliances and arrangements","Chapter IV - Radiocommunications","Chapter IX - Management for the safe operation of ships"],0,"IMO: Chapter V includes a general obligation for masters to proceed to the assistance of those in distress.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0826",1,5,20,"IMO SOLAS 1974 page, Chapter V",2,"Under the International Convention for the Safety of Life at Sea (SOLAS), how does the scope of Chapter V differ from the Convention as a whole?",["It applies only to passenger ships, whereas the Convention as a whole applies to all ships","It applies only within territorial waters, unlike the Convention which applies on the high seas","It applies generally to all ships on all voyages, unlike the Convention as a whole","It applies only to ships of 500 gross tonnage and above engaged on international voyages"],2,"IMO: Chapter V sets operational provisions applicable in general to all ships on all voyages, in contrast to the Convention as a whole.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0827",1,5,20,"SOLAS reg. V/33.1 as amended by res. MSC.153(78)",1,"Under the International Convention for the Safety of Life at Sea (SOLAS), regulation V/33.1, to whom does the master's obligation to provide assistance to persons in distress at sea apply?",["Only to nationals of the flag State and of other Contracting Governments to SOLAS","Only to crew members and passengers of ships in distress, not to persons on other craft","To persons in distress regardless of nationality, status or circumstances in which found","Only to persons whose status has previously been verified by the coastal State concerned"],2,"MSC.153(78) added to reg. V/33.1: 'This obligation to provide assistance applies regardless of the nationality or status of such persons or the circumstances in which they are found.'","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0828",1,5,20,"SOLAS reg. V/33.1-1 (res. MSC.153(78))",2,"Under the International Convention for the Safety of Life at Sea (SOLAS), regulation V/33.1-1, which Contracting Government exercises primary responsibility for ensuring coordination so that survivors are disembarked and delivered to a place of safety?",["The flag State of the ship that rendered assistance to the persons in distress","The Government responsible for the SAR region in which assistance is rendered","The State of nationality of the majority of the survivors taken on board","The State in which the assisting ship has its next scheduled port of call"],1,"Reg. V/33.1-1: the Contracting Government responsible for the SAR region where assistance is rendered exercises primary responsibility for such coordination and cooperation.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0829",1,5,20,"SOLAS reg. V/33.6 (res. MSC.153(78))",0,"Under the International Convention for the Safety of Life at Sea (SOLAS), regulation V/33.6, how must masters treat persons in distress whom they have embarked?",["As passengers with full contractual rights","As persons under arrest until handed over","According to the instructions of the nearest coastal State only","With humanity, within the capabilities and limitations of the ship"],3,"Reg. V/33.6 (added by MSC.153(78)): masters who have embarked persons in distress shall treat them with humanity, within the capabilities and limitations of the ship.","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0830",1,5,20,"IMO SOLAS 1974 page, Chapter IV",1,"Which system is incorporated in Chapter IV (Radiocommunications) of SOLAS?",["The Automatic Identification System (AIS)","The Long-Range Identification and Tracking system (LRIT)","The Global Maritime Distress and Safety System (GMDSS)","The Vessel Traffic Service system (VTS)"],2,"IMO: Chapter IV incorporates the Global Maritime Distress and Safety System (GMDSS).","https://www.imo.org/en/KnowledgeCentre/ConferencesMeetings/Pages/SOLAS.aspx"],["Q0831",1,5,21,"IMO SAR page 'Introduction'",0,"Where was the International Convention on Maritime Search and Rescue (SAR) adopted in 1979?",["Hamburg","London","Geneva","Montego Bay"],0,"IMO: the 1979 Convention was adopted at a Conference in Hamburg.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0832",1,5,21,"IMO SAR page 'Adoption / Entry into force'",1,"When did the International Convention on Maritime Search and Rescue (SAR), 1979 enter into force?",["22 June 1985","27 April 1979","25 May 1980","1 January 2000"],0,"IMO: SAR Convention adopted 27 April 1979; entry into force 22 June 1985.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0833",1,5,21,"IMO SAR page 'Introduction'",0,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, what was the main aim of the Convention?",["To set up an international SAR plan so that rescues are coordinated wherever accidents occur","To set international construction and equipment standards for lifeboats and rescue boats","To regulate salvage rewards payable to ships that rescue other vessels and their cargo","To define the territorial sea and contiguous zone of coastal States for rescue purposes"],0,"IMO: the Convention aimed at developing an international SAR plan so that, wherever an accident occurs, rescue is coordinated by a SAR organization and, where necessary, by neighbouring SAR organizations.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0834",1,5,21,"IMO SAR page 'IMO search and rescue areas'",1,"Following the adoption of the 1979 SAR Convention, into how many search and rescue areas did IMO's Maritime Safety Committee divide the world's oceans?",["13","7","10","21"],0,"IMO: the MSC divided the world's oceans into 13 search and rescue areas, in which the countries concerned delimited SAR regions.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0835",1,5,21,"IMO SAR page 'IMO search and rescue areas'",2,"Provisional search and rescue plans for all IMO SAR areas were completed when plans for which ocean were finalized at a conference in Fremantle in September 1998?",["The South Pacific Ocean","The South Atlantic Ocean","The Arctic Ocean","The Indian Ocean"],3,"IMO: provisional SAR plans for all areas were completed when plans for the Indian Ocean were finalized at Fremantle, Western Australia, in September 1998.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0836",1,5,21,"IMO SAR page 'The 1998 amendments'",1,"When was the revised technical Annex of the SAR Convention (1998 amendments) adopted and when did it enter into force?",["Adopted 20 May 2004; entered into force 1 July 2006","Adopted 18 May 1998; entered into force 1 January 2000","Adopted 1 November 1998; entered into force 1 July 1999","Adopted 18 May 1998; entered into force 1 July 2002"],1,"IMO: the 1998 amendments were adopted on 18 May 1998 (res. MSC.70(69)) and entered into force on 1 January 2000.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0837",1,5,21,"IMO SAR page 'Revision of SAR Convention'",2,"Which IMO sub-committee was requested to revise the technical Annex of the SAR Convention in the 1990s?",["The Sub-Committee on Safety of Navigation and Ship Routeing (NAV)","The Sub-Committee on Flag State Implementation and Port State Control (FSI)","The Facilitation Committee on Maritime Traffic and Persons Rescued (FAL)","The Sub-Committee on Radiocommunications and Search and Rescue (COMSAR)"],3,"IMO: COMSAR was requested to revise the technical Annex; the draft was approved by MSC 68 and adopted by MSC 69 in May 1998.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0838",1,5,21,"SAR Annex para. 2.3.3 (res. MSC.70(69)); IMO SAR page Chapter 2",0,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, how must rescue coordination centres (RCCs) be operated?",["During daylight hours only, with staff speaking the official language of the coastal State","On a 24-hour basis, constantly staffed by trained personnel with working English","On a 24-hour basis only during the navigation season, with volunteer staff on call","On call only, activated by the national coast guard when a distress alert is received"],1,"Para. 2.3.3: each RCC shall be operational on a 24-hour basis and constantly staffed by trained personnel having a working knowledge of the English language.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0839",1,5,21,"SAR Annex para. 1.3.5 (res. MSC.70(69))",1,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, how is a 'rescue co-ordination centre' defined?",["A ship designated by the coastal State to coordinate all operations at the scene of distress","A national ministry responsible for maritime affairs and for the licensing of rescue units","A satellite ground station that receives distress alerts and relays them to ships nearby","A unit promoting efficient SAR services and coordinating SAR operations in a SAR region"],3,"Annex 1.3.5 defines an RCC as a unit responsible for promoting efficient organization of SAR services and for coordinating SAR operations within a SAR region.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0840",1,5,21,"SAR Annex para. 1.3.2 (res. MSC.70(69))",0,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, which element is part of the definition of 'rescue'?",["Towing the vessel in distress to the nearest port","Identifying the nationality of survivors","Salvaging the cargo of the vessel","Delivering persons in distress to a place of safety"],3,"Annex 1.3.2: 'Rescue' is an operation to retrieve persons in distress, provide for their initial medical or other needs, and deliver them to a place of safety.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0841",1,5,21,"SAR Annex para. 2.1.10",0,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, to whom must Parties ensure that assistance is provided?",["Only nationals of States Parties and persons lawfully resident in those States","Any person in distress at sea, regardless of nationality, status or circumstances","Only persons on board ships flying the flag of a Party to the Convention","Only persons whose distress has first been confirmed by a rescue co-ordination centre"],1,"Annex 2.1.10: Parties shall ensure assistance to any person in distress at sea regardless of the nationality or status of such a person or the circumstances in which that person is found.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0842",1,5,21,"SAR Annex para. 2.1.7",2,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, what is the relationship between the delimitation of search and rescue regions and boundaries between States?",["SAR regions must follow the outer limits of exclusive economic zones","SAR regions determine the outer limits of the territorial sea of each State","It is unrelated to, and shall not prejudice, any boundary between States","SAR regions must coincide exactly with ICAO flight information regions"],2,"Annex 2.1.7: the delimitation of SAR regions is not related to and shall not prejudice the delimitation of any boundary between States.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0843",1,5,21,"SAR Annex para. 1.3.10-1.3.13 (res. MSC.70(69))",0,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, which three emergency phases are distinguished?",["Warning phase, danger phase and rescue phase","Information phase, search phase and recovery phase","Uncertainty phase, alert phase and distress phase","Watch phase, alarm phase and evacuation phase"],2,"Annex 1.3.10: 'Emergency phase' is a generic term meaning, as the case may be, uncertainty phase, alert phase or distress phase (in ICAO usage INCERFA, ALERFA and DETRESFA).","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0844",1,5,21,"SAR Annex para. 1.3.13 (res. MSC.70(69))",1,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, how is the 'distress phase' defined?",["Uncertainty as to the safety of a person, a vessel or other craft at sea","Apprehension as to the safety of a person, a vessel or other craft at sea","Reasonable certainty of grave and imminent danger requiring immediate assistance","Failure of a vessel to make one expected position or safety report"],2,"Annex 1.3.13 defines the distress phase as reasonable certainty of grave and imminent danger requiring immediate assistance.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0845",1,5,21,"SAR Annex para. 4.4.1 (res. MSC.70(69))",2,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, which situation corresponds to the uncertainty phase?",["A vessel is overdue or has failed to make an expected position or safety report","Attempts to contact a vessel after an earlier phase have failed","Positive information is received that a vessel needs immediate assistance","A vessel's operating efficiency is impaired so that distress is likely"],0,"Annex 4.4.1: uncertainty phase when a person is reported missing, a vessel is overdue, or a vessel has failed to make an expected position or safety report.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0846",1,5,21,"SAR Annex para. 4.8.1 (res. MSC.70(69)); IMO SAR page Chapter 4",1,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, for how long shall search and rescue operations continue?",["For a maximum of 72 hours from the declaration of the distress phase","When practicable, until all reasonable hope of rescuing survivors has passed","Until the flag State of the vessel in distress formally requests termination","Until nightfall on the third day following receipt of the first distress alert"],1,"Annex 4.8.1: 'Search and rescue operations shall continue, when practicable, until all reasonable hope of rescuing survivors has passed.'","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0847",1,5,21,"IMO SAR page 'IAMSAR Manual'",0,"Which organizations jointly developed the International Aeronautical and Maritime Search and Rescue (IAMSAR) Manual?",["IMO and the International Telecommunication Union (ITU)","IMO and UNHCR","IMO and the International Civil Aviation Organization (ICAO)","ICAO and the International Hydrographic Organization (IHO)"],2,"IMO: IMO and ICAO jointly developed the IAMSAR Manual concurrently with the revision of the SAR Convention.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0848",1,5,21,"IMO SAR page 'IAMSAR Manual'",2,"Into how many volumes is the IAMSAR Manual divided, and what do they cover?",["Two: Maritime Operations and Coordination; Aeronautical Operations and Coordination","Four: Organization; Communications; Medical Assistance; Training and Exercises","Three: Search Planning; Rescue Techniques and Equipment; Disembarkation of Survivors","Three: Organization and Management; Mission Coordination; Mobile Facilities"],3,"IMO: the IAMSAR Manual is published in three volumes covering Organization and Management, Mission Coordination, and Mobile Facilities.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0849",1,5,21,"SAR Annex para. 3.1.9 (res. MSC.155(78)); IMO SAR page '2004 amendments'",1,"Under the International Convention on Maritime Search and Rescue (SAR), 1979, as amended in 2004, on which Party does the primary responsibility for ensuring that survivors are delivered to a place of safety fall?",["The flag State of the ship that rescued the survivors and took them on board","The Party responsible for the SAR region where the survivors were recovered","The State from whose coast the survivors originally embarked on their voyage","The Party whose territory includes the port nearest to the rescue position"],1,"Res. MSC.155(78) and new para. 3.1.9: the Party responsible for the SAR region in which assistance is rendered exercises primary responsibility so that survivors are disembarked and delivered to a place of safety.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0850",1,5,21,"IMO SAR page '2004 amendments'; res. MSC.155(78) para. 3",1,"When did the 2004 amendments to the SAR Convention on persons in distress at sea enter into force?",["1 January 2000","22 June 1985","1 July 2006","1 January 2006"],2,"IMO: the 2004 amendments (MSC 78, May 2004) entered into force on 1 July 2006; they were deemed accepted on 1 January 2006.","https://www.imo.org/en/OurWork/Safety/Pages/SARConvention.aspx"],["Q0851",1,5,22,"Frontex page 'Fundamental rights at Frontex', intro",0,"According to Frontex's 'Fundamental rights at Frontex' page, respect for and protection of fundamental rights are described as what in relation to effective integrated border management?",["Secondary considerations after security objectives","Optional components subject to operational needs","Components applicable only to return operations","Unconditional and essential components"],3,"The page states that respect for and protection of fundamental rights are 'unconditional and essential components of effective integrated border management'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0852",1,5,22,"Frontex page 'Fundamental rights at Frontex', intro",0,"Which refugee-law instrument does Frontex explicitly state it strictly adheres to on its 'Fundamental rights at Frontex' page, alongside the EU Charter and the ECHR?",["The 1990 Dublin Convention and its 2003 implementing regulation","The 1951 Convention relating to the Status of Refugees and its 1967 Protocol","The 1984 Cartagena Declaration on Refugees","The 1961 Convention on the Reduction of Statelessness only"],1,"The page lists the Charter, the ECHR and relevant international instruments, 'including the 1951 Convention relating to the Status of Refugees and its 1967 Protocol'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0853",1,5,22,"Frontex page 'Fundamental rights at Frontex', training paragraph",1,"According to the 'Fundamental rights at Frontex' page, what training do Frontex staff and Member State officers participating in Frontex operations receive prior to deployment?",["Training on fundamental rights only for officers deployed to return operations, as border surveillance officers are trained nationally","Training on fundamental rights, access to international protection including non-refoulement and, where appropriate, search and rescue","Training on data protection and EU information systems only, since fundamental rights are covered by national basic training","Training on the use of force and service weapons only, with fundamental rights addressed after deployment"],1,"Prior to deployment all participants receive training on fundamental rights, access to international protection including non-refoulement and, where appropriate, search and rescue.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0854",1,5,22,"Frontex page 'Fundamental rights at Frontex', history paragraph",0,"Following which amendments to the Frontex Regulation were the Fundamental Rights Officer post and the Consultative Forum on Fundamental Rights created?",["The 2011 amendments to the Frontex Regulation","The 2016 European Border and Coast Guard Regulation","The 2004 founding Council Regulation","The 2019 European Border and Coast Guard Regulation"],0,"The page states that 'following 2011 amendments to the Frontex Regulation' the FRO position and the Consultative Forum were created.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0855",1,5,22,"Frontex page 'Fundamental rights at Frontex', components: Serious Incident Reports",1,"Under the Serious Incident Report (SIR) procedure described by Frontex, who is obliged to report possible violations of fundamental rights?",["Only the Coordinating Officer, in a consolidated monthly report to the Executive Director","Only fundamental rights monitors who personally witnessed the incident in the operational area","Every participant in Frontex operational activities, immediately, in the form of a SIR","Only Frontex statutory staff, through their line manager and within ten working days"],2,"The SIR procedure 'obliges every participant in Frontex operational activities to immediately report in the form of a Serious Incident Report any situation of possible violations of fundamental rights'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0856",1,5,22,"Frontex page 'Fundamental rights at Frontex', components: Serious Incident Reports",2,"Which of the following is NOT one of the three categories of situations listed by Frontex as reportable through a Serious Incident Report?",["Situations with serious actual or potential negative implications on the agency's core tasks","Violations of the EU acquis or international law","Violations of the provisions of the Frontex Codes of Conduct","Disagreements between deployed officers over shift allocation"],3,"The page lists: (1) violations of the EU acquis or international law; (2) violations of the Codes of Conduct; (3) situations with serious actual or potential negative implications on core tasks.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0857",1,5,22,"Frontex page 'Fundamental rights at Frontex', components: Serious Incident Reports",0,"Who handles Serious Incident Reports of fundamental rights relevance at Frontex?",["The Fundamental Rights Officer together with the staff of the Fundamental Rights Office","The European Data Protection Supervisor together with the Frontex Data Protection Officer","The Management Board's working group on fundamental rights and the Executive Director","The host Member State's border police together with the national ombudsman institution"],0,"The page states that the FRO together with the staff of the Fundamental Rights Office handle the SIRs of fundamental rights relevance.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0858",1,5,22,"Frontex page 'Fundamental rights at Frontex', components: Consultative Forum",0,"In which year was the Frontex Consultative Forum on Fundamental Rights established?",["2008","2016","2019","2012"],3,"The page states that the Consultative Forum on Fundamental Rights was 'established in 2012'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0859",1,5,22,"Frontex page 'Fundamental rights at Frontex', components: use of force",1,"According to the 'Fundamental rights at Frontex' page, to whom has the reporting obligation for incidents on the use of force under the supervisory mechanism been extended?",["Only officers deployed in third countries","All members of the standing corps","Only Frontex statutory staff of category 1","Only host Member State border guards"],1,"The supervisory mechanism on use of force includes 'a reporting obligation for incidents on the use of force that has been extended to all members of the standing corps'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0860",1,5,22,"Frontex page 'Fundamental Rights Office' (FRO section)",0,"Which two core functions describe the mandate of the Frontex Fundamental Rights Officer (FRO)?",["Monitoring Frontex's compliance with fundamental rights obligations and advising the Executive Director on them","Deciding on asylum applications lodged at the external borders and issuing return decisions for rejected applicants","Adopting the Frontex annual budget and proposing candidates for the post of Executive Director","Commanding the standing corps in the field and approving operational plans with host Member States"],0,"The FRO 'is mandated with monitoring Frontex's implementation of its fundamental rights obligations ... and with advising the Executive Director on fundamental rights-related issues'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0861",1,5,22,"Frontex page 'Fundamental Rights Office' (FRO section); Regulation (EU) 2019/1896 Art. 109(4)",1,"Pursuant to Article 109(4) of Regulation (EU) 2019/1896, what must the Fundamental Rights Officer publish?",["Quarterly risk analyses on migratory flows and trends at the external borders, with recommendations to Member States","A biennial evaluation of the Executive Director's performance, submitted to the European Parliament","Annual reports on his or her activities and the extent to which the Agency's activities respect fundamental rights","Monthly lists of all individuals who submitted complaints, including the outcome of each complaint"],2,"The FRO publishes annual reports pursuant to Art. 109(4), including information on the complaints mechanism and the implementation of the fundamental rights strategy.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0862",1,5,22,"Regulation (EU) 2019/1896 Art. 109(1)",1,"Under Article 109(1) of Regulation (EU) 2019/1896, how is the Fundamental Rights Officer appointed?",["By the Management Board from a list of three candidates, after consulting the Consultative Forum","By the Commission after consulting the EU Agency for Fundamental Rights","By the Executive Director from a list of five candidates proposed by the Commission","By the European Parliament on a proposal from the Council"],0,"Art. 109(1): the FRO is appointed by the management board on the basis of a list of three candidates, after consultation with the consultative forum.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0863",1,5,22,"Regulation (EU) 2019/1896 Art. 109(4)",0,"Under Article 109(4) of Regulation (EU) 2019/1896, to whom does the Fundamental Rights Officer report directly?",["The Executive Director","The Management Board","The European Commission","The Head of the Legal Unit"],1,"Art. 109(4): the FRO 'shall report directly to the management board and shall cooperate with the consultative forum'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0864",1,5,22,"Frontex page 'Fundamental Rights Office' (FRO section); Regulation (EU) 2019/1896 Art. 109(6)",1,"What happens if the Frontex Fundamental Rights Officer is absent or indisposed?",["The FRO's duties are suspended until his or her return, unless the Management Board decides otherwise","The Executive Director assumes the FRO's duties personally for the duration of the absence","The Deputy Fundamental Rights Officer assumes the FRO's duties and responsibilities","The Chair of the Consultative Forum acts as interim FRO until a new appointment is made"],2,"Art. 109(6) and the FRO page: if the FRO is absent or indisposed, the Deputy FRO assumes his or her duties and responsibilities.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0865",1,5,22,"Regulation (EU) 2019/1896 Art. 109(6)",2,"Under Regulation (EU) 2019/1896, how is the Deputy Fundamental Rights Officer appointed?",["By the Management Board from a list of at least three candidates presented by the FRO","By the FRO alone, without involvement of the Management Board","By the Executive Director from a list of two candidates presented by the Consultative Forum","By the Commission on a proposal of the European Ombudsman"],0,"Art. 109(6): the deputy is appointed by the management board from a list of at least three candidates presented by the fundamental rights officer.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0866",1,5,22,"Frontex page 'Fundamental Rights Monitors'; Regulation (EU) 2019/1896 Art. 110(1)",0,"Under which article of Regulation (EU) 2019/1896 are fundamental rights monitors established as statutory staff of Frontex?",["Article 80","Article 111","Article 110","Article 46"],2,"The monitors page states that 'Regulation (EU) 2019/1896, under Article 110, foresees the establishment of fundamental rights monitors as statutory staff'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0867",1,5,22,"Frontex page 'Fundamental Rights Monitors'",1,"How does Frontex describe the role of fundamental rights monitors in relation to the Fundamental Rights Officer?",["As members of the host Member State's border police, seconded to Frontex for the operation","As an external inspection body that reports directly to the European Parliament's LIBE Committee","As advisers to the Coordinating Officer, reporting only to him or her on operational matters","As the 'extension' of the FRO in the field, deployed to operational areas on the FRO's behalf"],3,"The page describes the monitors as 'the extension of the FRO in the field', deployed to operational areas on behalf of the FRO.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0868",1,5,22,"Frontex page 'Fundamental Rights Monitors'",1,"With which EU agency did Frontex run the pilot project (November 2019 - June 2021) to establish the function of fundamental rights monitors?",["The European Union Agency for Fundamental Rights (FRA)","The European Institute for Gender Equality (EIGE)","The European Union Agency for Asylum (EUAA)","Europol"],0,"Frontex launched the pilot project 'in cooperation with the European Union Agency for Fundamental Rights (FRA)'; FRA also supported recruitment of the first monitors.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0869",1,5,22,"Frontex page 'Fundamental Rights Monitors'",1,"According to Frontex, how many fundamental rights monitors h
