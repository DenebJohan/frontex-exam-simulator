<title>Frontex Exam Simulator</title>

<style>
/* Layout: one-column control-room tool; exam view = question pane + navigator rail, sticky status bar with the clock */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --sunk:#E3E9EC; --ink:#13202B; --muted:#5A6874; --line:#CFD8DD;
  --accent:#0B6670; --accent-ink:#FFFFFF; --accent-soft:#D5ECEE;
  --good:#1D7A46; --good-soft:#DCF1E4; --bad:#B42E25; --bad-soft:#F8E0DD; --flag:#A66A00; --flag-soft:#F7EACB;
  --f-display:"Archivo","Arial Narrow",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1418; --surface:#141E24; --sunk:#1B272E; --ink:#E4ECEF; --muted:#93A3AC; --line:#2A3A43;
  --accent:#43B7BF; --accent-ink:#06171A; --accent-soft:#16363A;
  --good:#5BC98A; --good-soft:#16321F; --bad:#F27A6F; --bad-soft:#3A1C19; --flag:#E5B04A; --flag-soft:#3A2D10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1418; --surface:#141E24; --sunk:#1B272E; --ink:#E4ECEF; --muted:#93A3AC; --line:#2A3A43;
  --accent:#43B7BF; --accent-ink:#06171A; --accent-soft:#16363A;
  --good:#5BC98A; --good-soft:#16321F; --bad:#F27A6F; --bad-soft:#3A1C19; --flag:#E5B04A; --flag-soft:#3A2D10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1rem;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .95rem;font-weight:500;display:inline-flex;align-items:center;gap:.4rem}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:16px}

/* home */
.hero{display:grid;gap:8px;margin-bottom:22px}
.rules{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font-family:var(--f-mono);font-size:.8rem;border:1px solid var(--line);border-radius:999px;padding:.2rem .65rem;background:var(--surface)}
.chip.g{color:var(--good);border-color:currentColor}.chip.b{color:var(--bad);border-color:currentColor}
.modes{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
.mode{display:grid;gap:12px;align-content:start}
.mode.exam{border:2px solid var(--accent)}
.opts{display:grid;gap:10px}
label.check{display:flex;gap:.55rem;align-items:flex-start;font-size:.93rem}
label.check input{margin-top:.25rem;accent-color:var(--accent)}
.field{display:grid;gap:4px;font-size:.88rem}
.field select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.45rem .6rem;max-width:100%}
.tip{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:.88rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px;align-items:start}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:.45rem .5rem;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tablebox{overflow-x:auto}

/* quiz */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-inline:-16px;padding:10px 16px}
.bar .in{max-width:1080px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--f-mono);font-size:1.35rem;font-weight:600;letter-spacing:.02em;padding:.15rem .6rem;border-radius:6px;background:var(--sunk)}
.clock.low{color:var(--bad);background:var(--bad-soft)}
.prog{flex:1;min-width:140px;display:grid;gap:4px}
.track{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);transition:width .2s}
.qlayout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;margin-top:18px;align-items:start}
.qcard{display:grid;gap:16px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.qtext{font-size:1.12rem;line-height:1.55;font-weight:500;margin:0}
.answers{display:grid;gap:10px}
.ans{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:.6rem;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:.7rem .85rem;width:100%}
.ans:hover{border-color:var(--accent)}
.ans .k{font-family:var(--f-mono);font-weight:600;width:1.8rem;height:1.8rem;display:grid;place-items:center;border-radius:50%;border:1.5px solid var(--line);font-size:.85rem}
.ans.sel{border-color:var(--accent);background:var(--accent-soft)}
.ans.sel .k{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ans.ok{border-color:var(--good);background:var(--good-soft)}
.ans.ok .k{background:var(--good);color:var(--surface);border-color:var(--good)}
.ans.ko{border-color:var(--bad);background:var(--bad-soft)}
.ans.ko .k{background:var(--bad);color:var(--surface);border-color:var(--bad)}
.ans[disabled]{cursor:default}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.ctrl .row{gap:8px}
.flagon{color:var(--flag);border-color:var(--flag);background:var(--flag-soft)}
.explain{border-left:3px solid var(--accent);padding:.4rem 0 .4rem .8rem;font-size:.93rem;display:grid;gap:4px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 74px);display:grid;gap:12px}
.navgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.nb{font-family:var(--f-mono);font-size:.72rem;aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:0;position:relative;max-width:100%}
.nb.a{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nb.cur{outline:2px solid var(--ink);outline-offset:1px}
.nb.f::after{content:"";position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:var(--flag)}
.nb.ok{background:var(--good);border-color:var(--good);color:var(--surface)}
.nb.ko{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.78rem;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.sw{width:10px;height:10px;border-radius:2px;border:1px solid var(--line);display:inline-block}
.counts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.counts b{display:block;font-family:var(--f-mono);font-size:1.1rem}
.counts small{color:var(--muted);font-size:.72rem}

/* result */
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(3rem,10vw,4.6rem);line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:.35em;color:var(--muted);font-weight:600}
.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.tally div{background:var(--sunk);border-radius:8px;padding:10px}
.tally b{display:block;font-family:var(--f-mono);font-size:1.3rem}
.tally .g b{color:var(--good)}.tally .r b{color:var(--bad)}
.formula{font-family:var(--f-mono);font-size:.82rem;color:var(--muted)}
.bars{display:grid;gap:10px}
.barrow{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:.88rem}
.stackbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);margin-top:4px}
.stackbar i{display:block;height:100%}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters .btn{padding:.35rem .7rem;font-size:.85rem}
.filters .btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.rev{display:grid;gap:12px}
.revq{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface);display:grid;gap:10px}
.revq .ans{padding:.45rem .7rem;font-size:.92rem}
.status{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;padding:.1rem .5rem;border-radius:4px}
.status.ok{color:var(--good);background:var(--good-soft)}.status.ko{color:var(--bad);background:var(--bad-soft)}.status.bl{color:var(--muted);background:var(--sunk)}
a{color:var(--accent)}

/* modal */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:16px;z-index:20}
.modal{max-width:440px;width:100%;display:grid;gap:14px}

@media (max-width:820px){
  .modes,.grid2{grid-template-columns:1fr}
  .qlayout{grid-template-columns:1fr}
  .rail{position:static}
  .score{grid-template-columns:1fr}
  .tally{grid-template-columns:repeat(2,minmax(0,1fr))}
  .barrow{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script type="application/json" id="db">{"topics":["EU legislation, Frontex, EU institutions and geopolitical awareness","Fundamental Rights and their implementation in the law enforcement sector","Professionalism, integrity, responsibility and ethical values","Leadership and resource management","ICT Knowledge"],"subs":["EU legislation related to Frontex, coast guard functions and return","Awareness of geopolitical situation","EU institutions and bodies","Staff Regulations","EU priorities","Fundamental Rights and their implementation in the law enforcement sector","Codes of Conduct and Policy documents","Ethics in law enforcement","Police leadership","Microsoft Office (Word, Excel, PowerPoint, Outlook)"],"sources":["EBCG Regulation (EU) 2019/1896","Technical and Operational Strategy for European Integrated Border Management 2023-2027 (EIBM Strategy)","Frontex Capability Roadmap","Frontex Annual Risk Analysis 2025-2026","Frontex website","MBD 6/2025 on EBCG Standing Corps profiles for 2026","European cooperation on coast guard functions","EU's geopolitical situation - The cost for EU Member States of proximity to war","Research Study on Polycrisis - Its influence on trust and legitimacy of Policing and Border Security (Frontex)","Schengen Borders Code (Regulation (EU) 2016/399, consolidated 12.10.2025)","Schengen Borders and visa (DG HOME page)","Pact on Migration and Asylum","European Internal Security Strategy 2025 (ProtectEU, COM(2025) 148)","Agencies - European Commission (DG HOME)","Staff Regulations of Officials and CEOS of the EU (Regulation No 31 (EEC), 11 (EAEC))","European Union priorities 2024-2029","Types of institutions, bodies and agencies (european-union.europa.eu)","EU budget 2028-2034 (Commission proposal for the next MFF)","Charter of Fundamental Rights of the EU","1951 Convention and 1967 Protocol Relating to the Status of Refugees (UNHCR)","SOLAS Convention (IMO)","SAR Convention 1979 (IMO)","Fundamental rights at Frontex","Code of Conduct for Return Operations and Return Interventions coordinated or organised by Frontex","Code of Conduct for all persons participating in Frontex operational activities","MBD 16/2019 Frontex policy on protecting the dignity of the person and preventing psychological and sexual harassment","Ethics in Law Enforcement – Open Textbook, Chapters 7.5 and 7.6","Campbell, I. & Kodz, J. (2011) What makes great police leadership? A Rapid Evidence Review, NPIA","Microsoft 365 Training"],"q":[["Q0001",0,0,0,"Art. 1",0,"Under Regulation (EU) 2019/1896, which of the following is NOT stated in Article 1 as an aim or effect of establishing the European Border and Coast Guard?",["Harmonising the conditions for granting international protection in the Member States","Increasing the efficiency of the Union return policy in full respect of fundamental rights","Ensuring a high level of internal security within the Union while safeguarding free movement","Contributing to the detection, prevention and combating of cross-border crime at the external borders"],0,"Article 1 refers to efficient border management, an efficient return policy, internal security and combating cross-border crime; harmonising asylum conditions is not one of its stated aims.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0002",0,0,0,"Art. 2(7)",1,"Under Regulation (EU) 2019/1896, how is 'situational awareness' defined?",["The ability to perform actions aimed at countering illegal cross-border activities, including the means and timelines to react adequately","An aggregation of geo-referenced near-real-time data from authorities, sensors and platforms, shared over secured channels","The capacity to analyse migratory trends, volume and routes towards and within the Union in order to develop a pre-warning mechanism","The ability to monitor, detect, identify, track and understand illegal cross-border activities to find reasoned grounds for reaction measures"],3,"Art. 2(7) defines situational awareness as the ability to monitor, detect, identify, track and understand illegal cross-border activities to find reasoned grounds for reaction measures, and to reduce loss of migrants' lives.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0003",0,0,0,"Art. 2(9)",0,"Under Regulation (EU) 2019/1896, what is EUROSUR defined as?",["The Agency-operated database of false and authentic travel documents shared with the national authorities of the Member States","The network of immigration liaison officers deployed by the Member States and the Agency in third countries of origin and transit","The framework for information exchange and cooperation between the Member States and the European Border and Coast Guard Agency","The Agency's integrated platform for managing return operations and the return case management systems of the Member States"],2,"Art. 2(9) defines EUROSUR as the framework for information exchange and cooperation between the Member States and the Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0004",0,0,0,"Art. 2(12)",1,"Under Regulation (EU) 2019/1896, what does 'cross-border crime' mean?",["Any offence committed by a third-country national within the territory of a Member State after an unauthorised entry","Any serious crime with a cross-border dimension committed or attempted at, along or in the proximity of the external borders","Any crime listed in the Europol mandate that involves two or more Member States or a Member State and a third country","Any unauthorised crossing of the external borders outside border crossing points or outside their fixed opening hours"],1,"Art. 2(12) defines cross-border crime as any serious crime with a cross-border dimension committed or attempted at, along or in the proximity of the external borders.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0005",0,0,0,"Art. 2(13)",0,"Under Regulation (EU) 2019/1896, what is the 'pre-frontier area'?",["The strip of land within the territory of a Member State, adjacent to the external border, in which border surveillance patrols operate","The geographical area beyond the external borders which is relevant for managing them through risk analysis and situational awareness","The international transit area of an airport or port situated before the point at which border checks on persons are carried out","The territorial waters and contiguous zone of a Member State adjacent to its maritime external border, as defined in national law"],1,"Art. 2(13) defines the pre-frontier area as the geographical area beyond the external borders relevant for border management through risk analysis and situational awareness.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0006",0,0,0,"Art. 2(16)",2,"Under Regulation (EU) 2019/1896, which staff are included in the definition of 'operational staff' although they are NOT deployable as members of the teams?",["The statutory staff responsible for the functioning of the ETIAS Central Unit","The fundamental rights monitors employed as statutory staff of the Agency","The Agency's liaison officers posted in Member States and in third countries","The forced-return monitors from the pool set up by the Agency for return"],0,"Art. 2(16) includes in operational staff the statutory staff responsible for the ETIAS Central Unit that are not deployable as members of the teams.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0007",0,0,0,"Art. 2(17)-(18)",0,"Under Regulation (EU) 2019/1896, the 'border management teams' are teams formed from the standing corps to be deployed during which activities?",["Return operations and return interventions organised by the Agency in Member States and third countries","Screening, registration and debriefing activities carried out at hotspot areas of the host Member State","Schengen evaluation visits and vulnerability assessment missions at the external borders of Member States","Joint operations at the external borders and rapid border interventions in Member States and third countries"],3,"Art. 2(18) defines border management teams as teams formed from the standing corps for joint operations and rapid border interventions in Member States and third countries.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0008",0,0,0,"Art. 2(20)",0,"Under Regulation (EU) 2019/1896, the 'host Member State' is the Member State:",["From which a staff member is deployed or seconded to the standing corps, and which retains disciplinary authority over that staff member","Which participates in a joint operation, rapid border intervention or return operation by providing technical equipment or staff, without hosting it","Where a joint operation, rapid border intervention, return operation or return intervention takes place or is launched, or a migration management support team is deployed","Which has requested the creation of a hotspot area at its external borders and in which the Commission coordinates the activities of migration management support teams"],2,"Art. 2(20) defines the host Member State; the Member State from which staff are seconded is the 'home Member State' (Art. 2(21)).","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0009",0,0,0,"Art. 2(21)",0,"Under Regulation (EU) 2019/1896, what is the 'home Member State'?",["The Member State in which a joint operation or rapid border intervention takes place or from which it is launched","The Member State which first registered the third-country national concerned in Eurodac upon irregular entry","The Member State from which a staff member is deployed or seconded to the standing corps","The Member State whose border guards are in command during the period of deployment of the teams"],2,"Art. 2(21) defines the home Member State as the Member State from which a staff member is deployed or seconded to the standing corps.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0010",0,0,0,"Art. 2(26)",0,"Under Regulation (EU) 2019/1896, who is a 'returnee'?",["Any third-country national whose application for international protection is still pending at first instance","An illegally staying third-country national who is the subject of an enforceable return decision","A Union citizen or family member returning to the Member State of nationality after expulsion from a third country","Any third-country national refused entry at a border crossing point under the Schengen Borders Code"],1,"Art. 2(26) defines a returnee as an illegally staying third-country national subject to an enforceable return decision.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0011",0,0,0,"Art. 2(27)",1,"Under Regulation (EU) 2019/1896, which statement correctly reflects the definition of 'return operation'?",["It is organised or coordinated by the Agency and returnees may be returned on a forced or voluntary basis, by any means of transport","It is organised solely by a Member State, with Agency financing, and covers only forced returns carried out by charter flights","It is organised by a third country of return, which provides both the means of transport and the return escorts for the returnees","It covers only assisted voluntary departures financed by the Agency, excluding any forced return of illegally staying persons"],0,"Art. 2(27) defines a return operation as organised or coordinated by the Agency, returning returnees on a forced or voluntary basis irrespective of the means of transport.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0012",0,0,0,"Art. 2(28)",2,"Under Regulation (EU) 2019/1896, what does a 'return intervention' consist of?",["The issuing of return decisions by the Agency on behalf of a Member State whose return system faces disproportionate pressure","The deployment of migration management support teams at hotspot areas to assist with screening and fingerprinting of migrants","The monitoring of forced-return operations by the pool of forced-return monitors from the pre-departure phase to the hand-over","The deployment of return teams and the organisation of return operations, as enhanced technical and operational assistance"],3,"Art. 2(28) defines a return intervention as enhanced technical and operational assistance consisting of the deployment of return teams and the organisation of return operations.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0013",0,0,0,"Art. 3(1)",1,"Under Regulation (EU) 2019/1896, which of the following is a component of European integrated border management under Article 3(1)?",["Controls at internal borders carried out by the Agency where the functioning of the Schengen area is at risk","The harmonisation of national criminal law on migrant smuggling and trafficking in human beings across the Union","The issuing of short-stay visas and airport transit visas at the consulates of Member States in third countries","Search and rescue operations for persons in distress at sea arising during border surveillance operations at sea"],3,"Art. 3(1)(b) lists search and rescue operations launched and carried out in accordance with Regulation (EU) No 656/2014 and international law as a component.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0014",0,0,0,"Art. 3(2)",1,"Under Regulation (EU) 2019/1896, which elements are described as 'overarching components' in the implementation of European integrated border management?",["Risk analysis, vulnerability assessment and situational awareness at the external borders","Border control, return of third-country nationals, and search and rescue operations at sea","Fundamental rights, education and training, and research and innovation","Information exchange, inter-agency cooperation and solidarity"],2,"Art. 3(2) states that fundamental rights, education and training, as well as research and innovation, are overarching components.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0015",0,0,0,"Art. 4",0,"Under Regulation (EU) 2019/1896, which bodies constitute the European Border and Coast Guard?",["The Agency, Europol, EASO and the national authorities responsible for border management of the Member States","The national border management authorities (including coast guards doing border control), the national return authorities and the Agency","The Agency, the Commission's Directorate-General for Migration and Home Affairs and the national coordination centres","The Agency's standing corps, the national police forces of the Member States and the national immigration and asylum authorities"],1,"Art. 4 states that national border management authorities, including coast guards to the extent they carry out border control tasks, national return authorities and the Agency constitute the EBCG.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0016",0,0,0,"Art. 5(2)",0,"Under Regulation (EU) 2019/1896, what is the maximum capacity of the standing corps referred to in Article 5(2)?",["Up to 10 000 operational staff","Up to 1 500 operational staff","Up to 5 000 operational staff","Up to 15 000 operational staff"],0,"Art. 5(2) provides that the Agency includes the standing corps with a capacity of up to 10 000 operational staff in accordance with Annex I.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0017",0,0,0,"Art. 6",0,"Under Regulation (EU) 2019/1896, to which institutions is the Agency accountable?",["The European Parliament and the Council","The Commission only","The Court of Justice and the European Ombudsman","The European Council and the Commission"],0,"Art. 6 provides that the Agency is accountable to the European Parliament and to the Council.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0018",0,0,0,"Art. 7(1)",0,"Under Regulation (EU) 2019/1896, who retains primary responsibility for the management of the sections of the external borders?",["The Agency","The Commission","The Agency and the Member States jointly in equal measure","The Member States"],3,"Art. 7(1) states that Member States retain primary responsibility for the management of their sections of the external borders.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0019",0,0,0,"Art. 7(2)",0,"Under Regulation (EU) 2019/1896, who has sole responsibility for issuing return decisions and adopting measures pertaining to the detention of returnees?",["The Agency's executive director","The Agency jointly with the Member State concerned","The Member States","The third country of return"],2,"Art. 7(2) states that Member States retain sole responsibility for issuing return decisions and adopting detention measures in accordance with Directive 2008/115/EC.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0020",0,0,0,"Art. 7(4)",1,"Under Regulation (EU) 2019/1896, which statement about the Agency and internal borders is correct?",["The Agency may coordinate controls at internal borders where a critical impact level is attributed to a section","The Agency shall not support any measures or be involved in any activities related to controls at internal borders","The Agency may support controls at internal borders at the request of a Member State facing secondary movements","The Agency monitors the reintroduction of internal border controls through its liaison officers in Member States"],1,"Art. 7(4) provides that the Agency shall not support any measures or be involved in any activities related to controls at internal borders.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0021",0,0,0,"Art. 8(2)",1,"Under Regulation (EU) 2019/1896, for what period does the multiannual strategic policy for European integrated border management provide policy priorities and strategic guidelines?",["Three years","Five years","Four years","Seven years"],1,"Art. 8(2) states that it sets out policy priorities and strategic guidelines for a period of five years.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0022",0,0,0,"Art. 8(5)",1,"Under Regulation (EU) 2019/1896, the technical and operational strategy for European integrated border management is established by:",["A management board decision on a proposal from the executive director","A Commission communication after discussion in Parliament and Council","Each Member State through its national strategy, adopted at national level","A Council recommendation adopted on a proposal from the Commission"],0,"Art. 8(5) states the Agency establishes it by a decision of the management board on a proposal from the executive director prepared with the Member States and the Commission.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0023",0,0,0,"Art. 8(7)",2,"Under Regulation (EU) 2019/1896, when must the Commission carry out a thorough evaluation of the implementation of the multiannual strategic policy?",["Two years after its adoption","Five years after its adoption","At the end of each annual planning cycle","Four years after its adoption"],3,"Art. 8(7) requires the evaluation four years after the adoption of the multiannual strategic policy.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0024",0,0,0,"Art. 9(3)",1,"Under Regulation (EU) 2019/1896, which part of a Member State's contingency plan must be jointly prepared with the Agency?",["The entire contingency plan, including the parts that relate to national resources","Only the part concerning return, which is coordinated with neighbouring Member States","The part that requires additional support from the European Border and Coast Guard","Only the part concerning maritime borders and search and rescue in territorial waters"],2,"Art. 9(3) states the part of the contingency plans requiring additional support from the EBCG is jointly prepared by the Member State and the Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0025",0,0,0,"Art. 9(8)",1,"Under Regulation (EU) 2019/1896, which document, approved by the management board, is annexed to the technical and operational strategy?",["The common integrated risk analysis model of the Agency","The EUROSUR Handbook adopted as a Commission recommendation","The capability roadmap of the European Border and Coast Guard","The rolling operational plan for return operations of the Agency"],2,"Art. 9(8) provides that once approved, the capability roadmap is annexed to the technical and operational strategy referred to in Art. 8(5).","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0026",0,0,0,"Art. 10(1)(m)",0,"Under Regulation (EU) 2019/1896, within migration management support teams at hotspot areas, the Agency deploys operational staff and equipment to assist with which activities?",["Examining asylum applications and issuing first-instance decisions","Screening, debriefing, identification and fingerprinting","Issuing return decisions and ordering detention of returnees","Prosecuting migrant smugglers before national courts"],1,"Art. 10(1)(m)(i) refers to assistance in screening, debriefing, identification and fingerprinting.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0027",0,0,0,"Art. 10(1)(o)",0,"Under Regulation (EU) 2019/1896, which pool does the Agency set up under its tasks related to return?",["A pool of forced-return monitors","A pool of national asylum caseworkers","A pool of consular identification officers","A pool of national judges and lawyers"],0,"Art. 10(1)(o) tasks the Agency with setting up a pool of forced-return monitors.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0028",0,0,0,"Art. 10(1)(t)",1,"Under Regulation (EU) 2019/1896, with which agencies does the Agency cooperate to support national authorities carrying out coast guard functions?",["Europol and Eurojust, within their respective mandates","The European Union Asylum Agency (EASO) and the Fundamental Rights Agency","eu-LISA and the European Defence Agency, within their respective mandates","The European Fisheries Control Agency and the European Maritime Safety Agency"],3,"Art. 10(1)(t) provides for cooperation with EFCA and EMSA to support national authorities carrying out coast guard functions.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0029",0,0,0,"Art. 10(1)(ae)",1,"Under Regulation (EU) 2019/1896, which information system does the Agency manage and operate to support Member States in detecting document fraud?",["The Schengen Information System (SIS)","The Visa Information System (VIS)","The European Dactyloscopy database (Eurodac)","False and Authentic Documents Online (FADO)"],3,"Art. 10(1)(ae) tasks the Agency with managing and operating FADO, referred to in Art. 79.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0030",0,0,0,"Art. 10(1)(af)",0,"Under Regulation (EU) 2019/1896, which central unit does the Agency set up and operate under Regulation (EU) 2018/1240?",["The SIRENE Bureau","The Europol Migrant Smuggling Centre","The ETIAS Central Unit","The Entry/Exit System Central Unit"],2,"Art. 10(1)(af) requires the Agency to ensure the setting up and operation of the ETIAS Central Unit.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0031",0,0,0,"Art. 10(1)(n)",0,"Under Regulation (EU) 2019/1896, in assisting Member States at all stages of the return process, the Agency:",["Reviews the legality of return decisions before supporting their enforcement by the Member States","Does not enter into the merits of return decisions, which remain the sole responsibility of Member States","May issue return decisions on behalf of a Member State when that Member State expressly requests it","Decides on administrative appeals lodged by returnees against return decisions in joint operations"],1,"Art. 10(1)(n) provides that assistance is given without entering into the merits of return decisions, which remain the sole responsibility of the Member States.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0032",0,0,0,"Art. 11",0,"Under Regulation (EU) 2019/1896, what duty applies to the Agency and the national border management and return authorities under Article 11?",["A duty to cooperate in good faith and an obligation to exchange information","A duty to obtain Commission approval before exchanging operational information","A duty of mutual financial compensation for the costs of joint operations","A duty to share all classified information with neighbouring third countries"],0,"Art. 11 provides for a duty to cooperate in good faith and an obligation to exchange information.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0033",0,0,0,"Art. 13(1)-(2)",1,"Under Regulation (EU) 2019/1896, how many staff members may a Member State designate to be assigned to the Agency as liaison officers representing its national contact point?",["Up to two","Only one","Up to three","Up to five"],0,"Art. 13(2) allows Member States to designate up to two staff members representing their national contact point as liaison officers to the Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0034",0,0,0,"Art. 14(1)(d)",2,"Under Regulation (EU) 2019/1896, up to which classification level may EU classified information be handled in the separate accredited part of the Agency's communication network?",["RESTREINT UE/EU RESTRICTED only","SECRET UE/EU SECRET","TRES SECRET UE/EU TOP SECRET","CONFIDENTIEL UE/EU CONFIDENTIAL"],3,"Art. 14(1)(d) allows handling of EU classified information up to CONFIDENTIEL UE/EU CONFIDENTIAL in a separate, duly accredited part of the network.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0035",0,0,0,"Art. 18",0,"Under Regulation (EU) 2019/1896, EUROSUR is established in order to:",["Store biometric data of all third-country nationals crossing the external borders of the Member States","Process applications for travel authorisation submitted by visa-exempt third-country nationals before travel","Improve situational awareness and increase reaction capability for the purposes of border management","Manage the reimbursement of travel and subsistence costs of staff deployed in Agency operations"],2,"Art. 18 establishes EUROSUR to improve situational awareness and increase reaction capability for border management.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0036",0,0,0,"Art. 19(2)",2,"Under Regulation (EU) 2019/1896, for which purpose shall EUROSUR NOT be used?",["Border checks at authorised border crossing points, including checks on persons and their means of transport","Legal or administrative measures taken once authorities have intercepted criminal activities or unauthorised crossings","Air border surveillance of manned or unmanned aircraft flying to or from the territory of the Member States","Detection, identification and tracking of unauthorised border crossings at sea and the protection of migrants' lives"],1,"Art. 19(2) excludes the use of EUROSUR for legal or administrative measures taken once authorities have intercepted criminal activities or unauthorised crossings.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0037",0,0,0,"Art. 20(1)",1,"Under Regulation (EU) 2019/1896, which of the following is NOT listed as a EUROSUR component?",["National coordination centres","The Schengen Information System","EUROSUR fusion services coordinated by the Agency","Integrated planning as referred to in Article 9"],1,"Art. 20(1) lists NCCs, national, European and specific situational pictures, fusion services and integrated planning; SIS is not a component.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0038",0,0,0,"Art. 21(2)",0,"Under Regulation (EU) 2019/1896, within the framework of EUROSUR, what is the single point of contact for exchange of information with other national coordination centres and the Agency?",["The national coordination centre","The national contact point of the Member State","The Agency's liaison officer in the Member State","The ministry of the interior of the Member State"],0,"Art. 21(2) states the NCC is the single point of contact within EUROSUR.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0039",0,0,0,"Art. 21(7)",0,"Under Regulation (EU) 2019/1896, what are the operating hours of a national coordination centre?",["Office hours on all working days of the year","Twelve hours a day, seven days a week","Only for the duration of joint operations","Twenty-four hours a day, seven days a week"],3,"Art. 21(7) requires the national coordination centre to operate 24/7.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0040",0,0,0,"Art. 24(1)",1,"Under Regulation (EU) 2019/1896, which three information layers make up the situational pictures?",["A national layer, a European layer and a specific layer","A sensor layer, a communication layer and a command-and-control layer","An events layer, an operational layer and an analysis layer","A risk layer, an impact-level layer and a reaction capability layer"],2,"Art. 24(1) lists the events layer, the operational layer and the analysis layer.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0041",0,0,0,"Art. 25(3)",2,"Under Regulation (EU) 2019/1896, which impact levels may a national coordination centre attribute to each incident in the events layer of the national situational picture?",["Low, medium, high and critical","Green, amber and red","Low, medium, high and very high","Minor, significant and decisive"],2,"Art. 25(3) provides a single indicative impact level ranging from 'low' and 'medium' to 'high' and 'very high' for incidents, all of which are shared with the Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0042",0,0,0,"Art. 27(3)",2,"Under Regulation (EU) 2019/1896, according to which principle must information in specific situational pictures be shared?",["The principle of availability","The principle of originator's consent","The principle of mutual recognition","The need-to-share principle without restrictions"],1,"Art. 27(3) requires sharing in accordance with the principle of originator's consent.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0043",0,0,0,"Art. 28(3)",1,"Under Regulation (EU) 2019/1896, may the Agency refuse a request from a national coordination centre for EUROSUR fusion services?",["Yes, for technical, financial or operational reasons, notifying the reasons in due time","No, the Agency must always comply with such requests","Yes, but only with the prior consent of the Commission and after informing the management board","Yes, but only if the requesting Member State has a low impact level on all sections"],0,"Art. 28(3) allows refusal for technical, financial or operational reasons with notification of the reasons in due time.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0044",0,0,0,"Art. 29(1)",1,"Under Regulation (EU) 2019/1896, how is the common integrated risk analysis model established?",["By a Commission implementing act under the examination procedure","By agreement among all the national coordination centres in EUROSUR","By the European Parliament and the Council on a proposal from the Commission","By management board decision on a proposal from the executive director"],3,"Art. 29(1) provides that the CIRAM is established by a decision of the management board based on a proposal from the executive director.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0045",0,0,0,"Art. 30",1,"Under Regulation (EU) 2019/1896, how does each Member State divide its external borders for the purposes of the Regulation?",["Into sections defined by the Agency on the basis of its risk analysis and vulnerability assessment","Into sections corresponding to the operational areas of the joint operations coordinated by the Agency","Into land and sea sections only, since air borders are excluded from the division into sections","Into land, sea and, where the Member State so decides, air border sections notified to the Agency"],3,"Art. 30 requires land, sea and, where the Member State so decides, air border sections, notified to the Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0046",0,0,0,"Art. 31(1)",1,"Under Regulation (EU) 2019/1896, how many Member States may a single Agency liaison officer cover at most?",["Only one Member State, in which the liaison officer is based","Up to two neighbouring Member States sharing a land border","Up to four Member States geographically close to each other","Up to six Member States belonging to the same regional network"],2,"Art. 31(1) allows a liaison officer to cover up to four geographically close Member States.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0047",0,0,0,"Art. 31(7)",0,"Under Regulation (EU) 2019/1896, from whom do the Agency's liaison officers in Member States take instructions?",["From the host Member State's national contact point","Only from the Agency","From the national coordination centre","Jointly from the Agency and the Member State concerned"],1,"Art. 31(7) states that liaison officers take instructions only from the Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0048",0,0,0,"Art. 32(2)",1,"Under Regulation (EU) 2019/1896, what is the minimum frequency with which each Member State must be subject to monitoring and assessment under the vulnerability assessment?",["At least once every three years","At least once every five years","At least twice a year","Only when a high impact level is attributed"],0,"Art. 32(2): assessment at least once a year unless decided otherwise, but each Member State at least once every three years.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0049",0,0,0,"Art. 32(10)",2,"Under Regulation (EU) 2019/1896, what happens if a Member State fails to implement the measures recommended by the executive director following a vulnerability assessment within the time limit?",["The matter goes to the management board, which adopts a binding decision setting out measures and a time limit","The Commission immediately reintroduces internal border controls with that Member State for up to six months","The Agency automatically launches a rapid border intervention without the agreement of the Member State","The executive director imposes a financial penalty on the Member State and withholds Union funding"],0,"Art. 32(10) requires referral to the management board, whose decision is binding on the Member State; non-compliance may lead to action under Art. 42.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0050",0,0,0,"Art. 34(1)-(2)",1,"Under Regulation (EU) 2019/1896, when is a 'critical' impact level temporarily attributed to an external border section?",["When incidents at that section have a significant impact on border security and reinforced border control measures are required","When the national coordination centre records incidents classified as 'very high' in the events layer for three consecutive months","When the Member State has failed to submit its contingency plan or national capability development plan to the Agency in time","When incidents have a decisive impact on border security to the extent that they risk jeopardising the functioning of the Schengen area"],3,"Art. 34(2) provides for a temporary critical level where incidents have a decisive impact risking the functioning of the Schengen area, in agreement with the Member State.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0051",0,0,0,"Art. 37(2)",0,"Under Regulation (EU) 2019/1896, a rapid border intervention may be deployed at the request of a Member State facing:",["A lack of trained staff and equipment to carry out the border control tasks assessed in its most recent Schengen evaluation","Serious delays in the processing of visa applications at its consulates following a sudden rise in demand from third countries","Specific and disproportionate challenges, especially the arrival of large numbers of third-country nationals seeking unauthorised entry","A serious threat to internal security requiring the temporary reintroduction of controls at its internal borders with neighbours"],2,"Art. 37(2) refers to specific and disproportionate challenges, especially large numbers of third-country nationals arriving without authorisation.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0052",0,0,0,"Art. 38(3)",1,"Under Regulation (EU) 2019/1896, on whom is the operational plan for a joint operation binding?",["Only the host Member State, which issues instructions to the teams","The Agency, the host Member State and the participating Member States","Only the Agency, which drew up the plan through its executive director","The Agency and the Commission, which monitors its implementation"],1,"Art. 38(3) states that the operational plan is binding on the Agency, the host Member State and the participating Member States.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0053",0,0,0,"Art. 39(5)",1,"Under Regulation (EU) 2019/1896, within what time must the executive director decide on a request to launch a rapid border intervention?",["Within five working days from receipt of the request","Within two working days from receipt of the request","Within 24 hours from the receipt of the request","Within ten working days from receipt of the request"],1,"Art. 39(5) requires a decision within two working days from the date of receipt of the request.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0054",0,0,0,"Art. 39(8) and (14)",2,"Under Regulation (EU) 2019/1896, in a rapid border intervention, by when must the first border management teams redeployed from other areas be deployed?",["No later than five working days after the operational plan is agreed","No later than three working days after the request has been received","No later than 12 working days after the decision to launch the intervention","No later than ten working days after the management board is informed"],0,"Art. 39(14) sets five working days after agreement of the operational plan for first deployment, and 12 working days for additional teams; the plan itself is agreed within three working days of the decision (Art. 39(8)).","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0055",0,0,0,"Art. 40(1)-(3)",1,"Under Regulation (EU) 2019/1896, who is responsible for coordinating the activities of the migration management support teams at the hotspot area?",["The Agency's executive director","EASO","The host Member State's national coordination centre","The Commission"],3,"Art. 40(3) states the Commission establishes the terms of cooperation and is responsible for coordinating the activities of the migration management support teams.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0056",0,0,0,"Art. 41(2)",1,"Under Regulation (EU) 2019/1896, within how many working days must a Member State respond to the executive director's recommendation under Article 41?",["Two working days","Ten working days","Six working days","Thirty days"],2,"Art. 41(2) requires a response within six working days, with justifications in case of a negative response.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0057",0,0,0,"Art. 42(1)",1,"Under Regulation (EU) 2019/1896, who adopts the decision identifying measures in a situation at the external borders requiring urgent action?",["The management board, on a proposal from the executive director","The European Parliament and the Council jointly, under the ordinary legislative procedure","The Council, by an implementing act on a proposal from the Commission","The Commission, after consulting the European Parliament"],2,"Art. 42(1) provides that the Council, on a Commission proposal, may adopt a decision by means of an implementing act.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0058",0,0,0,"Art. 42(10)",2,"Under Regulation (EU) 2019/1896, if a Member State does not comply with the Council decision under Article 42 within 30 days and does not cooperate with the Agency, what may the Commission do?",["Bring infringement proceedings against the Member State directly before the General Court","Trigger the procedure under Article 29 of Regulation (EU) 2016/399 (Schengen Borders Code)","Suspend the voting rights of that Member State's representative in the Agency's management board","Order the Agency to take over the command of border control operations in that Member State"],1,"Art. 42(10) allows the Commission to trigger the procedure of Art. 29 of Regulation (EU) 2016/399.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0059",0,0,0,"Art. 43(1)",1,"Under Regulation (EU) 2019/1896, during deployment of the teams in a Member State, who issues instructions to the teams?",["The host Member State, in line with the operational plan","The coordinating officer appointed by the Agency's executive director","The home Member State of each team member, via its national contact point","The fundamental rights officer, in consultation with the coordinating officer"],0,"Art. 43(1) states the host Member State issues instructions in accordance with the operational plan; the Agency may communicate its views via the coordinating officer (Art. 43(2)).","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0060",0,0,0,"Art. 43(5)",1,"Under Regulation (EU) 2019/1896, members of the teams who are NOT statutory staff remain subject to the disciplinary measures of:",["The host Member State","The Agency's executive director","The European Ombudsman","Their home Member State"],3,"Art. 43(5) provides that non-statutory team members remain subject to the disciplinary measures of their home Member State.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0061",0,0,0,"Art. 44(3)",1,"Under Regulation (EU) 2019/1896, who must assist and advise the coordinating officer of a joint operation or rapid border intervention?",["The national contact point of the host Member State","A representative of the Commission","A forced-return monitor","At least one fundamental rights monitor"],3,"Art. 44(3) states that at least one fundamental rights monitor assists and advises the coordinating officer.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0062",0,0,0,"Art. 45(1)",2,"Under Regulation (EU) 2019/1896, which of the following costs of Member States' staff deployed for a short term is NOT among those the Agency fully covers under Article 45(1)?",["Travel costs","Costs related to vaccinations","The basic salary of the deployed officer","Daily subsistence allowances, including accommodation"],2,"Art. 45(1) lists travel, vaccinations, special insurance, health care and daily subsistence allowances; basic salary is not listed.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0063",0,0,0,"Art. 46(4)",1,"Under Regulation (EU) 2019/1896, before withdrawing financing or suspending an activity because of serious or likely persistent violations of fundamental rights, the executive director must:",["Obtain the prior consent of the host Member State and of the participating Member States","Consult the fundamental rights officer and inform the Member State concerned","Obtain a prior opinion of the Court of Justice on the existence of the violations","Obtain the approval of the European Parliament's Committee on Civil Liberties"],1,"Art. 46(4) requires consulting the fundamental rights officer and informing the Member State concerned.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0064",0,0,0,"Art. 47",1,"Under Regulation (EU) 2019/1896, within what period after the end of the Agency's operational activities must detailed evaluation reports be transmitted to the management board?",["Within 60 days","Within 30 days","Within 90 days","Within six months"],0,"Art. 47 requires transmission within 60 days following the end of the activities, together with the observations of the fundamental rights officer.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0065",0,0,0,"Art. 48(1)(a)(ii)",2,"Under Regulation (EU) 2019/1896, when assisting in the acquisition of travel documents for return, which information must the Agency NOT disclose?",["That an application for international protection has been made","The nationality of the returnee as established by the Member State","The date and destination of the planned return operation by charter","The identity of the returnee as recorded in the return decision"],0,"Art. 48(1)(a)(ii) prohibits disclosing that an application for international protection has been made or other unnecessary information.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0066",0,0,0,"Art. 49(1)",2,"Under Regulation (EU) 2019/1896, which personal data may be transmitted to the Agency's integrated return management platform for the coordination or organisation of return operations?",["Full case files including the asylum history of returnees, transmitted at any stage of the return procedure","Biometric data and travel documents of returnees, stored on the platform for five years after the operation","Criminal records and police data of returnees, transmitted on request of the Agency for risk assessment","Only biographic data or passenger lists, once a decision to launch a return operation has been taken"],3,"Art. 49(1): personal data only include biographic data or passenger lists, transmitted once a decision to launch the operation is taken and erased when it ends.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0067",0,0,0,"Art. 50(2)",0,"Under Regulation (EU) 2019/1896, before the return of any returnee, which system must deployed members of the teams consult to check whether the return decision has been suspended or postponed?",["The Visa Information System","Eurodac","The Schengen Information System","The European Criminal Records Information System"],2,"Art. 50(2) requires team members to consult the SIS prior to the return of any returnee.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0068",0,0,0,"Art. 50(3)",1,"Under Regulation (EU) 2019/1896, what is a 'collecting return operation'?",["A return operation in which the Agency collects returnees from several hotspot areas of one host Member State","A return operation for which the means of transport and return escorts are provided by a third country of return","A voluntary return operation financed jointly by several Member States and coordinated by the Agency","A return operation by scheduled flights in which returnees from several Member States are collected at one hub"],1,"Art. 50(3) defines collecting return operations as those where the third country of return provides the means of transport and escorts.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0069",0,0,0,"Art. 50(7)",1,"Under Regulation (EU) 2019/1896, how often must the executive director transmit a detailed evaluation report covering all return operations?",["Every three months","Every six months","Once a year","Within 60 days after each operation"],1,"Art. 50(7) requires a detailed evaluation report every six months covering all return operations of the previous semester.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0070",0,0,0,"Art. 50(8)",2,"Under Regulation (EU) 2019/1896, when financing return operations, to which operations does the Agency give priority?",["Those conducted by more than one Member State, or from hotspot areas","Those conducted by Member States having a section with a critical impact level","Assisted voluntary return operations only, as a matter of priority","Those using chartered aircraft rather than scheduled commercial flights"],0,"Art. 50(8) gives priority to return operations conducted by more than one Member State, or from hotspot areas.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0071",0,0,0,"Art. 51(1)",1,"Under Regulation (EU) 2019/1896, from where does the Agency constitute the pool of forced-return monitors?",["Member State bodies carrying out forced-return monitoring under the Return Directive","Exclusively the Agency's statutory staff recruited for the standing corps of the Agency","UNHCR and IOM experts accredited by the consultative forum for return monitoring","National liaison officers seconded to the Agency's headquarters for return matters"],0,"Art. 51(1) provides that the pool is constituted from competent bodies of the Member States carrying out forced-return monitoring under Art. 8(6) of the Return Directive, after taking due account of the FRO's opinion.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0072",0,0,0,"Art. 51(3)",2,"Under Regulation (EU) 2019/1896, at least how far in advance must the Agency request Member States to make forced-return monitors available for a rapid return intervention?",["Ten working days","Five working days","21 working days","30 calendar days"],1,"Art. 51(3): the request must be made at least 21 working days before the deployment, or five working days in the case of a rapid return intervention.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0073",0,0,0,"Art. 51(4)",0,"Under Regulation (EU) 2019/1896, what must the Agency make available for any return operation involving children?",["A representative of UNICEF participating as an accredited observer on board","A deputy fundamental rights officer personally present on board the flight","Forced-return monitors with specific expertise in child protection","A national guardian appointed by the host Member State for each child"],2,"Art. 51(4) requires forced-return monitors with specific expertise in child protection for any return operation involving children.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0074",0,0,0,"Art. 51(5)",1,"Under Regulation (EU) 2019/1896, to which disciplinary measures are Member State forced-return monitors subject during a return operation?",["Those of the host Member State where the operation starts","Those adopted by the Agency's management board","Those set out in the Agency's Staff Regulations","Those of their home Member State"],3,"Art. 51(5): forced-return monitors remain subject to the disciplinary measures of their home Member State; statutory staff are subject to the Staff Regulations.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0075",0,0,0,"Art. 53(4)",2,"Under Regulation (EU) 2019/1896, within what time limit must the executive director take a decision on the operational plan for a rapid return intervention?",["Within five working days","Within two working days","Within ten working days","Within 21 working days"],0,"Art. 53(4): the decision is taken as soon as possible and, for a rapid return intervention (para. 2), within five working days.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0076",0,0,0,"Art. 53(1)-(2)",1,"Under Regulation (EU) 2019/1896, what triggers a rapid return intervention rather than an ordinary return intervention?",["A Member State facing a burden in implementing its obligation to return returnees","A Member State facing specific and disproportionate return challenges","A Council implementing decision finding a serious deficiency in return","A request from a third country of return to accelerate readmission procedures"],1,"Art. 53(2) links rapid return interventions to 'specific and disproportionate challenges', whereas Art. 53(1) refers to a 'burden'.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0077",0,0,0,"Art. 54(1)(a)",0,"Under Regulation (EU) 2019/1896, which category of the standing corps consists of the Agency's statutory staff?",["Category 2","Category 3","Category 1","Category 4"],2,"Art. 54(1)(a): category 1 is statutory staff deployed as team members, plus staff of the ETIAS Central Unit.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0078",0,0,0,"Art. 54(1)(d)",0,"Under Regulation (EU) 2019/1896, what does category 4 of the standing corps consist of?",["Staff seconded by Member States to the Agency for a long-term period of 24 months","Member State staff ready to be provided for short-term deployments of four months","Statutory staff working in the ETIAS Central Unit and in supporting functions","A reserve of Member State staff for rapid border interventions"],3,"Art. 54(1)(d) defines category 4 as the reserve for rapid reaction, deployable under Art. 58 for rapid border interventions.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0079",0,0,0,"Art. 54(1)(b)-(c)",0,"Under Regulation (EU) 2019/1896, category 3 of the standing corps consists of:",["Member State staff ready for short-term deployments","Member State staff seconded to the Agency for the long term","Agency statutory staff deployed in operational areas","Member State staff held in reserve for rapid reaction"],0,"Art. 54(1)(c): category 3 is staff from Member States ready to be provided for short-term deployment under Art. 57.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0080",0,0,0,"Art. 54(4)",1,"Under Regulation (EU) 2019/1896, by what date each year must the management board adopt the decision on profiles and numbers of standing corps staff for the following year?",["31 January","31 March","30 June","30 November"],1,"Art. 54(4) requires the management board decision by 31 March of each year.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0081",0,0,0,"Art. 54(7)",2,"Under Regulation (EU) 2019/1896, up to what share of the total standing corps may statutory staff recruited for supportive or monitoring functions account?",["Up to 2 %","Up to 10 %","Up to 4 %","Up to 15 %"],2,"Art. 54(7) allows such statutory staff up to 4 % of the total standing corps in Annex I; under Art. 54(8) they are counted as category 1 but not deployed in teams.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0082",0,0,0,"Art. 54(2)",0,"Under Regulation (EU) 2019/1896, on what condition may members of the standing corps carry out activities in a Member State or third country?",["Only after the adoption of a Council implementing decision on the activity","Only with the prior approval of the European Parliament's LIBE committee","Only after a vulnerability assessment of that country by the Agency","Only with the authorisation of the Member State or third country"],3,"Art. 54(2): such activities shall only be carried out with the authorisation of the Member State or third country concerned.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0083",0,0,0,"Art. 55(7)",1,"Under Regulation (EU) 2019/1896, which of the following is listed as a task requiring executive powers that statutory staff in the teams may perform?",["Escorting third-country nationals subject to forced-return procedures","Issuing return decisions against illegally staying third-country nationals","Deciding on applications for international protection","Prosecuting facilitators of irregular immigration"],0,"Art. 55(7)(i) lists escorting third-country nationals subject to forced-return procedures; the others are not listed.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0084",0,0,0,"Art. 55(7)(g)",2,"Under Regulation (EU) 2019/1896, into which system may statutory staff register fingerprints of persons apprehended for irregular crossing of an external border?",["the Schengen Information System","Eurodac","the Entry/Exit System","the Visa Information System"],1,"Art. 55(7)(g) refers to registering fingerprints in Eurodac under Chapter III of Regulation (EU) No 603/2013.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0085",0,0,0,"Art. 55(3)",1,"Under Regulation (EU) 2019/1896, who bears the cost of the training of statutory staff to be deployed as members of the teams?",["The Member State of the partnership academy","The host Member State of the deployment","The Agency covers the full cost","Costs are shared 50/50 with the Member State of nationality"],2,"Art. 55(3) (and Art. 62(3)) state that the Agency shall cover the full cost of training.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0086",0,0,0,"Art. 55(3)",1,"Under Regulation (EU) 2019/1896, which statutory staff need NOT undergo full border guard or return-related training?",["Those with more than 15 years of prior national border guard service","Those deployed exclusively in third countries under a status agreement","Those appointed as coordinating officers for joint operations","Technical crew operating the Agency's own equipment"],3,"Art. 55(3), third subparagraph, exempts statutory staff acting as technical crew of the Agency's own equipment.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0087",0,0,0,"Art. 55(6)",1,"Under Regulation (EU) 2019/1896, Agency staff not qualified to perform border guard or return tasks may be deployed during joint operations only for:",["Coordination and fundamental rights monitoring, outside the teams","Border surveillance under the supervision of host Member State border guards","Escorting returnees on commercial flights as part of the return teams","Registration of fingerprints in Eurodac under host Member State instructions"],0,"Art. 55(6): such staff are deployed only for coordination, monitoring of fundamental rights and related tasks and do not form part of the teams.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0088",0,0,0,"Art. 56(1)",0,"Under Regulation (EU) 2019/1896, what is the standard duration of an individual long-term secondment (category 2) to the standing corps?",["12 months","24 months","36 months","Four months per calendar year"],1,"Art. 56(1): individual secondments last 24 months and may be prolonged once for another 12 or 24 months.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0089",0,0,0,"Art. 56(4)",2,"Under Regulation (EU) 2019/1896, by what date must the Agency accept or refuse the candidates proposed by Member States for long-term secondment?",["30 June","31 July","15 September","30 November"],2,"Art. 56(4): Member States indicate candidates by 30 June and the Agency accepts or refuses them by 15 September.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0090",0,0,0,"Art. 57(2)",0,"Under Regulation (EU) 2019/1896, for how long must each Member State staff member nominated for short-term deployment be available within a calendar year?",["Up to two months","Up to six months","Up to 12 months","Up to four months"],3,"Art. 57(2): each staff member shall be available for up to four months within a calendar year.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0091",0,0,0,"Art. 57(8)",2,"Under Regulation (EU) 2019/1896, within what period must members of the teams be deployed from each Member State after the executive director's formal request for reinforcement of an ongoing joint operation?",["Within 20 working days","Within five working days","Within ten days","Within 45 days"],0,"Art. 57(8): team members shall be deployed within 20 working days from the formal request, without prejudice to Art. 39.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0092",0,0,0,"Art. 57(9)",2,"Under Regulation (EU) 2019/1896, when a Member State invokes a situation substantially affecting its national tasks, its short-term contributions may not cumulatively exceed:",["One third of its Annex III contribution for that year","Half of its Annex III contribution for that year","One quarter of its Annex II contribution for that year","Its Annex IV contribution for that year"],1,"Art. 57(9): such contributions shall not cumulatively exceed half of the Member State's Annex III contribution for the year.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0093",0,0,0,"Art. 58(1)",1,"Under Regulation (EU) 2019/1896, when may the reserve for rapid reaction (category 4) be activated for a rapid border intervention?",["Whenever the host Member State requests it, irrespective of the other categories","Only after a Council implementing decision under Article 42 of the Regulation","Once category 1, 2 and 3 staff are fully deployed for that intervention","Only when the Annex I capacity of the standing corps exceeds 10 000 staff"],2,"Art. 58(1): the reserve is activated provided that category 1, 2 and 3 staff have already been fully deployed for the intervention.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0094",0,0,0,"Art. 59(1)",1,"Under Regulation (EU) 2019/1896, by when did the Commission have to present a review of the overall number and composition of the standing corps?",["5 December 2021","31 March 2022","29 February 2024","31 December 2023"],3,"Art. 59(1) set 31 December 2023; Art. 59(2) then set 29 February 2024 for any proposals to amend Annexes I-IV.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0095",0,0,0,"Art. 60(4)-(5)",1,"Under Regulation (EU) 2019/1896, who decides on the establishment of an antenna office?",["The management board, on a proposal from the executive director","The executive director alone, after informing the management board","The Commission, after consulting the host Member State concerned","The Council, acting by qualified majority on a Commission proposal"],0,"Art. 60(5) gives the decision to the management board on the ED's proposal, taking into account the Commission's opinion and host agreement (two-thirds majority under Art. 100(2)(c)).","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0096",0,0,0,"Art. 60(7)",1,"Under Regulation (EU) 2019/1896, how often must the executive director report to the management board on the activities of antenna offices?",["Monthly","Quarterly","Twice a year","Annually"],1,"Art. 60(7) requires quarterly reporting, with a separate section in the annual activity report.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0097",0,0,0,"Art. 61(1)(a)",2,"Under Regulation (EU) 2019/1896, financing for Member States under Article 61 for long-term secondments amounts to what share of the reference amount per staff member indicated for year N+2 in Annex II?",["37 % of the reference amount","50 % of the reference amount","100 % of the reference amount","75 % of the reference amount"],2,"Art. 61(1)(a): 100 % of the reference amount multiplied by the number of staff indicated for year N+2 for secondment.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0098",0,0,0,"Art. 61(1)(b)",2,"Under Regulation (EU) 2019/1896, for staff effectively deployed under Articles 57 and 58, Member States receive financing equal to what share of the reference amount?",["25 %","50 %","100 %","37 %"],3,"Art. 61(1)(b) sets 37 % of the reference amount per staff effectively deployed, within Annex III and IV limits.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0099",0,0,0,"Art. 62(2)",0,"Under Regulation (EU) 2019/1896, which training must statutory staff receive before their initial deployment if they are to participate in sea operations?",["Search and rescue","Maritime law enforcement boarding","Fisheries control","Naval gunnery"],0,"Art. 62(2) includes, where they participate in sea operations, training in search and rescue prior to initial deployment.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0100",0,0,0,"Art. 62(6)",1,"Under Regulation (EU) 2019/1896, whom must the Agency consult when drawing up the common core curricula for border guard training?",["CEPOL and Europol, through a joint working group on training","The consultative forum and the fundamental rights officer","The European Parliament and the Council as co-legislators","The European Data Protection Supervisor and the Commission"],1,"Art. 62(6): the common core curricula are drawn up after consulting the consultative forum and the fundamental rights officer.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0101",0,0,0,"Art. 62(10)",1,"Under Regulation (EU) 2019/1896, on the basis of its internal quality control mechanism for training, what must the Agency prepare?",["A biennial training report sent to the European Court of Auditors","A quarterly training report to the fundamental rights officer","An annual evaluation report annexed to the annual activity report","A five-yearly training report addressed to the national parliaments"],2,"Art. 62(10) requires an annual evaluation report annexed to the annual activity report.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0102",0,0,0,"Art. 63(4)",2,"Under Regulation (EU) 2019/1896, where the Agency leases major technical equipment such as aircraft or vessels, the equipment must be:",["Registered in the name of the Agency in Poland","Registered on government service of the Union","Registered in the host Member State of each operation","Registered in a Member State"],3,"Art. 63(4)(b): in the case of leasing, the equipment shall be registered in a Member State.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0103",0,0,0,"Art. 64(8)",1,"Under Regulation (EU) 2019/1896, items in the rapid reaction equipment pool must be sent to the destination no later than how many days after the operational plan is agreed?",["10 days","5 days","20 days","30 days"],0,"Art. 64(8): no later than 10 days after the date on which the operational plan is agreed.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0104",0,0,0,"Art. 64(9)",2,"Under Regulation (EU) 2019/1896, how far in advance must the Agency request the deployment of major technical equipment from Member States?",["At least 21 working days","At least 45 days","At least 30 days","At least 60 days"],1,"Art. 64(9): at least 45 days before deployment of major technical equipment and 30 days for other equipment.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0105",0,0,0,"Art. 64(16)",1,"Under Regulation (EU) 2019/1896, what share of the deployment costs of technical equipment forming part of a Member State's minimum number of items does the Agency finance?",["50 % of the eligible deployment costs","75 % of the eligible deployment costs","100 % of the deployment costs","90 % of the eligible deployment costs"],2,"Art. 64(16): the Agency finances 100 % of the deployment of equipment that forms part of the minimum number of items.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0106",0,0,0,"Art. 67",0,"Under Regulation (EU) 2019/1896, which central unit must the Agency set up and operate?",["The Eurodac Central System","The SIS II Central Unit","The European Migrant Smuggling Centre","The ETIAS Central Unit"],3,"Art. 67: the Agency ensures the setting-up and operation of the ETIAS Central Unit under Art. 7 of Regulation (EU) 2018/1240.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0107",0,0,0,"Art. 68(2)",1,"Under Regulation (EU) 2019/1896, working arrangements between the Agency and other Union bodies or international organisations are subject to:",["The Commission's prior approval","The European Parliament's consent","The Council's unanimous approval","An opinion of the Court of Justice"],0,"Art. 68(2): such arrangements are subject to the Commission's prior approval; the Agency informs the EP and the Council.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0108",0,0,0,"Art. 69(1)",0,"Under Regulation (EU) 2019/1896, together with which two agencies does Frontex support national authorities carrying out coast guard functions?",["EASA and eu-LISA","EFCA and EMSA","Europol and Eurojust","EASO and FRA"],1,"Art. 69(1): the Agency cooperates with the European Fisheries Control Agency and the European Maritime Safety Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0109",0,0,0,"Art. 69(2)",1,"Under Regulation (EU) 2019/1896, who approves the working arrangement setting out the precise forms of European cooperation on coast guard functions?",["The Commission, by means of a delegated act adopted after consulting EFCA and EMSA","The Council, acting on a joint proposa
