n takes effect","Two months from the date the suspension takes effect","One year from the date of the alleged misconduct","Three months from the opinion of the Disciplinary Board"],0,"Annex IX, Art. 24(2) SR requires definitive settlement within six months; otherwise full remuneration resumes, save the criminal-custody exception.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0625",0,3,14,"SR Annex IX, Art. 27",2,"Under Annex IX to the EU Staff Regulations, after how long may an official request deletion from his personal file of a written warning or reprimand?",["One year","Eighteen months","Ten years","Three years"],3,"Annex IX, Art. 27 SR allows a request after three years for a written warning or reprimand and after six years for other penalties (except removal from post).","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0626",0,3,14,"SR Art. 90(1)",1,"Under Article 90(1) of the EU Staff Regulations, if the Appointing Authority does not reply to a request within four months, this constitutes:",["An implied decision granting the request in full","An automatic referral of the request to the Court of Justice","An implied decision rejecting the request, open to a complaint","A suspension of the request until the Staff Committee gives its opinion"],2,"Art. 90(1) SR: absence of a reply within four months is deemed an implied decision rejecting the request, against which a complaint may be lodged under Art. 90(2).","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0627",0,3,14,"SR Art. 90(2)",0,"Under Article 90(2) of the EU Staff Regulations, within what time limit must a complaint against an act adversely affecting a person be lodged?",["One month","Three months","Two months","Fifteen working days"],1,"Art. 90(2) SR requires the complaint to be lodged within three months.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0628",0,3,14,"SR Art. 91(2)-(3)",1,"Under Article 91 of the EU Staff Regulations, an appeal to the Court of Justice of the EU normally lies only if:",["The Staff Committee has given a favourable opinion, and the appeal is filed within one month","A timely Article 90(2) complaint was rejected, and the appeal is filed within three months","The European Ombudsman has first examined the case, and the appeal is filed within six months","The Disciplinary Board has delivered its opinion, and the appeal is filed within two months"],1,"Art. 91(2)-(3) SR requires a prior Art. 90(2) complaint rejected expressly or impliedly, with the appeal filed within three months.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0629",0,3,14,"CEOS Art. 1",0,"Under Article 1 of the Conditions of Employment of Other Servants (CEOS), which of the following is a category of servant covered?",["Special advisers","Seconded national experts","Trainees","Interim agency workers"],0,"Art. 1 CEOS covers temporary staff, contract staff, local staff, special advisers and accredited parliamentary assistants.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0630",0,3,14,"CEOS Art. 2(f)",1,"Under Article 2(f) of the CEOS, 'temporary staff' includes staff engaged to fill a post classified as temporary in the list of posts of an agency, EXCEPT:",["Staff in function group AST/SC and staff assigned to purely clerical or secretarial duties","Staff working in agencies whose seat is located outside Brussels and Luxembourg","Staff recruited through an external selection procedure organised by EPSO for the agency","Heads and deputy heads of agencies, and officials seconded to an agency in the service's interest"],3,"Art. 2(f) CEOS excludes heads and deputy heads of agencies referred to in the founding act and officials seconded in the interests of the service to an agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0631",0,3,14,"CEOS Art. 8",1,"Under Article 8 of the CEOS, a fixed-period contract of temporary staff under Article 2(a) or 2(f) may be renewed:",["Up to three times for fixed periods of up to two years each, then no further renewal","Only for an indefinite period, never for a further fixed period of any length","Only once for a fixed period; any further renewal is for an indefinite period","Not at all; a new selection procedure must always be organised before re-engagement"],2,"Art. 8 CEOS: such contracts may be renewed not more than once for a fixed period, and any further renewal shall be for an indefinite period.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0632",0,3,14,"CEOS Art. 8",2,"Under Article 8 of the CEOS, temporary staff under Article 2(b) or 2(d) may not be engaged for more than how long, with what possible renewal?",["Six years, renewable once for four years","Two years, renewable twice for one year each","Four years, renewable once for up to two years","Five years, renewable once for five years"],2,"Art. 8 CEOS limits 2(b)/(d) engagement to four years, renewable not more than once for a maximum of two years if provided for in the initial contract.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0633",0,3,14,"CEOS Art. 3a(1)",1,"Under Article 3a of the CEOS, 'contract staff' are staff:",["Assigned to a permanent post in the establishment plan of the institution for a fixed period","Not assigned to a post in the list of posts, engaged e.g. in agencies or for support tasks","Seconded from national administrations to an institution for a period of up to four years","Engaged locally outside the EU for manual or service duties according to local practice"],1,"Art. 3a(1) CEOS defines contract staff as staff not assigned to a post in the list of posts, engaged in an institution for manual or administrative support tasks, in agencies, other entities, Representations and Delegations.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0634",0,3,14,"CEOS Art. 3a(2)",2,"Under Article 3a(2) of the CEOS, the Commission reports yearly on whether the number of contract staff in agencies, delegations and similar entities has remained within what limit?",["75 % of all employees","50 % of all employees","25 % of all employees","90 % of all employees"],0,"Art. 3a(2) CEOS refers to a limit of 75 % of all employees in agencies, other entities inside the EU, Representations and Delegations and entities outside the EU respectively.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0635",0,3,14,"CEOS Arts 3b and 88(b)",1,"Under Articles 3b and 88 of the CEOS, the actual period of employment of contract staff for auxiliary tasks within an institution, including renewals, shall not exceed:",["Three years","Four years","Eight years","Six years"],3,"Art. 88(b) CEOS limits employment of Art. 3b contract staff in an institution to six years including renewals.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0636",0,3,14,"CEOS Art. 80(2)",0,"Under Article 80 of the CEOS, contract staff in function group IV (grades 13 to 18) perform which type of duties?",["Manual and administrative support service tasks under supervision","Clerical and secretarial tasks, office management and equivalent tasks","Executive tasks, drafting, accountancy and equivalent technical tasks","Administrative, advisory, linguistic and equivalent technical tasks"],3,"Art. 80(2) CEOS assigns to FG IV administrative, advisory, linguistic and equivalent technical tasks, performed under the supervision of officials or temporary staff.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0637",0,3,14,"CEOS Art. 80(1)-(2)",0,"Under Article 80 of the CEOS, into how many function groups is contract staff subdivided, and which corresponds to manual and administrative support service tasks?",["Three; function group III","Four; function group IV","Four; function group I","Five; function group II"],2,"Art. 80 CEOS sets four function groups; FG I (grades 1 to 3) covers manual and administrative support service tasks.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0638",0,3,14,"CEOS Art. 85(1)",1,"Under Article 85 of the CEOS, contracts of contract staff under Article 3a may be concluded for a fixed period of:",["At least one year and at most three years, renewable twice for up to three years each","At least three months and at most five years, renewable once for up to five years","At least six months and at most four years, not renewable under any circumstances","At least one month and at most two years, renewable without any limit on the number"],1,"Art. 85(1) CEOS: fixed period of at least three months and not more than five years, renewable once for not more than five years; any further renewal is indefinite.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0639",0,3,14,"CEOS Art. 82(2)(c)",1,"Under Article 82 of the CEOS, what minimum education is required for recruitment to contract staff function group IV?",["Completed university studies of at least three years attested by a diploma","Successful completion of compulsory education, with no diploma required","Post-secondary education attested by a diploma, or secondary plus experience","A doctorate or equivalent research qualification of at least three years"],0,"Art. 82(2)(c) CEOS requires for FG IV completed university studies of at least three years attested by a diploma, or equivalent professional training where justified.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0640",0,3,14,"CEOS Art. 82(7)",2,"Under Article 82(7) of the CEOS, contract staff in function groups II, III and IV may take part in internal competitions only after completing:",["Three years of service in the institution","One year of service in the institution","Five years of service in any EU body","Their probationary period and one annual report"],0,"Art. 82(7) CEOS allows participation in internal competitions only after three years of service in the institution.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0641",0,3,14,"CEOS Art. 84(1)",1,"Under Article 84 of the CEOS, a contract staff member whose contract is for at least one year serves a probationary period of:",["Nine months in all function groups, irrespective of the grade","Three months in function group I and six months in the others","Twelve months in function group IV and six months in the others","Six months in function group I and nine months in the others"],3,"Art. 84(1) CEOS sets six months for FG I and nine months for any other function group.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0642",0,3,14,"CEOS Art. 11",0,"Under Article 11 of the CEOS, which provisions of the Staff Regulations on rights and obligations apply by analogy to temporary staff?",["Articles 1 to 10c and 27 to 34","Articles 27 to 34","Articles 11 to 26a","Articles 55 to 61"],2,"Art. 11 CEOS applies Articles 11 to 26a of the Staff Regulations, concerning rights and obligations, by analogy to temporary staff.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0643",0,3,14,"CEOS Art. 47(c)(i)",2,"Under Article 47 of the CEOS, for a temporary staff contract of indefinite period, the notice period is at least one month per completed year of service, subject to:",["A minimum of one month and a maximum of three months","A minimum of three months and a maximum of 10 months","A minimum of two months and a maximum of six months","A minimum of six months and a maximum of 12 months"],1,"Art. 47(c)(i) CEOS sets a minimum of three months and a maximum of 10 months for indefinite-period contracts.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0644",0,3,14,"CEOS Art. 7",2,"Under Article 7 of the CEOS, a servant whose contract is for less than one year may vote in Staff Committee elections if:",["His contract has been renewed at least once","He has been employed for at least six months","He is in function group IV or grade AD","The Appointing Authority expressly authorises it"],1,"Art. 7 CEOS grants voting rights to servants with contracts for less than one year if they have been employed for at least six months.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0645",0,3,14,"CEOS Art. 14(4)",2,"Under Article 14 of the CEOS, a member of the temporary staff dismissed at the end of probation is entitled to compensation equal to:",["One-third of his basic salary per month of probation completed","Three months' basic salary regardless of the length of service","One month's basic salary for each completed year of service","Half of his basic salary for the remaining contract period"],0,"Art. 14(4) CEOS grants compensation equal to one-third of basic salary per month of probation completed.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0646",0,4,15,"introduction",0,"According to the EU's 'European Union priorities 2024-2029' page, which body set out its priorities in the 2024-2029 EU strategic agenda in June 2024?",["The European Commission","The European Council","The Council of the European Union","The European Parliament"],1,"The page states that in June 2024 the European Council set out its priorities in the 2024-2029 EU strategic agenda.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0647",0,4,15,"section 'EU strategic agenda for 2024-2029'",0,"According to the EU's 'European Union priorities 2024-2029' page, how many priority areas does the 2024-2029 EU strategic agenda set out?",["Three","Five","Seven","Ten"],0,"EU leaders set out 3 priority areas in the 2024-2029 strategic agenda.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0648",0,4,15,"section 'Commission priorities for 2024-2029'",0,"According to the EU's 'European Union priorities 2024-2029' page, how many priorities did the President of the Commission determine for the 2024-2029 mandate?",["Three","Five","Ten","Seven"],3,"The page states that the President of the Commission determined 7 priorities for the 2024-2029 mandate.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0649",0,4,15,"section 'EU strategic agenda for 2024-2029'",0,"According to the EU's 'European Union priorities 2024-2029' page, which of the following is one of the three priorities of the 2024-2029 EU strategic agenda?",["A Europe fit for the digital age","An economy that works for people","A strong and secure Europe","A new push for European democracy"],2,"The three strategic agenda priorities are a free and democratic Europe, a strong and secure Europe, and a prosperous and competitive Europe.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0650",0,4,15,"section 'EU strategic agenda for 2024-2029'",1,"According to the EU's 'European Union priorities 2024-2029' page, under which strategic agenda priority falls 'pursuing a comprehensive approach to migration and border management'?",["A free and democratic Europe","A prosperous and competitive Europe","A strong and secure Europe","A global Europe"],2,"Migration and border management is listed under 'A strong and secure Europe' in the strategic agenda.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0651",0,4,15,"section 'EU strategic agenda for 2024-2029'",1,"According to the EU's 'European Union priorities 2024-2029' page, 'making a success of the green and digital transitions' is part of which strategic agenda priority?",["A strong and secure Europe","A prosperous and competitive Europe","A free and democratic Europe","Preparing for a bigger and stronger Union"],1,"The green and digital transitions are listed under 'A prosperous and competitive Europe'.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0652",0,4,15,"section 'EU strategic agenda for 2024-2029'",2,"According to the EU's 'European Union priorities 2024-2029' page, 'preparing for a bigger and stronger Union' is listed under which strategic agenda priority?",["A strong and secure Europe","A free and democratic Europe","A prosperous and competitive Europe","Delivering together and preparing our Union for the future"],0,"Under the strategic agenda, 'preparing for a bigger and stronger Union' is one of the strands of 'A strong and secure Europe'.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0653",0,4,15,"section 'EU strategic agenda for 2024-2029'",1,"According to the EU's 'European Union priorities 2024-2029' page, which two strands make up the strategic agenda priority 'A free and democratic Europe'?",["Bolstering competitiveness and promoting an innovation- and business-friendly environment","Strengthening security and defence and protecting EU citizens against hybrid threats","Ensuring coherent external action and preparing for a bigger and stronger Union","Upholding European values within the EU and living up to them at global level"],3,"'A free and democratic Europe' comprises upholding European values within the EU and living up to EU values at global level.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0654",0,4,15,"section 'Commission priorities for 2024-2029'",1,"According to the EU's 'European Union priorities 2024-2029' page, which Commission priority includes building a European Defence Union and strengthening common borders?",["A global Europe: Leveraging our power and partnerships","Protecting our democracy, upholding our values","Delivering together and preparing our Union for the future","A new era for European Defence and Security"],3,"'A new era for European Defence and Security' covers building a European Defence Union, addressing threats and strengthening common borders and managing migration.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0655",0,4,15,"section 'Commission priorities for 2024-2029'",2,"According to the EU's 'European Union priorities 2024-2029' page, how does the Commission priority on defence and security describe the way migration should be managed?",["Swiftly and humanely","Jointly and flexibly","Fairly and firmly","Strictly and selectively"],2,"The priority refers to 'strengthening our common borders and managing migration fairly and firmly'.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0656",0,4,15,"section 'Commission priorities for 2024-2029'",1,"According to the EU's 'European Union priorities 2024-2029' page, which Commission priority covers building a competitive and resilient agriculture and food system and safeguarding biodiversity?",["A new plan for Europe's sustainable prosperity and competitiveness","Sustaining our quality of life: Food security, water and nature","Supporting people, strengthening our societies and our social model","A global Europe: Leveraging our power and partnerships"],1,"'Sustaining our quality of life: Food security, water and nature' includes a competitive and resilient agriculture and food system and safeguarding biodiversity.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0657",0,4,15,"section 'Commission priorities for 2024-2029'",1,"According to the EU's 'European Union priorities 2024-2029' page, strengthening the rule of law and increasing societal resilience and preparedness belong to which Commission priority?",["Protecting our democracy, upholding our values","A new era for European Defence and Security","Supporting people, strengthening our societies and our social model","Delivering together and preparing our Union for the future"],0,"'Protecting our democracy, upholding our values' covers defending democracy, societal resilience and preparedness, the rule of law and civic engagement.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0658",0,4,15,"section 'Commission priorities for 2024-2029'",1,"According to the EU's 'European Union priorities 2024-2029' page, which Commission priority involves enlarging the EU and pursuing a new economic foreign policy?",["A global Europe: Leveraging our power and partnerships","A new era for European Defence and Security","A new plan for Europe's sustainable prosperity and competitiveness","Protecting our democracy, upholding our values"],0,"'A global Europe' includes enlarging the EU, focusing on the wider neighbourhood, a new economic foreign policy and reforming the international system.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0659",0,4,15,"section 'Commission priorities for 2024-2029'",2,"According to the EU's 'European Union priorities 2024-2029' page, which Commission priority includes developing a simpler, more impactful EU budget and strengthening the partnership between the Commission and the European Parliament?",["A global Europe: Leveraging our power and partnerships","Protecting our democracy, upholding our values","A new plan for Europe's sustainable prosperity and competitiveness","Delivering together and preparing our Union for the future"],3,"'Delivering together and preparing our Union for the future' covers a simpler EU budget, reforms for a larger union and the Commission-Parliament partnership.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0660",0,4,15,"introduction",1,"According to the EU's 'European Union priorities 2024-2029' page, from what do the EU priorities derive?",["A Europe-wide consultative referendum held among citizens after the 2024 European elections","A Commission proposal adopted by qualified majority in the Council and approved by Parliament","A dialogue between EU leaders, national ministers, EU institutions and EP political groups","Recommendations of the European Economic and Social Committee and the Committee of the Regions"],2,"The page states that the priorities derive from a dialogue between EU leaders, national ministers, EU institutions and the political groups elected to the European Parliament.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0661",0,4,15,"introduction",1,"According to the EU's 'European Union priorities 2024-2029' page, what role does the European Council's strategic agenda play for the European Commission?",["It is a legally binding work programme that the Commission is obliged to implement","It serves as inspiration for the political priorities the Commission draws up","It replaces the Commission's annual work programme for the whole five-year term","It is adopted by the Commission only after formal approval by the European Parliament"],1,"The strategic agenda 'serves as inspiration for the European Commission's political priorities which it draws up before taking office for a 5-year term'.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0662",0,4,15,"section 'Commission priorities for 2024-2029'",1,"According to the EU's 'European Union priorities 2024-2029' page, supporting young people and ensuring equal opportunities for all fall under which Commission priority?",["Protecting our democracy, upholding our values","Supporting people, strengthening our societies and our social model","Sustaining our quality of life: Food security, water and nature","Delivering together and preparing our Union for the future"],1,"'Supporting people, strengthening our societies and our social model' includes social fairness, solidarity, supporting young people and equal opportunities.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0663",0,4,15,"section 'Commission priorities for 2024-2029'",1,"According to the EU's 'European Union priorities 2024-2029' page, tackling skills and labour gaps and leading in digital technology innovation are part of which Commission priority?",["A new plan for Europe's sustainable prosperity and competitiveness","Supporting people, strengthening our societies and our social model","A global Europe: Leveraging our power and partnerships","A new era for European Defence and Security"],0,"The first Commission priority includes making business easier, a circular economy, tackling skills and labour gaps and leading in digital technology innovation.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0664",0,4,15,"section 'EU strategic agenda for 2024-2029'",0,"According to the EU's 'European Union priorities 2024-2029' page, which crises are cited as making a clear strategic plan ever more pressing?",["The 2008 financial crisis, Brexit negotiations and the euro-area sovereign debt crisis","The 2015 refugee crisis, terrorist attacks in several Member States and cyber-attacks","Energy shortages, persistent high inflation and the global semiconductor chip shortage","Climate change, the COVID-19 pandemic and support for Ukraine after Russia's aggression"],3,"The strategic agenda section cites the fight against climate change, the COVID-19 pandemic and supporting Ukraine following Russia's war of aggression.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0665",0,4,15,"section 'EU strategic agenda for 2024-2029'",2,"According to the EU's 'European Union priorities 2024-2029' page, by focusing on new priority areas, the EU aims to make Europe:",["Fully self-sufficient in energy and raw materials by the end of 2029","Less dependent on the European Council's guidance in foreign policy","More sovereign and better equipped to deal with future challenges","A federal state with a single foreign minister and a common army"],2,"The page states that by focusing on new priority areas, the EU will help make Europe more sovereign and better equipped to deal with future challenges.","https://european-union.europa.eu/european-union-priorities-2024-2029_en"],["Q0666",0,2,16,"Types page, section 'Set-up and location'",0,"According to the EU's 'Types of institutions, bodies and agencies' page, how many EU institutions are there?",["4","7","9","12"],1,"The page states there are 7 European institutions, alongside 9 EU bodies and over 30 decentralised agencies.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0667",0,2,16,"Types page, section 'Set-up and location'",1,"According to the EU's 'Types of institutions, bodies and agencies' page, which four institutions are the main decision-making institutions leading the EU's administration?",["European Parliament, Council of the EU, European Commission, Court of Justice of the EU","European Parliament, European Council, Council of the EU, European Commission","European Council, Council of the EU, European Commission, European Central Bank","European Parliament, European Commission, Court of Auditors, European Central Bank"],1,"The page lists the Parliament, the European Council, the Council of the EU and the Commission as the 4 main decision-making institutions.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0668",0,2,16,"Types page, section 'Set-up and location'",0,"According to the EU's 'Types of institutions, bodies and agencies' page, where is the European Central Bank located?",["Frankfurt","Luxembourg","Brussels","Strasbourg"],0,"The page lists the European Central Bank with its seat in Frankfurt.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0669",0,2,16,"Types page, section 'Set-up and location'",1,"According to the EU's 'Types of institutions, bodies and agencies' page, which pair of institutions is located in Luxembourg?",["The European Central Bank and the Court of Justice of the EU","The European Council and the European Court of Auditors (ECA)","The Court of Justice of the EU and the European Court of Auditors","The European Commission and the European Central Bank"],2,"The page places both the Court of Justice of the EU and the European Court of Auditors in Luxembourg.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0670",0,2,16,"Types page, section 'Set-up and location'",1,"According to the EU's 'Types of institutions, bodies and agencies' page, approximately how many civil servants and other staff serve the EU?",["Around 32,000","Around 60,000","Around 140,000","Around 450,000"],1,"The page states that around 60,000 EU civil servants and other staff serve 450 million Europeans.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0671",0,2,16,"Types page, section 'Institutions'",0,"According to the EU's 'Types of institutions, bodies and agencies' page, what is the name of the procedure by which the Parliament, the Council and the Commission generally produce EU laws?",["The Special Legislative Procedure","The Community Method Procedure","The Ordinary Legislative Procedure","The Interinstitutional Consent Procedure"],2,"The page states that the process followed by the Parliament, Council and Commission is called the Ordinary Legislative Procedure.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0672",0,2,16,"Types page, section 'Institutions' (European Council)",1,"According to the EU's 'Types of institutions, bodies and agencies' page, what is the term of office of the President of the European Council?",["5 years, renewable once","2.5 years, not renewable","2.5 years, renewable once","6 months, rotating among member countries"],2,"The page states the European Council is chaired by a president elected for a 2.5-year term, renewable once.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0673",0,2,16,"Types page, section 'Institutions' (European Council)",0,"According to the EU's 'Types of institutions, bodies and agencies' page, what is the only kind of law the European Council may adopt?",["Regulations on the EU budget","Directives on foreign policy","Possible EU Treaty amendments","Implementing acts for agencies"],2,"The page says the European Council does not adopt laws except for possible EU Treaty amendments.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0674",0,2,16,"Types page, section 'Institutions' (European Commission)",1,"According to the EU's 'Types of institutions, bodies and agencies' page, which EU policy is NOT managed by the European Commission but conducted by the High Representative?",["The Common Agricultural and Fisheries Policy","The Common Commercial and Trade Policy","The Common Foreign and Security Policy","The Economic and Monetary Union policy"],2,"The page states the Commission manages EU policies except the CFSP, which is conducted by the High Representative/Vice-President.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0675",0,2,16,"Types page, section 'Institutions'",1,"According to the EU's 'Types of institutions, bodies and agencies' page, which three institutions handle the judicial, financial and external audit aspects of the EU?",["The Court of Justice of the EU, the European Investment Bank and the European Ombudsman's office","The General Court, the European Central Bank and OLAF","The Court of Justice of the EU, the European Central Bank and the European Court of Auditors","The Court of Justice of the EU, the European Commission and the European Court of Auditors"],2,"The page says these 3 institutions (CJEU, ECB, ECA) complement the 4 main institutions on judicial, financial and audit matters.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0676",0,2,16,"Types page, section 'Bodies' (European Investment Bank)",0,"According to the EU's 'Types of institutions, bodies and agencies' page, which body is described as 'the lending arm of the European Union'?",["The European Central Bank","The European Investment Fund","The European Stability Mechanism","The European Investment Bank"],3,"The page describes the EIB as the lending arm of the EU.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0677",0,2,16,"Types page, section 'Bodies'",1,"According to the EU's 'Types of institutions, bodies and agencies' page, which two bodies have the task of advising the EU institutions?",["The European Ombudsman and the European Data Protection Supervisor (EDPS)","The European External Action Service and the European Investment Bank group","The Economic and Social Committee and the European Committee of the Regions","The European Data Protection Board and the European Committee of the Regions"],2,"The page states that the EESC and the CoR advise the institutions, whereas the Ombudsman and EDPS ensure compliance with EU rules.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0678",0,2,16,"Types page, section 'Bodies' (EPPO)",0,"According to the EU's 'Types of institutions, bodies and agencies' page, what is the European Public Prosecutor's Office responsible for?",["Prosecuting war crimes and crimes against humanity committed on EU territory","Coordinating national police investigations into serious organised crime","Investigating, prosecuting and judging crimes against the EU's financial interests","Representing the EU institutions in legal disputes before the Court of Justice"],2,"The page says the EPPO is responsible for investigating, prosecuting and bringing to judgment crimes against the financial interests of the EU.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0679",0,2,16,"Types page, section 'Interinstitutional services'",2,"According to the EU's 'Types of institutions, bodies and agencies' page, which interinstitutional service is the oldest, established in 1969?",["The European Personnel Selection Office","The Publications Office","The European School of Administration","CERT-EU"],1,"The page states the Publications Office was established in 1969, EPSO in 2003, EuSA in 2005 and CERT-EU in 2012.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0680",0,2,16,"Types page, section 'Interinstitutional services'",0,"According to the EU's 'Types of institutions, bodies and agencies' page, which interinstitutional service organises competitions to recruit candidates for the EU institutions and agencies?",["The European Personnel Selection Office (EPSO)","The European School of Administration (EuSA) of the EU","The Publications Office (OP)","DG Human Resources of the Commission"],0,"The page describes EPSO as the EU's selection office that organises competitions to recruit candidates.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0681",0,2,16,"Types page, section 'Decentralised agencies'",1,"According to the EU's 'Types of institutions, bodies and agencies' page, which statement correctly describes decentralised agencies?",["They are set up by the Commission for a limited period to manage specific tasks of EU programmes","They are internal departments of the Commission and have no separate legal personality of their own","They are set up for a fixed 7-year period aligned with the long-term budget, then dissolved","They have their own legal personality, are set up indefinitely and are distinct from the institutions"],3,"The page states decentralised agencies have their own legal personalities, are set up for an indefinite period and are distinct from the institutions.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0682",0,2,16,"Types page, section 'Executive agencies'",1,"According to the EU's 'Types of institutions, bodies and agencies' page, how many executive agencies has the European Commission set up, and for how long?",["6, for an indefinite period","Over 30, for a limited period of time","4, for an indefinite period","6, for a limited period of time"],3,"The page says the Commission has set up 6 executive agencies for a limited period to manage specific tasks associated with EU programmes.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0683",0,2,16,"Types page, section 'Decentralised agencies'",1,"According to the EU's 'Types of institutions, bodies and agencies' page, where is the European Medicines Agency located?",["London","Brussels","Copenhagen","Amsterdam"],3,"The page gives the EMA as an example of a decentralised agency located in Amsterdam, established in 1995.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0684",0,2,16,"Types page, section 'Common foreign and security policy'",2,"According to the EU's 'Types of institutions, bodies and agencies' page, which CFSP agency provides geospatial intelligence products, primarily by analysing Earth observation satellite data?",["The European Defence Agency","The European Union Institute for Security Studies","The European Security and Defence College","The European Union Satellite Centre"],3,"The page says the Satellite Centre provides geospatial intelligence products and services, mainly from Earth observation satellite data.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0685",0,2,16,"Types page, section 'Euratom agencies and bodies'",2,"According to the EU's 'Types of institutions, bodies and agencies' page, which body manages the EU's contribution to the ITER project?",["The Fusion for Energy Joint Undertaking","The Euratom Supply Agency in Luxembourg","The Joint Research Centre of the Commission","The European Defence Agency in Brussels"],0,"The page states the Fusion for Energy Joint Undertaking manages the EU's contribution to ITER and cooperates with Japan on fusion research.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0686",0,2,16,"Linked profile 'European Parliament', section 'Composition'",1,"According to the EU's institution profile of the European Parliament, what are the minimum and maximum numbers of MEPs a single country can have?",["Minimum 6, maximum 96","Minimum 4, maximum 99","Minimum 6, maximum 100","Minimum 5, maximum 96"],0,"Under degressive proportionality, no country can have fewer than 6 or more than 96 MEPs, and the total cannot exceed 750 plus the President.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0687",0,2,16,"Linked profile 'European Parliament', section 'Overview'",0,"According to the EU's institution profile of the European Parliament, how many MEPs currently sit in the Parliament?",["705","751","720","750"],2,"The profile gives the membership as 720 MEPs.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0688",0,2,16,"Linked profile 'European Parliament', section 'Supervisory'",1,"According to the EU's institution profile of the European Parliament, what is meant by the Parliament 'granting discharge'?",["Approving the way EU budgets have been spent","Releasing an MEP from parliamentary immunity","Dismissing an individual Commissioner","Closing a citizens' petition after examination"],0,"The profile lists, among supervisory powers, 'granting discharge, i.e. approving the way EU budgets have been spent'.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0689",0,2,16,"Linked profile 'European Parliament', section 'How does the Parliament work?'",1,"According to the EU's institution profile of the European Parliament, where are plenary sessions normally held?",["In Brussels, for one week a month","In Strasbourg, for four days a month","In Luxembourg, for four days a month","In Strasbourg, for two weeks every quarter"],1,"The profile states plenary sessions are normally held in Strasbourg for four days a month, with some additional sessions in Brussels.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0690",0,2,16,"Linked profile 'European Council', section 'How does the European Council work?'",1,"According to the EU's institution profile of the European Council, how does the European Council generally take its decisions?",["By simple majority of the heads of state or government","By qualified majority in all cases","By unanimity, with the Commission President holding a casting vote","By consensus, with unanimity or qualified majority in some cases"],3,"The profile says it generally decides by consensus, but by unanimity or qualified majority in some cases; only heads of state or government vote.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0691",0,2,16,"Linked profile 'Council of the European Union', section 'Overview'",1,"According to the EU's institution profile of the Council of the EU, in which months are Council meetings held in Luxembourg instead of Brussels?",["January, May and September","April, June and October","March, July and November","June, September and December"],1,"The profile states Council meetings take place in Brussels except in April, June and October, when they are held in Luxembourg.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0692",0,2,16,"Linked profile 'Council of the European Union', section 'How does the Council work?'",2,"According to the EU's institution profile of the Council of the EU, what does a qualified majority require?",["65% of countries (18 of 27) representing at least 55% of the EU population","55% of countries (15 of 27) representing at least 65% of the EU population","55% of countries (15 of 27) representing at least 60% of the EU population","Two-thirds of countries (18 of 27) representing at least 65% of the EU population"],1,"The profile defines qualified majority as 55% of countries (15 of 27) representing at least 65% of total EU population.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0693",0,2,16,"Linked profile 'Council of the European Union', section 'How does the Council work?'",2,"According to the EU's institution profile of the Council of the EU, what is needed to form a blocking minority?",["At least 4 countries representing at least 35% of the EU population","At least 3 countries representing at least 35% of the EU population","At least 4 countries representing at least 45% of the EU population","At least 13 countries, whatever their population"],0,"The profile states that blocking a decision needs at least 4 countries representing at least 35% of total EU population.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0694",0,2,16,"Linked profile 'Council of the European Union', section 'Who chairs the meetings?'",1,"According to the EU's institution profile of the Council of the EU, who chairs the Foreign Affairs Council?",["The EU High Representative for Foreign Affairs and Security Policy","The foreign minister of the country holding the rotating presidency","The President of the European Council","The President of the European Commission"],0,"The Foreign Affairs Council has a permanent chair, the High Representative; other configurations are chaired by the rotating presidency.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0695",0,2,16,"Linked profile 'Council of the European Union', section 'Composition'",1,"According to the EU's institution profile of the Council of the EU, in how many configurations does the Council meet?",["7","10","12","27"],1,"The profile states the Council meets in 10 different configurations, each corresponding to a policy area.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0696",0,2,16,"Linked profile 'European Commission', section 'Composition'",2,"According to the EU's institution profile of the European Commission, how is the current College of Commissioners composed?",["The President, 3 Executive Vice-Presidents, 4 Vice-Presidents, the High Representative and 18 Commissioners","The President, 5 Executive Vice-Presidents, the High Representative/Vice-President and 20 Commissioners","The President, 6 Executive Vice-Presidents, the High Representative/Vice-President and 19 Commissioners","The President, the High Representative/Vice-President and 25 Commissioners with equal portfolios"],1,"The profile gives the College as the President, 5 Executive Vice-Presidents, a High Representative/Vice-President and 20 Commissioners.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0697",0,2,16,"Linked profile 'European Commission', section 'Selecting the team'",1,"According to the EU's institution profile of the European Commission, how is the College of Commissioners finally appointed?",["By the European Parliament, by simple majority, after the committee hearings","By the Council of the EU, by unanimity, after obtaining Parliament's opinion","By the European Council, by qualified majority, after Parliament's consent","By the Commission President alone, after Parliament's individual hearings"],2,"After the Parliament votes on the nominees as a team, they are appointed by the European Council by a qualified majority.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0698",0,2,16,"Linked profile 'European Commission', section 'How does the Commission work?'",1,"According to the EU's institution profile of the European Commission, when the College of Commissioners votes, how are decisions taken?",["By qualified majority weighted by population","By unanimity of all Commissioners","By the President alone after consulting the Vice-Presidents","By simple majority, each Commissioner having one vote"],3,"The profile says decisions are generally by consensus, but when votes take place they are by simple majority, each Commissioner having one vote.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0699",0,2,16,"Linked profile 'Court of Justice of the European Union', section 'Overview' and 'Composition'",1,"According to the EU's institution profile of the CJEU, how is the General Court composed and how long is a judge's term?",["2 judges from each EU country, for a renewable 6-year term","1 judge from each EU country, for a renewable 6-year term","2 judges from each EU country, for a non-renewable 9-year term","1 judge from each EU country plus 11 advocates general, for a 5-year term"],0,"The General Court has 2 judges per EU country; each judge and advocate general is appointed for a renewable 6-year term.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0700",0,2,16,"Linked profile 'Court of Justice of the European Union', section 'What does the CJEU do?'",0,"According to the EU's institution profile of the CJEU, which type of case allows a national court in doubt about the interpretation of EU law to ask the Court for clarification?",["An infringement proceeding","An action for annulment","An action for failure to act","A preliminary ruling"],3,"The profile describes preliminary rulings as the mechanism by which national courts ask the Court to interpret EU law.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0701",0,2,16,"Linked profile 'European Central Bank', section 'Composition'",2,"According to the EU's institution profile of the ECB, what is the composition of the ECB's Executive Board?",["The President, the Vice-President and 4 other members appointed for 8-year terms","The President, the Vice-President and the governors of all eurozone central banks","The President and 6 members appointed for renewable 5-year terms","The President, the Vice-President and the governors of all EU central banks"],0,"The Executive Board consists of the ECB President and Vice-President and 4 other members appointed for 8-year terms by eurozone leaders.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0702",0,2,16,"Linked profile 'European Court of Auditors', section 'Composition'",1,"According to the EU's institution profile of the European Court of Auditors, how are its members appointed?",["By the Parliament, after consulting the Council, for renewable 5-year terms","By the Commission, for non-renewable 6-year terms","By the European Council, for renewable 3-year terms","By the Council, after consulting the Parliament, for renewable 6-year terms"],3,"ECA members are appointed by the Council after consulting the Parliament for renewable 6-year terms; the President serves 3 years.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0703",0,2,16,"Linked profile 'European Ombudsman', sections 'How is the Ombudsman chosen?' and 'The Ombudsman and you'",0,"According to the EU's institution profile of the European Ombudsman, within what time limit must a complaint be lodged?",["Within 2 years of becoming aware of the problem","Within 6 months of becoming aware of the problem","Within 1 year of the contested decision","Within 5 years of the contested decision"],0,"The profile says complaints must be made within 2 years of the date the complainant became aware of the problem; the Ombudsman is elected by Parliament for 5 years.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0704",0,2,16,"Linked profile 'European Economic and Social Committee', section 'Composition'",1,"According to the EU's institution profile of the EESC, into which three groups are its members organised?",["Regions, cities and civil society organisations","Employers, consumers and farmers' organisations","Business, academia and non-governmental organisations","Employers, workers and other interest groups"],3,"EESC members belong to one of three groups: employers, workers, and other interest groups such as farmers and consumers.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0705",0,2,16,"Linked profile 'European Committee of the Regions', section 'What does the CoR do?'",2,"According to the EU's institution profile of the European Committee of the Regions, what can the CoR do if it is not consulted on legislation concerning local and regional government?",["Veto the legislative act in the Council","Bring a case before the Court of Justice","Request a referendum in the regions concerned","Refer the matter to the European Ombudsman"],1,"The profile states that if the Commission, Council or Parliament fail to consult it where required, the CoR can bring a case before the Court of Justice.","https://european-union.europa.eu/institutions-law-budget/institutions-and-bodies/types-institutions-and-bodies_en"],["Q0706",0,2,17,"Main page, section 'The 2028-2034 EU budget for a stronger Europe'",0,"On what date did the European Commission present its proposal for the 2028-2034 Multiannual Financial Framework?",["3 September 2025","1 January 2025","16 July 2024","16 July 2025"],3,"The page states the Commission presented its MFF proposal on 16 July 2025; a second package of sectoral proposals followed on 3 September 2025.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0707",0,2,17,"Main page, section 'The 2028-2034 EU budget for a stronger Europe'",0,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), what is the approximate total size of the long-term budget?",["About EUR 1.2 trillion","Almost EUR 3 trillion","Almost EUR 2 trillion","About EUR 750 billion"],2,"The page states the proposal amounts to almost EUR 2 trillion.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0708",0,2,17,"Main page, section 'The 2028-2034 EU budget for a stronger Europe'",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), what share of the EU's gross national income does the budget represent on average between 2028 and 2034?",["1.00%","1.13%","1.26%","2.00%"],2,"The page gives the size as almost EUR 2 trillion, or 1.26% of EU GNI on average over 2028-2034.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0709",0,2,17,"Factsheet 'MFF Summary: An ambitious budget for a stronger Europe 2028-2034' (September 2025)",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), by how much does the Commission propose to reduce the number of EU financial programmes?",["From 52 to 16 programmes","From 40 to 20 programmes","From 52 to 30 programmes","From 37 to 7 programmes"],0,"The MFF Summary factsheet states the budget will be simpler, going from 52 to 16 programmes.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0710",0,2,17,"Factsheet 'MFF Summary: An ambitious budget for a stronger Europe 2028-2034' (September 2025)",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), what minimum share of the EU budget is to support projects related to climate and environment?",["At least 20%","At least 30%","At least 50%","At least 35%"],3,"The MFF Summary factsheet states at least 35% of the EU budget will support climate and environment projects.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0711",0,2,17,"Main page, section 'Investing in people, Member States and regions'",0,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), through which instrument will EU funds implemented by Member States and regions, with cohesion and agricultural policy at their core, be delivered?",["Recovery and Resilience Plans","Operational Programmes under shared management","National Strategic Reform Agreements","National and Regional Partnership Plans"],3,"The page states this strategy will be implemented through National and Regional Partnership Plans.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0712",0,2,17,"Factsheet 'National and Regional Partnership Plans' (July 2025)",2,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), what minimum amount is ring-fenced for less developed regions in the National and Regional Partnership Plans?",["EUR 218 billion","EUR 302 billion","EUR 150 billion","EUR 100 billion"],0,"The NRPP factsheet states support to less developed regions is ring-fenced at a minimum of EUR 218 billion.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0713",0,2,17,"Factsheet 'National and Regional Partnership Plans' (July 2025)",2,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), at what amount is support for farmers and fishers ring-fenced?",["EUR 302 billion","EUR 218 billion","EUR 386 billion","EUR 409 billion"],0,"The NRPP factsheet states support for farmers and fishers is ring-fenced at EUR 302 billion, plus a doubled agricultural reserve of EUR 900 million a year.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0714",0,2,17,"Factsheet 'National and Regional Partnership Plans' (July 2025)",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), what spending target on social objectives is set for the National and Regional Partnership Plans?",["14%","10%","25%","43%"],0,"The NRPP factsheet sets a target of 14% spending on social objectives (excluding agriculture, fisheries and the Social Climate Fund), yielding about EUR 100 billion.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0715",0,2,17,"Factsheet 'National and Regional Partnership Plans' (July 2025)",2,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), what is 'Catalyst Europe'?",["A EUR 63.2 billion facility for Union actions such as crisis response","A facility offering EUR 150 billion in policy loans to Member States","A crisis mechanism of up to EUR 400 billion in loans for severe crises","A EUR 15 billion reserve within Global Europe for emerging crises"],1,"The NRPP factsheet describes Catalyst Europe as offering EUR 150 billion in policy loans to Member States to invest in European objectives.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0716",0,2,17,"Factsheet 'National and Regional Partnership Plans' (July 2025)",2,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), which bonuses are included in the streamlined allocation formula for the National and Regional Partnership Plans?",["Bonuses only for island, outermost and mountain regions, and for sparsely populated areas","Bonuses for Member States with the highest national defence spending and military mobility needs","Bonuses for regions hosting the largest numbers of refugees from Ukraine and other third countries","Bonuses for poorer regions, regions bordering Russia/Belarus and agriculture external convergence"],3,"The NRPP factsheet lists bonuses for poorer regions, regions bordering Russia and Belarus and agriculture external convergence.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0717",0,2,17,"Main page, section 'Investing in people, Member States and regions'",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), which instrument will continue to protect the entire EU budget from breaches of the rule of law?",["The Financial Regulation's exclusion system (EDES)","The Rule of Law Report mechanism","The Article 7 TEU procedure","The Conditionality Regulation"],3,"The page states that the Conditionality Regulation will continue to protect the entire EU budget from breaches of the rule of law.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0718",0,2,17,"Main page, section 'Foster education and democratic values'",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), which programme is described as the backbone of the Union of Skills?",["The European Social Fund Plus (ESF+)","The AgoraEU programme","A reinforced Erasmus+ programme","Horizon Europe"],2,"The page states a reinforced Erasmus+ programme will be the backbone of the Union of Skills.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0719",0,2,17,"Main page, section 'Driving prosperity via competitiveness, research and innovation'",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), which of the following is NOT one of the four areas of focus of the new European Competitiveness Fund?",["Clean transition and decarbonisation","Migration and border management","Digital transition","Defence and space"],1,"The four areas are clean transition and decarbonisation; digital transition; health, biotech, agriculture and bioeconomy; and defence and space.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0720",0,2,17,"Main page, section 'Driving prosperity via competitiveness, research and innovation'",0,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), how much is the EU research framework programme Horizon Europe worth?",["EUR 95 billion","EUR 175 billion","EUR 131 billion","EUR 451 billion"],1,"The page states the flagship Horizon Europe is worth EUR 175 billion.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0721",0,2,17,"Factsheet 'Competitiveness' (July 2025)",2,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), what is the total proposed funding for competitiveness and research, including Horizon Europe?",["EUR 451 billion","EUR 175 billion","EUR 409 billion","EUR 865 billion"],0,"The Competitiveness factsheet gives a total of EUR 451 billion for competitiveness and research compared with 2021-2027.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0722",0,2,17,"Main page, section 'Protecting Europe'",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), how much will the defence and space window of the European Competitiveness Fund allocate?",["EUR 131 billion, twice as much as in the previous MFF","EUR 131 billion, five times more than in the previous MFF","EUR 200 billion, five times more than in the previous MFF","EUR 34 billion, three times more than in the previous MFF"],1,"The page states the defence and space window will allocate EUR 131 billion, five times more funding at EU level than the previous MFF.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0723",0,2,17,"Main page, section 'Protecting Europe'",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), how will the military mobility strand of the Connecting Europe Facility change?",["It will be doubled","It will be tripled","It will be multiplied tenfold","It will be merged into the European Peace Facility"],2,"The page states the military mobility strand of the Connecting Europe Facility will be multiplied tenfold.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0724",0,2,17,"Main page, section 'Protecting Europe'",0,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), how much is allocated to migration management, external borders and internal security, and how does it compare with the previous period?",["EUR 34 billion, doubling funding","EUR 34 billion, tripling funding","EUR 81 billion, doubling funding","EUR 15 billion, tripling funding"],1,"The page states EUR 34 billion will be allocated, which triples funding compared to the previous period; the funds help implement the Pact on Migration and Asylum.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0725",0,2,17,"Factsheet 'Home Affairs Funds: Migration Borders Security' (July 2025)",2,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), what total amount does the Commission propose in the area of Home Affairs (migration, borders and security, including the agencies)?",["EUR 81 billion","EUR 34 billion","EUR 51 billion","EUR 120 billion"],0,"The Home Affairs factsheet states the Commission proposes EUR 81 billion in the area of Home Affairs, tripling funding compared to the previous period.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0726",0,2,17,"Main page, section 'Building partnerships for a stronger Europe in the world'",0,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), how much is the Global Europe Instrument worth for 2028-2034?",["EUR 200 billion","EUR 100 billion","EUR 150 billion","EUR 79.5 billion"],0,"The page states the Global Europe Instrument is worth EUR 200 billion, with a EUR 15 billion reserve for emerging crises.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0727",0,2,17,"Factsheet 'Global Europe' (July 2025); main page",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), how much may be mobilised for Ukraine over 2028-2034, and how is it treated?",["EUR 50 billion, within the Global Europe ceiling","EUR 100 billion, within the European Peace Facility","EUR 100 billion, outside the MFF ceilings","EUR 15 billion, as a crisis reserve"],2,"The page says EUR 100 billion may be mobilised for Ukraine; the Global Europe factsheet adds that it is dedicated outside the MFF ceilings.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0728",0,2,17,"Main page, section 'Building partnerships for a stronger Europe in the world'",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), through which instrument will support for operations with military aspects continue to be covered?",["The Global Europe Instrument","The European Peace Facility","The Common Foreign and Security Policy budget","The European Competitiveness Fund"],1,"The page states support for operations with military aspects will continue to be covered by the European Peace Facility.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0729",0,2,17,"Main page, section 'New own resources to match our common ambition'",1,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), how many new own resources does the Commission propose?",["Three","Four","Seven","Five"],3,"The page states the Commission presents five new own resources: ETS, CBAM, e-waste, tobacco excise duty (TEDOR) and CORE.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0730",0,2,17,"Main page, section 'New own resources to match our common ambition'",2,"Under the Commission's proposal for the 2028-2034 Multiannual Financial Framework (MFF), which companies would pay the proposed 'Corporate Resource for Europe' (CORE)?",["All companies operating in the EU, including SMEs, with a net annual turnover above EUR 750 million","Digital service companies operating in the EU with global annual revenues above EUR 1 billion","Non-SME companies operating and selling in the EU with a net annual turnover of at least EUR 100 million","Companies of any size importing carbon-intensive goods into the EU above a set volume threshold"],2,"CORE is an annual lump-sum contribution from non-SME companies operating and selling in the EU with net annual turnover of at least EUR 100 million.","https://commission.europa.eu/strategy-and-policy/eu-budget/long-term-eu-budget/eu-budget-2028-2034_en"],["Q0731",1,5,18,"Art. 1",0,"Under the Charter of Fundamental Rights of the European Union, which right is described as 'inviolable' and must be 'respected and protected'?",["Human dignity","The right to liberty and security","The right to asylum","Equality before the law"],0,"Art. 1 states: 'Human dignity is inviolable. It must be respected and protected.'","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0732",1,5,18,"Title I (Arts. 1-5)",0,"Which title of the Charter of Fundamental Rights of the European Union opens the catalogue of rights and contains the prohibition of torture?",["Title I 'Dignity'","Title II 'Freedoms'","Title III 'Equality'","Title VI 'Justice'"],0,"Title I 'Dignity' (Arts. 1-5) includes Art. 4 on the prohibition of torture and inhuman or degrading treatment.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0733",1,5,18,"Titles I-VII",1,"How many titles does the Charter of Fundamental Rights of the European Union contain?",["Five","Seven","Six","Eight"],1,"The Charter is divided into seven titles: Dignity, Freedoms, Equality, Solidarity, Citizens' Rights, Justice and General Provisions (Title VII).","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0734",1,5,18,"Art. 2(2)",0,"Under the Charter of Fundamental Rights of the European Union, what does Article 2 provide regarding the death penalty?",["The death penalty may be applied only for crimes committed in time of war","The death penalty may be imposed only by a court of last instance","The death penalty is left to national law within the scope of Union law","No one shall be condemned to the death penalty, or executed"],3,"Art. 2(2): 'No one shall be condemned to the death penalty, or executed.'","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0735",1,5,18,"Art. 3(2)(d)",1,"Under the Charter of Fundamental Rights of the European Union, which practice is expressly prohibited in the fields of medicine and biology under Article 3?",["The reproductive cloning of human beings","All forms of genetic research on human cells","The donation of human organs between living persons","The storage of genetic data for medical purposes"],0,"Art. 3(2)(d) lists 'the prohibition of the reproductive cloning of human beings'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0736",1,5,18,"Art. 5(3)",0,"Under the Charter of Fundamental Rights of the European Union, which article expressly states that 'Trafficking in human beings is prohibited'?",["Article 5 (Prohibition of slavery and forced labour)","Article 4 (Prohibition of torture and inhuman treatment)","Article 6 (Right to liberty and security of person)","Article 19 (Protection in the event of removal)"],0,"Art. 5(3) of the Charter states that trafficking in human beings is prohibited.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0737",1,5,18,"Art. 4",0,"Under the Charter of Fundamental Rights of the European Union, which article prohibits torture and inhuman or degrading treatment or punishment?",["Article 2","Article 6","Article 19","Article 4"],3,"Art. 4: 'No one shall be subjected to torture or to inhuman or degrading treatment or punishment.'","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0738",1,5,18,"Art. 6",0,"Under the Charter of Fundamental Rights of the European Union, what does Article 6 guarantee to everyone?",["The right to freedom of movement and residence","The right to a fair and public hearing","The right to liberty and security of person","The right to respect for private and family life"],2,"Art. 6: 'Everyone has the right to liberty and security of person.'","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0739",1,5,18,"Art. 7",0,"Under the Charter of Fundamental Rights of the European Union, Article 7 guarantees respect for private and family life. Which further elements are expressly listed in that article?",["Home and communications","Correspondence and reputation","Property and inheritance","Honour and personal data"],0,"Art. 7 protects everyone's 'private and family life, home and communications'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0740",1,5,18,"Art. 8(3)",1,"Under the Charter of Fundamental Rights of the European Union, who must control compliance with the rules on the protection of personal data under Article 8?",["The European Ombudsman","The Court of Justice of the European Union","The data controller's internal auditor","An independent authority"],3,"Art. 8(3): compliance with data protection rules 'shall be subject to control by an independent authority'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0741",1,5,18,"Art. 8(2)",1,"Under the Charter of Fundamental Rights of the European Union, which rights of the data subject are expressly mentioned in Article 8(2)?",["Erasure of all data and portability of data to another controller","Objection to processing and not being subject to automated profiling","Compensation for unlawful processing and restriction of processing","Access to data collected about him or her, and rectification of it"],3,"Art. 8(2) provides that everyone has the right of access to data collected concerning him or her, and the right to have it rectified.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0742",1,5,18,"Art. 10(2)",1,"Under the Charter of Fundamental Rights of the European Union, how is the right to conscientious objection recognised?",["As an absolute right that may not be restricted by any law","In accordance with the national laws governing its exercise","Only for Union citizens called up for compulsory military service","In accordance with uniform rules laid down by Union legislation"],1,"Art. 10(2): the right to conscientious objection is recognised 'in accordance with the national laws governing the exercise of this right'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0743",1,5,18,"Art. 11(2)",0,"Under the Charter of Fundamental Rights of the European Union, what does Article 11 require to be respected besides freedom of expression?",["The freedom and pluralism of the media","The independence of national broadcasting regulators","The confidentiality of journalistic sources only in criminal cases","The neutrality of public service media"],0,"Art. 11(2): 'The freedom and pluralism of the media shall be respected.'","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0744",1,5,18,"Art. 18",0,"Under the Charter of Fundamental Rights of the European Union, the right to asylum is guaranteed with due respect for the rules of which instruments?",["The Geneva Convention of 28 July 1951 and the Protocol of 31 January 1967","The European Convention on Human Rights of 1950 and its Protocol No. 4","The Dublin Convention of 15 June 1990 and the Schengen Borders Code","The Universal Declaration of 1948 and the 1954 Statelessness Convention"],0,"Art. 18 guarantees asylum with due respect for the 1951 Geneva Convention and the 1967 Protocol and in accordance with the TEU and TFEU.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0745",1,5,18,"Art. 18",0,"Under the Charter of Fundamental Rights of the European Union, besides the 1951 Geneva Convention and 1967 Protocol, in accordance with what is the right to asylum guaranteed?",["The constitutional traditions and asylum laws of the Member States","The case-law of the European Court of Human Rights on Article 3 ECHR","The directives and regulations of the Common European Asylum System","The Treaty on European Union and the Treaty on the Functioning of the EU"],3,"Art. 18 refers to the Geneva Convention, the 1967 Protocol and 'the Treaty on European Union and the Treaty on the Functioning of the European Union (the Treaties)'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0746",1,5,18,"Art. 19(1)",0,"Under the Charter of Fundamental Rights of the European Union, what does Article 19(1) prohibit?",["The extradition of Union citizens","The detention of asylum seekers","Collective expulsions","Return to a safe third country"],2,"Art. 19(1): 'Collective expulsions are prohibited.'","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0747",1,5,18,"Art. 19(2)",1,"Under the Charter of Fundamental Rights of the European Union, to a State where there is a serious risk of which treatments may no one be removed, expelled or extradited?",["Criminal prosecution or imprisonment for any offence under national law","Discrimination in access to employment, housing or social assistance","The death penalty, torture or other inhuman or degrading treatment","Deprivation of nationality, confiscation of property or forced labour"],2,"Art. 19(2) prohibits removal, expulsion or extradition where there is a serious risk of the death penalty, torture or other inhuman or degrading treatment or punishment.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0748",1,5,18,"Art. 19(2)",2,"Under the Charter of Fundamental Rights of the European Union, what standard of risk triggers the prohibition of removal, expulsion or extradition in Article 19(2)?",["A certain risk","A serious risk","A reasonable possibility","Proof beyond reasonable doubt"],1,"Art. 19(2) applies 'where there is a serious risk' that the person would be subjected to the death penalty, torture or other inhuman or degrading treatment.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0749",1,5,18,"Art. 19 (title)",1,"What is the title of Article 19 of the Charter of Fundamental Rights of the European Union?",["Protection in the event of removal, expulsion or extradition","Right to asylum and protection against collective expulsion","Prohibition of refoulement and of extradition to third States","Freedom of movement and of residence of third-country nationals"],0,"Art. 19 is entitled 'Protection in the event of removal, expulsion or extradition'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0750",1,5,18,"Art. 21(1)",1,"Under the Charter of Fundamental Rights of the European Union, which of the following grounds is expressly listed in Article 21(1) as a prohibited ground of discrimination?",["Criminal record","Marital status","Genetic features","Place of residence"],2,"Art. 21(1) lists, among others, sex, race, colour, ethnic or social origin, genetic features, language, religion, disability, age and sexual orientation.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0751",1,5,18,"Art. 21(2)",2,"Under the Charter of Fundamental Rights of the European Union, discrimination on grounds of nationality is prohibited under what condition?",["In all circumstances, including situations falling outside the scope of Union law","Only for persons who have been legally resident for at least five years","Only in matters of employment, social security and access to vocational training","Within the scope of the Treaties, without prejudice to their specific provisions"],3,"Art. 21(2) prohibits discrimination on grounds of nationality 'within the scope of application of the Treaties and without prejudice to any of their specific provisions'.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A12016P%2FTXT"],["Q0752",1,5,18,"Art. 23",1,"Under the Charter of Fundamental Rights of the European Union, does the principle of equality between women and men prevent measures giving specific advantage
