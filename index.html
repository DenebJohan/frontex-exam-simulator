rience","When coupled with high levels of narcissism","When the leader holds a senior rank"],2,"Key finding 10 and section 5.5 (Yocum, 2007): high emotional intelligence can undermine effectiveness when coupled with high narcissism.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0964",3,8,27,"Campbell & Kodz (2011), section 1 Key findings (9); section 5.2-5.3 (Densten)",2,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), what unusual finding is reported about Australian police officers compared to business/industry workers?",["A clear preference for laissez-faire leaders at all ranks, including sergeants and senior sergeants","Higher satisfaction with their leaders, although those leaders were rated less transformational","Rating transactional leaders as the least effective at every rank, including senior sergeants","Lower satisfaction with their leaders, although those leaders were rated more transformational"],1,"Key finding 9: Australian officers showed higher satisfaction with leaders than business workers despite their leaders being less transformational (Densten, 1999).","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0965",3,8,27,"Campbell & Kodz (2011), section 3 Overview of papers",1,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), which leadership model provided the theoretical basis for six of the reviewed studies?",["Hersey and Blanchard's Personal-Situational theory","Bass's Full-Range Leadership Model","The path-goal contingency theory","The DISC personality model"],1,"Section 3: the popularity of Bass's Full-Range Leadership Model (FRL) is attested by its being the theoretical basis for six of the studies.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0966",3,8,27,"Campbell & Kodz (2011), section 5.2 (MLQ)",2,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), under the Full Range Leadership Model measured by the Multifactor Leadership Questionnaire, which behaviours fall into the 'passive/avoidant' category?",["Intellectual stimulation and idealised influence","Contingent reward and management-by-exception (active)","Telling and selling","Management-by-exception (passive) and laissez-faire"],3,"Section 5.2: passive/avoidant comprises management-by-exception (passive) and laissez-faire; transactional comprises contingent reward and MBE (active).","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0967",3,8,27,"Campbell & Kodz (2011), section 5.1 (Dobby et al., 2004)",1,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), in the 2004 Home Office study by Dobby et al., which transformational dimension had the strongest relationship with positive psychological outcomes for subordinates?",["Intellectual stimulation and encouragement of innovation","Charisma and the communication of an inspiring vision","Contingent reward linked to the achievement of targets","Genuine concern for others' well-being and development"],3,"Section 5.1: the scale with the strongest relationship to psychological outcomes was 'genuine concern for others' well-being and development'.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0968",3,8,27,"Campbell & Kodz (2011), section 5.2 (Engel, 2002)",2,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), what did Engel's (2002) study of US police sergeants find about the 'active' supervisory style?",["Active supervisors significantly increased the number of arrests and citations issued by their subordinate patrol officers","Officers with active supervisors spent more time on personal business and less on self-initiated activities","Officers spent more time on self-initiated work and problem solving, but active supervisors used force twice as often","The active style had no influence on officer behaviour, unlike the innovative style, which increased problem solving"],2,"Section 5.2: only the active style influenced behaviour (self-initiated activity, problem solving); active supervisors were twice as likely to use force, so they must set a good example.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0969",3,8,27,"Campbell & Kodz (2011), section 5.4 (Huberts et al., 2007)",1,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), which three leadership behaviours were found by the Dutch study of Huberts et al. (2007) to be negatively related to integrity violations?",["Role modelling, openness and strictness","Mentoring, coaching and empowerment","Charisma, contingent reward and delegation","Telling, selling and participating"],0,"Section 5.4: all three behaviours - role modelling, openness and strictness - were negatively related to integrity violations among 2,130 Dutch officers.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0970",3,8,27,"Campbell & Kodz (2011), section 6 Conclusion",1,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), what overall conclusion does the review draw about effective police leadership?",["It confirms that a strict quasi-military command style remains the most effective approach in all policing situations","It challenges both 'leader as commander' and exclusive reliance on soft styles; leaders must adapt to context","It shows conclusively, through 'what works' evidence, that transformational leadership alone reduces crime rates","It finds that personality type, rather than style or context, determines how effective a police leader will be"],1,"Section 6: findings challenge both the 'leader as commander' style and the trend to emphasise soft styles to the exclusion of transactional ones; leaders must adapt to context.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0971",4,9,28,"Microsoft Support 'Track changes in Word', section 'Turn Track Changes on and off'",0,"In Microsoft Word, where do you turn Track Changes on or off?",["Insert tab > Comments > Track Changes","Review tab > Tracking > Track Changes","View tab > Show > Track Changes","File > Options > Proofing > Track Changes"],1,"Microsoft Support states: on the Review tab, select Tracking > Track Changes.","https://support.microsoft.com/en-us/office/track-changes-in-word-197ba630-0f5f-4a8e-9a77-3712475e806a"],["Q0972",4,9,28,"Microsoft Support 'Track changes in Word', section 'Choose how you would like to display the changes'",1,"In Microsoft Word, which markup view displays tracked changes with a red line in the margin?",["All Markup","No Markup","Simple Markup","Show Revisions Inline"],2,"Microsoft Support states that Simple Markup displays tracked changes with a red line in the margin, while All Markup shows coloured text and lines per reviewer.","https://support.microsoft.com/en-us/office/track-changes-in-word-197ba630-0f5f-4a8e-9a77-3712475e806a"],["Q0973",4,9,28,"Microsoft Support 'Track changes in Word', section 'Choose whose changes to track'",2,"In Microsoft Word, how can you use a password to prevent others from turning off Track Changes?",["Review > Tracking > Track Changes > Lock Tracking","File > Info > Protect Document > Always Open Read-Only","Review > Restrict Editing > Filling in forms","Review > Tracking > Track Changes > Just Mine"],0,"Microsoft Support states that to keep others from turning off Track Changes with a password you select Review > Tracking > Track Changes > Lock Tracking.","https://support.microsoft.com/en-us/office/track-changes-in-word-197ba630-0f5f-4a8e-9a77-3712475e806a"],["Q0974",4,9,28,"Microsoft Support 'Keyboard shortcuts in Word', section 'Review a document'",1,"In Microsoft Word for Windows, which keyboard shortcut turns change tracking on or off?",["Ctrl+Alt+M","Ctrl+Shift+T","Ctrl+Shift+E","Alt+Shift+X"],2,"Microsoft Support lists Ctrl+Shift+E to turn change tracking on or off (Ctrl+Alt+M inserts a comment).","https://support.microsoft.com/en-us/office/keyboard-shortcuts-in-word-95ef89dd-7142-4b50-afb2-f762f663ceb2"],["Q0975",4,9,28,"Microsoft Support 'Insert a table of contents', section 'Create the table of contents'",0,"In Microsoft Word, an automatic table of contents is built from which element of the document?",["Text formatted in bold","Bookmarks inserted manually","Paragraphs listed in the Navigation pane search results","Text formatted with heading styles (e.g. Heading 1)"],3,"Microsoft Support states that a table of contents is based on the headings in the document; missing entries usually occur because headings are not formatted with heading styles.","https://support.microsoft.com/en-us/office/insert-a-table-of-contents-882e8564-0edb-435e-84b5-1d8552ccf0c0"],["Q0976",4,9,28,"Microsoft Support 'Insert a table of contents', note on 'Manual Table of Contents'",2,"In Microsoft Word, what happens if you insert a table of contents using a 'Manual Table of Contents' style?",["Word builds it from headings but only updates it when the document is printed","Word builds it from headings and updates it automatically on every edit","Word uses placeholder text you type yourself and cannot update it from the headings","Word builds it from bookmarks instead of headings"],2,"Microsoft Support notes that with a Manual Table of Contents style Word won't use your headings and won't be able to update it automatically; it uses placeholder text.","https://support.microsoft.com/en-us/office/insert-a-table-of-contents-882e8564-0edb-435e-84b5-1d8552ccf0c0"],["Q0977",4,9,28,"Microsoft Support 'Use mail merge for bulk email, letters, labels, and envelopes', introduction",1,"In a Microsoft Word mail merge, what are the placeholders that tell Word where to insert information from the data source called?",["Content controls","Quick Parts","Merge fields","Field codes for cross-references"],2,"Microsoft Support states that placeholders called merge fields tell Word where in the document to include information from the data source.","https://support.microsoft.com/en-us/office/use-mail-merge-for-bulk-email-letters-labels-and-envelopes-f488ed5b-b849-4c11-9cff-932c49474705"],["Q0978",4,9,28,"Microsoft Support 'Keyboard shortcuts in Word', section 'Apply styles' / 'Insert special characters'",1,"In Microsoft Word for Windows, which keyboard shortcut applies the Heading 1 style to the current paragraph?",["Ctrl+Shift+N","Ctrl+Alt+1","Ctrl+1","Alt+Shift+1"],1,"Microsoft Support lists Ctrl+Alt+1 for Heading 1 (Ctrl+Shift+N applies the Normal style; Ctrl+1 sets single spacing).","https://support.microsoft.com/en-us/office/keyboard-shortcuts-in-word-95ef89dd-7142-4b50-afb2-f762f663ceb2"],["Q0979",4,9,28,"Microsoft Support 'XLOOKUP function', section 'Syntax' ([match_mode])",1,"In Microsoft Excel, what match type does XLOOKUP use if the match_mode argument is omitted?",["Approximate match, returning the next smaller item","Exact match, returning #N/A if none is found","Approximate match, requiring a sorted lookup array","Wildcard match where * and ? have special meaning"],1,"Microsoft Support states that match_mode 0 (exact match, #N/A if none found) is the default.","https://support.microsoft.com/en-us/office/xlookup-function-b7fd680e-6d10-43e6-84f9-88eae8bf5929"],["Q0980",4,9,28,"Microsoft Support 'XLOOKUP function', section 'Syntax' ([if_not_found])",0,"In Microsoft Excel, what does XLOOKUP return when no valid match is found and the [if_not_found] argument is missing?",["#VALUE!","#REF!","0","#N/A"],3,"Microsoft Support states that if a valid match is not found and [if_not_found] is missing, #N/A is returned.","https://support.microsoft.com/en-us/office/xlookup-function-b7fd680e-6d10-43e6-84f9-88eae8bf5929"],["Q0981",4,9,28,"Microsoft Support 'VLOOKUP function', section 'Syntax' (range_lookup)",1,"In Microsoft Excel, what does VLOOKUP do if the range_lookup argument is left out?",["It performs an exact match (FALSE), whether or not the column is sorted","It returns #N/A until a range_lookup argument is provided","It performs an approximate match (TRUE), assuming a sorted first column","It performs a wildcard match using the * and ? characters"],2,"Microsoft Support states approximate match (1/TRUE) is the default method if none is specified.","https://support.microsoft.com/en-us/office/vlookup-function-0bbc8083-26fe-4963-8ab8-93a18ad188a1"],["Q0982",4,9,28,"Microsoft Support 'VLOOKUP function', section 'Common Problems'",2,"In Microsoft Excel, which error does VLOOKUP return when col_index_num is greater than the number of columns in table_array?",["#N/A","#VALUE!","#NAME?","#REF!"],3,"Microsoft Support states that if col_index_num is greater than the number of columns in table_array, you get #REF!.","https://support.microsoft.com/en-us/office/vlookup-function-0bbc8083-26fe-4963-8ab8-93a18ad188a1"],["Q0983",4,9,28,"Microsoft Support 'SUMIF function', section 'Syntax'",1,"In Microsoft Excel, what does the formula =SUMIF(B2:B5,\"John\",C2:C5) calculate?",["The sum of the values in C2:C5 where the corresponding cells in B2:B5 equal \"John\"","The sum of the values in B2:B5 where the corresponding cells in C2:C5 equal \"John\"","The number of cells in B2:B5 that equal \"John\"","The sum of C2:C5 only if every cell in B2:B5 equals \"John\""],0,"Microsoft Support gives this example: it sums only the values in C2:C5 where the corresponding cells in B2:B5 equal \"John\".","https://support.microsoft.com/en-us/office/sumif-function-169b8c99-c05c-4483-a712-1697a653039b"],["Q0984",4,9,28,"Microsoft Support 'Switch between relative, absolute, and mixed references'",2,"In Microsoft Excel, a formula containing the reference A$1 is copied two cells down and two cells to the right. What does the reference become?",["A$3","C$3","$A$1","C$1"],3,"Microsoft Support's table shows A$1 (relative column, absolute row) becomes C$1 when copied two cells down and two right.","https://support.microsoft.com/en-us/office/switch-between-relative-absolute-and-mixed-references-dfec08cd-ae65-4f56-839e-5f0d8d0baca9"],["Q0985",4,9,28,"Microsoft Support 'Switch between relative, absolute, and mixed references'",0,"In Microsoft Excel, which key do you press in the formula bar to switch a selected cell reference between relative, absolute and mixed types?",["F4","F2","F9","F11"],0,"Microsoft Support states: select the reference in the formula bar and press F4 to switch between reference types.","https://support.microsoft.com/en-us/office/switch-between-relative-absolute-and-mixed-references-dfec08cd-ae65-4f56-839e-5f0d8d0baca9"],["Q0986",4,9,28,"Microsoft Support 'Create a PivotTable to analyze worksheet data', section 'Summarize Values By'",1,"In a Microsoft Excel PivotTable, how are fields placed in the Values area summarised by default?",["As a SUM, or as a COUNT if Excel interprets the data as text","As an AVERAGE, or as a COUNT if Excel interprets the data as text","As a COUNT in all cases, whatever the data type","As a SUM in all cases, with text values shown as zero"],0,"Microsoft Support states Values fields display as SUM by default, but as COUNT if Excel interprets the data as text.","https://support.microsoft.com/en-us/office/create-a-pivottable-to-analyze-worksheet-data-a9a84538-bfe9-40a9-a8e9-f99134456576"],["Q0987",4,9,28,"Microsoft Support 'Freeze panes to lock rows and columns', section 'Freeze columns and rows'",1,"In Microsoft Excel, to keep both some top rows and some left columns visible while scrolling, which cell should you select before choosing View > Freeze Panes > Freeze Panes?",["The last cell of the rows and columns you want to keep visible","The cell below the rows and to the right of the columns you want to keep visible","Cell A1","The cell above the rows and to the left of the columns that you want to keep visible"],1,"Microsoft Support states Freeze Panes freezes the rows above and columns left of the selected cell, so you select the cell below and to the right.","https://support.microsoft.com/en-us/office/freeze-panes-to-lock-rows-and-columns-dab2ffc9-020d-4026-8121-67dd25f2508f"],["Q0988",4,9,28,"Microsoft Support 'Keyboard shortcuts in Excel', section 'Keyboard shortcuts for formatting cells'",0,"In Microsoft Excel for Windows, which keyboard shortcut enters the current date in the active cell?",["Ctrl+Shift+Colon (:)","Ctrl+D","Ctrl+Grave accent (`)","Ctrl+Semicolon (;)"],3,"Microsoft Support lists Ctrl+; to enter the current date (Ctrl+Shift+: enters the current time; Ctrl+` toggles formula display).","https://support.microsoft.com/en-us/office/keyboard-shortcuts-in-excel-1798d9d5-842a-42b8-9c99-9b7213f0040f"],["Q0989",4,9,28,"Microsoft Support 'What is a slide master in PowerPoint?', introduction",0,"In Microsoft PowerPoint, how do you open Slide Master view to apply the same fonts and logos to all slides?",["Design tab > Slide Master","Insert tab > Slide Master","Home tab > Layout > Slide Master","View tab > Slide Master"],3,"Microsoft Support states: to open Slide Master view, on the View tab select Slide Master.","https://support.microsoft.com/en-us/office/what-is-a-slide-master-b9abb2a0-7aef-4257-a14e-4329c904da54"],["Q0990",4,9,28,"Microsoft Support 'What is a slide master in PowerPoint?', Note",1,"According to Microsoft guidance on PowerPoint slide masters, when is it best to edit the slide master and layout masters?",["After all slides are finished, to apply changes once","Before you start creating individual slides","Only when presenting in Presenter View","Only after saving the file as a template"],1,"Microsoft Support advises editing the slide master and layouts before creating slides; otherwise you must reapply changed layouts to existing slides.","https://support.microsoft.com/en-us/office/what-is-a-slide-master-b9abb2a0-7aef-4257-a14e-4329c904da54"],["Q0991",4,9,28,"Microsoft Support 'What is a slide master in PowerPoint?', introduction",1,"In Microsoft PowerPoint Normal view you cannot remove a picture that appears on every slide. According to Microsoft, what is the most likely reason?",["The picture is locked by the theme's colour palette and font set","The presentation is open in Read-Only mode","The picture is defined on the slide master or a layout master","The picture is embedded in the slide notes"],2,"Microsoft Support explains that an element you cannot edit in Normal view may be defined on the slide master or a layout master, requiring Slide Master view.","https://support.microsoft.com/en-us/office/what-is-a-slide-master-b9abb2a0-7aef-4257-a14e-4329c904da54"],["Q0992",4,9,28,"Microsoft Support 'Use keyboard shortcuts to deliver PowerPoint presentations', section 'Frequently used shortcuts'",0,"In Microsoft PowerPoint for Windows, which shortcut starts the slide show from the current slide?",["Shift+F5","F5","Alt+F5","Ctrl+Shift+F5"],0,"Microsoft Support lists F5 to start from the beginning, Shift+F5 from the current slide, and Alt+F5 in Presenter View.","https://support.microsoft.com/en-us/office/use-keyboard-shortcuts-to-deliver-powerpoint-presentations-1524ffce-bd2a-45f4-9a7f-f18b992b93a0"],["Q0993",4,9,28,"Microsoft Support 'Use keyboard shortcuts to deliver PowerPoint presentations', section 'Frequently used shortcuts'",1,"During a Microsoft PowerPoint slide show on Windows, which key displays a blank black slide (or returns from it)?",["W or Comma (,) key","B or Period (.)","H","Ctrl+H"],1,"Microsoft Support lists B or Period for a blank black slide; W or Comma gives a blank white slide.","https://support.microsoft.com/en-us/office/use-keyboard-shortcuts-to-deliver-powerpoint-presentations-1524ffce-bd2a-45f4-9a7f-f18b992b93a0"],["Q0994",4,9,28,"Microsoft Support 'Use keyboard shortcuts to create PowerPoint presentations', section 'Frequently used shortcuts'",0,"In Microsoft PowerPoint for Windows, which keyboard shortcut adds a new slide?",["Ctrl+M","Ctrl+N","Ctrl+D","Ctrl+Shift+N"],0,"Microsoft Support lists Ctrl+M to add a new slide (Ctrl+N creates a new presentation).","https://support.microsoft.com/en-us/office/use-keyboard-shortcuts-to-create-powerpoint-presentations-ebb3d20e-dcd4-444f-a38e-bb5c5ed180f4"],["Q0995",4,9,28,"Microsoft Support 'Manage email messages by using rules in Outlook', section 'Create an inbox rule for new Outlook for Windows'",1,"According to Microsoft guidance on Outlook rules, what are the three things every rule needs at minimum?",["A sender, a folder and a schedule","A condition, an exception and a folder","A name, a condition and an action","A name, a category and an importance level"],2,"Microsoft Support states every rule needs at least a name, a condition and an action; it can also contain exceptions.","https://support.microsoft.com/en-us/office/manage-email-messages-by-using-rules-in-outlook-c24f5dea-9465-4df4-ad17-a50704d66c59"],["Q0996",4,9,28,"Microsoft Support 'Manage email messages by using rules in Outlook', section 'Create an inbox rule'",1,"When creating a rule in Outlook, which option prevents any further rules from running on a message after this rule has run?",["Stop processing more rules","Run rules on existing messages","Disable this rule after it runs","Add an exception to the rule"],0,"Microsoft Support states that if you don't want more rules to run after this one, select the 'Stop processing more rules' check box.","https://support.microsoft.com/en-us/office/manage-email-messages-by-using-rules-in-outlook-c24f5dea-9465-4df4-ad17-a50704d66c59"],["Q0997",4,9,28,"Microsoft Support 'Manage email messages by using rules in Outlook', sections 'Set the order' and 'Run inbox rules on existing messages'",2,"In new Outlook for Windows, which statement about inbox rules is correct?",["Rules run alphabetically by name and automatically on all existing messages","Rules run in list order and, by default, only on messages arriving after creation","Rules run in creation order, which cannot be changed after they are saved","Rules run only on messages already in the Inbox when the rule is saved"],1,"Microsoft Support states rules are applied in the order they appear in the list (changeable with arrows) and by default run on incoming messages after creation.","https://support.microsoft.com/en-us/office/manage-email-messages-by-using-rules-in-outlook-c24f5dea-9465-4df4-ad17-a50704d66c59"],["Q0998",4,9,28,"Microsoft Support 'How to recall an email in Outlook', section 'Summary'",1,"According to Microsoft, under what conditions can you recall a sent email in Outlook for Windows or Outlook on the web?",["The recipient uses any Outlook client or webmail service, and the message was sent less than 24 hours ago","The message was sent from a personal Outlook.com account to any recipient, and it is still unread","The recipient belongs to any organization, and the message has no attachments or protection","Both use Microsoft 365 work or school accounts in the same organization, and the recipient hasn't opened it"],3,"Microsoft Support states recall works only if both have Microsoft 365 work or school accounts in the same organization and the recipient hasn't opened the message.","https://support.microsoft.com/en-us/office/recall-or-replace-an-email-message-that-you-sent-35027f88-d655-4554-b4f8-6c0729a723a0"],["Q0999",4,9,28,"Microsoft Support 'How to recall an email in Outlook', section 'To recall and replace a message in classic Outlook'",2,"In classic Outlook, what must you do with the sent message before you can use 'Recall This Message'?",["Select it so it appears in the Reading Pane","Open it by double-clicking it in Sent Items","Move it from Sent Items to the Drafts folder","Flag it for follow-up in the Sent Items folder"],1,"Microsoft Support states you must double-click to open the message; selecting it so it appears in the reading pane won't allow you to recall it.","https://support.microsoft.com/en-us/office/recall-or-replace-an-email-message-that-you-sent-35027f88-d655-4554-b4f8-6c0729a723a0"],["Q1000",4,9,28,"Microsoft Support 'Share an Outlook calendar as view-only with others', section 'Share a calendar with others in new Outlook'",0,"When sharing your calendar in Outlook, which permission lets the other person see only when you are busy, without any details of your items?",["Can view when I'm busy","Can view titles and locations","Can view all details","Can edit"],0,"Microsoft Support states 'Can view when I'm busy' gives permission to see only when you are busy, not the details of items.","https://support.microsoft.com/en-us/office/share-an-outlook-calendar-with-other-people-353ed2c1-3ec5-449d-8c73-6931a0adab88"]]}</script>
<script>
(()=>{
const DB=JSON.parse(document.getElementById('db').textContent);
const TOPIC_SHORT=["EU law, Frontex and EU institutions","Fundamental rights","Ethics and codes of conduct","Leadership","ICT – Microsoft Office"];
const SRC_SHORT={
"EBCG Regulation (EU) 2019/1896":"EBCG Regulation 2019/1896",
"Technical and Operational Strategy for European Integrated Border Management 2023-2027 (EIBM Strategy)":"EIBM Strategy 2023-2027",
"Frontex Capability Roadmap":"Frontex Capability Roadmap",
"Frontex Annual Risk Analysis 2025-2026":"Annual Risk Analysis 2025-2026",
"Frontex website":"Frontex website",
"MBD 6/2025 on EBCG Standing Corps profiles for 2026":"MBD 6/2025 Standing Corps profiles",
"European cooperation on coast guard functions":"Coast guard cooperation",
"EU's geopolitical situation - The cost for EU Member States of proximity to war":"Geopolitics – cost of proximity to war",
"Research Study on Polycrisis - Its influence on trust and legitimacy of Policing and Border Security (Frontex)":"Polycrisis research study",
"Schengen Borders Code (Regulation (EU) 2016/399, consolidated 12.10.2025)":"Schengen Borders Code",
"Schengen Borders and visa (DG HOME page)":"Schengen borders and visa (DG HOME)",
"Pact on Migration and Asylum":"Pact on Migration and Asylum",
"European Internal Security Strategy 2025 (ProtectEU, COM(2025) 148)":"ProtectEU – Internal Security Strategy",
"Agencies - European Commission (DG HOME)":"DG HOME agencies",
"Staff Regulations of Officials and CEOS of the EU (Regulation No 31 (EEC), 11 (EAEC))":"Staff Regulations and CEOS",
"European Union priorities 2024-2029":"EU priorities 2024-2029",
"Types of institutions, bodies and agencies (european-union.europa.eu)":"EU institutions, bodies and agencies",
"EU budget 2028-2034 (Commission proposal for the next MFF)":"EU budget 2028-2034",
"Charter of Fundamental Rights of the EU":"Charter of Fundamental Rights",
"1951 Convention and 1967 Protocol Relating to the Status of Refugees (UNHCR)":"Refugee Convention 1951/1967",
"SOLAS Convention (IMO)":"SOLAS Convention",
"SAR Convention 1979 (IMO)":"SAR Convention 1979",
"Fundamental rights at Frontex":"Fundamental rights at Frontex",
"Code of Conduct for Return Operations and Return Interventions coordinated or organised by Frontex":"Code of Conduct – return operations",
"Code of Conduct for all persons participating in Frontex operational activities":"Code of Conduct – operational activities",
"MBD 16/2019 Frontex policy on protecting the dignity of the person and preventing psychological and sexual harassment":"Harassment policy (MBD 16/2019)",
"Ethics in Law Enforcement – Open Textbook, Chapters 7.5 and 7.6":"Ethics in Law Enforcement 7.5–7.6",
"Campbell, I. & Kodz, J. (2011) What makes great police leadership? A Rapid Evidence Review, NPIA":"Campbell & Kodz – police leadership"};
const LEAD_SRC=new Set([
"EU's geopolitical situation - The cost for EU Member States of proximity to war",
"Research Study on Polycrisis - Its influence on trust and legitimacy of Policing and Border Security (Frontex)",
"Ethics in Law Enforcement – Open Textbook, Chapters 7.5 and 7.6",
"Campbell, I. & Kodz, J. (2011) What makes great police leadership? A Rapid Evidence Review, NPIA"].map(s=>DB.sources.indexOf(s)));
const srcName=i=>SRC_SHORT[DB.sources[i]]||DB.sources[i];
const DIFF=["Easy","Medium","Hard"];
const L="ABCD";
const Q=DB.q.map(r=>({id:r[0],t:r[1],s:r[3],ref:r[4],d:r[5],q:r[6],o:r[7],c:r[8],ex:r[9],url:r[10]}));
const byId=new Map(Q.map(q=>[q.id,q]));
const EXAM_N=50, EXAM_MIN=60;

/* storage (per browser, optional) */
const store={get(k,d){try{const v=localStorage.getItem('fxq_en.'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('fxq_en.'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('fxq_en.'+k)}catch(e){}}};

let prefs=Object.assign({lead:true,fresh:true,topics:[0,1,2,3,4],src:-1,n:20,feedback:true},store.get('prefs',{}));
let S=null; // active session
let view='home', revFilter='all', modal=null, tick=null;

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=(x,d=2)=>x.toLocaleString('en-GB',{minimumFractionDigits:d,maximumFractionDigits:d});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function pool(kind){
  if(kind==='exam') return Q.filter(q=>prefs.lead||(!LEAD_SRC.has(q.s)&&q.t!==3));
  if(kind==='wrong'){const w=new Set(store.get('wrong',[]));return Q.filter(q=>w.has(q.id))}
  return Q.filter(q=>prefs.src>=0?q.s===prefs.src:prefs.topics.includes(q.t));
}
function pick(list,n){
  const seen=new Set(store.get('seen',[]));
  if(!prefs.fresh) return shuffle(list.slice()).slice(0,n);
  const a=shuffle(list.filter(q=>!seen.has(q.id))), b=shuffle(list.filter(q=>seen.has(q.id)));
  return a.concat(b).slice(0,n);
}
function start(kind){
  const p=pool(kind); if(!p.length) return;
  const n=kind==='exam'?EXAM_N:Math.min(prefs.n,p.length);
  const qs=pick(p,n);
  S={kind,ids:qs.map(q=>q.id),ans:qs.map(()=>null),flag:qs.map(()=>false),locked:qs.map(()=>false),cur:0,
     startAt:Date.now(),endAt:kind==='exam'?Date.now()+EXAM_MIN*60000:null,done:false,feedback:kind!=='exam'&&prefs.feedback};
  view='quiz'; save(); render(); runClock();
}
function save(){ if(S&&!S.done) store.set('active',S); else store.del('active'); }

function score(s){
  let c=0,w=0,b=0; s.ids.forEach((id,i)=>{const a=s.ans[i]; if(a===null)b++; else if(a===byId.get(id).c)c++; else w++});
  const n=s.ids.length; return {c,w,b,n,net:c-w,vote:(c-w)/n*10};
}
function finish(auto){
  clearInterval(tick); S.done=true; S.endedAt=Date.now(); S.auto=!!auto;
  const sc=score(S);
  const seen=new Set(store.get('seen',[])); S.ids.forEach(id=>seen.add(id)); store.set('seen',[...seen]);
  const wrong=new Set(store.get('wrong',[]));
  S.ids.forEach((id,i)=>{const a=S.ans[i]; if(a===null) return; if(a===byId.get(id).c) wrong.delete(id); else wrong.add(id)});
  store.set('wrong',[...wrong]);
  const hist=store.get('hist',[]); hist.unshift({at:S.endedAt,kind:S.kind,n:sc.n,c:sc.c,w:sc.w,b:sc.b,vote:sc.vote,mins:Math.round((S.endedAt-S.startAt)/60000)});
  store.set('hist',hist.slice(0,30));
  store.del('active'); view='result'; revFilter='all'; modal=null; render(); window.scrollTo(0,0);
}
function runClock(){
  clearInterval(tick); if(!S||!S.endAt||S.done) return;
  tick=setInterval(()=>{const left=S.endAt-Date.now(); if(left<=0){finish(true);return} const el=document.getElementById('clock'); if(el){el.textContent=clock(left); el.classList.toggle('low',left<5*60000)}},500);
}
function clock(ms){ms=Math.max(0,ms);const t=Math.ceil(ms/1000),m=Math.floor(t/60),s=t%60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}

/* ---------- views ---------- */
function render(){
  const app=document.getElementById('app');
  app.innerHTML=(view==='home'?home():view==='quiz'?quiz():result())+(modal?modalHtml():'');
  if(view==='quiz'){const el=document.getElementById('clock'); if(el&&S.endAt){el.textContent=clock(S.endAt-Date.now())}}
}
function installHint(){
  const standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
  if(standalone||store.get('hideInstall',false)) return '';
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const how=ios?'In Safari, tap the <b>Share</b> button, then <b>Add to Home Screen</b>.':'In Chrome, open the <b>⋮</b> menu, then <b>Add to Home screen</b> or <b>Install app</b>.';
  return `<div class="tip" style="display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px"><span><b>Install it on your phone.</b> ${how} It then opens like an app and works offline.</span><button class="btn ghost" data-act="hide-install">Dismiss</button></div>`;
}
function home(){
  const hist=store.get('hist',[]), wrongN=store.get('wrong',[]).length, seenN=store.get('seen',[]).length;
  const ep=pool('exam').length;
  const topicsOpts=TOPIC_SHORT.map((t,i)=>`<label class="check"><input type="checkbox" id="tp${i}" data-topic="${i}" ${prefs.topics.includes(i)?'checked':''}><span>${t} <span class="muted mono">(${Q.filter(q=>q.t===i).length})</span></span></label>`).join('');
  const srcOpts=`<option value="-1">All sources in the selected topics</option>`+DB.sources.map((s,i)=>`<option value="${i}" ${prefs.src===i?'selected':''}>${esc(srcName(i))} (${Q.filter(q=>q.s===i).length})</option>`).join('');
  const prac=pool('practice').length;
  return `
  ${installHint()}<header class="hero">
    <span class="eyebrow">Question bank: ${Q.length} questions · 29 reference sources</span>
    <h1>Frontex Exam Simulator</h1>
    <p class="muted" style="margin:0;max-width:62ch">Multiple-choice test that follows the selection rules: four options, one correct answer. Questions are drawn from the official reference material for the Frontex selection procedure.</p>
    <div class="rules"><span class="chip">50 questions</span><span class="chip">60 minutes</span><span class="chip g">+1 correct</span><span class="chip b">−1 wrong</span><span class="chip">0 unanswered</span><span class="chip">score = (C − W) ÷ 50 × 10</span></div>
  </header>
  <div class="modes">
    <section class="panel mode exam">
      <span class="eyebrow">Exam mode</span>
      <h2>Full exam simulation</h2>
      <p class="muted" style="margin:0">50 questions drawn at random from the whole bank, a 60-minute timer, automatic submission when time runs out. Answers are marked only at the end.</p>
      <div class="opts">
        <label class="check"><input type="checkbox" id="lead" ${prefs.lead?'checked':''}><span>Include material that applies <b>only to leadership positions</b> (geopolitics, polycrisis, ethics, leadership)</span></label>
        <label class="check"><input type="checkbox" id="fresh" ${prefs.fresh?'checked':''}><span>Prioritise questions you have not seen yet <span class="muted mono">(${seenN}/${Q.length} seen)</span></span></label>
      </div>
      <div class="row"><button class="btn primary" data-act="start-exam">Start the exam</button><span class="muted mono" style="font-size:.85rem">pool: ${ep} questions</span></div>
      <p class="tip" style="margin:0"><b>When guessing pays off.</b> With −1 for a wrong answer, a blind guess among 4 options is worth −0.5 points on average. If you can rule out 2 options for certain, a guess breaks even on average; rule out 3 and the answer is certain. If you cannot rule anything out, leave it blank.</p>
    </section>
    <section class="panel mode">
      <span class="eyebrow">Practice mode</span>
      <h2>By topic or by source</h2>
      <div class="opts">${topicsOpts}</div>
      <label class="field" for="src">Specific source<select id="src">${srcOpts}</select></label>
      <div class="row">
        <label class="field" for="nq">Number of questions<select id="nq">${[10,20,30,50,100].map(n=>`<option ${prefs.n===n?'selected':''}>${n}</option>`).join('')}</select></label>
        <label class="check" style="align-self:end"><input type="checkbox" id="fb" ${prefs.feedback?'checked':''}><span>Show the correct answer after each question</span></label>
      </div>
      <div class="row"><button class="btn primary" data-act="start-practice" ${prac?'':'disabled'}>Start practice</button><span class="muted mono" style="font-size:.85rem">pool: ${prac}</span></div>
      <div class="row" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn" data-act="start-wrong" ${wrongN?'':'disabled'}>Review my mistakes</button><span class="muted" style="font-size:.85rem">${wrongN?`${wrongN} wrongly answered questions to review`:'Questions you get wrong are collected here'}</span></div>
    </section>
  </div>
  <div class="grid2">
    <section class="panel"><h3 style="margin-bottom:8px">Recent attempts</h3>${hist.length?`<div class="tablebox"><table><thead><tr><th>Date</th><th>Type</th><th class="num">C/W/U</th><th class="num">Score</th></tr></thead><tbody>${hist.slice(0,8).map(h=>`<tr><td>${new Date(h.at).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</td><td>${h.kind==='exam'?'Exam':h.kind==='wrong'?'Mistakes':'Practice'} <span class="muted mono">· ${h.n}</span></td><td class="num">${h.c}/${h.w}/${h.b}</td><td class="num"><b>${fmt(h.vote)}</b></td></tr>`).join('')}</tbody></table></div>`:`<p class="muted" style="margin:0">No attempts yet. Results are saved in this browser only.</p>`}</section>
    <section class="panel"><h3 style="margin-bottom:8px">Question bank by topic</h3><div class="tablebox"><table><thead><tr><th>Topic</th><th class="num">Questions</th></tr></thead><tbody>${TOPIC_SHORT.map((t,i)=>`<tr><td>${t}</td><td class="num">${Q.filter(q=>q.t===i).length}</td></tr>`).join('')}</tbody></table></div><p class="muted" style="font-size:.82rem;margin:8px 0 0">C/W/U = correct / wrong / unanswered.</p></section>
  </div>
  <p class="muted" style="font-size:.8rem;margin:24px 0 0;max-width:75ch">Independent study tool, not affiliated with or endorsed by Frontex. Every question cites the article or section of the public reference document it is based on; check figures that may change (fees, dates, staff numbers) against the current sources before the test. Your progress is stored only in this browser.</p>`;
}
function quiz(){
  const i=S.cur, q=byId.get(S.ids[i]), a=S.ans[i], n=S.ids.length, answered=S.ans.filter(x=>x!==null).length;
  const reveal=S.feedback&&S.locked[i];
  const opts=q.o.map((o,k)=>{let cls='ans'; if(reveal){ if(k===q.c)cls+=' ok'; else if(k===a)cls+=' ko'} else if(a===k)cls+=' sel';
    return `<button class="${cls}" data-ans="${k}" ${reveal?'disabled':''} aria-pressed="${a===k}"><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`}).join('');
  const nav=S.ids.map((id,k)=>{let c='nb'; if(S.feedback&&S.locked[k]) c+=S.ans[k]===byId.get(id).c?' ok':' ko'; else if(S.ans[k]!==null)c+=' a'; if(S.flag[k])c+=' f'; if(k===i)c+=' cur'; return `<button class="${c}" data-go="${k}" aria-label="Question ${k+1}">${k+1}</button>`}).join('');
  const unflagged=S.flag.filter(Boolean).length;
  return `
  <div class="bar"><div class="in">
    ${S.endAt?`<span class="clock" id="clock" aria-live="off">--:--</span>`:`<span class="eyebrow">${S.kind==='wrong'?'Mistake review':'Practice'}</span>`}
    <div class="prog"><span class="mono" style="font-size:.82rem">Question ${i+1} of ${n} · answered ${answered}</span><div class="track"><i style="width:${answered/n*100}%"></i></div></div>
    <button class="btn ghost" data-act="ask-quit">Quit</button>
    <button class="btn primary" data-act="ask-submit">Submit</button>
  </div></div>
  <div class="qlayout">
    <section class="panel qcard">
      <div class="qmeta"><span class="eyebrow">${TOPIC_SHORT[q.t]}</span>${S.kind==='exam'?'':`<span class="eyebrow">· ${esc(srcName(q.s))}</span>`}<span class="eyebrow mono" style="margin-left:auto">${q.id}</span></div>
      <p class="qtext" lang="en">${esc(q.q)}</p>
      <div class="answers" lang="en">${opts}</div>
      ${reveal?`<div class="explain"><b style="color:${a===q.c?'var(--good)':'var(--bad)'}">${a===q.c?'Correct (+1)':'Wrong (−1) · correct answer: '+L[q.c]}</b><span lang="en">${esc(q.ex)}</span><span class="muted" style="font-size:.84rem">${esc(srcName(q.s))} · ${esc(q.ref)} · <a href="${esc(q.url)}" target="_blank" rel="noopener">source</a></span></div>`:''}
      <div class="ctrl">
        <div class="row"><button class="btn" data-act="prev" ${i===0?'disabled':''}>← Previous</button><button class="btn" data-act="next" ${i===n-1?'disabled':''}>Next →</button></div>
        <div class="row">
          ${S.feedback?(a!==null&&!S.locked[i]?`<button class="btn primary" data-act="lock">Confirm answer</button>`:''):`<button class="btn" data-act="clear" ${a===null?'disabled':''}>Clear answer</button>`}
          <button class="btn ${S.flag[i]?'flagon':''}" data-act="flag">${S.flag[i]?'Flagged':'Flag for later'}</button>
        </div>
      </div>
      <p class="muted" style="font-size:.8rem;margin:0">Keyboard: A–D or 1–4 to answer, ← → to move, F to flag${S.feedback?', Enter to confirm':''}.</p>
    </section>
    <aside class="panel rail">
      <div class="counts"><div><b>${answered}</b><small>answered</small></div><div><b>${n-answered}</b><small>blank</small></div><div><b>${unflagged}</b><small>flagged</small></div></div>
      <div class="navgrid">${nav}</div>
      <div class="legend"><span><i class="sw" style="background:var(--accent);border-color:var(--accent)"></i>answered</span><span><i class="sw"></i>blank</span><span><i class="sw" style="background:var(--flag);border-color:var(--flag);border-radius:50%"></i>flagged</span></div>
    </aside>
  </div>`;
}
function result(){
  const sc=score(S), n=sc.n;
  const per=TOPIC_SHORT.map((t,ti)=>{let c=0,w=0,b=0; S.ids.forEach((id,k)=>{const q=byId.get(id); if(q.t!==ti)return; const a=S.ans[k]; if(a===null)b++; else if(a===q.c)c++; else w++}); return {t,c,w,b,n:c+w+b}}).filter(x=>x.n);
  const items=S.ids.map((id,k)=>({k,q:byId.get(id),a:S.ans[k],f:S.flag[k]})).filter(x=>revFilter==='all'||(revFilter==='ko'&&x.a!==null&&x.a!==x.q.c)||(revFilter==='bl'&&x.a===null)||(revFilter==='ok'&&x.a===x.q.c)||(revFilter==='fl'&&x.f));
  const mins=Math.round((S.endedAt-S.startAt)/60000);
  return `
  <header class="hero"><span class="eyebrow">${S.kind==='exam'?'Exam simulation':S.kind==='wrong'?'Mistake review':'Practice'} · ${n} questions · ${mins} min${S.auto?' · submitted automatically when time ran out':''}</span><h1>Result</h1></header>
  <section class="panel score">
    <div class="big">${fmt(sc.vote)}<small> / 10</small></div>
    <div class="stack" style="gap:10px">
      <div class="tally"><div class="g"><b>${sc.c}</b>correct</div><div class="r"><b>${sc.w}</b>wrong</div><div><b>${sc.b}</b>unanswered</div><div><b>${sc.net>0?'+':''}${sc.net}</b>net points</div></div>
      <span class="formula">(${sc.c} − ${sc.w}) ÷ ${n} × 10 = ${fmt(sc.vote)}</span>
    </div>
  </section>
  <div class="grid2">
    <section class="panel"><h3 style="margin-bottom:12px">By topic</h3><div class="bars">${per.map(p=>`<div class="barrow"><div><div>${p.t}</div><div class="stackbar"><i style="width:${p.c/p.n*100}%;background:var(--good)"></i><i style="width:${p.w/p.n*100}%;background:var(--bad)"></i></div></div><div class="mono" style="font-size:.82rem;text-align:right">${p.c}/${p.w}/${p.b} · ${p.c-p.w>0?'+':''}${p.c-p.w}</div></div>`).join('')}</div><p class="muted" style="font-size:.8rem;margin:10px 0 0">Correct / wrong / unanswered · net points.</p></section>
    <section class="panel stack" style="align-content:start;gap:12px"><h3>Next step</h3>
      <p class="muted" style="margin:0">${sc.w?`The ${sc.w} wrongly answered questions were added to your mistake review.`:'No mistakes in this attempt.'} ${sc.b&&S.kind==='exam'?`You left ${sc.b} questions blank: check in the review which ones you could have reasoned out.`:''}</p>
      <div class="row"><button class="btn primary" data-act="again">${S.kind==='exam'?'New exam':'New practice'}</button><button class="btn" data-act="home">Back to start</button></div></section>
  </div>
  <section style="margin-top:22px" class="stack">
    <div class="row" style="justify-content:space-between"><h2>Review</h2>
      <div class="filters">${[['all','All',n],['ko','Wrong',sc.w],['bl','Unanswered',sc.b],['ok','Correct',sc.c],['fl','Flagged',S.flag.filter(Boolean).length]].map(([k,l,c])=>`<button class="btn ${revFilter===k?'on':''}" data-filter="${k}">${l} <span class="mono">${c}</span></button>`).join('')}</div></div>
    <div class="rev">${items.length?items.map(({k,q,a})=>{const st=a===null?'bl':a===q.c?'ok':'ko';
      return `<article class="revq"><div class="qmeta"><span class="mono" style="font-weight:600">${k+1}.</span><span class="status ${st}">${st==='ok'?'correct +1':st==='ko'?'wrong −1':'unanswered 0'}</span><span class="eyebrow">${esc(srcName(q.s))}</span><span class="eyebrow mono" style="margin-left:auto">${q.id}</span></div>
      <p style="margin:0;font-weight:500" lang="en">${esc(q.q)}</p>
      <div class="answers" lang="en">${q.o.map((o,j)=>`<div class="ans ${j===q.c?'ok':j===a?'ko':''}"><span class="k">${L[j]}</span><span>${esc(o)}</span></div>`).join('')}</div>
      <div class="explain"><span lang="en">${esc(q.ex)}</span><span class="muted" style="font-size:.84rem">${esc(q.ref)} · <a href="${esc(q.url)}" target="_blank" rel="noopener">source</a></span></div></article>`}).join(''):`<p class="muted">No questions match this filter.</p>`}</div>
  </section>`;
}
function modalHtml(){
  if(modal==='submit'){const b=S.ans.filter(x=>x===null).length,f=S.flag.filter(Boolean).length;
    return `<div class="scrim"><div class="panel modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Submit the test?</h2><p style="margin:0">${b?`You have <b>${b}</b> unanswered questions: they score 0.`:'You have answered every question.'}${f?` You still have <b>${f}</b> flagged questions.`:''}${S.endAt?` Time left: <span class="mono">${clock(S.endAt-Date.now())}</span>.`:''}</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Back to the test</button><button class="btn primary" data-act="submit">Submit and mark</button></div></div></div>`}
  return `<div class="scrim"><div class="panel modal" role="dialog" aria-modal="true" aria-labelledby="mt"><h2 id="mt">Quit the test?</h2><p style="margin:0">Your answers so far will be lost and the attempt will not be recorded.</p><div class="row" style="justify-content:flex-end"><button class="btn" data-act="close">Continue the test</button><button class="btn danger" data-act="quit">Quit</button></div></div></div>`;
}

/* ---------- events ---------- */
function savePrefs(){store.set('prefs',prefs)}
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='lead'){prefs.lead=t.checked}
  else if(t.id==='fresh'){prefs.fresh=t.checked}
  else if(t.id==='fb'){prefs.feedback=t.checked}
  else if(t.id==='src'){prefs.src=+t.value}
  else if(t.id==='nq'){prefs.n=+t.value}
  else if(t.dataset.topic!==undefined){const i=+t.dataset.topic; prefs.topics=t.checked?[...new Set([...prefs.topics,i])].sort():prefs.topics.filter(x=>x!==i); prefs.src=-1}
  else return;
  savePrefs(); render();
});
function answer(k){
  if(!S||S.done||(S.feedback&&S.locked[S.cur]))return;
  S.ans[S.cur]=S.ans[S.cur]===k&&!S.feedback?null:k; save(); render();
}
function go(i){ if(i<0||i>=S.ids.length)return; S.cur=i; save(); render(); }
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||b.disabled)return;
  if(b.dataset.ans!==undefined) return answer(+b.dataset.ans);
  if(b.dataset.go!==undefined) return go(+b.dataset.go);
  if(b.dataset.filter){revFilter=b.dataset.filter; return render()}
  switch(b.dataset.act){
    case 'start-exam': return start('exam');
    case 'start-practice': return start('practice');
    case 'start-wrong': return start('wrong');
    case 'prev': return go(S.cur-1);
    case 'next': return go(S.cur+1);
    case 'clear': S.ans[S.cur]=null; save(); return render();
    case 'flag': S.flag[S.cur]=!S.flag[S.cur]; save(); return render();
    case 'lock': S.locked[S.cur]=true; save(); return render();
    case 'ask-submit': modal='submit'; return render();
    case 'ask-quit': modal='quit'; return render();
    case 'close': modal=null; return render();
    case 'submit': return finish(false);
    case 'quit': clearInterval(tick); S=null; modal=null; store.del('active'); view='home'; return render();
    case 'again': { const k=S.kind; S=null; return start(k==='wrong'&&!store.get('wrong',[]).length?'practice':k) }
    case 'hide-install': store.set('hideInstall',true); return render();
    case 'home': S=null; view='home'; render(); return window.scrollTo(0,0);
  }
});
document.addEventListener('keydown',e=>{
  if(view!=='quiz'||modal||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest&&e.target.closest('select,input'))return;
  const k=e.key.toLowerCase(); const m={a:0,b:1,c:2,d:3,'1':0,'2':1,'3':2,'4':3};
  if(k in m){e.preventDefault();answer(m[k])}
  else if(e.key==='ArrowRight'){go(S.cur+1)} else if(e.key==='ArrowLeft'){go(S.cur-1)}
  else if(k==='f'){S.flag[S.cur]=!S.flag[S.cur];save();render()}
  else if(e.key==='Enter'&&S.feedback&&S.ans[S.cur]!==null&&!S.locked[S.cur]){S.locked[S.cur]=true;save();render()}
});

/* ---------- boot (resume an unfinished test) ---------- */
function boot(data){
  const act=(data&&data.S)||store.get('active',null);
  if(act&&act.ids&&act.ids.every(id=>byId.has(id))&&!act.done){S=act; view='quiz'; if(S.endAt&&S.endAt<=Date.now()){render(); return finish(true)} }
  render(); runClock();
}
window.claude?.hot?.snapshot?.(()=>({S:S&&!S.done?S:null}));
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
})();
</script>

<script>if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}</script>
