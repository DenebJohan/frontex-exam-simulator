ad the Fundamental Rights Office recruited as of December 2022?",["40","100","25","46"],3,"The page states that as of December 2022 the Fundamental Rights Office finalised the recruitment of 46 fundamental rights monitors.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0870",1,5,22,"Regulation (EU) 2019/1896 Art. 110(3)",0,"Under Article 110(3) of Regulation (EU) 2019/1896, what is the minimum assignment of fundamental rights monitors?",["One monitor per Member State hosting an operation per year","Monitors are assigned only at the request of the host Member State","At least two monitors to each return flight only","At least one fundamental rights monitor to each operation"],3,"Art. 110(3): the FRO 'shall assign at least one fundamental rights monitor to each operation'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0871",1,5,22,"Frontex page 'Frontex Complaints Mechanism'",0,"Within what time limit must a complaint be submitted to the Frontex complaints mechanism to be admissible?",["Within three months from the date of the alleged violation","Within one year from the moment the facts happened","Within 30 days from the end of the Frontex operational activity","At any time, as no time limit applies to fundamental rights complaints"],1,"One of the admissibility criteria is that the complaint is submitted 'within one year from the moment the facts happened'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0872",1,5,22,"Frontex page 'Frontex Complaints Mechanism'",1,"Which statement about the form and language of complaints under the Frontex complaints mechanism is correct?",["Complaints must be filed on the standard form only and in an official EU language","Complaints must be submitted in person at the Frontex headquarters","Complaints must be in writing but may be submitted in any language","Complaints may be oral but must be in English or French"],2,"The page states complaints must be submitted in writing (online form, standard form, email or letter) and 'in any language you prefer'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0873",1,5,22,"Frontex page 'Frontex Complaints Mechanism'",1,"Under the Frontex complaints mechanism, what happens to an admissible complaint that concerns an officer from an EU Member State deployed in a Frontex activity?",["It is closed as inadmissible, since Frontex has no competence over officers of Member States","It is referred directly to the Court of Justice of the EU for a preliminary ruling on the facts","It is referred to the national authorities and to a national fundamental rights institution","It is decided by the Frontex Executive Director, whose decision is binding on the Member State"],2,"If the complaint concerns a Member State officer, 'it will be referred to national authorities and to a national fundamental rights institution'.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0874",1,5,22,"Frontex page 'Frontex Complaints Mechanism'",2,"Which of the following complaints falls OUTSIDE the mandate of the Frontex Fundamental Rights Officer?",["A complaint concerning the outcome of an asylum application","A complaint about a return escort's failure to act during a Frontex return operation","A complaint lodged by a lawyer on behalf of an authorised migrant","A joint complaint from several people affected by the same action of Frontex staff"],0,"The page lists complaints concerning the outcome of asylum applications (and ETIAS Central Unit activities) as outside the FRO's mandate.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0875",1,5,22,"Frontex page 'Consultative Forum - General'; Regulation (EU) 2019/1896 Art. 108(3)",1,"On which matters must the Frontex Consultative Forum be consulted under the European Border and Coast Guard Regulation?",["The location of operational areas, the deployment of technical equipment and the Agency's annual risk analysis","The fundamental rights strategy, the complaints mechanism, the codes of conduct and the common core curricula","The annual budget, the appointment of senior staff and the Agency's major procurement procedures","Individual return decisions, asylum applications and the selection of third countries of return"],1,"Art. 108(3) and the CF page: the forum is consulted on the fundamental rights strategy, the complaints mechanism, the codes of conduct and the common core curricula.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0876",1,5,22,"Frontex page 'Consultative Forum - General'",1,"How many organisations make up the Frontex Consultative Forum from September 2025, and how is it led?",["Twenty organisations, led by the Executive Director","Fifteen organisations, led by two chairs elected by its members for a two-year term","Ten organisations, led by the Fundamental Rights Officer","Twelve organisations, led by a chair appointed by the Management Board for four years"],1,"The CF page states that from September 2025 the Forum is composed of fifteen organisations and is led by two chairs elected by its members for a two-year term.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0877",1,5,22,"Regulation (EU) 2019/1896 Art. 109(2)(h)",2,"Under Regulation (EU) 2019/1896, who provides the secretariat of the Consultative Forum?",["The Fundamental Rights Officer, with the secretariat receiving instructions directly from the forum","The Executive Director's cabinet, with the secretariat reporting to the Deputy Executive Directors of the Agency","The European Union Agency for Fundamental Rights, under a working arrangement with Frontex","The secretariat of the Management Board, acting on instructions of the Management Board Chair"],0,"Art. 109(2)(h): the FRO provides the secretariat of the consultative forum, which receives instructions directly from the forum.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0878",1,5,22,"Frontex page 'Fundamental rights at Frontex'; Frontex Fundamental Rights Strategy (MB 14 Feb 2021), Implementation",1,"What is the relationship between the Frontex Fundamental Rights Strategy and the Fundamental Rights Action Plan?",["The Action Plan applies only to return operations, the Strategy only to joint operations","The Action Plan develops the Strategy into practical, time-bound safeguards, outputs and indicators","The Action Plan replaces the Strategy every two years","The Strategy is a binding regulation, while the Action Plan is an internal memo of the FRO"],1,"The page says the Strategy 'has been developed into an Action Plan that includes practical fundamental rights safeguards'; the FRS says it delineates time-bound outputs, activities and indicators.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0879",1,5,22,"Regulation (EU) 2019/1896 Art. 46(4); Frontex Fundamental Rights Strategy (MB 14 Feb 2021), Operationalisation",2,"Under Article 46(4) of Regulation (EU) 2019/1896, what must the Executive Director do if he or she considers that there are violations of fundamental rights related to an activity that are of a serious nature or likely to persist?",["Refer the matter to the Court of Justice of the EU and await its ruling before taking any measure on the activity","Continue the activity unchanged but double the number of fundamental rights monitors deployed to it","Ask the host Member State to decide whether the activity should continue and accept its decision","After consulting the FRO and informing the Member State, withdraw financing or suspend or terminate the activity"],3,"Art. 46(4) obliges the Executive Director, after consulting the FRO and informing the Member State, to withdraw financing, suspend or terminate the activity in whole or in part.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0880",1,5,22,"Regulation (EU) 2019/1896 Art. 46(5)-(6); Frontex Fundamental Rights Strategy (MB 14 Feb 2021), Operationalisation",2,"Under Article 46 of Regulation (EU) 2019/1896, which information must the Executive Director take into account when deciding to suspend, terminate or not launch an activity on fundamental rights grounds?",["Only a formal finding of a violation by the European Court of Human Rights or the Court of Justice of the EU in a final judgment","Only the annual risk analysis and the vulnerability assessment prepared by Frontex for the Member State","Unresolved registered complaints, reports of serious incidents, coordinating officers' reports and reports of international organisations","Only the written opinion of the host Member State's Ministry of Interior and of its border guard authority"],2,"Art. 46(6): decisions under paras 4 and 5 must be duly justified and take into account complaints not resolved nationally, serious incident reports, coordinating officers' reports and relevant international organisations and EU bodies.","https://www.frontex.europa.eu/fundamental-rights/fundamental-rights-at-frontex/fundamental-rights-at-frontex/"],["Q0881",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 3(1)(e)",1,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what is a 'collecting return operation'?",["A return operation carried out exclusively on a voluntary basis, with transport provided by the organising Member State","A return operation in which several Member States collect returnees at a single EU hub airport before the joint departure flight","A return operation for which the means of transport and forced-return escorts are provided by a non-EU country of return","A return operation organised by Frontex using its own chartered aircraft and escorts from the standing corps"],2,"Art. 3(1)(e) defines a collecting RO as one for which the means of transport and forced-return escorts are provided by a non-EU country of return.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0882",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 3(1)(j)",1,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, who is considered the 'head of the return operation' if the organising Member State has not appointed a particular person?",["The escort leader of the organising Member State","The captain of the aircraft","The Frontex Fundamental Rights Officer","The most senior forced-return monitor on board"],0,"Art. 3(1)(j): where no particular person is appointed, the escort leader of the OMS is to be considered the head of the RO.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0883",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 3(1)(b)",0,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, who is a 'participant'?",["Any person, including escorts, monitors, interpreters and medical staff, taking part in an RO or RI, other than the returnee","Only the forced-return escorts and escort leaders of the organising and participating Member States, excluding monitors and medical staff","Any person on board the means of transport, including the returnees and the crew of the carrier","Only Frontex statutory staff deployed in the operation, excluding staff provided by Member States"],0,"Art. 3(1)(b) defines 'participant' as any person taking part in an RO or RI other than the returnee.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0884",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 3(1)(i)",1,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, which statement about 'forced-return escorts' is correct?",["They must always be police officers of the organising Member State and may never be private contractor staff","They are security personnel accompanying returnees and may include persons employed by a private contractor","They are medical staff who certify the returnees' fitness to travel before and during the operation","They are independent observers who report on fundamental rights compliance to the national monitoring body"],1,"Art. 3(1)(i): forced-return escorts are security personnel, 'including persons employed by a private contractor', responsible for accompanying returnees.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0885",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 3(1)(l)",0,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what does 'fit to travel' refer to?",["The returnee's written consent to board the means of transport, given before the pre-departure phase","The absence of any pending asylum application or appeal against the returnee's return decision","A returnee's medical condition, both physical and mental, allowing the person to travel safely","The possession of valid travel documents issued or accepted by the authorities of the country of return"],2,"Art. 3(1)(l) defines 'fit to travel' as the returnee's medical condition (physical and mental) which allows safe travel.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0886",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 4(3)",2,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, when must a return operation or return intervention be suspended or terminated in whole or in part on fundamental rights grounds?",["When the forced-return monitor disagrees with the head of the RO on how coercive measures are being applied","When the participating Member State withdraws its escorts from the operation after the pre-departure phase","When the Executive Director considers fundamental rights or protection violations to be serious or likely to persist","When any returnee lodges a complaint during the flight, regardless of the content or the seriousness of the complaint made"],2,"Art. 4(3): an RO or RI must be suspended or terminated if the executive director considers there are serious or persisting violations of fundamental rights or international protection obligations.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0887",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 5",1,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, who must suspend or terminate an RO or RI if its continuation is considered unsafe?",["Only the Frontex Executive Director, after consulting the Management Board and the FRO","The captain, the head of RO, the host MS authorities or Frontex, depending on the phase","Only the forced-return monitor, who must inform the organising Member State","Only the escort leader of each participating Member State, acting jointly"],1,"Art. 5 assigns the duty to suspend or terminate an unsafe RO/RI to the captain, the head of RO, the competent MS authorities hosting an RI or Frontex, depending on the phase.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0888",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 6(1)",0,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, why must participants seek cooperation with each returnee at all stages of the operation?",["To speed up boarding procedures and reduce flight costs","To obtain the returnee's written consent to removal","To collect intelligence on smuggling networks","To avoid or limit the use of force to the minimum extent necessary"],3,"Art. 6(1): cooperation is sought with each returnee 'in order to avoid or limit the use of force to the minimum extent necessary'.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0889",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 6(3)",1,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, who ensures that returnees are informed about the possibility of lodging a complaint about an alleged fundamental rights violation?",["The private contractor providing escorts, through a leaflet given at boarding","The captain of the aircraft, in an announcement made before take-off","The authorities of the country of return, upon hand-over of the returnees","The head of RO or the competent authorities of the Member State hosting an RI"],3,"Art. 6(3): the head of RO or the competent authorities of the MS hosting an RI ensure information on complaint possibilities, e.g. via the Frontex complaints mechanism.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0890",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 7(1)",0,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, which requirements must the use of coercive measures meet?",["It must be authorised in writing in advance by the returnee's legal representative","It must be legal, necessary and proportional, not exceeding reasonable force","It must be decided collectively by all escorts on board and recorded in the log","It must be approved in advance by the authorities of the country of return"],1,"Art. 7(1): coercive measures must be legal, necessary and proportional, not exceeding reasonable force, with due respect for rights, dignity and physical integrity.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0891",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 7(3)",0,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, which coercive measures are expressly prohibited?",["Escorting a returnee by the arm during boarding and disembarkation of the aircraft","Any use of handcuffs or other restraints at any stage of the flight, without exception","Any measure not expressly listed in the Schengen Borders Code or the Return Directive","Measures likely to compromise or threaten the returnee's ability to breathe normally"],3,"Art. 7(3): coercive measures likely to compromise or threaten the possibility of the returnees to breathe normally are prohibited.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0892",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 7(4)",1,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what is the rule on the use of sedatives?",["Allowed whenever the escort leader considers it necessary to prevent resistance during boarding of the aircraft","Allowed if prescribed by a doctor of the country of return and administered by the escorts","Forbidden to facilitate removal, without prejudice to emergency measures under medical supervision","Allowed if the returnee has resisted boarding at least twice during previous removal attempts"],2,"Art. 7(4) forbids sedatives to facilitate removal, except emergency measures under medical supervision for flight security.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0893",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 7(5)",2,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what applies when the organising Member State and Frontex accept a coercive measure that is not allowed under the national law of a participating Member State?",["No participant of that participating Member State is required to use that measure","The operation must be cancelled","The participating Member State's escorts must apply it, as the OMS rules prevail","The measure may be applied only with the forced-return monitor's consent"],0,"Art. 7(5): no PMS participants are required to use coercive measures not allowed under their national legislation, even if accepted by the OMS and Frontex.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0894",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 3(1)(h) and Art. 7(3)",2,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, who periodically reviews, on the basis of a dynamic risk assessment, the continuing necessity and proportionality of coercive measures, particularly prolonged restraints?",["The Frontex Fundamental Rights Officer","The relevant escort leader","The forced-return monitor","The medical doctor on board"],1,"Art. 7(3): based on a dynamic risk assessment, the relevant escort leader periodically reviews the continuing necessity and proportionality of coercive measures.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0895",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 8(1)",0,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what must the organising Member State do if a returnee is not fit to travel?",["Transfer the decision to the captain of the aircraft","Administer medication so the returnee can travel","Proceed with the removal and inform the country of return","Refuse the participation of that returnee in the RO or RI"],3,"Art. 8(1): returnees are removed only if fit to travel; the OMS must refuse the participation of a returnee who is not fit to travel.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0896",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 13",1,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what is the rule on recording during an RO or RI?",["Any participant may record for evidential purposes without prior agreement and may keep copies for private use","Possible only when specifically agreed and compliant with data protection law; private recording is prohibited","Recording for private use is allowed provided the faces of returnees and escorts are blurred","Recording is mandatory on every flight and the footage is published in the Frontex annual report"],1,"Art. 13: recording is possible only when specifically agreed between the MS, Frontex and/or the carrier and in compliance with data protection law; private recording is prohibited.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0897",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 14(1)",0,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what medical presence should be ensured during each RO and RI?",["At least one nurse provided by Frontex and paid from the operation budget","A doctor from the country of return, who joins the flight at departure","At least one medical doctor provided by the organising Member State","Medical staff only if a returnee requests a medical examination in writing"],2,"Art. 14(1): during each RO and RI at least one medical doctor provided by the OMS should be present.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0898",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 15(3)",1,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what period should the monitoring of forced return operations cover?",["The whole forced RO, from pre-departure until hand-over in the country of return or back to the country of departure","Only the flight phase, from take-off at the departure airport to landing in the country of return, excluding the ground phases","Only the pre-departure phase at the airport, as the flight and hand-over are monitored by the country of return","Only the hand-over to the authorities of the country of return, where the risk of ill-treatment is highest"],0,"Art. 15(3): monitoring should cover the whole forced RO, from pre-departure until hand-over in the country of return or back to the country of departure.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0899",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 16(3)",2,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what may forced-return monitors do if they perceive irregularities?",["Instruct the captain to return to the departure airport and draw up a report for the Executive Director","Order the escorts to stop the use of force immediately and take over the management of the returnee","Suspend the return operation on their own authority until the Fundamental Rights Officer has been consulted","Inform the head of RO and/or the escort leader(s), without interfering with the planned execution of the RO"],3,"Art. 16(3): forced-return monitors may inform the head of RO and/or escort leaders of perceived irregularities but may not interfere with the planned execution of the RO.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0900",2,6,23,"Code of Conduct for Return Operations and Return Interventions, Art. 19 and Art. 21(2)",1,"Under the Frontex Code of Conduct for Return Operations and Return Interventions, what is the consequence if a person deployed by a Member State violates the Code?",["The Executive Director informs the responsible Member State and may remove the person from the activity if it is jeopardised","Frontex opens its own disciplinary procedure against the person under the EU Staff Regulations and imposes the sanction","The Consultative Forum decides on the appropriate sanction after hearing the person and the Member State concerned","The person is automatically and permanently banned from all future Frontex activities without further procedure"],0,"Art. 21(2): the ED communicates the incident to the responsible MS, expects disciplinary measures, and may suspend or remove the person from the activity if continued engagement jeopardises it.","https://www.frontex.europa.eu/assets/Key_Documents/Code_of_Conduct/Code_of_Conduct_for_Return_Operations_and_Return_Interventions.pdf"],["Q0901",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 1(1)",0,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, to which activities does the Code apply?",["Only joint operations at the EU's external sea and land borders taking place on the territory of a Member State","Only return operations coordinated by Frontex, including the pre-departure phase in Member States","Only activities taking place on the territory of the host Member State, excluding third countries","All Frontex operational activities, including those taking place outside the territory of the Union"],3,"Art. 1(1): the code applies to all Frontex operational activities, including those which take place outside the territory of the Union.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0902",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 2(b)",1,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, which of the following are listed as Frontex operational activities?",["Joint operations, pilot projects, return operations and training of relevant staff","Only joint operations and rapid border interventions at the external sea and land borders","Asylum decision-making, visa issuance and the processing of residence permits","Recruitment campaigns, procurement procedures and the planning of the budget"],0,"Art. 2(b): Frontex operational activities include joint operations, pilot projects, return operations and training of relevant staff.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0903",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 2(g)",1,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, how is 'harassment' defined?",["Any behaviour that breaches the national criminal law of the host Member State, whether or not it is unwanted by, or even known to, the person concerned","Intentional, unwanted behaviour meant to, or having the effect of, offending the person or creating an intimidating, hostile or offensive environment","Any physical contact between participants during an operation, irrespective of intent or of whether the other person objected to it","Any repeated criticism of a colleague's work performance, regardless of intent, accuracy or the context in which it was expressed"],1,"Art. 2(g) defines harassment as intentional, unwanted behaviour with the purpose or effect of offending or creating an intimidating, hostile or offensive environment.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0904",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 2(d)",1,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, which group is expressly included in the indicative definition of 'vulnerable persons'?",["Persons holding a valid Schengen visa","Third-country nationals with sufficient means of subsistence","Victims of torture or trauma","Frequent travellers at border crossing points"],2,"Art. 2(d): vulnerable persons may include women, children, persons with disabilities, the elderly, victims of torture or trauma, persons susceptible to exploitation and victims of trafficking.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0905",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 3",0,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, with which law must participants comply under the principle of lawfulness?",["Only the operational plan, which overrides the national law of both the home and the host Member States","Only the national law of their home Member State, which continues to apply during deployment","Only Union law, to the exclusion of the national law of the home and host Member States","International law and Union law as well as the national law of both home and host Member States"],3,"Art. 3(a): participants must comply with international law, Union law and the national law of both home and host Member States.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0906",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 5(b)",0,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, what must participants ensure with regard to persons seeking international protection?",["That they are referred without delay to the national authorities responsible for considering their requests","That their requests are assessed on the spot by the participant before any referral to national authorities","That they are referred to Frontex headquarters in Warsaw for registration and assessment of their requests","That they are returned to the last transit country, which is responsible for considering their requests"],0,"Art. 5(b): such persons must be referred without delay to the competent national authorities, in compliance with non-refoulement and the right to seek asylum.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0907",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 5(c)",1,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, which basic necessities must be provided to persons in participants' custody?",["Only food and water during the first 24 hours, after which the host State takes over","Food, water, shelter and medical attention to meet their individual needs","Shelter only, as all other needs are covered by the host State's reception system","Legal representation and interpretation only, as basic needs are covered nationally"],1,"Art. 5(c): persons in custody must be treated with human dignity and provided with food, water, shelter and medical attention.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0908",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 6(b)",2,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, when may participants refrain from displaying that they are on a Frontex operational activity?",["Whenever the host Member State's officers are present and lead the activity in that part of the operational area","Whenever they choose to work in plain clothes, as a matter of personal preference and comfort","Whenever they are off duty in the host Member State or travelling to and from the operational area","When such transparency would compromise their personal safety or duly justified operational objectives"],3,"Art. 6(b): participants display that they are on a Frontex activity unless this would compromise personal safety or duly justified operational objectives.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0909",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 7",1,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, who bears primary responsibility for the actions of a participant in the context of a Frontex operational activity?",["The participant himself or herself","The Frontex Executive Director","The host Member State's border guard commander","The Coordinating Officer"],0,"Art. 7: 'Participants are primarily responsible for all the actions in the context of their participation in a Frontex operational activity'.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0910",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 9(2)-(3)",0,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, may participants comment on current Frontex operational activities on social media?",["Only after the end of their deployment, provided they do not disclose any personal data of migrants or colleagues","Only with explicit authorisation, in line with the operational/implementation plan or similar agreed rules","Yes, provided they do not post photographs or videos of persons involved in the activity","Yes, freely, provided they make clear that they are expressing their views in a private capacity"],1,"Art. 9(3): participants must not express themselves on current, past or planned activities in the media, including social media, unless explicit authorisation is given.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0911",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 10",1,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, when do the behavioural standards of Article 10 apply to participants?",["Only when wearing a uniform","Only during operational briefings","Whether they are on or off duty","Only while on duty"],2,"Art. 10 applies to participants 'whether on or off duty'.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0912",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 11",0,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, what does Article 11 prohibit?",["Any off-duty travel outside the operational area without permission","Any contact with journalists or the media during the deployment period","All improper use of a position of influence, power or authority","Any use of force, including in legitimate self-defence or defence of others"],2,"Art. 11: 'All improper use of a position of influence, power or authority is forbidden.'","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0913",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 14(1)-(2)",0,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, what is the rule on alcohol consumption?",["Forbidden at all times during the deployment, both on duty and off duty","Forbidden on duty; off duty it must be moderate unless the plan prohibits it","Allowed off duty without limit, as long as the participant is not in uniform","Allowed on duty in small quantities during meals, and off duty without limit"],1,"Art. 14: consumption of alcohol on duty is forbidden; off duty it must be moderate unless the plan prohibits any consumption.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0914",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 14(3)",2,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, what must a participant do if unexpectedly called out for duty after consuming alcohol?",["Say, at no risk of discredit, that he or she has consumed alcohol and may not be fit for duty","Report for duty as instructed and inform the supervisor about the alcohol consumption after the shift","Take a breathalyser test and report the consumption only if it exceeds the legal driving limit","Refuse the call-out without giving any reason, to avoid disciplinary consequences for drinking"],0,"Art. 14(3): a participant unexpectedly called out is obliged, at no risk of discredit, to say he/she has consumed alcohol and may not be fit for duty.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0915",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 15(1)",0,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, when is the use or possession of narcotics or drugs permitted?",["Only with the consent of the Coordinating Officer","Off duty, if legal in the host Member State","Only when prescribed for medical reasons","Never, even with a medical prescription"],2,"Art. 15(1): the use or possession of narcotics or drugs, unless prescribed for medical reasons, is forbidden.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0916",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 16(1)",1,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, what is the rule on services of a sexual nature?",["They are forbidden only where they are illegal under the law of the host State","They are forbidden only while on duty, but tolerated off duty in private settings","They are forbidden only in public places, but tolerated in private accommodation","Using or soliciting such services is forbidden, whether in public or in private"],3,"Art. 16(1): using or soliciting services of a sexual nature, whether in public or in private, is forbidden.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0917",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 17(2)",1,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, which conduct is expressly forbidden under the rules on corruption and misconduct?",["Using one's public position for illegitimate private gain or accepting unjustified rewards","Using a Frontex mobile office, car or phone for operational tasks during the deployment","Reporting a colleague's suspected misconduct through the official Frontex reporting channels","Accepting reimbursement of mission expenses in accordance with the applicable financial rules"],0,"Art. 17(2): use of public position for illegitimate private gain and acceptance of unjustified rewards are forbidden.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0918",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 18(1)",2,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, on what conditions may members of the teams use force, including service weapons?",["Whenever they consider it necessary, under their home State's law and without host State border guards present","With the consent of the Frontex Executive Director only, under Union law and the operational plan alone","Only in the absence of host State border guards, with the consent of the Coordinating Officer and under Union law","With home and host Member State consent, in the presence of host State border guards and under host State law"],3,"Art. 18(1), referring to Art. 40 of the EBCG Regulation: force may be used only with home and host MS consent, in the presence of host State border guards and in accordance with host State law.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0919",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 18(3)",1,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, how must the use of force, and in particular weapons, be applied?",["Only after written authorisation from the Management Board, for each individual incident","As a last resort, not exceeding the minimum degree necessitated by the circumstances","In any degree permitted by the host State's law, irrespective of the circumstances of the case","As a first resort, to deter irregular crossings and demonstrate the authority of the teams"],1,"Art. 18(3): force, especially weapons, must be a last resort, not exceed the minimum necessary, and be proportionate.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0920",2,6,24,"Code of Conduct for all persons participating in Frontex operational activities, Art. 21(1)",2,"Under the Frontex Code of Conduct for all persons participating in Frontex operational activities, what measure may the Executive Director take if a member of Frontex staff violates the Code?",["A fine deducted from the staff member's salary, set by the Consultative Forum after hearing the staff member","Only a written warning, because removal from an activity requires a decision of the EU courts","Adequate measures, which may include immediate removal from the activity, under the Staff Regulations","Only a referral of the case to the staff member's former home Member State for national sanctions"],2,"Art. 21(1): for Frontex staff the ED must take adequate measures, which may include immediate removal from the activity, under the Staff Regulations and the Frontex disciplinary procedure.","https://prd.frontex.europa.eu/document/code-of-conduct-for-all-persons-participating-in-frontex-operational-activities/"],["Q0921",2,6,25,"MBD 16/2019, Annex, point 2.1",0,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, which feature is part of the definition of psychological harassment taken from the Staff Regulations?",["Improper conduct that takes place over a period, is repetitive or systematic, and is intentional","Any single remark that the recipient finds unpleasant, whether or not the remark was intended to offend","Any negative performance appraisal, even when duly substantiated by objective facts and figures","Conduct relating to sex which is unwanted by the recipient and creates an offensive environment"],0,"Point 2.1: psychological harassment is improper conduct over a period, repetitive or systematic, involving intentional behaviour, language, gestures or acts that may undermine a person's dignity or integrity.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0922",2,6,25,"MBD 16/2019, Annex, point 2.1",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, which of the following is NOT necessarily considered psychological harassment?",["Repeated insulting remarks about someone's professional competence","Systematically giving someone work that does not match their job profile","A duly substantiated negative assessment, even if repeated","Repeatedly isolating and ignoring a colleague"],2,"Point 2.1 states that a remark, a dispute, a difficult management decision or 'a duly substantiated negative assessment, even repeated' cannot necessarily be considered psychological harassment.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0923",2,6,25,"MBD 16/2019, Annex, point 2.2",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, how does sexual harassment differ from psychological harassment as regards the number of incidents?",["Sexual harassment always requires at least three incidents","There is no difference: both always require repetition","Sexual harassment requires conduct over a period of at least six months","A single incident may constitute sexual harassment if it is sufficiently serious"],3,"Point 2.2: 'unlike psychological harassment, a single incident may constitute sexual harassment if it is sufficiently serious'.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0924",2,6,25,"MBD 16/2019, Annex, point 2.2",0,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, what is the essential characteristic of sexual harassment?",["It is committed by a hierarchical superior","It occurs between persons of different sex","It is unwanted by the recipient","It involves physical contact"],2,"Point 2.2: 'The essential characteristic of sexual harassment is that it is unwanted by the recipient'; it may involve persons of the same or different sex.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0925",2,6,25,"MBD 16/2019, Annex, point 2.2; Staff Regulations Art. 12a(4)",0,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, how is sexual harassment additionally treated under the Staff Regulations?",["As a minor breach handled only informally","As a matter of private life outside the Agency's competence","As discrimination based on gender","As a criminal offence prosecuted by the Agency"],2,"Point 2.2 and 7.3: sexual harassment is also treated as discrimination based on gender (Art. 12a(4) Staff Regulations).","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0926",2,6,25,"MBD 16/2019, Annex, point 2.4",2,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, at the formal level, which criteria must cumulatively be met for psychological harassment to be considered to exist?",["Abusive, intentional, repetitive, sustained or systematic conduct that, for instance, discredits or undermines the person","The conduct must have been reported to a confidential counsellor within one month and confirmed by at least two witnesses","The person concerned must subjectively perceive the conduct as undesirable, whatever the objective facts show","The conduct must have caused a medically certified illness and an absence from work of at least ten days"],0,"Point 2.4: at the formal level the conduct must be abusive, intentional, repetitive, sustained or systematic with a discrediting/undermining effect; these criteria are cumulative.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0927",2,6,25,"MBD 16/2019, Annex, point 2.4",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, who is a 'victim' for the purposes of the informal procedure?",["Only a person whose harassment has been proven in the formal procedure","Only a person with at least one witness","Only a person whose complaint has been declared admissible by the Inspection and Control Office","Any person who defines or identifies themselves as such"],3,"Point 2.4: in the informal procedure 'victim' refers to any person who defines or identifies themselves as such; no stage of the informal procedure may prejudice the formal procedure.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0928",2,6,25,"MBD 16/2019, Annex, point 4.2; Staff Regulations Art. 12a",0,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, what protection does Article 12a of the Staff Regulations give to an official who has given evidence on harassment?",["He or she is granted full anonymity before the Court of Justice and in all internal administrative proceedings","He or she shall not suffer prejudicial effects from the institution, provided he or she acted honestly","He or she is automatically transferred to another unit for the duration of the formal procedure","He or she receives a financial reward if the evidence leads to a disciplinary penalty being imposed"],1,"Point 4.2 quotes Art. 12a: an official who has given evidence on harassment shall not suffer prejudicial effects, provided the official acted honestly.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0929",2,6,25,"MBD 16/2019, Annex, point 4 (4.3-4.5)",0,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, which principle is fully guaranteed to alleged harassers?",["Immunity from disciplinary proceedings during the informal procedure","The right to block any emergency measure","The right to choose the investigator","The presumption of innocence"],3,"Point 4.4: 'The presumption of innocence is fully guaranteed to alleged harassers.'","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0930",2,6,25,"MBD 16/2019, Annex, point 6.1",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, which Frontex entity is responsible for drawing up and monitoring the implementation of the policy on harassment?",["The Legal Services Unit","The Inspection and Control Office","The Fundamental Rights Office","The Staff Committee"],1,"Point 6.1: the Inspection and Control Office is responsible for drawing up and monitoring the policy, acting as 'central service'.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0931",2,6,25,"MBD 16/2019, Annex, point 6.2",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, who officially appoints the confidential counsellors?",["The Management Board, on a proposal of the Staff Committee","The European Ombudsman","The Head of Human Resources alone","The Executive Director, on the basis of the choice of a selection panel"],3,"Point 6.2: counsellors are selected by a panel (HR and Security Unit, Inspection and Control Office, Staff Committee) and officially appointed by the Executive Director.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0932",2,6,25,"MBD 16/2019, Annex, point 6.2",2,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, what is the term of appointment of confidential counsellors?",["Two years, renewable twice only","Four years, non-renewable","One year, renewable indefinitely","Three years, renewable once"],0,"Point 6.2: appointments are for two years, renewable twice only, on a voluntary basis.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0933",2,6,25,"MBD 16/2019, Annex, point 6.5",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, which persons have access to the formal procedure?",["Only staff covered by the Staff Regulations and seconded national experts","Only persons who first completed the informal procedure","Only officials, excluding temporary and contract staff","Every person working at the Agency, including trainees and national-law contractors"],0,"Point 6.5: anyone may initiate the informal procedure, but only staff covered by the Staff Regulations (incl. CEOS) and seconded national experts have access to the formal procedure.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0934",2,6,25,"MBD 16/2019, Annex, point 6.5",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, what right and duty does a person have who witnesses conduct that appears to be harassment?",["Only the right, but no duty, to inform the Staff Committee, which then decides on its own whether to open an inquiry","The duty to confront the alleged harasser publicly before informing any of the Agency's services","The right and the duty to inform the central service, a confidential counsellor, the HR manager or line managers","The duty to file a criminal complaint with the national police of the host country within one month"],2,"Point 6.5: any person aware of or witnessing apparently improper conduct has both the right and the duty to inform the listed parties and must cooperate with formal enquiries.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0935",2,6,25,"MBD 16/2019, Annex, point 7.1",0,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, what is the effect on a pending informal procedure when the person moves to the formal procedure?",["The formal procedure is suspended until the informal one ends","The confidential counsellor must decide which procedure prevails","The informal procedure is automatically closed","Both procedures continue in parallel"],2,"Point 7.1 (and fn. 26): passage to the formal procedure automatically involves closure of any informal procedure underway.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0936",2,6,25,"MBD 16/2019, Annex, point 7.2",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, what does the informal procedure NOT involve?",["Contact with a confidential counsellor chosen by the person concerned","Formal recording of the facts or the application of penalties","The possibility of emergency measures, such as separating the parties","The possibility of an amicable resolution through conciliation"],1,"Point 7.2: the informal procedure allows monitoring and amicable resolution, but does not involve formal recording of facts or penalties, which belong to the formal procedure.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0937",2,6,25,"MBD 16/2019, Annex, point 7.2.1",2,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, within what period must confidential counsellors deal with a problem in the informal procedure?",["Three months, non-extendable","Two weeks, extendable to one month","Four months, after which the request is deemed rejected","One month, extendable to two months if necessary"],3,"Point 7.2.1: counsellors have one month to deal with the problem, which may be extended to two months if necessary.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0938",2,6,25,"MBD 16/2019, Annex, point 7.2.1",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, on what condition may a confidential counsellor take any action in the informal procedure?",["Only after informing the alleged harasser's line manager and the Human Resources Unit in writing","Only with the prior agreement of the alleged victim and within the counsellor's mandate","Only with the approval of the Executive Director, given on a proposal of the Inspection and Control Office","At the counsellor's own discretion once the case has been allocated by the central service"],1,"Point 7.2.1: any action by confidential counsellors may only be carried out with the prior agreement of the victim and within their mandate.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0939",2,6,25,"MBD 16/2019, Annex, point 7.3; Staff Regulations Arts 24 and 90",1,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, on what basis is the formal procedure initiated, and what follows if the request is rejected?",["A request for assistance under Art. 24 SR; if rejected, a complaint under Art. 90(2) SR, then an appeal to the Union Court","A complaint under Art. 90(2) SR; if rejected, a request for assistance under Art. 24 SR, then an appeal to the EU Ombudsman","A report to OLAF; if it is rejected, a request to the Staff Committee, then a final appeal to the Management Board","A petition to the European Parliament; if rejected, a complaint to the Ombudsman, then an appeal to the Union Court"],0,"Point 7.3: the formal procedure starts with a request for assistance under Art. 24 SR; if explicitly or implicitly rejected, a complaint under Art. 90(2) SR and then an appeal to the competent Union Court.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0940",2,6,25,"MBD 16/2019, Annex, point 7.3",2,"Under Frontex Management Board Decision 16/2019 on protecting the dignity of the person and preventing harassment, after what period without reply is a request for assistance under Article 24 of the Staff Regulations considered implicitly rejected?",["2 months","4 months","6 months","30 days"],1,"Point 7.3: absence of reply after 4 months amounts to implicit rejection of the request.","https://prd.frontex.europa.eu/document/management-board-decision-16-2019-on-the-frontex-policy-on-protecting-the-dignity-of-the-person-and-preventing-psychological-harassment-and-sexual-harassment/"],["Q0941",3,7,26,"Section 7.5 Ethical Leadership, introduction",0,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.5 states that an agency culture in which officers act ethically can be achieved only when what happens?",["The agency adopts a detailed disciplinary code with sanctions for each breach","An external oversight body reviews all operational decisions taken by officers","Leaders demonstrate ethical actions to all members of the agency","Officers sign individual ethics contracts each year as a condition of employment"],2,"Section 7.5 states this is achieved only when leaders demonstrate ethical actions to all agency members.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0942",3,7,26,"Section 7.5 Ethical Leadership, Zuidema and Duff (2009)",1,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.5, what do Zuidema and Duff (2009) say about having employees sign a confirmation that they share the values of the agency's mission statement?",["It is counterproductive, because officers resent being asked to sign such statements","It is largely symbolic but serves as a strong reminder of important values","It is legally binding and can be enforced through the agency's disciplinary process","It replaces the need for ethics training once all employees have signed the statement"],1,"Zuidema and Duff note the sign-off is largely symbolic but serves as a strong reminder of the agency's values.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0943",3,7,26,"Section 7.5 Ethical Leadership, Zuidema and Duff (2009)",1,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.5, which of the following is one of the four ways Zuidema and Duff (2009) suggest leaders can foster an ethical workforce?",["Rewarding officers financially for ethical arrest decisions","Not tolerating any unethical activities, including at the executive level","Delegating ethics entirely to an internal affairs unit","Limiting ethics training to new recruits only"],1,"The four ways are: mission statements, ethics in formal events and training, ethics in the agency philosophy, and not tolerating unethical activities including at executive level.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0944",3,7,26,"Section 7.5 Ethical Leadership, Zuidema and Duff (2009)",2,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.5, what does the 'universality test' proposed for executives involve?",["Testing whether a policy or practice is accepted in all jurisdictions in which the agency operates","Checking whether the executive's behaviour complies with universal human rights treaties and charters","Applying exactly the same disciplinary sanction to members of all ranks for any comparable breach","Asking whether an executive's behaviour would be appropriate for every member of the agency"],3,"Zuidema and Duff suggest judging executives' behaviour by whether it would be appropriate for every member of the agency.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0945",3,7,26,"Section 7.5 Ethical Leadership, Zuidema and Duff (2009)",1,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.5, what danger do Zuidema and Duff highlight in relation to the agency's philosophy?",["Relying too heavily on technology in investigations at the expense of human judgment","Following crime control models too closely at the expense of ethical behaviour","Excessive community consultation that slows down operational and policy decisions","Excessive emphasis on officers' physical fitness at the expense of their education"],1,"They warn of the problems that arise when crime control models are followed too closely at the expense of ethical behaviour.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0946",3,7,26,"Section 7.5 Ethical Leadership, Mayer et al. (2009)",0,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.5, what model did Mayer et al. (2009) propose regarding ethical leadership?",["A 'trickle down' model, in which ethical leadership is emulated at all levels of the hierarchy","A 'bottom-up' model, in which front-line officers set the ethical tone for managers","A 'zero-sum' model, in which ethics conflicts with productivity","A 'compartmental' model, in which each rank develops separate ethical standards"],0,"Mayer et al. proposed a 'trickle down' model whereby the effects of ethical leadership are copied by workers at all ranks.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0947",3,7,26,"Section 7.5 Ethical Leadership, Mayer et al. (2009)",1,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.5, according to Mayer et al. (2009), how does top management mainly influence employee behaviour?",["Indirectly, through supervisory leadership","Through financial incentives only","It has no measurable influence on employees","Directly, through written policies alone"],0,"Their findings showed top management affects employees indirectly through supervisors, who in turn influence all employees.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0948",3,7,26,"Section 7.5 Ethical Leadership, extrapolation to law enforcement",1,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.5, what consequence for policing does the author draw from the trickle-down effect?",["Ethics training for managers becomes unnecessary","Ethical leaders become isolated from the lower ranks","Patrol officers may adopt corrupt practices by modelling corrupt leaders","Unethical behaviour among lower ranks never reaches management"],2,"The author notes employees replicate unethical leadership behaviour, which can lead to corrupt practices among patrol officers modelling corrupt leaders.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0949",3,7,26,"Section 7.5 Ethical Leadership, Frisch and Huppenbauer (2014)",2,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.5, which outcome of ethical leadership was identified by Frisch and Huppenbauer (2014) from interviews with 18 executive leaders?",["Financial success for the enterprise due to the benefits of a positive reputation","Lower recruitment costs for the enterprise, resulting mainly from reduced staff turnover","Faster promotion of front-line staff into management positions across the organisation","A reduction in the number of managerial layers and a flatter organisational hierarchy"],0,"Frisch and Huppenbauer identified enhanced well-being, financial success through positive reputation, and customer and employee satisfaction.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0950",3,7,26,"Section 7.6 Transactional and Transformational Leadership, paragraph 1",1,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.6, why must police leadership move away from relying on strictness to promote ethical conduct?",["Because police unions prohibit strict supervision","Because rules and regulations are not binding on officers","Because officers work on the street, out of view and unsupervised for much of their day","Because strictness has been proven ineffective against fraud and corruption"],2,"Section 7.6 notes strictness limits fraud and corruption, but police work mostly happens out of view and unsupervised, so leadership must go beyond strictness.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0951",3,7,26,"Section 7.6 Transactional and Transformational Leadership, paragraph 2",0,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.6, how is transactional leadership characterised?",["A bureaucratic style focused on maintaining the status quo, keeping decision-making power at the top","A style in which leaders delegate all operational decisions to subordinates and accept the resulting risks","A style based on charisma, appealing to followers' values and inspiring a shared long-term vision","A style that empowers subordinates to make moral decisions independently, without close supervision"],0,"Transactional leadership is used by those oriented toward bureaucracy and the status quo, taking decision-making power away from subordinates.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0952",3,7,26,"Section 7.6 Transactional and Transformational Leadership, paragraph 2",1,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.6, why has police leadership historically been largely transactional?",["Because of the small size of most police agencies","Because officers rarely need to use discretion","Because of the influence of private-sector management consultants","Because of the paramilitary nature of policing"],3,"Section 7.6 states that due to the paramilitary nature of policing, leadership has historically been largely transactional.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0953",3,7,26,"Section 7.6 Transactional and Transformational Leadership, paragraph 5 (Bass, 1990)",0,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.6, how does Bass (1990) describe the transformational leader?",["As a leader who avoids operational risk by centralising all important decisions at the top","As a guardian of the status quo who enforces the organisation's rules and regulations strictly","As 'a developer of people and a builder of teams' who inspires followers to act and decide","As a manager who rewards compliance with directives and punishes any deviation from procedure"],2,"Bass (1990, p. 54) calls the transformational leader 'a developer of people and a builder of teams' who inspires followers.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0954",3,7,26,"Section 7.6 Transactional and Transformational Leadership, paragraph 4 (Villiers, 2003)",2,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.6, what term does Villiers (2003) use for the autocratic, rule-following style of police organisations?",["Charismatic centralisation","Democratic professionalism","Transactional empowerment","Mechanistic bureaucratization"],3,"Villiers (2003, p. 28) describes policing operating in an autocratic style as 'mechanistic bureaucratization'.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0955",3,7,26,"Section 7.6 Transactional and Transformational Leadership, paragraph 7",1,"In 'Ethics in Law Enforcement' (Parent, BCcampus open textbook), section 7.6, how should transformational leaders respond to mistakes made by officers exercising discretion?",["Remove discretionary powers from any officer who makes a mistake until retraining has been completed","Accept the risk and treat mistakes as part of officers' development rather than as occasions for blame","Avoid discussing mistakes openly with officers in order to protect team morale and the leader's authority","Apply immediate disciplinary sanctions to every mistake in order to preserve the chain of command"],1,"Section 7.6 states transformational leaders must fight the blame culture and treat mistakes as part of officers' development, not opportunities to blame.","https://opentextbc.ca/ethicsinlawenforcement/"],["Q0956",3,8,27,"Campbell & Kodz (2011), section 1 Overview",0,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), how many research studies formed the basis of the review?",["23","12","57","66"],0,"Section 1: the resulting list of 23 research studies was reviewed and summarised (from 25 publications).","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0957",3,8,27,"Campbell & Kodz (2011), section 1 Overview / section 2",1,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), what publication period did the systematic search cover?",["1979 to the end of 2008","1990 to the end of 2012","1999 to the end of 2010","1970 to the end of 1999"],0,"Sections 1-2: the review covers studies published in English between 1979 and the end of 2008.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0958",3,8,27,"Campbell & Kodz (2011), section 1 Key findings (1)",0,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), what is the main limitation of the evidence base on great police leadership?",["It is based almost entirely on UK studies, which limits its relevance for police forces in other countries","It consists mainly of randomised controlled trials, but these have very small sample sizes","It largely covers impacts on, and perceptions of, subordinates rather than operational outcomes","It focuses only on chief constables and ignores first-line managers such as sergeants"],2,"Key finding 1: evidence is largely restricted to leaders' impacts on subordinates and their perceptions; very little assesses operational and organisational outcomes.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0959",3,8,27,"Campbell & Kodz (2011), section 1 Key findings (2)",0,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), which behaviours characterise transformational police leaders?",["Inspiring, setting a vision, offering intellectual stimulation and appealing to moral values","Relying on rewards and punishment and acting only when deviations from expected behaviour occur","Strictly specifying procedures, assigning tasks and closely supervising the work of subordinates","Avoiding involvement in decisions and leaving subordinates to resolve problems on their own"],0,"Key finding 2 describes transformational leaders as those who inspire, set a vision, offer intellectual stimulation and appeal to moral values.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0960",3,8,27,"Campbell & Kodz (2011), section 1 Key findings (3)",1,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), what does 'management-by-exception' mean?",["Personally managing only exceptional, high-profile operations and delegating all routine work","Delegating all exceptional or unusual cases to senior officers higher up the chain of command","Taking action only when there are deviations from expected behaviours and/or service delivery","Granting exceptions from the rules to high-performing officers as a reward for good results"],2,"Key finding 3 defines management-by-exception as taking action only when there are deviations from expected behaviours and/or service delivery.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0961",3,8,27,"Campbell & Kodz (2011), section 1 Key findings (4)",1,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), what does the evidence suggest about mixed-style leadership?",["Only a combination of laissez-faire and transactional behaviours is effective, especially for the most junior ranks","Mixing styles confuses subordinates about expectations and therefore reduces leader effectiveness overall","Mixed styles are effective only at the rank of chief officer and are counterproductive for sergeants","Combining transformational and transactional behaviours may be more effective than a purely transformational style"],3,"Key finding 4: police leaders who combine transformational and transactional behaviours may be more effective than those relying purely on transformational behaviours.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0962",3,8,27,"Campbell & Kodz (2011), section 1 Key findings (8)",0,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), how are laissez-faire, passive/avoidant police leaders viewed?",["As equally effective as transformational leaders","Almost universally as less effective","As the most effective style for front-line sergeants","As effective at increasing subordinates' extra effort"],1,"Key finding 8: leaders who practise inactive leadership are almost universally viewed as less effective, with possible exceptions among higher ranks.","https://library.college.police.uk/docs/npia/Great-Police-Leader-REA-2011.pdf"],["Q0963",3,8,27,"Campbell & Kodz (2011), section 1 Key findings (10); section 5.5",2,"According to Campbell and Kodz's NPIA Rapid Evidence Review 'What makes great police leadership?' (2011), when can high emotional intelligence undermine leader effectiveness?",["When combined with a participative style","When coupled with long operational expe
