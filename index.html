ted by the Management Board on the basis of a proposal from the European Commission.","http://www.frontex.europa.eu/"],["Q0234",0,0,4,"About Frontex > Who we are > Structure (Executive Profiles)",0,"According to the Frontex website, since when has Hans Leijtens served as Frontex Executive Director?",["1 July 2022","1 March 2023","1 January 2021","16 February 2022"],1,"The executive profile states Hans Leijtens has served as Executive Director since 1 March 2023 (Aija Kalnaja was ad interim from 1 July 2022 to 28 February 2023).","http://www.frontex.europa.eu/"],["Q0235",0,0,4,"About Frontex > Who we are > Structure",0,"According to the Frontex website, how many Deputy Executive Directors assist the Executive Director?",["Seven","Four","Three","Two"],2,"The Structure page states the Executive Director is assisted by three Deputy Executive Directors, each with a specific area of responsibility.","http://www.frontex.europa.eu/"],["Q0236",0,0,4,"About Frontex > Who we are > Structure",0,"According to the Frontex website, to whom does the independent Fundamental Rights Officer report directly?",["The Executive Director","The European Ombudsman","The European Parliament's LIBE Committee","The Management Board"],3,"The Structure page states an independent Fundamental Rights Officer reports directly to the Management Board and cooperates with the Consultative Forum.","http://www.frontex.europa.eu/"],["Q0237",0,0,4,"About Frontex > Management Board",1,"According to the Frontex website, how often are meetings of the Frontex Management Board held?",["Five times a year","Twice a year","Four times a year","Once a month"],0,"The Management Board page states meetings are convened by the Chairperson and held five times a year.","http://www.frontex.europa.eu/"],["Q0238",0,0,4,"About Frontex > Management Board",2,"According to the Frontex website, what is the position of Ireland's representative in the Frontex Management Board?",["Full member with full voting rights like other EU Member States","Invited to participate in meetings but has no voting rights","Member with limited voting rights like the Schengen associated countries","Observer only when Irish airports are concerned"],1,"The Management Board page states a representative from Ireland (Schengen opt-out) is invited to participate but has no voting rights.","http://www.frontex.europa.eu/"],["Q0239",0,0,4,"About Frontex > Management Board",2,"According to the Frontex website, which participants in the Management Board have only limited voting rights?",["Cyprus, Ireland, Denmark and Bulgaria","The two representatives of the European Commission","Iceland, Liechtenstein, Norway and Switzerland","Romania, Bulgaria, Croatia and Cyprus"],2,"The page states the Schengen associated countries Iceland, Liechtenstein, Norway and Switzerland participate but retain limited voting rights.","http://www.frontex.europa.eu/"],["Q0240",0,0,4,"About Frontex > Standing Corps",0,"According to the Frontex website, what will be the total size of the European Border and Coast Guard Standing Corps by 2027?",["10,000 people, of whom 7,000 Category 1 officers","5,000 people, of whom 1,500 Category 1 officers","15,000 people, of whom 3,000 Category 1 officers","10,000 people, of whom 3,000 Category 1 officers"],3,"The Standing Corps page states that by 2027 it will comprise 10,000 people, among them 3,000 Category 1 officers; the other 7,000 are seconded or deployed by Member States.","http://www.frontex.europa.eu/"],["Q0241",0,0,4,"About Frontex > Standing Corps (Categories)",1,"According to the Frontex website, which officers form Category 2 of the Standing Corps?",["Long-term staff seconded from EU Member States","Border guards directly employed by Frontex as staff members","Short-term staff deployed from EU Member States","Officers of third countries deployed under status agreements"],0,"The Categories section defines Category 1 as Frontex statutory staff, Category 2 as long-term secondments from Member States and Category 3 as short-term deployments.","http://www.frontex.europa.eu/"],["Q0242",0,0,4,"About Frontex > Standing Corps",1,"According to the Frontex website, under whose command do Frontex Standing Corps officers work when deployed?",["The Frontex Executive Director at the Agency's headquarters in Warsaw","The national authorities of the country in which they are deployed","The European Commission's Directorate-General for Migration and Home Affairs","The Frontex-appointed commander of the respective joint operation"],1,"The Standing Corps page and the operational cycle page state officers work under the command and control of the host country's authorities.","http://www.frontex.europa.eu/"],["Q0243",0,0,4,"What we do > Operations > EU's coast guard cooperation",0,"According to the Frontex website, which three EU agencies support national authorities in performing coast guard functions?",["Frontex, Europol and EUAA","Frontex, eu-LISA and EMSA","Frontex, EFCA and EMSA","Frontex, EFCA and SatCen"],2,"The coast guard cooperation page lists Frontex (Warsaw), the European Fisheries Control Agency (Vigo) and the European Maritime Safety Agency (Lisbon).","http://www.frontex.europa.eu/"],["Q0244",0,0,4,"What we do > Operations > EU's coast guard cooperation ('Legal framework')",2,"According to the Frontex website, what happened on 18 March 2021 regarding European cooperation on coast guard functions?",["The three agencies signed their first Tripartite Working Arrangement for four years","The Commission proposed amending the founding regulations of the three agencies","The Council adopted the Practical Handbook on coast guard cooperation","Frontex, EMSA and EFCA renewed the Tripartite Working Arrangement for an indefinite period"],3,"The page states the first Tripartite Working Arrangement was signed in 2017 for four years and was renewed on 18 March 2021 for an indefinite period.","http://www.frontex.europa.eu/"],["Q0245",0,0,4,"What we do > Monitoring and risk analysis ('Eurosur')",1,"According to the Frontex website, what is the backbone of EUROSUR?",["A network of National Coordination Centres established by each Member State","A network of Frontex liaison officers deployed in neighbouring third countries","The European Monitoring Room in Warsaw, operating alone as a single central hub","A satellite constellation operated by the EU Satellite Centre for Frontex"],0,"The Eurosur section states the backbone of Eurosur is a network of National Coordination Centres (NCCs), each grouping a Member State's border control authorities.","http://www.frontex.europa.eu/"],["Q0246",0,0,4,"What we do > Monitoring and risk analysis ('Eurosur')",2,"According to the Frontex website, which impact levels can be attributed to border sections under EUROSUR?",["Green, amber or red","Low, medium or high","Minor, serious or critical","Level 1 to level 5"],1,"The Eurosur section states each border section is attributed an impact level of low, medium or high; for high impact sections Member States may request Frontex assistance.","http://www.frontex.europa.eu/"],["Q0247",0,0,4,"What we do > ETIAS/EES > About ETIAS",1,"According to the Frontex website, what is the role of Frontex in ETIAS?",["It develops and maintains the ETIAS information system and hosts all of the ETIAS National Units","It takes the final decision on all ETIAS applications that raise concerns in automated processing","It hosts the 24/7 ETIAS Central Unit, which also defines risks, risk indicators and screening rules","It issues short-stay visas to travellers whose ETIAS applications have been refused by Member States"],2,"The About ETIAS page states Frontex hosts the 24/7 ETIAS Central Unit, responsible also for risks, risk indicators and screening rules; eu-LISA develops the system and National Units decide.","http://www.frontex.europa.eu/"],["Q0248",0,0,4,"What we do > ETIAS/EES > About ETIAS",0,"According to the Frontex website, what share of ETIAS applications is expected to be approved automatically within minutes?",["About 75%","About 50%","About 99.9%","About 97%"],3,"The page states most applications (about 97%) will be approved automatically, the remaining 3% being reviewed manually.","http://www.frontex.europa.eu/"],["Q0249",0,0,4,"Return and reintegration > Return operations > Returns",1,"According to the Frontex website, when can Frontex provide operational and technical support for the return of a non-EU national?",["Only once a return decision is adopted and legally enforceable","As soon as an asylum application is lodged in a Member State","Once Frontex has assessed the merits of the return decision","Only after the person has expressed willingness to return"],0,"The Returns page states Frontex has no role in return decision procedures and can support only when a return decision is adopted and legally enforceable.","http://www.frontex.europa.eu/"],["Q0250",0,0,4,"Fundamental rights > Frontex Complaints Mechanism",1,"According to the Frontex website, within what period must a complaint be submitted to the Frontex complaints mechanism to be admissible?",["Within three months from the moment the facts happened","Within one year from the moment the facts happened","Within thirty days from the end of the operation","Within five years from the moment the facts happened"],1,"The admissibility criteria on the Complaints Mechanism page require submission within one year from the moment the facts happened.","http://www.frontex.europa.eu/"],["Q0251",0,0,5,"Recital (1); Art. 54(4) EBCG Reg.",0,"Under Regulation (EU) 2019/1896, as recalled in Management Board Decision 6/2025, by what date each year must the Management Board adopt the decision defining the profiles of, and requirements for, operational staff of the standing corps?",["31 March","31 January","30 June","31 December"],0,"Recital (1) recalls Article 54(4) of the Regulation, under which the Management Board adopts the decision by 31 March of each year.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0252",0,0,5,"Preamble; Art. 100(2)(i) EBCG Reg.; Done at Warsaw",1,"Management Board Decision 6/2025 adopting the standing corps profiles for 2026 was adopted on which date?",["27 March 2024","31 March 2025","22 November 2023","26 March 2025"],3,"The Decision was 'done in Warsaw, on 26 March 2025' and signed by Chairperson Alexander Fritsch.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0253",0,0,5,"Recital (1)",2,"According to Management Board Decision 6/2025, on whose proposal does the Management Board adopt the decision defining standing corps profiles?",["The European Commission","The Fundamental Rights Officer","The Executive Director","The Consultative Forum"],2,"Recital (1) states the Management Board acts on the basis of a proposal by the Executive Director, taking into account risk analysis, vulnerability assessment and the multiannual strategic policy for EIBM.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0254",0,0,5,"Recital (3); MBD 18/2024",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), in which separate act are the 'operational horizontal functions' that standing corps members may additionally perform defined?",["Management Board Decision 45/2023","Management Board Decision 18/2024","Commission Recommendation (EU) 2021/1222","Executive Director Decision R-ED-2022-145"],1,"Recital (3) refers to Management Board Decision 18/2024 of 27 March 2024 on operational horizontal functions; they are not covered by Decision 6/2025.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0255",0,0,5,"Annex, section 1(a)",0,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), what legal or operational effect do the standing corps profiles have on national profiles, roles or tasks?",["They replace national profiles for deployed staff","They have no legal or operational effect on them","They are binding on national authorities from 2026","They apply only to profiles of seconded staff"],1,"General consideration (a) states that the profiles have no legal or operational effect on national profiles, roles, or tasks.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0256",0,0,5,"Annex, section 1(b)",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), in accordance with which framework are the competences for specific profiles defined?",["The Sectoral Qualifications Framework for Border Guarding","The Common European Framework of Reference for Languages","The Schengen Evaluation and Monitoring Mechanism","The Common Core Curriculum for EU Border Guards"],0,"General consideration (b) states competences are defined in accordance with the Sectoral Qualifications Framework for Border Guarding.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0257",0,0,5,"Annex, section 1(e)",0,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), which of the following is required of ALL members of the standing corps?",["English at CEFR level C1","At least three years of border check experience","Certification as a document examiner","Basic knowledge of first aid procedures"],3,"General consideration (e) requires all members of the standing corps to have basic knowledge of first aid procedures.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0258",0,0,5,"Annex, section 1(l); Reg. (EU) 2015/1998",2,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), members of the standing corps deployed to airports should be trained and certified in line with which act to obtain an airport ID?",["Regulation (EU) 2016/399 (Schengen Borders Code)","Directive 2008/115/EC (Return Directive)","Regulation (EU) 2015/1998 on aviation security","Council Directive 89/391/EEC on safety at work"],2,"Consideration (l) refers to Regulation (EU) 2015/1998, point 11.2.6, on training of persons requiring unescorted access to security restricted areas.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0259",0,0,5,"Annex, section 1(k)",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), which databases may members of the standing corps consult where necessary for operational aims of the operational plan?",["Only the host Member State's national databases, without Union ones","Only databases owned or operated by Frontex under the plan","Relevant Union databases; national ones if the host MS authorises","Any Union or national database, with no host MS authorisation"],2,"Consideration (k): members may consult relevant Union databases; the host MS may also authorise consultation of its national databases.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0260",0,0,5,"Annex, section 2.2",0,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), which of the following is NOT one of the core tasks of the Border and Coast Guard Officer profile?",["Border checks at first and second line","Registration and fingerprinting","Border surveillance at external borders","Coast guard functions in maritime operations"],1,"Section 2.2 lists border checks, border surveillance and coast guard functions as core tasks; registration and fingerprinting is an auxiliary task (2.3.2).","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0261",0,0,5,"Annex, section 2.4",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), what minimum English level is expected of a Border and Coast Guard Officer performing coast guard functions (2.2.3)?",["CEFR level B2","CEFR level B1","CEFR level A2","CEFR level C1"],0,"Section 2.4 requires CEFR B1 for border checks and surveillance, but B2 for coast guard functions (2.2.3).","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0262",0,0,5,"Annex, section 2.2.3(e)",2,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), a Border and Coast Guard Officer performing coast guard functions supports staff in preparing which kind of reports?",["Return operation monitoring reports for return flights","Vulnerability assessment reports on national capacities","Debriefing interview reports for the Agency's risk analysis","Sighting forms on fisheries and potential marine pollution"],3,"Section 2.2.3(e) mentions reports related to coast guard functions such as sighting forms on fisheries and potential marine pollution.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0263",0,0,5,"Annex, section 3.2.1(b)",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), in which application does an Information Officer process and validate incidents, cross-referencing with EUROSUR data?",["IRMA (Integrated Return Management Application)","RIAT (Reintegration Assistance Tool)","FAR (Frontex Application for Return)","JORA (Joint Operations Reporting Application)"],3,"Section 3.2.1(b): Information Officers process and validate incidents in JORA, cross-referencing EUROSUR data and other sources.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0264",0,0,5,"Annex, section 4.2.1(a)",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), how are debriefing interviews carried out by Debriefing Officers characterised?",["Mandatory, formal, recorded and public","Voluntary, informal, recorded and shared","Voluntary, formal, anonymous and confidential","Mandatory, anonymous, informal and confidential"],2,"Section 4.2.1(a): debriefing interviews are voluntary, formal, anonymous and confidential; screening interviews are mandatory (4.2.1(i)).","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0265",0,0,5,"Annex, section 4.2.1(j)",0,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), which task belongs to the screening part of the Debriefing Officer profile?",["Processing bookings for returnees in the IRMA application","Establishing the assumed nationality of an interviewed person","Inspecting fishing vessels and their catches at sea","Managing the weapons and ammunition inventory of the team"],1,"Section 4.2.1(j) lists establishing the assumed nationality of an interviewed person as a screening task.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0266",0,0,5,"Annex, section 5.3",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), how much professional experience as a document examination officer is required for the Advanced Level Document Officer profile?",["At least three years","At least one year","At least two years","At least five years"],0,"Section 5.3 requires proven professional experience of at least three years as a document examination officer.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0267",0,0,5,"Annex, section 5.2(f)",2,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), to which level of expertise does an Advanced Level Document Officer refer documents?",["The third line","The second line","The first line","The gate check line"],0,"Section 5.2(f): the Advanced Level Document Officer refers documents to the third line of expertise.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0268",0,0,5,"Annex, section 6.3",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), what English level is required for a Cross-Border Crime Detection Officer performing motor vehicle crime detection?",["CEFR level B2","CEFR level C1","CEFR level A2","CEFR level B1"],3,"Section 6.3 requires B2 for cross-border crime detection but only B1 for motor vehicle crime detection (6.2.2).","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0269",0,0,5,"Annex, section 7.2(b)",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), which statement about the use of force by a Dog Handler searching for sources of human scent is correct?",["Force must always be used when apprehending a detected person","Dog handlers are prohibited from any use of force while deployed","Force may be used under applicable law but is not mandatory","Force may be used only on prior instruction of Frontex staff"],2,"Section 7.2(b) allows the use of force in accordance with applicable legislation, 'the use of force not being mandatory'.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0270",0,0,5,"Annex, section 8.3",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), what experience is required for occupational safety and health support within the Logistics and OSH Support Officer profile?",["At least two years of full-time experience in logistics support","At least three years' full-time proven experience in OSH","At least five years of experience in weapons management","At least one year of deployment in a Frontex joint operation"],1,"Section 8.3 requires at least three years' full-time proven experience in occupational safety and health.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0271",0,0,5,"Annex, section 9.3",0,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), what minimum English level is required for a Frontex Return Escort and Support Officer?",["CEFR level B2","CEFR level B1","CEFR level C1","CEFR level A2"],1,"Section 9.3 requires adequate English equivalent to CEFR level B1.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0272",0,0,5,"Annex, section 10.3",1,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), what minimum professional experience is required of a Return Specialist?",["At least two years in one or more of the profile's tasks","At least three years in the specific crew role on an asset","At least five years of work in consular or diplomatic affairs","At least one year of escorting in a forced-return operation"],0,"Section 10.3 requires at least two years of professional experience in one or more tasks described for the profile.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0273",0,0,5,"Annex, section 11.1, footnote 15",2,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), which persons are expressly excluded from the Crew Member profile?",["Crew members operating aerial rather than maritime assets","Statutory staff of the Agency acting as crew members","Officials of national authorities performing boarding tasks","Crew members provided by private contractors"],3,"Footnote 15 to section 11.1 states that crew members provided by private contractors are excluded.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0274",0,0,5,"Annex, section 11.3",0,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), how much experience in the specific crew role must a Crew Member have?",["A minimum of one year","A minimum of two years","A minimum of three years","A minimum of five years"],2,"Section 11.3 requires a minimum of three years of experience in the specific crew role.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0275",0,0,5,"Annex, section 12.2",0,"Under Management Board Decision 6/2025 (standing corps profiles for 2026), which of the following profiles is NOT listed among those with a derogation from the obligation to wear a uniform?",["Debriefing Officer","Return Specialist","Dog Handler","Frontex Return Escort and Support Officer"],2,"Section 12.2 lists derogations for the Border and Coast Guard Officer (return support), Debriefing Officer, Frontex Return Escort and Support Officer, and Return Specialist only.","https://prd.frontex.europa.eu/document/management-board-decision-6-2025-decision-adopting-the-profiles-to-be-made-available-to-the-european-border-and-coast-guard-standing-corps-for-2026/"],["Q0276",0,0,6,"Booklet, 'Who are the agencies involved'",0,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', which three EU agencies support national authorities in performing coast guard tasks?",["EMSA, Europol and Frontex","EFCA, EMSA and Frontex","EFCA, EASA and Frontex","EMSA, EUAA and Frontex"],1,"The booklet names the European Fisheries Control Agency, the European Maritime Safety Agency and the European Border and Coast Guard Agency.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0277",0,0,6,"Booklet, 'Why do we cooperate?'; Rec. 2021/1222 Annex, section 1",0,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', approximately how many civilian and military authorities in the Member States carry out coast guard functions?",["More than 300","More than 100","More than 500","More than 1 000"],0,"The booklet states that more than 300 civilian and military authorities in the Member States work together around the clock.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0278",0,0,6,"Booklet, 'What is the legal basis?'",1,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', in which year was the agencies' cooperation formalised by a Commission legislative proposal inserting a common article in their founding regulations?",["2017","2019","2021","2016"],3,"The booklet states that in 2016 the cooperation was formalised through amendment of the three founding regulations with a common article.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0279",0,0,6,"Booklet, 'What is the legal basis?'",0,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', what did the three agencies sign in 2017 to structure their cooperation?",["A Memorandum of Understanding with the Commission","A Service Level Agreement with Europol","A Tripartite Working Arrangement","A Joint Declaration on maritime security"],2,"In 2017 the agencies signed a Tripartite Working Arrangement.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0280",0,0,6,"Booklet, 'What is the legal basis?'",1,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', what happened on 18 March 2021?",["The Practical Handbook was adopted as a Commission recommendation","The common article on coast guard functions entered into force","The Tripartite Working Arrangement was renewed for an indefinite period","The first Annual European Coast Guard Event was held"],2,"The booklet states that on 18 March 2021 the Tripartite Working Arrangement was renewed for an indefinite period.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0281",0,0,6,"Booklet, 'What are the coast guard functions?'",0,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', in which act are the coast guard functions commonly referred to by the three agencies outlined?",["Regulation (EU) 2019/1896, Article 10","Commission Recommendation (EU) 2021/1222","Council Decision on the EU Maritime Security Strategy","Regulation (EU) 2019/473 on EFCA, Article 8"],1,"The booklet refers to Commission Recommendation (EU) 2021/1222 of 20 July 2021 establishing a 'Practical Handbook'.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0282",0,0,6,"Booklet, 'What are the coast guard functions?'; Rec. 2021/1222 Annex 3.1",1,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', which of the following is NOT among the listed coast guard functions?",["Asylum application processing","Maritime customs activities","Fisheries inspection and control","Maritime, ship and port security"],0,"The list comprises 11 functions including customs, fisheries and port security; asylum processing is not among them.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0283",0,0,6,"Rec. 2021/1222 Annex, section 3.1",2,"Under Commission Recommendation (EU) 2021/1222 (Practical Handbook), how many coast guard functions are listed, as originally generated by the European Coast Guard Functions Forum?",["Five","Eight","Thirteen","Eleven"],3,"Section 3.1 of the Annex lists points (a) to (k), i.e. eleven coast guard functions, originating from the ECGFF.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0284",0,0,6,"Booklet, 'How do we cooperate?'",1,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', which of the following is one of the five areas of inter-agency cooperation?",["Joint procurement","Visa policy","Asylum support","Capacity sharing"],3,"The five areas shown are information sharing, surveillance services, capacity building, risk analysis and capacity sharing.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0285",0,0,6,"Booklet, agency descriptions",0,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', which agency focuses on operational coordination of fisheries control and inspection activities?",["EMSA","Frontex","EFCA","Europol"],2,"The booklet states that EFCA focuses on operational coordination of fisheries control and inspection activities.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0286",0,0,6,"Booklet, agency descriptions",1,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', which agency 'serves EU maritime interests for a safe, secure, green and competitive maritime sector'?",["EFCA","EMSA","Frontex","ENISA"],1,"This is the booklet's description of the European Maritime Safety Agency.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0287",0,0,6,"Booklet, agency descriptions",0,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', what does Frontex aim at?",["Better external border management for internal security and fighting cross-border crime","Ensuring compliance and a level playing field for the fishing industry and sustainable fisheries","Serving as a reference point for a safe, secure, green and competitive maritime sector","Coordinating the naval defence and military maritime operations of the Member States"],0,"The booklet describes Frontex as aiming at improving external border management to ensure internal security and tackle cross-border crime.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0288",0,0,6,"Art. 69(1) Reg. (EU) 2019/1896",1,"Under Article 69(1) of Regulation (EU) 2019/1896, the Agency's support to national coast guard authorities is provided without prejudice to which system?",["EUROSUR","SafeSeaNet","Schengen Information System","Eurodac"],0,"Article 69(1) opens 'Without prejudice to EUROSUR, the Agency shall, in cooperation with EFCA and EMSA, support national authorities...'.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0289",0,0,6,"Art. 69(1)(a) Reg. (EU) 2019/1896",2,"Under Article 69(1)(a) of Regulation (EU) 2019/1896, information in ship reporting systems is shared, fused and analysed subject to which limitation?",["Only with the prior consent of the flag state","Only for search and rescue purposes","Subject to approval by the European Data Protection Supervisor","Without prejudice to the ownership of data by Member States"],3,"Article 69(1)(a) specifies 'in accordance with their respective legal bases and without prejudice to the ownership of data by Member States'.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0290",0,0,6,"Art. 69(1)(e) Reg. (EU) 2019/1896",2,"Under Article 69(1)(e) of Regulation (EU) 2019/1896, capacity sharing through multipurpose operations is possible to the extent that the activities are coordinated by the agencies and:",["authorised in advance by the European Commission and the Council","approved in advance by the European Parliament's competent committee","agreed to by the competent authorities of the Member States concerned","notified in advance to the International Maritime Organization"],2,"Article 69(1)(e) requires that the activities be coordinated by those agencies and agreed to by the competent authorities of the Member States concerned.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0291",0,0,6,"Art. 69(2) Reg. (EU) 2019/1896",1,"Under Article 69(2) of Regulation (EU) 2019/1896, the precise forms of cooperation between Frontex, EFCA and EMSA are determined in which instrument?",["A Commission implementing regulation adopted after consultation","A working arrangement approved by the agencies' boards","A Council decision adopted unanimously by the Member States","A memorandum of understanding signed by the Member States"],1,"Article 69(2) provides for a working arrangement approved by the Frontex management board and the administrative boards of EFCA and EMSA.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0292",0,0,6,"Art. 69(3) Reg. (EU) 2019/1896",1,"Under Article 69(3) of Regulation (EU) 2019/1896, in what legal form does the Commission adopt the practical handbook on European cooperation on coast guard functions?",["A delegated regulation","A recommendation","A directive","A Council decision"],1,"Article 69(3) states 'The Commission shall adopt the handbook in the form of a recommendation.'","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0293",0,0,6,"Art. 69(1)(c) Reg. (EU) 2019/1896",1,"Under Article 69(1)(c) of Regulation (EU) 2019/1896, how is 'building capacity' to be achieved?",["Guidelines, best practices, training and exchange of staff","Joint procurement of patrol vessels and aircraft by the agencies","Permanent secondment of naval units to the Agency's standing corps","Direct EU financing of national coast guard operating budgets"],0,"Article 69(1)(c) refers to drawing up guidelines and recommendations, establishing best practices, and providing training and exchange of staff.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0294",0,0,6,"Rec. 2021/1222, point 6",1,"According to Commission Recommendation (EU) 2021/1222, what is the legal effect of the Practical Handbook on national authorities?",["It creates binding duties for national authorities to share all data","It replaces national legislation on coast guard functions in each MS","It confers executive powers on the staff of the three EU agencies","It creates no new rights or duties and no interpretative guidance"],3,"Point 6 states the handbook shall not create any new rights or duties nor offer interpretative guidance on existing roles and rules.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0295",0,0,6,"Rec. 2021/1222, point 8",2,"According to Commission Recommendation (EU) 2021/1222, which agency operates the online platform displaying the Practical Handbook's practical information?",["EMSA","Frontex","EFCA","The Commission's DG MARE"],2,"Point 8 states the information is displayed on an online platform operated by EFCA in close cooperation with the other two agencies and the Commission.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0296",0,0,6,"Rec. 2021/1222, point 3",1,"According to Commission Recommendation (EU) 2021/1222, which States does the Practical Handbook cover?",["EU Member States only","EU Member States and candidate countries","EU Member States and EFTA States","All IMO member States"],2,"Point 3 states that the handbook covers EU Member States and European Free Trade Association (EFTA) States.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0297",0,0,6,"Rec. 2021/1222 Annex, section 3.2",2,"According to the Practical Handbook (Recommendation (EU) 2021/1222), by when must the TWA steering committee approve the annual strategic plan each year?",["Before 31 December","Before 1 September","Before 30 November","Before 31 October"],1,"Section 3.2 states the steering committee approves, before 1 September each year, the annual strategic plan to implement the TWA.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0298",0,0,6,"Rec. 2021/1222 Annex, section 3.2",1,"According to the Practical Handbook (Recommendation (EU) 2021/1222), which body organises the Annual European Coast Guard Event (AECGE)?",["The agency chairing the TWA steering committee","The European Commission's DG HOME","The Member State holding the Council presidency","The European Coast Guard Functions Forum secretariat"],0,"Section 3.2 states it was agreed in 2017 that the AECGE is organised by the agency currently chairing the TWA steering committee.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0299",0,0,6,"Rec. 2021/1222 Annex, section 3.3(b)",2,"According to the Practical Handbook (Recommendation (EU) 2021/1222), what does the SLA between EMSA and Frontex cover?",["Frontex deployment of offshore patrol vessels for fisheries control","EFCA's access to Frontex aerial surveillance for fisheries patrols","Joint training of boarding teams by EMSA and Frontex experts","EMSA maritime services for EUROSUR and Frontex use of EMSA RPAS"],3,"Section 3.3(b): the EMSA-Frontex SLA (2013) covers dedicated maritime services in support of EUROSUR and Frontex use of EMSA RPAS for border control.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0300",0,0,6,"Booklet, 'Why do we cooperate?'",0,"According to the Frontex/EFCA/EMSA publication 'European cooperation on coast guard functions', which of the following is cited as a risk to which the maritime domain is exposed?",["Currency speculation","Airspace congestion","Desertification","Illegal fishing"],3,"The booklet lists accidents, marine pollution, illegal fishing, terrorism, piracy, people smuggling and other cross-border crimes.","https://prd.frontex.europa.eu/document/european-cooperation-on-coast-guard-functions-2/"],["Q0301",0,1,7,"Introduction / summary",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', what is the estimated loss in annual GDP growth over 2022-23 for every 1 000 km reduction in distance to the war?",["Around 0.5 percentage points","Around 4 percentage points","Around 2 percentage points","Around 6 percentage points"],2,"The summary states the loss in annual growth over 2022-23 is around 2 pps. for every 1 000 km reduction in distance.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0302",0,1,7,"Section 'Comparing economic outcomes...' / measure of proximity",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', how is geographical proximity to the war measured?",["Distance from each capital to the front line in eastern Ukraine","Average distance of each capital to Kyiv and Moscow, plus a border","Length of each Member State's land border with Russia or Belarus","Average flight time from each capital to Kyiv and to Moscow"],1,"Proximity is measured by the average of the distances between each capital and Kyiv and Moscow, and by the presence of a border.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0303",0,1,7,"Section on proximity groups",0,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', how many Member States form the group of 'closer' countries?",["Thirteen","Eight","Ten","Seventeen"],0,"The 'closer' group comprises the thirteen Member States with a distance lower than the median.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0304",0,1,7,"Section on proximity groups",0,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', how many EU Member States border either Ukraine or Russia?",["Five","Six","Thirteen","Eight"],3,"The eight bordering countries are Estonia, Finland, Hungary, Latvia, Lithuania, Poland, Romania and Slovakia.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0305",0,1,7,"Section on proximity groups",0,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', which of the following countries is listed among the Member States bordering Ukraine or Russia?",["Bulgaria","Czechia","Austria","Romania"],3,"Romania is among the eight bordering countries; Bulgaria, Czechia and Austria are in the 'closer' group but do not border Ukraine or Russia.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0306",0,1,7,"Section on proximity groups",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', which of the following Member States belongs to the 'closer' group but is NOT a bordering country?",["Finland","Latvia","Germany","Slovakia"],2,"Germany is in the group of thirteen 'closer' countries but is not among the eight that border Ukraine or Russia.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0307",0,1,7,"Section 'Comparing economic outcomes to pre-war expectations'",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', which forecast serves as the pre-war benchmark for the forecast-error analysis?",["The Spring 2022 Forecast","The Autumn 2021 Forecast","The Winter 2022 Forecast","The Autumn 2019 Forecast"],1,"The analysis compares outcomes with the Autumn 2021 Forecast (AF21), the last before Russia's full-scale invasion.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0308",0,1,7,"Section 'Comparing economic outcomes...'",2,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', by how much was actual annual average GDP growth in 2022-23 lower than the pre-war forecast for the median Member State among those closer to the war?",["1.9 percentage points","0.9 percentage points","3.7 percentage points","5.9 percentage points"],0,"The text states actual annual average growth in 2022-23 was 1.9 pps. lower than the pre-war forecast.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0309",0,1,7,"Section 'Bordering countries appear most vulnerable...'",2,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', for which expenditure component was NO proximity effect detected in the forecast-error analysis?",["Government consumption","Private consumption","Investment","Imports of goods and services"],0,"Proximity effects were found for private consumption, investment, exports and imports; the only exception was government consumption.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0310",0,1,7,"Section 'Proximity to the war is also linked to higher inflationary shocks'",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', by how much did EU HICP inflation exceed the pre-war forecast per year?",["2.2 percentage points","3.7 percentage points","1.9 percentage points","5.9 percentage points"],3,"HICP inflation turned out to be 5.9 pps. per year above the pre-war forecast.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0311",0,1,7,"Section on inflationary shocks",2,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', how much higher was median HICP inflation in Member States bordering the war compared with the EU average?",["About 2.2 percentage points","About 5.9 percentage points","About 3.7 percentage points","About 1.1 percentage points"],2,"Median HICP inflation was about 2.2 pps. higher for closer countries and 3.7 pps. higher for those bordering the war.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0312",0,1,7,"Section 'The drivers of the economic impact of proximity'",0,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', which of the following is identified as a channel through which proximity amplifies exposure to the war's economic consequences?",["Lower exposure to sanctions and supply bottlenecks","Greater dependence on Russian gas and oil","Reduced defence spending by neighbouring governments","Higher tourism inflows from the countries at war"],1,"The drivers include stronger trade links, energy intensity and dependence on Russian gas and oil, higher risk premiums, displaced persons and security concerns.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0313",0,1,7,"Section 'The drivers...'",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', for which economies are higher financial risk premiums linked to proximity said to be particularly relevant?",["Euro-area economies","Non-euro-area economies","Nordic economies","Southern European economies"],1,"The text notes higher financial risk premiums, particularly in non-euro-area economies.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0314",0,1,7,"Section 'Empirical studies confirm...' (Federle et al. 2024a)",2,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', what did Federle et al. (2024a), analysing 150 years and 60 countries, find about the spillover of war costs?",["They spill over to nearby countries via trade contraction","They remain confined to the territories of the countries at war","They are spread evenly across countries regardless of distance","They spill over to distant countries mainly via migration flows"],0,"Federle et al. (2024a) found that economic costs of war spill over to geographically close countries through trade contraction.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0315",0,1,7,"Section 'Empirical studies...' (Gluszak et al. 2025)",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', according to Gluszak et al. (2025), what was the effect of the arrival of persons fleeing Ukraine on rents in Poland's largest cities?",["A fall of around 0.7%","A rise of around 7%","No measurable effect","A rise of around 0.7%"],3,"Gluszak et al. (2025) showed rents in Poland's largest cities rose by around 0.7%.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0316",0,1,7,"Section 'Testing for war proximity effects...'",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', over which period is the panel data regression model estimated?",["2013-2019","2022-2024","2002-2024","1990-2024"],2,"The model is estimated over 2002-24 with country and time fixed effects.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0317",0,1,7,"Section 'Quantifying the economic cost of proximity'",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', what is the estimated growth loss for Member States bordering the war compared with the EU average distance?",["Around 1.1-1.3 percentage points","Around 0.1-0.2 percentage points","Around 1.4-1.8 percentage points","Around 6 percentage points"],2,"The estimates correspond to 1.1-1.3 pps. lower growth for closer countries and around 1.4-1.8 pps. for those bordering the war.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0318",0,1,7,"Section 'Quantifying...' (Graph II.1.6)",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', what is the approximate difference in annual GDP growth between the most distant and the closest Member State?",["Around 2 percentage points","Around 6 percentage points","Around 1 percentage point","Around 10 percentage points"],1,"The text states the difference between the most distant and the closest country amounts to around 6 pps.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0319",0,1,7,"Section 'Controlling for growth drivers...' (Table II.1.1, spec. 3)",2,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', including which variables makes the proximity coefficient shrink by about half and become statistically insignificant?",["Energy intensity and energy prices","Government expenditures on defence","GDP per capita and investment-to-GDP","Population growth and migration rates"],0,"In specification (3), including energy intensity and energy prices halves the coefficient and makes it insignificant; adding government expenditure makes it larger.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0320",0,1,7,"Section 'Testing...'; labour channel",1,"According to the European Commission (DG ECFIN) Special Topic 'The cost of EU Member States' proximity to the war', what happened to employment growth in countries near the conflict despite the inflow of displaced persons from Ukraine?",["It was stronger than the EU average","It was unaffected","It rose sharply in 2022","It remained weaker"],3,"The text notes that despite more displaced persons, employment growth remained weaker in countries near the conflict.","https://economy-finance.ec.europa.eu/cost-eu-member-states-proximity-war_en"],["Q0321",0,1,8,"Ch. I Introduction",1,"According to the Frontex 'Research Study on Polycrisis' (final report), in support of which initiative was the study carried out?",["The European Council's Strategic Agenda 2024-2029","Europol's EU SOCTA 2025 assessment","The Interpol Global Policing Goals","The IALG 'Pearls in Policing' assignment"],3,"Chapter I states the study supported the IALG 'Pearls in Policing' assignment for 2023/2024 on 'The Future of Policing: Fostering Trust and Legitimacy'.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0322",0,1,8,"Ch. I Introduction",0,"According to the Frontex 'Research Study on Polycrisis' (final report), during which period was the study carried out?",["January to April 2023","September to December 2023","January to April 2024","May to October 2024"],2,"Chapter I states the study was carried out for Frontex between January and April 2024.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0323",0,1,8,"Ch. I Introduction",0,"According to the Frontex 'Research Study on Polycrisis' (final report), which five main risk types give rise to polycrises?",["Financial, Geopolitical, Climatic, Demographic and Informational","Economic, Geopolitical, Environmental, Societal and Technological","Political, Institutional, Health, Energy and Cybersecurity","Economic, Migratory, Hybrid, Criminal and Technological"],1,"Chapter I lists five main risk types: Economic, Geopolitical, Environmental, Societal and Technological.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0324",0,1,8,"Ch. III.1 Definition of key concepts (Polycrisis)",0,"According to the Frontex 'Research Study on Polycrisis' (final report), who coined the term 'polycrisis'?",["Edgar Morin","Jean-Claude Juncker","Adam Tooze","Thomas Homer-Dixon"],0,"Section III.1 states the term was coined by French theorist Edgar Morin and later embraced by Jean-Claude Juncker in 2016.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0325",0,1,8,"Ch. III.1 (Polycrisis)",1,"According to the Frontex 'Research Study on Polycrisis' (final report), in which year did Commission President Jean-Claude Juncker embrace the term 'polycrisis'?",["2016","2008","2012","2020"],0,"Section III.1 states the term was embraced in 2016 by Jean-Claude Juncker to describe converging crises affecting EU governance.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0326",0,1,8,"Ch. III.1 (Polycrisis)",2,"According to the Frontex 'Research Study on Polycrisis' (final report), which crisis was NOT among those cited as converging when Juncker used the term 'polycrisis'?",["The Greek debt crisis","The Syrian refugee crisis","Discussions on Brexit","The COVID-19 pandemic"],3,"Section III.1 cites the Greek debt crisis, Russia's initial aggression against Ukraine, the Syrian refugee crisis and Brexit; COVID-19 came later.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0327",0,1,8,"Ch. III.1 (Polycrisis)",2,"According to the Frontex 'Research Study on Polycrisis' (final report), why do Homer-Dixon and Rockström (2022) consider the 'perfect storm' metaphor misleading?",["It overstates the economic impact of simultaneous crises","It ignores the role of technology in accelerating crises","It implies a temporary coincidence, not intertwined crises","It applies only to natural and environmental disasters"],2,"Section III.1 explains the metaphor suggests a temporary coincidence, whereas the crises are intertwined and worsen one another.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0328",0,1,8,"Ch. III.1 (Legitimacy)",1,"According to the Frontex 'Research Study on Polycrisis' (final report), which of the following is listed as a key component of legitimacy?",["Community engagement","Respect for human rights","Professionalism and competence","Fair and impartial treatment"],1,"Legitimacy components are legal authority, accountability, respect for human rights and ethical conduct; the other options are components of trust.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0329",0,1,8,"Ch. III.1 (Trust and legitimacy)",0,"According to the Frontex 'Research Study on Polycrisis' (final report), how is the relationship between trust and legitimacy described?",["They are independent of each other","They are mutually reinforcing","Legitimacy depends only on trust","Trust undermines legitimacy over time"],1,"Section III.1 states the concepts are mutually reinforcing: a legitimate authority builds trust and a trusted entity is seen as more legitimate.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0330",0,1,8,"Ch. III.1 (Emerging technologies)",1,"According to the Frontex 'Research Study on Polycrisis' (final report), within what time frame are 'emerging technologies' understood to become available?",["Within the coming five to ten years","Within the coming one to two years","Within the coming 15 to 20 years","Within the current budgetary cycle"],0,"Section III.1 defines emerging technologies as those under development or available within the coming five to ten years.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0331",0,1,8,"Ch. II.2 Scope and limitations",2,"According to the Frontex 'Research Study on Polycrisis' (final report), which planned activity did NOT take place, limiting the formal validation of findings?",["Interviews with law enforcement stakeholders","A desk review of academic literature","Delivery of the 'Interactive Table' (D2.2)","An interactive workshop with key experts"],3,"Section II.2 explains that the envisaged interactive workshop did not take place due to delays in organising the expert consultations.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0332",0,1,8,"Ch. III.2 Overview of trends and risks",0,"According to the Frontex 'Research Study on Polycrisis' (final report), which risk did most respondents to the WEF Global Risks Perception Survey 2023-2024 rank as highest for 2024?",["Cyberattacks","Cost-of-living crisis","Extreme weather","Societal polarisation"],2,"Section III.2 notes extreme weather (66%) as the highest risk, ahead of AI-generated mis/disinformation (53%) and polarisation (46%).","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0333",0,1,8,"Ch. III.2",1,"According to the Frontex 'Research Study on Polycrisis' (final report), how many people were expected to participate in elections globally in 2024, raising the risk of misinformation?",["Approximately one billion","Approximately five billion","Approximately three billion","Approximately 500 million"],2,"Section III.2 states that approximately three billion people would participate in elections globally in 2024.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0334",0,1,8,"Ch. III.2, Figure 3",2,"According to the Frontex 'Research Study on Polycrisis' (final report), what share of WEF survey respondents selected AI-generated misinformation and disinformation as a likely material crisis in 2024?",["66%","53%","46%","39%"],1,"Section III.2 gives 53% for AI-generated mis/disinformation, versus 66% extreme weather, 46% polarisation and 39% cyberattacks.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0335",0,1,8,"Ch. III.4 Overview of the to-be-assessed polycrises",0,"According to the Frontex 'Research Study on Polycrisis' (final report), which of the following is one of the four overarching polycrises analysed?",["Migratory streams and returns","Global pandemics and health security","Energy transition and resource scarcity","Financial market instability"],0,"Section III.4 lists social unrest and polarisation, migratory streams and returns, demographic shifts, and misuse of new technologies and AI.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0336",0,1,8,"Ch. IV.2 Migratory streams and returns",1,"According to the Frontex 'Research Study on Polycrisis' (final report), how many migrants were there worldwide according to the 2022 World Migration Report?",["181 million","381 million","81 million","281 million"],3,"Section IV.2 cites 281 million migrants worldwide, or 3.60% of the global population.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0337",0,1,8,"Ch. IV.2",1,"According to the Frontex 'Research Study on Polycrisis' (final report), which phenomenon did stakeholders highlight as foreign entities leveraging migration for geopolitical purposes?",["Secondary movements of migrants","Circular migration of workers","Brain drain from origin countries","Instrumentalisation of migration"],3,"Section IV.2 describes the instrumentalisation of migration, where foreign entities leverage migration for geopolitical purposes, pressuring border security.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0338",0,1,8,"Ch. IV.2, Impact on emerging technologies",1,"According to the Frontex 'Research Study on Polycrisis' (final report), which European initiative is cited as an example of increased interconnectivity and integration of information systems?",["The Schengen Borders Code recast","The EU Digital Services Act","The Smart Borders Package","The Copernicus programme"],2,"Section IV.2 cites the Smart Borders Package in Europe as an example of integrating information systems and databases.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0339",0,1,8,"Ch. IV.3 Demographic shifts",1,"According to the Frontex 'Research Study on Polycrisis' (final report), how is the proportion of the world population over 60 expected to change between 2015 and 2050?",["From 8% to 16%","From 12% to 22%","From 20% to 30%","From 15% to 35%"],1,"Section IV.3, citing the WHO, states the share over 60 will rise from 12% to 22%, nearly doubling.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0340",0,1,8,"Ch. IV.3",2,"According to the Frontex 'Research Study on Polycrisis' (final report), what annual attrition rate due to the ageing population did stakeholders report?",["4-5%","1-2%","8-10%","12-15%"],0,"Section IV.3 reports stakeholders indicated attrition rates of 4-5% annually due to the ageing population.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0341",0,1,8,"Ch. IV.3, Impact on human capital",1,"According to the Frontex 'Research Study on Polycrisis' (final report), which two drivers did a University of Maryland study identify as strongest for Generation Z when joining the public sector?",["Work-life balance/flexibility and career advancement","High starting salary and long-term job security","Pension benefits and the option of early retirement","International mobility and full remote working"],0,"Section IV.3 cites the 'Desire for work-life balance and flexibility' and 'Value for career advancement opportunities' as the two strongest drivers.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0342",0,1,8,"Ch. IV.4 Misuse of new technologies and AI",0,"According to the Frontex 'Research Study on Polycrisis' (final report), which two key drivers explain why law enforcement lags behind criminals in adopting new technologies?",["Lack of political will and public opposition to AI","Technical incompatibility and vendor lock-in risks","Language barriers and lack of training centres","High cost of adoption and regulatory restrictions"],3,"Section IV.4 identifies cost (capability and expertise) and legislative/regulatory restrictions as the two root causes.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0343",0,1,8,"Ch. IV.4, Impact on trust and legitimacy",2,"According to the Frontex 'Research Study on Polycrisis' (final report), what inaccuracy rate was found by the University of Essex (2019) for facial recognition used by the UK Metropolitan Police?",["34%","53%","81%","42%"],2,"Section IV.4 states correct results only 8 out of 42 times, i.e. an inaccuracy rate of 81%.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0344",0,1,8,"Ch. V.1, Finding 3",1,"According to the Frontex 'Research Study on Polycrisis' (final report), in which areas did stakeholders consider it more realistic to establish global standards as a first step?",["Use of force and firearms regulation for officers","Police education, training and forensic standards","Border fencing and surveillance infrastructure design","Salary scales and pension schemes for officers"],1,"Finding 3 states it may be more realistic first to set global standards for universal elements such as police education, training and forensic standards.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0345",0,1,8,"Ch. V.1, Finding 6",1,"According to the Frontex 'Research Study on Polycrisis' (final report), which example of a public-public partnership for recruitment is given?",["German army reservists deployed as auxiliary border guards","Austrian fire service volunteers as potential police recruits","Dutch customs officers retrained to serve as coast guards","Italian civil protection staff seconded to the national police"],1,"Finding 6 reports that in Austria the pool of fire service volunteers is being leveraged as potential police recruits.","https://www.frontex.europa.eu/assets/Innovations/Research_Study_on_Polycrisis_-_Final_Report.pdf"],["Q0346",0,0,9,"Art. 1",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what is the twofold subject matter of the Regulation?",["The establishment of Frontex and of the European Border Surveillance System (EUROSUR)","Absence of border control at internal borders and rules on control of persons at external borders","Common conditions for short-stay visas and the uniform format for long-stay residence permits","Common asylum procedures at external borders and the return of illegally staying migrants"],1,"Art. 1 states that the Regulation provides for the absence of border control at internal borders and lays down rules on border control of persons crossing external borders.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0347",0,0,9,"Art. 2(1)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which of the following constitutes an 'internal border'?",["Airports of the Member States for internal flights","Any airport located on the territory of a Member State","Sea ports used by cruise ships calling at third-country ports","Land borders between a Member State and a candidate country"],0,"Art. 2(1) defines internal borders as common land (incl. river and lake) borders, airports for internal flights, and sea, river and lake ports for regular internal ferry connections.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0348",0,0,9,"Art. 2(10)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), 'border control' is defined as activity carried out at a border in response exclusively to an intention to cross or the act of crossing that border. Of what does it consist?",["Border surveillance and return operations","Police checks and immigration checks within the territory","Border checks and customs controls","Border checks and border surveillance"],3,"Art. 2(10) states that border control consists of border checks and border surveillance.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0349",0,0,9,"Art. 2(12)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), as amended by Regulation (EU) 2024/1717, which of the following is expressly included in the definition of 'border surveillance'?",["Conducting second line checks at airports on passengers arriving from third countries","Carrying out checks on persons and their luggage at border crossing points during opening hours","Contributing to raising situational awareness and countering cross-border criminality","Issuing visas at the border to persons who fulfil all the other entry conditions"],2,"The amended Art. 2(12) includes preventative measures, raising situational awareness, countering cross-border criminality and taking measures against persons who crossed illegally.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0350",0,0,9,"Art. 2(13)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what is a 'second line check'?",["A check carried out by a second Member State at a shared border crossing point","A further check, possibly in a special location away from where all persons are checked","A repeat check carried out on exit for persons who were already checked on entry","A check of the means of transport carried out after the person has been checked"],1,"Art. 2(13) defines a second line check as a further check in a special location away from the first line.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0351",0,0,9,"Art. 2(25)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), an 'automated border control system' is composed of which elements?",["A self-service system and an e-gate","A self-service kiosk and a border guard booth","A document reader and the Entry/Exit System","An e-gate and a biometric matching service"],0,"Art. 2(25) defines an automated border control system as one composed of a self-service system and an e-gate.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0352",0,0,9,"Art. 2(30)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which of the following is listed as a 'transport hub'?",["Motorway service areas","Customs warehouses","Shopping centres near the border","Freight terminals"],3,"Art. 2(30) defines transport hubs as airports, sea or river ports, train or bus stations and freight terminals.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0353",0,0,9,"Art. 3",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), its application is without prejudice to which of the following?",["Bilateral readmission agreements concluded by Member States with third countries after 2016","The powers of Europol and Eurojust to conduct or request checks at the external borders","The rights of refugees and persons requesting international protection, in particular non-refoulement","National rules of each Member State on the issuing of short-stay and long-stay visas at the border"],2,"Art. 3(b) states that the Regulation applies without prejudice to the rights of refugees and persons requesting international protection, in particular non-refoulement.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0354",0,0,9,"Art. 4",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), how must decisions under the Regulation be taken, in accordance with the general principles of Union law?",["Only after consultation of Frontex","On an individual basis","Collectively for each group of travellers","On the basis of nationality-based risk profiles"],1,"Art. 4 provides that decisions under the Regulation shall be taken on an individual basis.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0355",0,0,9,"Art. 5(1)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), where and when may external borders, as a rule, be crossed?",["Only at border crossing points and during the fixed opening hours","Only at airports and sea ports designated by the Commission","At any border crossing point, 24 hours a day","At any point, provided the person presents a valid travel document"],0,"Art. 5(1) provides that external borders may be crossed only at border crossing points and during fixed opening hours.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0356",0,0,9,"Art. 5(2)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which of the following is a permitted exception to the obligation to cross external borders only at border crossing points?",["Holders of a valid ETIAS travel authorisation travelling by private car","Persons whose intended stay does not exceed 24 hours in the border area","Persons holding a multiple-entry Schengen visa valid for at least one year","Individuals or groups of persons in an unforeseen emergency situation"],3,"Art. 5(2)(b) allows exceptions for individuals or groups in the event of an unforeseen emergency situation.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0357",0,0,9,"Art. 5(3)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what characteristics must national penalties for unauthorised crossing of external borders have?",["They must be harmonised across the Union and set by the Commission","They must be exclusively administrative fines, never criminal penalties","They must be effective, proportionate and dissuasive","They must include detention of at least 30 days for repeat offenders"],2,"Art. 5(3) requires penalties for unauthorised crossing that are effective, proportionate and dissuasive.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0358",0,0,9,"Art. 5(3) second subpara.",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), as amended in 2024, what may Member States do where a large number of migrants attempt to cross their external borders in an unauthorised manner, en masse and using force?",["Automatically refuse all applications for international protection","Take the necessary measures to preserve security, law and order","Request the Council to suspend the Schengen Borders Code","Suspend the application of the Charter of Fundamental Rights"],1,"The second subparagraph of Art. 5(3), introduced by Regulation (EU) 2024/1717, allows Member States to take the necessary measures to preserve security, law and order in such situations.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0359",0,0,9,"Art. 5(4)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), in a situation of instrumentalisation of migrants, what measure regarding border crossing points does Article 5(4) allow?",["Temporarily closing, or limiting the opening hours of, specific border crossing points","Transferring command of the border crossing points concerned to Frontex teams","Suspending the obligation to register entry and refusal data in the Entry/Exit System","Permanently closing all border crossing points with the third country concerned"],0,"Art. 5(4) allows Member States, in particular in instrumentalisation situations, to temporarily close or limit the opening hours of specific border crossing points, proportionately.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0360",0,0,9,"Art. 6(1)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), for what maximum duration of intended stay do the entry conditions in Article 6(1) apply?",["No more than 3 months in any calendar year","No more than 180 days in any 12-month period","No more than 90 days from the date of first entry","No more than 90 days in any 180-day period"],3,"Art. 6(1) refers to stays of no more than 90 days in any 180-day period, considering the 180 days preceding each day of stay.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0361",0,0,9,"Art. 6(1)(a)(i)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), how long must a third-country national's travel document remain valid?",["At least three months after the date of entry into the territory of the Member States","At least one month after the intended date of departure from the Member States","At least three months after the intended date of departure from the Member States","At least six months after the date of entry into the territory of the Member States"],2,"Art. 6(1)(a)(i) requires validity of at least three months after the intended departure date, which may be waived in a justified emergency.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0362",0,0,9,"Art. 6(1)(a)(ii)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), within what period must a third-country national's travel document have been issued?",["Within the previous 5 years","Within the previous 10 years","Within the previous 15 years","Within the previous 7 years"],1,"Art. 6(1)(a)(ii) requires that the travel document was issued within the previous 10 years.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0363",0,0,9,"Art. 6(1)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which of the following is NOT one of the entry conditions for third-country nationals listed in Article 6(1)?",["Proof of a valid travel medical insurance purchased in a Member State","Sufficient means of subsistence for the stay and the return","Not being the subject of an SIS alert for the purposes of refusing entry","Not being considered a threat to public policy, internal security, public health or international relations"],0,"Art. 6(1)(a)-(f) lists travel document, visa, purpose and means of subsistence, no SIS alert, no threat, and biometrics; medical insurance is not among them.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0364",0,0,9,"Art. 6(1a)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), how is the 90 days in any 180-day period calculated for Member States
