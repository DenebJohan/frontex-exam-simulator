l from the High Representative and the Commission","The Agency's management board and the administrative boards of EFCA and EMSA","The executive directors of the three agencies jointly, after informing the Commission"],2,"Art. 69(2): the arrangement is approved by the Agency's management board and the administrative boards of EFCA and EMSA.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0110",0,0,0,"Art. 69(3)",1,"Under Regulation (EU) 2019/1896, in what legal form does the Commission adopt the practical handbook on European cooperation on coast guard functions?",["A delegated regulation","A directive","An implementing decision","A recommendation"],3,"Art. 69(3): the Commission adopts the handbook in the form of a recommendation.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0111",0,0,0,"Art. 73(3)",2,"Under Regulation (EU) 2019/1896, where border management teams will exercise executive powers in a third country, what must be concluded?",["A status agreement between the Union and the third country under Article 218 TFEU","A working arrangement between the Agency and the third country's authorities","A bilateral agreement between the host Member State and the third country","A memorandum of understanding approved by the executive director"],0,"Art. 73(3) requires a status agreement, based on the model status agreement, concluded by the Union under Art. 218 TFEU.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0112",0,0,0,"Art. 74(5)",2,"Under Regulation (EU) 2019/1896, where a Member State invokes security concerns to opt out of an operation in a third country, it must provide reasons no later than:",["5 working days prior to the deployment","21 days prior to the deployment","30 days prior to the deployment","45 days prior to the deployment"],1,"Art. 74(5): reasons are provided during annual bilateral negotiations or no later than 21 days prior to deployment.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0113",0,0,0,"Art. 77(2)",0,"Under Regulation (EU) 2019/1896, to which third countries is priority given for the deployment of the Agency's liaison officers?",["Candidate countries for EU accession, as identified by the Commission each year","Countries with which the Union has concluded readmission agreements only","Countries of origin or transit for illegal immigration, per risk analysis","Countries hosting CSDP missions and operations in accordance with their mandates"],2,"Art. 77(2): priority goes to third countries which, on the basis of a risk analysis, constitute a country of origin or transit regarding illegal immigration.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0114",0,0,0,"Art. 77(3)",0,"Under Regulation (EU) 2019/1896, wherever possible, where should the Agency's liaison officers in third countries have their offices?",["In the embassies of the host Member State","In the premises of the third country's border police","In the Agency's antenna offices","In the same premises as the Union delegations"],3,"Art. 77(3): wherever possible, they shall have their offices in the same premises as the Union delegations.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0115",0,0,0,"Art. 79",0,"Under Regulation (EU) 2019/1896, which document system does the Agency take over and operate?",["False and Authentic Documents Online (FADO)","Public Register of Authentic Documents (PRADO)","Interpol Stolen and Lost Travel Documents database","Visa Information System (VIS) central unit"],0,"Art. 79: the Agency takes over and operates FADO, established by Joint Action 98/700/JHA.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0116",0,0,0,"Art. 80(1)",1,"Under Regulation (EU) 2019/1896, the Agency's fundamental rights strategy and action plan are drawn up subject to the endorsement of:",["The European Union Agency for Fundamental Rights","The fundamental rights officer","The European Ombudsman","The consultative forum"],1,"Art. 80(1): the strategy is drawn up with the contribution of and subject to endorsement by the fundamental rights officer.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0117",0,0,0,"Art. 81(1)-(2)",0,"Under Regulation (EU) 2019/1896, in cooperation with which body does the Agency draw up its codes of conduct?",["The European Data Protection Supervisor","The Council of Europe","The consultative forum","Europol"],2,"Art. 81(1) and (2): both codes of conduct are drawn up in cooperation with the consultative forum.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0118",0,0,0,"Art. 82(6)",0,"Under Regulation (EU) 2019/1896, what must all members of the teams wear on their uniforms?",["A yellow armband bearing the Agency logo and the team number","A badge with the flag of the host Member State on the left sleeve","A white armband bearing the word 'Frontex' and the EU flag","A blue armband with the insignia of the Union and of the Agency"],3,"Art. 82(6): visible personal identification and a blue armband with the insignias of the Union and of the Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0119",0,0,0,"Art. 82(7)",1,"Under Regulation (EU) 2019/1896, for staff seconded or deployed short-term by Member States, the ability to carry and use service weapons is governed by:",["The home Member State's national law","Annex V of the Regulation","The rules adopted by the management board","The Staff Regulations of officials"],0,"Art. 82(7): for seconded or short-term deployed staff, the home Member State's national law applies; Annex V applies to statutory staff.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0120",0,0,0,"Art. 82(8)",1,"Under Regulation (EU) 2019/1896, under what condition may a host Member State prohibit team members from carrying certain service weapons?",["Only with the prior consent of the executive director of the Agency","If its own law applies the same prohibition to its own border guards","Only during return operations and return interventions on its territory","Only if the Commission gives a positive opinion on the prohibition"],1,"Art. 82(8): the host Member State may prohibit certain weapons provided its own law applies the same prohibition to its own border guards or return staff.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0121",0,0,0,"Art. 82(11)",1,"Under Regulation (EU) 2019/1896, who may take decisions to refuse entry under Article 14 of the Schengen Borders Code during Agency operations?",["Any member of the teams holding a valid accreditation document","The Agency's coordinating officer present in the operational area","Host border guards, or team members authorised to act on its behalf","The executive director of the Agency, on a proposal from the host State"],2,"Art. 82(11) reserves such decisions to the host Member State's border guards or team members authorised to act on its behalf.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0122",0,0,0,"Art. 84(1)",0,"Under Regulation (EU) 2019/1896, who is liable for damage caused by members of the teams while operating in a host Member State?",["The home Member State of the team member, under its own national law","The Agency in all cases, before the Court of Justice of the EU","The host Member State, in accordance with its national law","The team member personally, under the law of the host Member State"],3,"Art. 84(1): the host Member State is liable under its national law, subject to reimbursement claims for gross negligence or wilful misconduct.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0123",0,0,0,"Art. 85",0,"Under Regulation (EU) 2019/1896, with regard to criminal offences committed against or by them, members of the teams in the host Member State are treated:",["In the same way as officials of the host Member State","As diplomatic agents enjoying immunity","According to the law of their home Member State only","Under the exclusive jurisdiction of the Court of Justice"],0,"Art. 85: members of the teams, including statutory staff, are treated in the same way as officials of the host Member State.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0124",0,0,0,"Art. 91(1)",1,"Under Regulation (EU) 2019/1896, what is the maximum retention period for personal data collected in operations and transmitted or used for risk analysis?",["30 days after collection","90 days after collection","Six months after collection","Three years after collection"],1,"Art. 91(1): retention shall not exceed 90 days after the date of collection.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0125",0,0,0,"Art. 91(2)",2,"Under Regulation (EU) 2019/1896, personal data processed for return-related tasks must be deleted no later than:",["90 days after collection","Six months after the return operation","30 days after the end of those tasks","One year after the return decision"],2,"Art. 91(2): deleted as soon as the purpose is achieved and no later than 30 days after the end of those tasks.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0126",0,0,0,"Art. 89(2)",1,"Under Regulation (EU) 2019/1896, which are the only personal data permitted to be accessed in the European situational picture and EUROSUR fusion services?",["Names and nationalities of persons intercepted","Fingerprints of persons apprehended","Licence plate and telephone numbers","Ship and aircraft identification numbers"],3,"Art. 89(2): ship and aircraft identification numbers are the only personal data permitted to be accessed.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0127",0,0,0,"Art. 93(5)",0,"Under Regulation (EU) 2019/1896, where is the seat of the Agency?",["Warsaw, Poland","Brussels, Belgium","Valletta, Malta","Luxembourg, Luxembourg"],0,"Art. 93(5): the seat of the Agency shall be Warsaw, Poland.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0128",0,0,0,"Art. 95(3)",1,"Under Regulation (EU) 2019/1896, statutory staff subject to the Conditions of Employment are, in principle, initially engaged for:",["A fixed period of three years","A fixed period of five years","A fixed period of four years","An indefinite period"],1,"Art. 95(3): initially engaged for five years, renewable once for up to five years; any further renewal is indefinite.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0129",0,0,0,"Art. 99",0,"Under Regulation (EU) 2019/1896, which of the following is NOT part of the Agency's administrative and management structure but assists it as an advisory body?",["The management board","The fundamental rights officer","The consultative forum","The deputy executive directors"],2,"Art. 99 lists the management board, executive director, deputy executive directors and FRO; the consultative forum assists as an advisory body.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0130",0,0,0,"Art. 101(1)",0,"Under Regulation (EU) 2019/1896, how is the management board composed?",["One representative of each Member State and one of the European Parliament, each with a vote","Two representatives of each Member State and one of the Commission, each with a vote","One representative of each Member State, with the Commission as a non-voting observer","One representative per Member State and two of the Commission, each with a vote"],3,"Art. 101(1): one representative per Member State and two Commission representatives, each with a right to vote; terms of four years.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0131",0,0,0,"Art. 105(1); Art. 100(2)(m)",1,"Under Regulation (EU) 2019/1896, by what majority does the management board adopt the Agency's annual budget?",["Two thirds of the members with a right to vote","Absolute majority of the members with a right to vote","Simple majority of the members present","Unanimity"],0,"Art. 100(2)(m) requires a two-thirds majority for the budget; Art. 105(1) sets absolute majority as the general rule.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0132",0,0,0,"Art. 107(3), (5)",0,"Under Regulation (EU) 2019/1896, how many deputy executive directors assist the executive director, and what is the executive director's term of office?",["Two deputies; four-year term","Three deputies; five-year term","Three deputies; four-year term","Four deputies; five-year term"],1,"Art. 107(3): three deputy executive directors; Art. 107(5): the ED's term is five years.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0133",0,0,0,"Art. 109(1)",1,"Under Regulation (EU) 2019/1896, how is the fundamental rights officer appointed?",["By the executive director, from a list of candidates proposed by FRA's director","By the European Parliament, on a proposal from the Commission after a hearing","By the management board from three candidates, after consulting the consultative forum","By the Commission, after consulting the European Ombudsman and the EDPS jointly"],2,"Art. 109(1): appointed by the management board on the basis of a list of three candidates, after consultation with the consultative forum.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0134",0,0,0,"Art. 110(6)",1,"Under Regulation (EU) 2019/1896, by 5 December 2020, at least how many fundamental rights monitors had to be recruited by the Agency?",["20","60","100","40"],3,"Art. 110(6): the Agency shall ensure that by 5 December 2020 at least 40 fundamental rights monitors are recruited.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0135",0,0,0,"Art. 111(4)",0,"Under Regulation (EU) 2019/1896, who is responsible for handling complaints received under the Agency's complaints mechanism?",["The fundamental rights officer","The executive director of the Agency","The European Ombudsman","The Agency's data protection officer"],0,"Art. 111(4): the FRO handles complaints, reviews admissibility, registers them and forwards them to the ED or home Member State.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0136",0,0,0,"Annex I",2,"Under Regulation (EU) 2019/1896, according to Annex I, what is the total capacity of the standing corps for 2027 and beyond?",["8 000","10 000","9 000","12 000"],1,"Annex I sets a total of 10 000 for 2027 and beyond (3 000 cat. 1, 1 500 cat. 2, 5 500 cat. 3, 0 cat. 4).","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0137",0,0,0,"Annex I; Annex IV",2,"Under Regulation (EU) 2019/1896, according to Annex I, what is the size of the reserve for rapid reaction (category 4) for the years 2021-2024?",["1 000","2 500","1 500","3 000"],2,"Annex I sets category 4 at 1 500 for 2021-2024 and 0 from 2025; Annex IV totals 1 500.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0138",0,0,0,"Annex V, Part 4",2,"Under Regulation (EU) 2019/1896, under Annex V, what is the minimum total duration of the annual ongoing training on the use of force for statutory staff?",["16 hours (at least 8 theoretical and 8 practical)","40 hours (at least 16 theoretical and 24 practical)","12 hours (at least 4 theoretical and 8 practical)","24 hours (at least 8 theoretical and 16 practical)"],3,"Annex V Part 4 (Training): at least 24 hours, with at least 8 hours theoretical and 16 hours practical.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0139",0,0,0,"Annex V, Part 1",0,"Under Regulation (EU) 2019/1896, which are the 'core principles' governing the use of force by statutory staff under Annex V?",["Necessity, proportionality and precaution","Legality, accountability and transparency","Necessity, subsidiarity and non-discrimination","Proportionality, neutrality and humanity"],0,"Annex V Part 1 names necessity, proportionality and precaution as the core principles.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0140",0,0,0,"Annex V, Part 2",1,"Under Regulation (EU) 2019/1896, under Annex V, how may a warning be given before statutory staff use firearms?",["Only in writing via the coordinating officer","Orally or by firing warning shots","Only orally in the language of the person","Only by visual signals"],1,"Annex V Part 2 (Firearms): warnings may be given orally or by the firing of warning shots.","https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32019R1896"],["Q0141",0,0,1,"Foreword; section 1.1",0,"According to the Technical and Operational Strategy for EIBM 2023-2027, when did the Frontex Management Board adopt the first (predecessor) Technical and Operational Strategy for European Integrated Border Management?",["March 2019","October 2016","November 2019","March 2023"],0,"Section 1.1 states the first strategy was adopted by the Frontex Management Board in March 2019 (MB Decision 2/2019) under Regulation (EU) 2016/1624.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0142",0,0,1,"'The Road to Pamplona and Beyond'",1,"Where and when was the Technical and Operational Strategy for EIBM 2023-2027 adopted?",["At the 100th Management Board meeting in Warsaw, Poland, in December 2023","At the 96th Management Board meeting in Pamplona, Spain, in September 2023","At a Justice and Home Affairs Council meeting in Madrid, Spain, in June 2023","At the 94th Management Board meeting in Stockholm, Sweden, in March 2023"],1,"The introduction 'The Road to Pamplona and Beyond' records adoption at the 96th Management Board meeting in Pamplona, hosted by the Spanish Presidency, in September 2023.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0143",0,0,1,"Section 3.1; Figure 2",0,"What is the Vision 2027 set out in the Technical and Operational Strategy for EIBM 2023-2027?",["A fully automated European border built on technology to secure and open Europe","A unified European border police built on solidarity to defend and integrate Europe","A strengthened European Border and Coast Guard built on trust to protect and connect Europe","An integrated European coast guard built on cooperation to monitor and protect Europe"],2,"Section 3.1 and Figure 2 give the vision 'A Strengthened European Border and Coast Guard Built on Trust to Protect and Connect Europe'.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0144",0,0,1,"Figure 2 (structure of the Strategy)",0,"Which mission statement appears in the structure of the Technical and Operational Strategy for EIBM 2023-2027 (Figure 2)?",["We protect the borders and prevent irregular migration in a coordinated way","We control the borders and support asylum procedures in a harmonised way","We secure the borders and fight cross-border crime in a proactive way","We manage the borders and implement returns in an integrated way"],3,"Figure 2 states the mission: 'We Manage the Borders and Implement Returns in an Integrated Way'.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0145",0,0,1,"Section 3.2",0,"How many goals does the Technical and Operational Strategy for EIBM 2023-2027 define, and how do they relate to the Multiannual Strategic Policy?",["Eight: six from the Multiannual Strategic Policy plus two additional enabling goals","Six goals, all taken directly from the Multiannual Strategic Policy with no additional goals","Ten goals: eight from the Multiannual Strategic Policy plus two additional enabling goals","Fifteen goals, one for each of the components of European integrated border management"],0,"Section 3.2 explains that on top of six goals stemming from the Policy, two additional enabling goals were added (future-proofing and good governance).","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0146",0,0,1,"Section 3.2, footnotes 39-40",1,"Which of the following is one of the two additional enabling goals added by the Technical and Operational Strategy for EIBM 2023-2027 beyond the Multiannual Strategic Policy goals?",["Increase the efficiency of the Union's return policy","Ensure good governance and sound administration","Achieve effective cooperation with third countries","Facilitate legitimate border crossings"],1,"Footnotes 39 and 40 identify goals 7 (future-proof the external borders and accelerate innovation) and 8 (ensure good governance and sound administration) as the added enabling goals.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0147",0,0,1,"Section 3.2, Goal C",0,"Under the Technical and Operational Strategy for EIBM 2023-2027, what is the success measure for Goal C 'Increase the Efficiency of the Union's Return Policy'?",["Reduced return backlog","Shorter return procedures","Increased returns","Higher voluntary departure rate"],2,"Section 3.2 lists 'Increased Returns' as the success measure for Goal C.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0148",0,0,1,"Section 3.2, Goal A",1,"Under the Technical and Operational Strategy for EIBM 2023-2027, what is the success measure for Goal A 'Facilitate Legitimate Border Crossings'?",["Reduced waiting times at border crossing points, more automated e-gates, fewer refusals of entry","Full roll-out of the Entry/Exit System, ETIAS and the interoperability framework by the end of 2027","Increased number of visas issued, reduced overstays of travellers, simplified travel procedures","Enhanced identification of travellers, improved data management, boosted automation of border checks"],3,"Section 3.2 sets 'Enhanced Identification of Travellers, Improved Data Management, Boosted Automation of Border Checks' as the Goal A success measure.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0149",0,0,1,"Section 3.2, Goal B",1,"Under the Technical and Operational Strategy for EIBM 2023-2027, which success measure is linked to Goal B 'Ensure the Effective Prevention of Unauthorised Crossings of the External Borders'?",["Reduced unauthorised border-crossings and secondary movements","Full surveillance coverage of all external border sections","Increased number of apprehensions at the green border","Improved detection rate of fraudulent travel documents"],0,"Section 3.2 sets 'Reduced Unauthorised Border-Crossings and Secondary Movements' as the success measure for Goal B.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0150",0,0,1,"Section 3.2, Goal H",1,"Under the Technical and Operational Strategy for EIBM 2023-2027, what is the success measure for Goal H 'Ensure Good Governance and Sound Administration'?",["Reduced number of fundamental rights complaints","Strengthened governance and compliance","Positive Schengen evaluation results for all States","Full execution of the Agency's annual budget"],1,"Section 3.2 lists 'Strengthened Governance and Compliance' as the Goal H success measure.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0151",0,0,1,"Section 3.2, Goal G",2,"Under the Technical and Operational Strategy for EIBM 2023-2027, which success measure corresponds to Goal G 'Future-Proof the External Borders and Accelerate Innovation'?",["Increased share of the EU research budget allocated to border security","Full deployment of artificial intelligence in border surveillance systems","Improved availability of relevant, resilient and sustainable capabilities","Reduced dependence on non-European suppliers of border equipment"],2,"Section 3.2 gives 'Improved Availability of Relevant, Resilient and Sustainable Capabilities' as the Goal G success measure.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0152",0,0,1,"Section 3.2, Goal F",2,"Under the Technical and Operational Strategy for EIBM 2023-2027, which success measure is attached to Goal F on swift registration and provision of care to persons in need of international protection?",["Reduced average duration of asylum procedures","Increased number of reception places at the borders","Full identification of vulnerable persons on arrival","Enhanced systematic level of registration and processing"],3,"Section 3.2 sets 'Enhanced Systematic Level of Registration and Processing' as the Goal F success measure.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0153",0,0,1,"Section 2.1.1, footnote 14 (Art. 3 Reg. (EU) 2019/1896)",0,"According to the Technical and Operational Strategy for EIBM 2023-2027, of how many components does European integrated border management consist under Article 3 of Regulation (EU) 2019/1896?",["Fifteen","Thirteen","Twelve","Ten"],0,"Section 2.1.1 states the Regulation describes European integrated border management as a set of fifteen components (Article 3).","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0154",0,0,1,"Section 2.1.1, footnote 14",1,"Which of the following is NOT among the fifteen EIBM components of Article 3 of Regulation (EU) 2019/1896 as listed in the Technical and Operational Strategy for EIBM 2023-2027?",["Search and rescue","Visa issuance by consulates of the Member States","Solidarity mechanisms including Union funding","Research and innovation"],1,"Footnote 14 lists the fifteen components (border control, search and rescue, risk analysis, ..., solidarity mechanisms incl. Union funding, fundamental rights, education and training, research and innovation); visa issuance is not one of them.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0155",0,0,1,"Section 2.1.1",1,"According to the Technical and Operational Strategy for EIBM 2023-2027, within what period after the adoption of the EIBM Communication should the Management Board adopt the technical and operational strategy?",["Within three months, on the basis of a proposal by the Commission","Within twelve months, on the basis of a proposal by the Council","Within six months, on the basis of a proposal by the Executive Director","Within one month, on the basis of a proposal by the Member States"],2,"Section 2.1.1 explains that, based on a proposal by the Frontex Executive Director, the Management Board should adopt the strategy within six months of the Communication's adoption.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0156",0,0,1,"Section 2.1.1",0,"According to the Technical and Operational Strategy for EIBM 2023-2027, how long does the Multiannual Strategic Policy Cycle span?",["Seven years, aligned strictly with the Multiannual Financial Framework","Three years, renewable once by decision of the Management Board","Ten years, with a mandatory mid-term review after five years","Five years, although it can be relaunched at any time if deemed necessary"],3,"Section 2.1.1 states the cycle spans a period of five years but can be relaunched at any time if necessary.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0157",0,0,1,"Section 2.1.1",2,"According to the Technical and Operational Strategy for EIBM 2023-2027, when must the Commission carry out a thorough evaluation of the implementation of the Multiannual Strategic Policy?",["Four years after the adoption of the Multiannual Strategic Policy","Two years after the adoption of the Multiannual Strategic Policy","Five years after the adoption of the national strategies","One year after the adoption of the technical and operational strategy"],0,"Section 2.1.1 states that four years after adoption of the Multiannual Strategic Policy the Commission shall carry out a thorough evaluation of its implementation.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0158",0,0,1,"Section 2.1.1; footnote 7",0,"According to the Technical and Operational Strategy for EIBM 2023-2027, on what date did the Commission adopt the Communication establishing the Multiannual Strategic Policy for European integrated border management (COM(2023) 146)?",["13 November 2019","14 March 2023","23 September 2020","9 February 2023"],1,"Section 2.1.1 records that on 14 March 2023 the Commission adopted the Communication, establishing the cycle for 2023-2027.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0159",0,0,1,"Section 2.1.1, footnote 15 (Art. 8(4) Reg. (EU) 2019/1896)",2,"According to the Technical and Operational Strategy for EIBM 2023-2027, on the basis of which document does the Commission prepare its policy document developing the Multiannual Strategic Policy for EIBM?",["The vulnerability assessment reports of the Member States","The annual activity report of the Fundamental Rights Officer","The strategic risk analysis for EIBM prepared by the Agency","The Schengen evaluation reports adopted by the Council"],2,"Footnote 15 quotes Article 8(4): the Commission prepares the policy document on the basis of the strategic risk analysis referred to in Article 29(2).","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0160",0,0,1,"Section 2.1.1 (Art. 9 Reg. (EU) 2019/1896)",1,"According to the Technical and Operational Strategy for EIBM 2023-2027, which three elements make up integrated planning between Member States and the Agency under Article 9 of Regulation (EU) 2019/1896?",["Strategic planning, financial planning and human resources planning","Risk analysis planning, vulnerability assessment and Schengen evaluation","Border control planning, return planning and asylum reception planning","Operational planning, contingency planning and capability development planning"],3,"Section 2.1.1 states EIBM should be implemented through integrated planning comprising operational, contingency and capability development planning (Article 9).","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0161",0,0,1,"Section 1.2; section 4.2 (Art. 8(6))",1,"Under which provision of Regulation (EU) 2019/1896, as cited in the Technical and Operational Strategy for EIBM 2023-2027, shall Member States establish national strategies for European integrated border management?",["Article 8(6)","Article 3(1)","Article 29(2)","Article 102(1)"],0,"Sections 1.2 and 4.2 cite Article 8(6) as the basis for Member States establishing national EIBM strategies.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0162",0,0,1,"Section 4.2 (Annex II of the EIBM Communication)",0,"According to the requirements recalled in the Technical and Operational Strategy for EIBM 2023-2027, how many national EIBM strategies should each Member State have?",["One strategy per competent national authority","One national strategy for each Member State","One strategy per external border section","Two strategies: one for borders and one for return"],1,"Section 4.2 lists as the first requirement of Annex II that there should be one national strategy for each Member State.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0163",0,0,1,"Section 4.2",1,"According to the Technical and Operational Strategy for EIBM 2023-2027, what should accompany a national EIBM strategy?",["A legislative package transposing the Regulation into national law within one year of adoption","A bilateral agreement with Frontex on the deployment of standing corps officers and equipment","An action plan setting out key measures, timeframe, milestones, resources and monitoring","A risk analysis report endorsed by the European Commission and the Council before adoption"],2,"Section 4.2 requires the national strategy to be accompanied by an action plan with key measures, timeframe, milestones, resources and monitoring arrangements.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0164",0,0,1,"Section 4.2",0,"According to the Technical and Operational Strategy for EIBM 2023-2027, which EU funding instrument can Member States use, besides national resources, to implement their national EIBM strategies?",["The Asylum, Migration and Integration Fund (AMIF)","The Internal Security Fund – Police (ISF)","The European Regional Development Fund (ERDF)","The Border Management and Visa Instrument (BMVI)"],3,"Section 4.2 states Member States can implement their strategies from and in line with their national BMVI programme.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0165",0,0,1,"Section 4.3",1,"According to the Technical and Operational Strategy for EIBM 2023-2027, by which mechanism will the national strategies for European integrated border management be evaluated?",["The Schengen Evaluation and Monitoring Mechanism","The Frontex vulnerability assessment only","The European Court of Auditors' annual audit","The Commission's infringement procedure"],0,"Section 4.3 states that national EIBM strategies will be evaluated by the Schengen Evaluation and Monitoring Mechanism.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0166",0,0,1,"Section 4.3",1,"According to the Technical and Operational Strategy for EIBM 2023-2027, which body supports the Management Board in monitoring the Strategy and proposing updates to its Implementation Plan?",["The Consultative Forum on Fundamental Rights of the European Border and Coast Guard Agency","The Management Board Working Group on European Integrated Border Management","The Commission's Schengen Coordinator together with the Schengen Council configuration","The Capability Development Network of Member States' and Frontex capability experts"],1,"Section 4.3 states that the MB Working Group on EIBM supports the Management Board, including by advising on and proposing updates to the Implementation Plan.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0167",0,0,1,"Section 3.3.2; Figure 3",0,"In the Integrated Planning and Implementation Process of the Technical and Operational Strategy for EIBM 2023-2027, which element connects the four phases Planning, Implementation, Evaluation and Improvement?",["Risk analysis","Fundamental rights monitoring","Governance","Situational awareness"],2,"Section 3.3.2 states the process steps Planning, Implementation, Evaluation and Improvement are connected by Governance.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0168",0,0,1,"Section 3.3.2 (IMPROVEMENT)",1,"In the Integrated Planning and Implementation Process of the Technical and Operational Strategy for EIBM 2023-2027, the process step 'Learn and Adapt' belongs to which phase?",["Planning","Evaluation","Governance","Improvement"],3,"Section 3.3.2 places 'Learn and Adapt' under the Improvement phase, institutionalising learning from evaluation findings.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0169",0,0,1,"Section 3.2, Goal E",2,"According to the Technical and Operational Strategy for EIBM 2023-2027, to which third countries is priority given for capacity building under Goal E?",["Adjacent countries per risk analysis (Mediterranean) and enlargement priorities (East Europe, Western Balkans)","Countries of origin in Sub-Saharan Africa and South Asia with the highest backlog of pending return decisions","Countries that have concluded both readmission agreements and visa facilitation agreements with the Union","Candidate countries only, as defined by the European Council's enlargement conclusions and accession talks"],0,"Goal E states the priority for capacity building is adjacent third countries as defined by risk analysis (the Mediterranean) and by enlargement policy priorities (East Europe and the Western Balkans).","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0170",0,0,1,"Section 2.1.2, footnote 21",1,"How does the Technical and Operational Strategy for EIBM 2023-2027 define hybrid threats?",["Cyber attacks by criminal networks or hacktivists against the large-scale IT systems used for border control","Actors exploiting EU vulnerabilities through a coordinated mix of measures, below the threshold of formal warfare","Simultaneous mass arrivals of migrants at several external border sections, organised by smuggling networks","Open military aggression by a third country combined with economic sanctions and trade restrictions against the EU"],1,"Footnote 21 defines hybrid threats as state or non-state actors using in a coordinated way a mixture of measures (diplomatic, military, economic, technological) while remaining below the threshold of formal warfare.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0171",0,0,1,"Section 2.1.3, footnote 22",2,"Which of the following is listed in the Technical and Operational Strategy for EIBM 2023-2027 as one of the key EIBM principles stemming from the Regulation?",["European integrated border management should be financed exclusively from the Union budget","European integrated border management should be implemented primarily by the Agency's own staff","European integrated border management should be based on the four-tier access control model","European integrated border management should prioritise return over border surveillance"],2,"Footnote 22 lists the key principles, including that EIBM should be based on the Four-Tier Access Control Model.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0172",0,0,1,"Section 3.2, Goal C",1,"According to the Technical and Operational Strategy for EIBM 2023-2027, what should become a core component of return case management?",["Systematic forced-return monitoring","Detention pending removal procedures","Consular identification missions","Return and reintegration counselling"],3,"Goal C states that return and reintegration counselling should become a core component of return case management.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0173",0,0,1,"Section 3.2, Goal C",2,"According to the Technical and Operational Strategy for EIBM 2023-2027, the common data sharing platform on return should be further developed based on which model?",["The Frontex Return Case Management System model","The Visa Information System model","The EUROSUR national situational picture model","The Europol SIENA information exchange model"],0,"Goal C refers to further development of the common data sharing platform based on the Frontex Return Case Management System model.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0174",0,0,1,"Section 3.3.2 (IMPLEMENTATION – Manage Availability and Deployments of Capabilities)",1,"According to the Technical and Operational Strategy for EIBM 2023-2027, which element is explicitly mentioned as part of managing the availability and deployments of capabilities?",["The need to deploy only Category 1 standing corps officers","The need to ensure gender-balanced deployments","The need to rotate officers every thirty days","The need to obtain prior Council authorisation"],1,"Under 'Manage Availability and Deployments of Capabilities', the Strategy mentions the need to ensure gender-balanced deployments.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0175",0,0,1,"Section 1.1, footnote 8; section 2.2",0,"According to the Technical and Operational Strategy for EIBM 2023-2027, to what extent are coast guards included among the national authorities sharing responsibility for European integrated border management?",["Only when they operate under the command of Frontex","Only in Member States that have no national border police","To the extent that they carry out border control tasks","Fully, regardless of the tasks they perform at sea"],2,"Footnote 8 and section 2.2 refer to national authorities responsible for border management, including coast guards to the extent that they carry out (maritime) border control tasks.","https://www.frontex.europa.eu/publications/technical-and-operational-strategy-for-european-integrated-border-management-2023-2027-lep99d"],["Q0176",0,0,2,"Title page; Chapter 3 'Vision 2037'",0,"Towards which year does the Capability Roadmap of the European Border and Coast Guard set its vision?",["2027","2030","2050","2037"],3,"The Roadmap is titled 'Future-proofing the External Borders and Accelerating Innovation Towards 2037' and sets Vision 2037.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0177",0,0,2,"Chapter 3 'Vision 2037'",0,"Which three qualities make up the Vision 2037 of the Capability Roadmap of the European Border and Coast Guard?",["Relevance, resilience and excellence","Readiness, reliability and efficiency","Integration, interoperability and innovation","Solidarity, sustainability and security"],0,"Vision 2037 is 'Relevance, Resilience and Excellence for Future-Proofed Borders and Accelerated Innovation'.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0178",0,0,2,"Chapter 1 'Introduction'; 'At a Glance'",1,"In which goal of the Technical and Operational Strategy for EIBM is the Capability Roadmap of the European Border and Coast Guard anchored?",["Ensure good governance and sound administration of the EBCG","Future-proof the external borders and accelerate innovation","Facilitate legitimate border crossings and automate checks","Achieve effective cooperation with third countries and partners"],1,"The Introduction states the Roadmap is anchored in the strategic goal 'Future-Proof the External Borders and Accelerate Innovation' of the TO-EIBM Strategy.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0179",0,0,2,"Foreword; Chapter 3 'Capability Priorities'",0,"How many European Border and Coast Guard capability priorities does the Capability Roadmap of the European Border and Coast Guard set?",["Five","Eight","Seven","Fifteen"],2,"The Foreword and Chapter 3 list seven priorities, from integrated information management to gradually adopted emerging innovative technologies.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0180",0,0,2,"Chapter 3 'Capability Priorities'",1,"Which of the following is one of the capability priorities of the Capability Roadmap of the European Border and Coast Guard?",["Establishment of a European return directorate with own aircraft","Harmonisation of national asylum reception standards","Creation of a single EU visa issuing authority","Comprehensive pan-European network-enabled multipurpose surveillance"],3,"Chapter 3 lists 'Comprehensive Pan-European Network-Enabled Multipurpose Surveillance' among the seven priorities.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0181",0,0,2,"Chapter 1 'A Fifteen-Year Horizon Revised Every Five Years'",1,"What time horizon does the Capability Roadmap of the European Border and Coast Guard cover, and how often are major revisions foreseen?",["Fifteen years, with major revisions every five years at the start of each new policy cycle","Ten years, with major revisions every two years following each strategic risk analysis","Seven years, with major revisions aligned to each Multiannual Financial Framework period","Twenty years, with major revisions every ten years following each Commission evaluation"],0,"Chapter 1 explains the fifteen-year horizon (covering three policy cycles) and that major revisions are foreseen with the start of every new EIBM policy cycle, i.e. every five years.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0182",0,0,2,"Chapter 1; Chapter 4 'Implementation'",0,"Under the Regulation, as recalled in the Capability Roadmap of the European Border and Coast Guard, how often must the Roadmap be discussed and approved by the Management Board?",["At least every six months","At least once a year","Once every five years","Only when a new policy cycle starts"],1,"Chapter 1 and Chapter 4 state the Regulation requires the Roadmap to be discussed and approved by the Management Board at least once a year.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0183",0,0,2,"Chapter 1 (Art. 9(8) of the Regulation)",2,"According to the Capability Roadmap of the European Border and Coast Guard, which article of the European Border and Coast Guard Regulation refers to a Capability Roadmap without prescribing its format or scope?",["Article 8(6)","Article 3(1)","Article 9(8)","Article 54(4)"],2,"Chapter 1 notes that Article 9(8) of the Regulation refers to a Capability Roadmap but does not prescribe its format or scope, leaving them to the Management Board.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0184",0,0,2,"Chapter 2 'Legal framework'",1,"According to the Capability Roadmap of the European Border and Coast Guard, once approved by the Management Board, to which document shall the Capability Roadmap be annexed?",["The Single Programming Document of the European Border and Coast Guard Agency","The Commission Communication establishing the Multiannual Strategic Policy for EIBM","The Agency's Consolidated Annual Activity Report to the European Parliament and Council","The Technical and Operational Strategy for European Integrated Border Management"],3,"The 'Legal framework' section states that once approved, the Capability Roadmap shall be annexed to the Technical and Operational Strategy on EIBM.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0185",0,0,2,"Chapter 2 'Legal framework'",1,"According to the Capability Roadmap of the European Border and Coast Guard, the Capability Roadmap shall be prepared on the basis of which overview?",["The overview of the National Capability Development Plans","The overview of the national strategies for integrated border management","The overview of the Schengen evaluation findings and recommendations","The overview of the Member States' annual budgets for border control"],0,"The 'Legal framework' section states the Roadmap is prepared on the basis of the overview of National Capability Development Plans, taking into account risk analysis, vulnerability assessments and Frontex's Multiannual Plans.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0186",0,0,2,"Foreword; 'Milestone Roadmap – 2027'",1,"According to the Capability Roadmap of the European Border and Coast Guard, what transformation should be completed by 2027 across the European Border and Coast Guard?",["The full replacement of national border guards at the external borders by standing corps officers","The shift from resource-based planning to capability-driven, effects-based planning","The transfer of all return operations and return decisions from Member States to Frontex","The complete automation of all border checks at every external border crossing point"],1,"The Foreword and the 2027 milestone state that by 2027 the transformation to effects-based, capability-driven planning will be complete at both European and national levels.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0187",0,0,2,"Foreword; 'Milestone Roadmap – 2032'",1,"According to the Capability Roadmap of the European Border and Coast Guard, what is the milestone for 2032?",["Full operational capability of the 10,000-strong standing corps at all external borders","Complete interoperability of all large-scale EU information systems used at the borders","Sustainability and adaptability embedded, with fully sustainable capability development","Global recognition of Frontex as the reference border management agency worldwide"],2,"The 2032 milestone 'Sustainability and Adaptability Enabling Enduring Resilience' states capability development and management shall be fully sustainable, with green solutions embedded.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0188",0,0,2,"'Milestone Roadmap – 2027'",2,"According to the Capability Roadmap of the European Border and Coast Guard, by 2027 what should the Agency be able to provide for its operational activities?",["All capabilities for its operational activities, without any contribution from Member States","Only aerial surveillance capabilities, with Member States providing all other assets","Only training capabilities, with Member States providing all equipment and personnel","The baseline capabilities per the EBCG Operational Concept, with Member States topping up"],3,"The 2027 milestone states the Agency should be able to provide the baseline capabilities for its operational activities, with Member States providing top-ups when necessary.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0189",0,0,2,"'Milestone Roadmap – 2027'",2,"According to the Capability Roadmap of the European Border and Coast Guard, within what time after the approval of the Capability Roadmap must changes to Frontex's own plans be introduced?",["Within a year","Within three months","Within six months","Within two years"],0,"The 2027 milestone states any changes in Frontex's plans to better meet Member States' expectations need to be introduced within a year after the approval of the Roadmap.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0190",0,0,2,"Chapter 3 'Capability Heat Map'",1,"In the Capability Heat Map of the Capability Roadmap of the European Border and Coast Guard, at how many levels were priorities assigned to each business capability?",["Two levels: essential and desirable","Three levels: low, medium and high","Four levels: none, low, medium and high","Five levels on a scale from 1 to 5"],1,"The Heat Map methodology assigned priorities to each business capability at three levels: low, medium and high.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0191",0,0,2,"Chapter 3 'Capability Heat Map', Figure 4",2,"In the Business Capability Heat Map of the Capability Roadmap of the European Border and Coast Guard, into which three categories are business capabilities grouped?",["Strategic, tactical and operational business capabilities","Preventive, reactive and recovery business capabilities","Governing, core and supporting business capabilities","National, European and international business capabilities"],2,"Figure 4 groups the capabilities into Governing (e.g. policy management), Core (e.g. operational management) and Supporting (e.g. resources management) business capabilities.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0192",0,0,2,"Chapter 2 'Concept: Shared Responsibility for Integrated Capabilities'",0,"According to the Capability Roadmap of the European Border and Coast Guard, from which field does the notion of 'capability' stem?",["Customs","Civil aviation","Public health","Defence"],3,"The Concept section states 'The notion of capability stems from defence', where centuries of managing operational resources revealed the interlinkages of processes.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0193",0,0,2,"Chapter 2 'Concept' (Lines of Development)",2,"Which of the following is listed among the Lines of Development in the Capability Roadmap of the European Border and Coast Guard?",["Culture, organisation and leadership","Procurement, auditing and accounting","Diplomacy, trade and development","Asylum, reception and integration"],0,"The Concept section lists Lines of Development including doctrine, policies and concepts; culture, organisation and leadership; science, technology and innovation; personnel; equipment; logistics; safety; interoperability.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0194",0,0,2,"Chapter 3, Figure 2/3 (effects continuum)",1,"In the Capability Roadmap of the European Border and Coast Guard, what is the aim of the proactive response effects in the effects continuum?",["To stabilise the situation quickly after an event has already occurred at the external borders","To prevent challenging events from reaching the external borders, staying 'left' of the event","To recover operational capacity and lessons learnt after a crisis has ended at the external borders","To mitigate the consequences of an event once it has been detected at the external border"],1,"Figures 2 and 3 explain that proactive response effects (predict, prevent, detect) aim to stay 'left' of the challenging event, preventing it from occurring.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0195",0,0,2,"Chapter 3, priority 'Comprehensive Pan-European Network-Enabled Multipurpose Surveillance'",1,"According to the Capability Roadmap of the European Border and Coast Guard, in which strategic locations shall the Maritime Surveillance Architecture begin to be rolled out for a period of experimentation?",["The Baltic Sea, the North Sea and the Atlantic","The Aegean, the Adriatic and the Ionian Sea","The Mediterranean, the Channel and the Black Sea","The Canary Islands, Madeira and the Azores"],2,"The surveillance priority states the Maritime Surveillance Architecture shall begin to be rolled out in strategic locations in the Mediterranean, the Channel and the Black Sea.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0196",0,0,2,"Chapter 3, priority 'Improved Efficiency and Security of Border Crossing Points'",1,"According to the Capability Roadmap of the European Border and Coast Guard, how should the ability to detect hidden objects, illicit goods and clandestine persons at border crossing points be enhanced?",["By doubling the number of manual inspections of all vehicles, containers and cargo","By transferring all inspection and detection tasks to the national customs authorities","By relying exclusively on biometric e-gates and passenger data at every crossing point","By combining novel technological solutions with an expanded pool of canine teams"],3,"The border crossing points priority calls for detecting hidden objects, illicit and stolen goods and clandestine persons by combining novel technological solutions with an expanded pool of canine teams.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0197",0,0,2,"Chapter 3, priority 'Gradually Adopted Emerging Innovative Technologies'",1,"According to the Capability Roadmap of the European Border and Coast Guard, what should the European Border and Coast Guard have fully rolled out by 2027 under the priority on emerging innovative technologies?",["The smart border concept, drawing on large-scale information systems","Directed energy weapons deployed for all land and maritime border patrols","Autonomous robots replacing border guards at all external crossing points","Quantum-encrypted communications for all operations and national authorities"],0,"The priority states that by 2027 the EBCG should have fully rolled out the smart border concept, drawing on large-scale information systems.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0198",0,0,2,"Chapter 4 'Governance', Figure 7",1,"In the governance structure of the Capability Roadmap of the European Border and Coast Guard, which body acts as the Steering Committee for the capability development planning process?",["The Capability Development Network of national and Frontex capability experts","The Management Board Working Group on European Integrated Border Management","The Pooled Resources Network of Member States' national contact points","The Consultative Forum on Fundamental Rights and its two elected chairs"],1,"Figure 7 shows the Management Board as governance body and the MB Working Group on EIBM as Steering Committee.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0199",0,0,2,"Chapter 4 'Governance'",0,"According to the Capability Roadmap of the European Border and Coast Guard, which network should remain the main collaborative platform to implement the capability development planning process?",["The Risk Analysis Network","The Pooled Resources Network","The Capability Development Network","The Partnership Academies network"],2,"The Governance section states the Capability Development Network should remain the main collaborative platform for the capability development planning process.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0200",0,0,2,"Chapter 4 'Governance', Figure 7",2,"In the governance structure of the Capability Roadmap of the European Border and Coast Guard, who acts as Product Owner?",["The Chair of the Management Board","The European Commission","The Deputy Executive Director for Standing Corps Management","The Executive Director"],3,"Figure 7 identifies the Executive Director as Product Owner, MS/SAC Management Board representatives as such, and the Deputy Executive Director for Standing Corps Management as Solution Provider.","https://prd.frontex.europa.eu/document/frontex-capability-roadmap/"],["Q0201",0,0,3,"News release, 3 June 2025",0,"Who was the Frontex Executive Director quoted at the release of the Frontex Annual Risk Analysis (ARA) 2025/2026?",["Hans Leijtens","Fabrice Leggeri","Aija Kalnaja","Lars Gerdes"],0,"The news release of 3 June 2025 quotes Executive Director Hans Leijtens; he also signs the report's foreword.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0202",0,0,3,"Section 3 'Introduction'",1,"What time horizon does the Frontex Annual Risk Analysis (ARA) 2025/2026 cover?",["Two years from publication (Q1 2025 – Q4 2026)","One year from publication (Q3 2025 – Q3 2026)","Ten years from publication (2025 – 2034)","Five years from publication (2025 – 2030)"],1,"The Introduction states the ARA focuses on the main risks on entry within a time horizon of one year from publication (Q3 2025 – Q3 2026).","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0203",0,0,3,"Section 3 'Introduction'",1,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which content was newly added compared with previous editions of the report?",["Analysis of the Channel route on exit to the United Kingdom","Analysis of internal border controls within Schengen","Analysis of air borders, returns and vulnerabilities","Analysis of visa statistics and consular practices"],2,"The Introduction states that, in a change from previous editions, the content is now enriched with analysis of air borders, returns and vulnerabilities.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0204",0,0,3,"Section 3 'Introduction'",2,"How does the Frontex Annual Risk Analysis (ARA) 2025/2026 treat the Channel route towards the United Kingdom?",["It is analysed in a dedicated chapter as the main entry route for irregular migration into the EU","It is covered as a sub-route within the Western Mediterranean route chapter of the report","It is excluded entirely because the United Kingdom is no longer a Member State of the EU","Outside the scope as an exit route, but noted for its implications for secondary movements"],3,"The Introduction explains that the Channel route on exit is outside the report's scope but has implications for secondary movements and cooperation with third countries.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0205",0,0,3,"Section 4 'Eastern Borders'",0,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, on which section of the EU's external borders is geopolitics the strongest determinant of migration?",["The Eastern borders","The Western African route","The Air borders","The Western Balkan route"],0,"Section 4 states that nowhere else on the EU's external borders is geopolitics a stronger determinant of migration than on the Eastern borders.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0206",0,0,3,"Section 4 'Eastern Borders'",0,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, at which border was a notable uptick in attempted illegal border-crossings observed in early 2025?",["The Finnish border with Russia","The Polish border with Belarus","The Romanian border with Ukraine","The Hungarian border with Serbia"],1,"Section 4 notes a notable uptick in attempted illegal border-crossings in early 2025 from Belarus, particularly at the Polish border.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0207",0,0,3,"Section 4 'Eastern Borders'",1,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which innovative smuggling methods are expected on the Eastern borders?",["Submarines, shipping containers and private light aircraft","Tunnels, hot-air balloons and freight trains across borders","Drones, GPS-tracked balloons and rafts at river borders","Jet skis, rigid-hulled speedboats and fishing trawlers"],2,"Section 4 states smugglers will continue to adapt using innovative methods such as drones, GPS-tracked balloons and rafts at river borders.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0208",0,0,3,"Section 4 'Eastern Borders'",2,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, what effect could a ceasefire in the Russia-Ukraine conflict have on cross-border crime?",["A sharp decrease in all smuggling activities at the EU-Ukrainian border as controls normalise","A shift of drug trafficking routes from the Western Balkans towards the Baltic Sea ports","An immediate end to the instrumentalisation of migration flows by Belarus and Russia","A rise in the supply of contraband, especially weapons, as soldiers and mercenaries are demobilised"],3,"Section 4 states the supply of contraband, especially weapons, is expected to rise as soldiers and mercenaries are demobilised.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0209",0,0,3,"Section 5 'South-Eastern Borders'",1,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, since March 2024 how many Afghans has Iran expelled?",["Over one million, although roughly 50% have returned","About 200,000, almost all of whom remained in Afghanistan","Over five million, mostly towards Pakistan","About 500,000, of whom 90% moved on to Türkiye"],0,"Section 5 states that since March 2024 Iran has expelled over one million Afghans, although roughly 50% have returned.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0210",0,0,3,"Section 5 'South-Eastern Borders'",2,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which nationality was the top one detected on secondary movement corridors deriving from the Western Balkan route in 2024?",["Afghan (30%)","Syrian (30%)","Turkish (30%)","Moroccan (30%)"],1,"Section 5 lists Syrian (30%), Afghan (14%), Turkish (9%), Moroccan (7%) and Bangladeshi (4%) as top nationalities on those corridors in 2024.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0211",0,0,3,"Section 5 'South-Eastern Borders'",1,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which corridor could become a key route in the Eastern Mediterranean, reflecting North Africa's growing influence?",["The Tunisia-Malta corridor","The Egypt-Cyprus corridor","The Libya-Crete corridor","The Lebanon-Rhodes corridor"],2,"Section 5 states the Libya-Crete corridor could become a key route, reflecting the growing influence of North Africa on the Eastern Mediterranean.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0212",0,0,3,"Section 6 'Southern Borders'",0,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which country is the primary country of departure on the Central Mediterranean route?",["Tunisia","Egypt","Algeria","Libya"],3,"Section 6 states that Libya, as the primary country of departure, continues to be a critical focus.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0213",0,0,3,"Section 6 'Southern Borders'",2,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which airport in Eastern Libya plays a crucial role as a transit hub for migrants?",["Benghazi's Benina airport","Tripoli's Mitiga airport","Misrata international airport","Sabha airport in the Fezzan"],0,"Section 6 states Eastern Libya remains a pivotal transit hub, with Benghazi's Benina airport playing a crucial role.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0214",0,0,3,"Section 6 'Southern Borders'",1,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which nationalities make up the majority of arrivals on the Libyan-Italian corridor?",["Eritreans, Sudanese and Somalis","Bangladeshis, Syrians and Pakistanis","Tunisians, Egyptians and Moroccans","Afghans, Iranians and Iraqis"],1,"Section 6 states migrants from Bangladesh, Syria and Pakistan make up the majority of arrivals on the Libyan-Italian corridor.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0215",0,0,3,"Section 6 'Southern Borders'",1,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, what is the concern linked to the increasing Russian military presence in Eastern Libya?",["Russian forces could block all departures from Eastern Libya and thereby reduce flows towards Italy","Russian naval patrols could replace the Libyan coast guard in search and rescue in the Central Med","Russian-backed forces and PMCs could instrumentalise migration flows as a hybrid warfare tool","Russian companies could take over the management of Libyan reception and detention centres"],2,"Section 6 states Russian-backed forces and PMCs in Libya, notably via the Maaten Al Sarra airbase, could instrumentalise migration as a tool of hybrid warfare against the EU.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0216",0,0,3,"Section 6 'Southern Borders'; Abbreviations",0,"In the Frontex Annual Risk Analysis (ARA) 2025/2026, what does the abbreviation AES stand for?",["African Economic Space","Association of European Seaports","Agreement on External Security","Alliance of Sahel States"],3,"The list of abbreviations defines AES as Alliance of Sahel States, formed by Mali, Burkina Faso and Niger.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0217",0,0,3,"Section 7 'South-Western Borders'",0,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which three countries formed the Alliance of Sahel States and withdrew from ECOWAS?",["Mali, Burkina Faso and Niger","Senegal, Mauritania and The Gambia","Chad, Sudan and Libya","Nigeria, Ghana and Côte d'Ivoire"],0,"Section 7 refers to the decision by Mali, Burkina Faso and Niger to form the AES and withdraw from ECOWAS.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0218",0,0,3,"Section 7 'South-Western Borders'",0,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which country has emerged as a key departure point for migrants heading to the Canary Islands?",["Morocco","Mauritania","Guinea","Cabo Verde"],1,"Section 7 states Mauritania has emerged as a key departure point for migrants heading to the Canary Islands, driven by Malian migrants and expanding smuggling networks.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0219",0,0,3,"Section 7 'South-Western Borders'",2,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, when do arrivals on the Western African route typically peak?",["In March and April","In June and July","In October and November","In January and February"],2,"Section 7 states arrivals start increasing in August and reach a peak in October and November, with fewer arrivals from March to July.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0220",0,0,3,"Section 7 'South-Western Borders'",1,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, what change in the Western Mediterranean route was observed in 2024?",["More departures from Morocco and fewer from Algeria, with a surge of arrivals in Ceuta and Melilla","A complete halt of departures from Algeria following a new bilateral readmission agreement with Spain","A shift of departures from Tunisia towards Morocco, with more arrivals in Melilla and Andalusia","Fewer departures from Morocco and more from Algeria, with a surge of arrivals in the Balearic Islands"],3,"Section 7 notes a significant decrease in departures from Morocco and an increase from Algeria in 2024, with eastern departures causing a surge in Balearic arrivals.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0221",0,0,3,"Section 8 'Air Borders'",0,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, what is the primary enabler of irregular entry at EU airports?",["Fraudulent documentation","Airport Transit Visa waivers","Lack of carrier sanctions","Insufficient e-gates"],0,"Section 8 states that fraudulent documentation remains a primary enabler of irregular entry at EU airports.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0222",0,0,3,"Section 8 'Air Borders'",2,"In the Frontex Annual Risk Analysis (ARA) 2025/2026, what does 'nationality swapping' refer to?",["Migrants exchanging passports with relatives during transit stops","Migrants claiming to be from conflict-affected regions to facilitate asylum claims","Smugglers changing the flag state of vessels to avoid interception","Travellers holding dual citizenship using different passports on entry and exit"],1,"Section 8 describes nationality swapping as migrants claiming to be from conflict-affected regions to facilitate asylum claims.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0223",0,0,3,"Section 8 'Air Borders'",1,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, which nationalities may shift their focus to Europe due to tighter US immigration controls?",["Mexican, Guatemalan and Honduran nationals","Indian, Chinese and Vietnamese nationals","Venezuelan, Colombian and Cuban nationals","Haitian, Dominican and Jamaican nationals"],2,"Section 8 and the news release state Venezuelan, Colombian and Cuban nationals may redirect towards the EU due to US policy changes.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0224",0,0,3,"Section 9 'Outlook' – Frontex support for return activities",1,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, what remains the key factor determining the number of returns from the EU?",["The number of return decisions issued by Member States","The availability of charter flights","The capacity of detention facilities","The level of third-country cooperation on readmission"],3,"The Outlook states that the level of third-country cooperation on readmission will remain the key factor determining the number of returns.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0225",0,0,3,"Section 9 'Outlook' – Strategic Risk Analysis 2024",2,"According to the Frontex Annual Risk Analysis (ARA) 2025/2026, what time horizon does Frontex's Strategic Risk Analysis have?",["A 10-year horizon, developing scenarios for European border management until 2034","A 5-year horizon, developing scenarios for European border management until 2029","A 3-year horizon, developing scenarios aligned with the programming period","A 20-year horizon, developing scenarios for European border management until 2044"],0,"The Outlook states the Strategic Risk Analysis has a 10-year time horizon developing scenarios until 2034, with best-case, baseline, worst-case and hybrid-threat scenarios.","https://www.frontex.europa.eu/media-centre/news/news-release/frontex-releases-annual-risk-analysis-2025-2026-xq0c2u"],["Q0226",0,0,4,"About Frontex > Who we are > Legal Basis",0,"According to the Frontex website, where is the headquarters of Frontex located, and which provision lays this down?",["Brussels, Belgium – Article 93(5) of Regulation (EU) 2019/1896","Warsaw, Poland – Article 93(5) of Regulation (EU) 2019/1896","Warsaw, Poland – Article 8(6) of Regulation (EU) 2016/1624","Luxembourg – Article 102 of Regulation (EU) 2019/1896"],1,"The Legal Basis page states the headquarters is in Warsaw, Poland, as laid down in Article 93(5) of Regulation (EU) 2019/1896, with a Headquarters Agreement signed with Poland.","http://www.frontex.europa.eu/"],["Q0227",0,0,4,"About Frontex > Who we are > Tasks & Mission ('Frontex is born')",1,"According to the Frontex website, which act originally established Frontex as the European Agency for the Management of Operational Cooperation at the External Borders?",["Regulation (EU) 2016/1624 of 14 September 2016","Regulation (EC) No 863/2007 of 11 July 2007","Council Regulation (EC) 2007/2004 of 26 October 2004","Regulation (EU) No 1052/2013 of 22 October 2013 (Eurosur)"],2,"The 'Frontex is born' section states Council Regulation (EC) 2007/2004 of 26 October 2004 established the Agency.","http://www.frontex.europa.eu/"],["Q0228",0,0,4,"About Frontex > Who we are > Tasks & Mission ('Frontex is born')",0,"According to the Frontex website, which regulation of 14 September 2016 established Frontex as the European Border and Coast Guard Agency?",["Regulation (EU) 2019/1896","Regulation (EU) 656/2014","Regulation (EU) 2016/399","Regulation (EU) 2016/1624"],3,"The history section states Regulation (EU) 2016/1624 of 14 September 2016 repealed the 2004 Regulation and established Frontex as the European Border and Coast Guard Agency.","http://www.frontex.europa.eu/"],["Q0229",0,0,4,"About Frontex > Who we are > Legal Basis ('Background')",2,"According to the Frontex website, which 2007 amendment to the founding Frontex regulation established a mechanism for the creation of Rapid Border Intervention Teams?",["Regulation (EC) No 863/2007","Regulation (EU) No 1168/2011","Regulation (EU) No 1052/2013","Regulation (EU) No 656/2014"],0,"The Background section states Regulation (EC) No 863/2007 of 11 July 2007 established the Rapid Border Intervention Teams mechanism and regulated visiting officers' tasks and powers.","http://www.frontex.europa.eu/"],["Q0230",0,0,4,"About Frontex > Who we are > Tasks & Mission ('Schengen')",0,"According to the Frontex website, in which year did five Member States sign the first Schengen agreement?",["1957","1985","1990","1995"],1,"The Schengen section states the first agreement was signed in 1985, followed in 1990 by the Convention implementing it, with the area entering into force in 1995.","http://www.frontex.europa.eu/"],["Q0231",0,0,4,"About Frontex > Who we are > Tasks & Mission ('Our Mission')",0,"According to the Frontex website, what is the mission of Frontex?",["Independently of Member States, we control all external borders and decide on the entry of persons","Together with Europol, we fight organised crime at the internal borders of the Schengen area","Together with EU Member States, we ensure safe and well-functioning external borders providing security","On behalf of the Commission, we issue return decisions and organise removals from the Union"],2,"The 'Our Mission' section reads: 'Together with EU Member States, we ensure safe and well-functioning external borders providing security.'","http://www.frontex.europa.eu/"],["Q0232",0,0,4,"About Frontex > Who we are > Tasks & Mission (values)",0,"According to the Frontex website, which of the following is one of the Frontex values?",["We are independent","We are neutral","We are competitive","We are accountable"],3,"The values listed are: we are professional, we are respectful, we seek cooperation, we are accountable, and we care.","http://www.frontex.europa.eu/"],["Q0233",0,0,4,"About Frontex > Who we are > Structure",0,"According to the Frontex website, who appoints the Frontex Executive Director?",["The Management Board, on the basis of a proposal from the European Commission","The European Parliament, on the basis of a proposal from the Council of the EU","The Council of the EU, on the basis of a proposal from the Management Board","The European Commission, after consulting the Member States and the Parliament"],0,"The Structure page states the Executive Director is appoin
