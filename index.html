d","The applicant is referred to the regular procedure and may enter the territory","The applicant is automatically transferred to the return border procedure","The time limit is automatically extended by the Commission for six weeks"],1,"If there is no decision within the time limit, applicants are referred to the regular asylum procedure and authorised to enter the territory.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0491",0,0,11,"Questions and answers on the Pact, 'How will returns be made more effective in the context of the return border procedure?'",1,"Under normal circumstances, the combined asylum and return border procedures should not last more than how long in total?",["12 weeks","24 weeks","18 weeks","36 weeks"],1,"The seamless link between asylum and return at the border should not under normal circumstances last more than 24 weeks (12 + 12).","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0492",0,0,11,"Legislative files in a nutshell, Asylum Procedure Regulation 'What is new?'",2,"Under the Asylum Procedure Regulation, at what level is the 'adequate capacity' for the border procedure set at Union level?",["20 000","30 000","50 000","120 000"],1,"The adequate capacity at Union level is set at 30 000; the capacity per Member State is established by the Commission every three years by implementing act.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0493",0,0,11,"Questions and answers on the Pact, 'What is the Pact... in a nutshell' – More secure external borders",0,"Under the Pact, are unaccompanied minors subject to the asylum border procedure?",["No, they are exempt unless they pose a security threat","Yes, always, under the same rules as for any adult applicant","Only if they are over 16 years of age and travel alone","Only if they come from a designated safe country of origin"],0,"The Q&A states that unaccompanied minors are exempt from the border procedure unless they pose a security threat.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0494",0,0,11,"Questions and answers on the Pact, 'How will the fundamental rights of the persons be guaranteed during the border procedure?'",1,"Under the Pact, what should happen to the border procedure for families with minors if reception conditions for them are not adequate?",["It continues, but its duration is shortened to six weeks","It is transferred to the EUAA, which then runs it directly","It should be suspended on a recommendation by the Commission","It is replaced by automatic detention in a closed centre"],2,"If reception conditions for minors and their family members are not adequate, the border procedure for families with minors should be suspended based on a Commission recommendation.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0495",0,0,11,"Questions and answers on the Pact, 'Will asylum applicants be detained during the border procedure?'",1,"According to the Pact Q&A, under what conditions can detention be applied to applicants in the border procedure?",["Only if necessary and proportionate after individual assessment, as last resort, with judicial review","Automatically for all applicants for the whole duration of the border procedure, without review","Only on the decision of Frontex standing corps staff deployed at the relevant border section","Whenever the applicant is a national of a designated safe country of origin, without exception"],0,"Member States cannot impose detention automatically; detention follows the Reception Conditions Directive safeguards (necessity, proportionality, individual assessment, last resort, judicial scrutiny).","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0496",0,0,11,"Questions and answers on the Pact, 'What are the obligations for asylum applicants?'",0,"Under the Asylum Procedure Regulation, within what period must applicants lodge their application after it has been registered?",["7 days","15 days","21 days","30 days"],2,"Applicants must lodge applications within 21 days from registration.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0497",0,0,11,"Questions and answers on the Pact, 'How are fast and efficient procedures ensured?'",1,"Under the Asylum Procedure Regulation, what is the maximum duration of the regular procedure, including the permitted extension?",["3 + 3 months (6 months)","6 + 3 months (9 months)","6 + 6 months (12 months)","12 + 6 months (18 months)"],2,"Member States may only extend the examination by 6 months, so the regular procedure can last a maximum of 6+6 months.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0498",0,0,11,"Questions and answers on the Pact, 'How are fast and efficient procedures ensured?'",1,"Under the Asylum Procedure Regulation, within what deadline must the accelerated procedure be concluded?",["6 weeks","6 months","3 months","12 weeks extendable to 18 weeks"],2,"The APR sets a clear deadline of 3 months to conclude the accelerated procedure, which is mandatory EU-wide for abusive claims and subsequent applications.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0499",0,0,11,"Legislative files in a nutshell, Asylum Procedure Regulation 'What is new?'",1,"Under the Asylum Procedure Regulation, how are the asylum and return processes linked?",["A return decision may only be issued after all appeals against the asylum decision are exhausted","A negative asylum decision comes with a return decision; appeals on both follow the same timelines","Return decisions are issued by Frontex, while asylum decisions are issued by national authorities","The return decision is issued later by the Member State of which the applicant is a national"],1,"The APR ensures that a negative asylum decision is issued jointly with a return decision and that appeals against both decisions are handled within the same timelines.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0500",0,0,11,"Legislative files in a nutshell, Asylum Procedure Regulation 'How will it benefit asylum seekers?'",2,"Under the Asylum Procedure Regulation, no later than when must a representative be appointed for an unaccompanied minor?",["3 working days from when the application was registered","30 days from when the application was lodged","15 working days from when the application was made","Before the end of the screening procedure"],2,"The representative of an unaccompanied minor must be appointed no later than 15 working days from when the application was made.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0501",0,0,11,"Legislative files in a nutshell, Asylum Procedure Regulation 'How will it benefit asylum seekers?'",2,"Under the Asylum Procedure Regulation, which of the following appeals DOES carry automatic suspensive effect?",["An appeal against a decision rejecting an application as implicitly withdrawn","An appeal against a negative merits decision in the border procedure for an adult applicant","An appeal against an inadmissibility decision based on the safe third country concept","An appeal against withdrawal of refugee status for danger to security"],2,"Inadmissibility decisions do not have automatic suspensive effect except where the ground is the safe third country principle; the other listed decisions have no automatic suspensive effect.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0502",0,0,11,"Legislative files in a nutshell, Asylum Procedure Regulation 'Safe third country designation at EU level'",1,"What is the main difference between the 'safe third country' and 'safe country of origin' concepts?",["A safe third country must be an EU candidate country; a safe country of origin need not be one","A safe third country is safe for non-nationals; a safe country of origin is safe for its nationals","A safe country of origin is designated only nationally; a safe third country only at EU level","There is no real difference; the two terms are used interchangeably throughout the APR"],1,"The nutshell explains that a safe third country is safe for a non-national applicant, while a safe country of origin is safe for its nationals (or former habitual residents).","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0503",0,0,11,"Questions and answers on the Pact, 'What are safe third countries?'",2,"Under the 2026 revision of the safe third country concept in the Asylum Procedure Regulation, which option does NOT apply to unaccompanied minors?",["A connection between the applicant and the safe third country concerned","An agreement with the third country, where there is no connection or transit","Transit by the applicant through the safe third country before reaching the EU","Any of the inadmissibility grounds listed in the Asylum Procedure Regulation"],1,"The third criterion – an agreement or arrangement with the safe third country where there is no connection or transit – does not apply to unaccompanied minors.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0504",0,0,11,"Questions and answers on the Pact, 'What are safe countries of origin?'",0,"The first EU list of safe countries of origin, adopted in February 2026, includes EU candidate countries with one current exception. Which?",["Moldova","Montenegro","Türkiye","Ukraine"],3,"The list includes EU candidate countries (currently except Ukraine in view of Russia's war of aggression), plus Kosovo, Bangladesh, Colombia, Egypt, India, Morocco and Tunisia.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0505",0,0,11,"Questions and answers on the Pact, 'What flexibility do Member States have in crisis situations?'",1,"Under the Crisis and Force Majeure Regulation, to what maximum may the duration of the border procedure be extended?",["16 weeks","24 weeks","18 weeks","6 months"],2,"In a situation of crisis, instrumentalisation or force majeure, the border procedure may be extended from 12 weeks to a maximum of 18 weeks.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0506",0,0,11,"Questions and answers on the Pact, 'What flexibility do Member States have in crisis situations?'",1,"Under the Crisis and Force Majeure Regulation, the time limit to register applications for international protection may be extended from 7 days to what?",["Two weeks","Three months","Four weeks","Six weeks"],2,"The time limit to register applications is extended from 7 days to four weeks.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0507",0,0,11,"Questions and answers on the Pact, 'What is a situation of instrumentalisation?'",1,"How does the Crisis and Force Majeure Regulation describe a 'situation of instrumentalisation'?",["A sudden increase in arrivals caused by a natural disaster or pandemic in a neighbouring third country","Organised smuggling networks operating for profit along an established migration route towards the EU","A third country or hostile non-state actor pushes migrants to EU borders to destabilise the EU or a Member State","A Member State's refusal to accept relocation pledges or other contributions under the Solidarity Pool"],2,"Instrumentalisation is defined as a third country or hostile non-state actor encouraging or facilitating movements with the aim of destabilising the EU or a Member State, putting essential State functions at risk.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0508",0,0,11,"Questions and answers on the Pact, 'What constitutes a force majeure situation?'",0,"Which of the following is given as an example of a 'force majeure' situation in the Pact?",["Instrumentalisation of migrants by a third country","A sudden mass arrival of persons disembarked after search and rescue","Secondary movements of applicants to another Member State","A pandemic"],3,"Force majeure refers to abnormal and unforeseeable circumstances outside a Member State's control, such as natural disasters and pandemics.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0509",0,0,11,"Questions and answers on the Pact, 'How does the solidarity mechanism work in times of crisis...?'",2,"Under the Crisis and Force Majeure Regulation, within what time should the implementing act establishing a specific solidarity pool for a Member State in crisis be adopted?",["Within 3 weeks","Within 72 hours","Within 2 months","Before the end of the calendar year"],0,"The implementing act should be adopted within 3 weeks from when the Member State is considered in crisis, as opposed to up to 2 months under the AMMR.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0510",0,0,11,"Legislative files in a nutshell, Crisis and Force Majeure Regulation 'What are the safeguards for asylum seekers?'",1,"In a situation of instrumentalisation where the border procedure can be applied to all applicants, which minors are excluded from it from the outset (or once their claim appears well-founded)?",["All minors under the age of 18 without exception","Only minors under the age of 6","Minors under the age of 12 and their family members","Only unaccompanied minors over 16"],2,"Minors under 12, family members, and people with special procedural or reception needs are excluded from the border procedure from the outset or as soon as their applications appear likely well-founded.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0511",0,0,11,"Legislative files in a nutshell, Eurodac Regulation 'On increased security guarantees'; Q&A minors",0,"From what age does the recast Eurodac Regulation require biometric data of minors to be recorded?",["6 years","12 years","14 years","10 years"],0,"Eurodac now includes data of children as of 6 years old, to identify children separated from their families and protect them from trafficking.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0512",0,0,11,"Questions and answers on the Pact, 'What is new in the Eurodac database?'",1,"Under the new Eurodac Regulation, how long are the fingerprints of persons who entered the EU illegally stored, compared with those of asylum applicants?",["18 months for irregular entrants; 10 years for asylum applicants","5 years for both categories","10 years for irregular entrants; 5 years for asylum applicants","5 years for irregular entrants; 10 years for asylum applicants"],3,"Data of those who entered illegally remains in the system for 5 years, while the storage period for asylum applicants remains 10 years.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0513",0,0,11,"Legislative files in a nutshell, Qualification Regulation 'What is new?'",1,"Which obligation does the Qualification Regulation place on Member States when assessing and reviewing applications?",["To take into account up-to-date EUAA guidance on countries of origin","To obtain prior approval from the Commission for each refugee status decision","To consult Frontex risk analyses before granting subsidiary protection","To apply the recognition rate of the country of nationality as binding"],0,"Member States must take into account up-to-date EU Asylum Agency guidance on countries of origin; they must also assess an internal protection alternative.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0514",0,0,11,"Legislative files in a nutshell, Reception Conditions Directive 'Strengthened safeguards'",1,"Under the revised Reception Conditions Directive, within what time must the assessment of specific reception needs be completed?",["7 days","30 days","15 working days","3 months"],1,"The assessment of specific reception needs must be completed within 30 days, as opposed to a 'reasonable period' in the previous text.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0515",0,0,11,"Legislative files in a nutshell, Reception Conditions Directive 'Increased flexibility and integration processes'",0,"Under the revised Reception Conditions Directive, asylum seekers must have access to the labour market no later than how long after their application is registered?",["Six months","Three months","Nine months","Twelve months"],0,"Asylum seekers will have access to the labour market no later than six months after registration, with earlier access encouraged for likely well-founded cases.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0516",0,0,11,"Legislative files in a nutshell, Reception Conditions Directive 'What is new?'",1,"To prevent secondary movements, what does the revised Reception Conditions Directive provide for applicants found in a Member State other than the responsible one?",["They are automatically granted a temporary residence permit there","They become the responsibility of that Member State after 30 days","They are not entitled to material reception conditions in that Member State","They are transferred to a reception facility run directly by the EUAA"],2,"Member States will not be able to provide material reception conditions when an applicant is found in a Member State other than the one responsible.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0517",0,0,11,"Legislative files in a nutshell, Union Resettlement Framework 'Common policy and procedures'",1,"Under the Union Resettlement and Humanitarian Admission Framework Regulation, what does the Union Plan cover and who adopts it?",["A 5-year plan adopted by the European Parliament, setting binding national quotas for each Member State","A 2-year plan adopted by the Council on a Commission proposal, setting total admissions and geographic priorities","An annual plan adopted by the EUAA Management Board, setting admissions by country of first asylum","A 3-year plan adopted by the Commission alone by delegated act, setting admissions per UNHCR referral"],1,"The Framework envisages a 2-year Union plan adopted by the Council based on a Commission proposal, determining the total number of persons and geographic priorities.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0518",0,0,11,"Questions and answers on the Pact, General questions table, item 9",0,"On what basis do Member States resettle refugees under the Resettlement Framework Regulation?",["On a mandatory basis according to fair-share keys","On a voluntary basis","Only when designated by UNHCR as obligatory","Only when the Council declares a crisis"],1,"The Resettlement Framework Regulation creates a common EU framework for Member States to resettle, on a voluntary basis, refugees from outside the EU.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0519",0,0,11,"Questions and answers on the Pact, 'How will returns be made more effective...?'",0,"According to the Pact Q&A, which agency provides operational support in all phases of the return process, including reintegration?",["EUAA","Europol","eu-LISA","Frontex"],3,"At operational level, Frontex provides support in all phases of the return process (pre-return, return operations and post-return including reintegration).","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0520",0,0,11,"Pact page, 'Embedding migration in international partnerships'",1,"Under the Pact's external dimension, which instrument establishes the first EU-wide platform to facilitate international recruitment?",["The EU Talent Pool","The Anti-Smuggling Operational Partnerships","The Union Resettlement Framework","The EU Blue Card Network"],0,"The Pact page states that an EU Talent Pool establishes the first EU-wide platform to facilitate international recruitment.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0521",0,0,12,"COM(2025) 148, title page and Section 1",0,"What is the name of the European Internal Security Strategy presented by the Commission on 1 April 2025 (COM(2025) 148)?",["SecureEU","ProtectEU","SafeEurope","ShieldEU"],1,"COM(2025) 148 is the Communication 'on ProtectEU: a European Internal Security Strategy', dated Strasbourg, 1.4.2025.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0522",0,0,12,"COM(2025) 148, Section 1, 'three principles'",1,"Which three principles guide the ProtectEU Internal Security Strategy?",["Subsidiarity of national action; proportionality of measures; mutual recognition","Whole-of-society approach; security mainstreamed across EU policies; serious investment","Prevention of crime; prosecution of offenders; protection of victims and witnesses","Intelligence-led policing; integrated border control; reinforced judicial cooperation"],1,"Section 1 lists the whole-of-society approach, integration of security across all EU legislation, policies and programmes, and serious investment by the EU, Member States and private sector.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0523",0,0,12,"COM(2025) 148, Section 1",1,"According to ProtectEU, what share of Europeans tend to be worried about the EU's security?",["46 percent","52 percent","78 percent","64 percent"],3,"Section 1 cites a Flash Eurobarometer finding that 64 percent of Europeans tend to be worried about the EU's security.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0524",0,0,12,"COM(2025) 148, Section 1",1,"Which two documents does ProtectEU state it complements?",["The Strategic Compass for Security and Defence and the EU Maritime Security Strategy","The Schengen Strategy and the EU Security Union Strategy 2020-2025","The Preparedness Union Strategy and the White Paper for European Defence Readiness 2030","The Global Gateway strategy and the Competitiveness Compass for the EU"],2,"Section 1 states the Strategy complements the Preparedness Union Strategy and the White Paper for European Defence Readiness 2030.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0525",0,0,12,"COM(2025) 148, Section 2, Integrated situational awareness and threat analysis",1,"In ProtectEU, which capacity is described as the single point of entry for Member States' intelligence?",["The Integrated Security Operations Centre (ISOC)","The European Counter Terrorism Centre","The Single Intelligence Analysis Capacity (SIAC)","The EU Hybrid Fusion Cell at Europol"],2,"Section 2 encourages Member States to enhance intelligence sharing through SIAC as the single point of entry for Member States' intelligence.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0526",0,0,12,"COM(2025) 148, Section 2",2,"Under ProtectEU, what is the purpose of the Integrated Security Operations Centre (ISOC) to be established by the Commission?",["To protect people, physical assets and operations across all Commission sites","To coordinate Member States' responses to large-scale cyber incidents","To host joint Frontex and Europol analysis of threats at the external borders","To manage the future European Critical Communication System network"],0,"Section 2: the Commission will revise its corporate security governance and establish ISOC to protect people, physical assets and operations across all Commission sites.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0527",0,0,12,"COM(2025) 148, Section 3, 'EU agencies and bodies for internal security'",1,"According to ProtectEU, which new security threats are NOT covered by Europol's current mandate, justifying its overhaul?",["Sabotage, hybrid threats and information manipulation","Drug trafficking and money laundering","Terrorism and cybercrime","Migrant smuggling and trafficking in human beings"],0,"Section 3 notes that Europol's current mandate does not cover new threats such as sabotage, hybrid threats or information manipulation.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0528",0,0,12,"COM(2025) 148, Section 3, Key actions",0,"In which year does ProtectEU announce a legislative proposal to turn Europol into a truly operational law enforcement agency?",["2026","2025","2027","2028"],0,"The key actions of Section 3 list a legislative proposal to transform Europol into a truly operational law enforcement agency in 2026.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0529",0,0,12,"COM(2025) 148, Section 3, 'Strengthening border security'",0,"According to ProtectEU, to what number should the European Border and Coast Guards grow over time?",["10 000","20 000","50 000","30 000"],3,"Section 3 states the Commission will propose to reinforce Frontex and that the European Border and Coast Guards should triple to 30 000 over time.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0530",0,0,12,"COM(2025) 148, Section 3, 'Strengthening border security'",1,"By when does ProtectEU foresee Frontex having access to robust EU Earth-Observation governmental services for border control?",["2025","2026","2027","2030"],2,"Section 3 refers to access to robust EU Earth-Observation governmental services for border control to be deployed by 2027.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0531",0,0,12,"COM(2025) 148, Section 3, 'Strengthening border security'",2,"According to ProtectEU, in relation to which category of persons should a reinforced Frontex in particular strengthen its support to Member States with returns?",["Unaccompanied minors","Third-country nationals posing a security risk","Beneficiaries of temporary protection","Persons resettled under the Union Framework"],1,"Section 3 says Frontex should reinforce its support to returns, in particular in relation to third-country nationals posing a security risk.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0532",0,0,12,"COM(2025) 148, Section 3, 'EU agencies and bodies for internal security' and footnote 10",2,"ProtectEU calls for swift mutual information exchange between Europol and Frontex, following up on which document?",["The Joint Statement of January 2024","The Memorandum of Understanding of 2016","The Council Decision of 2021 on Europol-Frontex cooperation","The 2019 Frontex Regulation working arrangement annex"],0,"Section 3 refers to following up on the Europol-Frontex Joint Statement of January 2024 (signed 31.1.2024).","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0533",0,0,12,"COM(2025) 148, Section 3, 'EU agencies and bodies for internal security'",1,"Under ProtectEU, which agency is described as having a central role in ensuring secure storage and availability of data for information exchange between agencies?",["ENISA","CEPOL","eu-LISA","Frontex"],2,"Section 3 states that eu-LISA has a central role in ensuring secure storage and availability of data.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0534",0,0,12,"COM(2025) 148, Section 3, 'EU agencies and bodies for internal security'",2,"According to ProtectEU, against whose information has the EU Anti-Money Laundering Authority (AMLA) been empowered to crossmatch data on a hit/no-hit basis?",["Europol, the EPPO, Eurojust and OLAF","Frontex, eu-LISA, Europol and ENISA","National FIUs, Interpol, the ECB and the EBA","Eurojust, CEPOL, Frontex and the EUAA"],0,"Section 3: AMLA can crossmatch information on a hit/no-hit basis against information made available by Europol, the EPPO, Eurojust and the EU Anti-Fraud Office.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0535",0,0,12,"COM(2025) 148, Section 3, 'Critical Communication'",1,"On which three strategic pillars should the proposed European Critical Communication System (EUCCS) be based?",["Interoperability, end-to-end encryption and redundancy","Operational mobility, strong resilience and strategic autonomy","Speed of deployment, territorial coverage and affordability","Political sovereignty, competitiveness and sustainability"],1,"Section 3 states the aim is for the EUCCS to be based on operational mobility, strong resilience and strategic autonomy, with coverage extended through IRIS².","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0536",0,0,12,"COM(2025) 148, Section 3, 'Lawful access to data'",1,"According to ProtectEU, approximately what share of criminal investigations rely on access to digital information?",["Around 50%","Around 85%","Around 65%","Around 95%"],1,"Section 3 states that around 85% of criminal investigations now rely on law enforcement's ability to access digital information.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0537",0,0,12,"COM(2025) 148, Section 3, 'Lawful access to data'",1,"From when, according to ProtectEU, will the EU electronic evidence rules apply fully?",["January 2025","August 2026","June 2026","December 2027"],1,"Section 3 mentions electronic evidence rules (Regulation (EU) 2023/1543) that will apply fully from August 2026.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0538",0,0,12,"COM(2025) 148, Section 3, Key actions",1,"In which year does ProtectEU plan to present a Technology Roadmap on encryption for lawful access to data?",["2025","2026","2027","2030"],1,"The key actions of Section 3 list a Technology Roadmap on encryption in 2026, after the 2025 Roadmap on lawful access and data-retention impact assessment.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0539",0,0,12,"COM(2025) 148, Section 3, 'Operational cooperation'",0,"Which EMPACT cycle does ProtectEU identify as an opportunity to strengthen the framework against serious and organised crime?",["2022-2025","2025-2028","2026-2029","2027-2030"],2,"Section 3 states that the next EMPACT cycle 2026-2029 presents an opportunity to strengthen the framework.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0540",0,0,12,"COM(2025) 148, Section 3, 'Operational cooperation'",2,"According to ProtectEU, which data categories will the Prüm II Regulation allow to be exchanged automatically through EU routers?",["Passenger name records, API data, visa application data and travel histories","Bank account data, crypto-wallet data, tax records and company register entries","Telephone metadata, IP addresses, e-mail content and geolocation data","Fingerprints, DNA profiles, vehicle registration data, facial images, police records"],3,"Section 3 says Prüm II enables secure automated exchanges of fingerprints, DNA profiles, vehicle registration data, facial images and police records through EU routers.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0541",0,0,12,"COM(2025) 148, Section 3, 'Operational cooperation'",0,"Which agency does ProtectEU identify as the EU agency for law enforcement training?",["Europol","Frontex","CEPOL","Eurojust"],2,"Section 3 states that the Commission will rely on CEPOL as the EU agency for law enforcement training.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0542",0,0,12,"COM(2025) 148, Section 3, 'Strengthening border security'",1,"According to ProtectEU, what enhancement of the Schengen Information System (SIS) is planned for 2026?",["Alerts on third-country nationals linked to terrorism or serious crime, based on third-country data shared with Europol","Allowing alerts on EU citizens who overstay in another Member State, based on data from the Entry/Exit System","Merging SIS with the Visa Information System into a single database managed by Frontex at the external borders","Transferring the operational management of SIS from eu-LISA to Europol, to allow direct alerts by its analysts"],0,"Section 3 states SIS is to be enhanced in 2026 so Member States can enter alerts on third-country nationals involved in terrorism and other serious crimes based on third-country data shared with Europol.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0543",0,0,12,"COM(2025) 148, Section 3, 'Strengthening border security' and footnote 23",1,"Which interoperability component does ProtectEU say will improve authorities' ability to identify individuals using multiple identities?",["The European Search Portal (ESP)","The shared Biometric Matching Service (sBMS)","The multiple identity detector (MID)","The ETIAS watchlist"],2,"Section 3: the multiple identity detector (MID), once operational, will improve national authorities' ability to identify individuals using multiple identities and counter identity fraud.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0544",0,0,12,"COM(2025) 148, Section 4, 'Cybersecurity'",1,"What cybersecurity skills gap does ProtectEU say must be closed?",["99 000 people","150 000 people","500 000 people","299 000 people"],3,"Section 4 states implementation requires closing the current cybersecurity skills gap of 299 000 people.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0545",0,0,12,"COM(2025) 148, Section 4, 'Technological sovereignty'",2,"Under ProtectEU, by when at the latest should Member States ensure quantum-safe encryption for high-risk cases in critical entities?",["End of 2026","End of 2028","End of 2030","End of 2035"],2,"Section 4 states Member States should ensure quantum-safe encryption for high-risk cases as soon as possible and no later than the end of 2030.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0546",0,0,12,"COM(2025) 148, Section 4, 'Countering weaponisation of migration'",0,"Which state does ProtectEU identify as having weaponised migration towards the EU's external borders with the aid and decisive support of Belarus?",["Türkiye","Libya","Iran","Russia"],3,"Section 4 states that Russia, with the aid and decisive support of Belarus, has purposefully weaponised migration.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0547",0,0,12,"COM(2025) 148, Section 4, 'Countering weaponisation of migration'",1,"According to ProtectEU, which measures can the Council's sanctions framework impose on individuals and organisations involved in the weaponisation of migration?",["Asset freezes and travel bans","Criminal prosecution before the EPPO","Suspension of their Schengen visas only","Exclusion from EU public procurement only"],0,"Section 4 refers to the framework to sanction those involved in actions like Russia's weaponisation of migration by imposing asset freezes and travel bans.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0548",0,0,12,"COM(2025) 148, Section 4, 'Critical infrastructure'",1,"Under ProtectEU, in which region will the first regional hub for integrated surveillance of submarine cables be developed?",["Mediterranean","Black Sea","North Sea/Atlantic","Nordic/Baltic"],3,"Section 4 says the Commission will develop integrated surveillance per sea basin, starting with a Nordic/Baltic regional hub.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0549",0,0,12,"COM(2025) 148, Section 1 and Section 5, 'Fighting serious crimes'",2,"According to ProtectEU, what share of the EU's most dangerous criminal networks are involved in violent drug trafficking?",["One quarter","One third","Two thirds","Half"],3,"Section 5 states that half of the EU's most dangerous criminal networks are involved in violent drug trafficking.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0550",0,0,12,"COM(2025) 148, Section 5, 'Fighting serious crimes'",1,"In ProtectEU, with which agencies will the Commission lead efforts through the Global Alliance to Counter Migrant Smuggling?",["EUAA, eu-LISA and the FRA","CEPOL, ENISA and the EUDA","Europol, Eurojust and Frontex","OLAF, the EPPO and the AMLA"],2,"Section 5 states the Commission will lead efforts through the new Global Alliance to Counter Migrant Smuggling, in cooperation with Europol, Eurojust and Frontex.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0551",0,0,12,"COM(2025) 148, Section 5, Key actions",0,"Which period will the renewed EU Strategy on combatting trafficking in human beings announced in ProtectEU cover?",["2021-2025","2026-2030","2025-2029","2027-2031"],1,"Section 5 announces a renewed EU Strategy on combatting trafficking in human beings (2026-2030).","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0552",0,0,12,"COM(2025) 148, Section 6, 'Foreign terrorist fighters'",1,"According to ProtectEU, which tool developed by Frontex supports border control authorities in identifying suspicious travel by potential foreign terrorist fighters?",["The Common Risk Indicators (CRIs)","The Common Integrated Risk Analysis Model (CIRAM)","The European Judicial Counter-terrorism Register","The Europol Tool Repository"],0,"Section 6 states that the Common Risk Indicators developed by Frontex will continue supporting border authorities to assess risks of suspicious travel by potential foreign terrorist fighters.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0553",0,0,12,"COM(2025) 148, Section 6, Key actions and footnote 83",1,"Under ProtectEU, Member States are urged to conduct mandatory systematic checks on all persons at EU external borders in full compliance with which instruments?",["The Return Directive and the recast Eurodac Regulation","The Schengen Borders Code and the Screening Regulation","The PNR Directive and the two API Regulations","The Visa Code and the ETIAS Regulation"],1,"Section 6 urges enhanced biometric and mandatory systematic checks at external borders; footnote 83 specifies full compliance with the Schengen Borders Code and Screening Regulation.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0554",0,0,12,"COM(2025) 148, Section 7, 'Regional cooperation'",1,"According to ProtectEU, which organisation should the EU support to become the regional equivalent of Europol in the Americas?",["CLASI","CARICOM IMPACS","MAOC-N","AMERIPOL"],3,"Section 7 states the EU will further support the development of AMERIPOL to become the regional equivalent of Europol.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0555",0,0,12,"COM(2025) 148, Section 7, Key actions",1,"Under ProtectEU, by when should the Commission, with the High Representative, coordinate joint inspections in third country ports?",["2027","2025","2026","2030"],0,"The Section 7 key actions provide for coordinating joint inspections in third country ports by 2027.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A52025DC0148"],["Q0556",0,2,13,"Section 'FRONTEX: The European Border and Coast Guard Agency'",0,"Where is Frontex, the European Border and Coast Guard Agency, located?",["Brussels (Belgium)","Vienna (Austria)","Valletta (Malta)","Warsaw (Poland)"],3,"The DG HOME agencies page states that FRONTEX is located in Warsaw (Poland).","https://home-affairs.ec.europa.eu/agencies_en"],["Q0557",0,2,13,"Section 'Europol: The European Union Agency for Law Enforcement Cooperation'",0,"Where is Europol located?",["The Hague (The Netherlands)","Strasbourg (France)","Brussels (Belgium)","Luxembourg City (Luxembourg)"],0,"The agencies page states that Europol is located in The Hague (The Netherlands).","https://home-affairs.ec.europa.eu/agencies_en"],["Q0558",0,2,13,"Section 'CEPOL: The European Union Agency for Law Enforcement Training'",0,"Where is CEPOL, the EU Agency for Law Enforcement Training, located?",["Bratislava (Slovakia)","Budapest (Hungary)","Prague (Czechia)","Warsaw (Poland)"],1,"The agencies page states that CEPOL is located in Budapest (Hungary).","https://home-affairs.ec.europa.eu/agencies_en"],["Q0559",0,2,13,"Section 'EUDA: The European Union Drugs Agency'",0,"Where is the European Union Drugs Agency (EUDA) located?",["Madrid (Spain)","Athens (Greece)","Lisbon (Portugal)","The Hague (The Netherlands)"],2,"The agencies page states that the EUDA is located in Lisbon (Portugal).","https://home-affairs.ec.europa.eu/agencies_en"],["Q0560",0,2,13,"Section 'EUAA: The European Union Agency for Asylum'",0,"Where is the European Union Agency for Asylum (EUAA) located?",["Nicosia (Cyprus)","Rome (Italy)","Athens (Greece)","Valletta (Malta)"],3,"The agencies page states that EUAA is located in Valletta (Malta).","https://home-affairs.ec.europa.eu/agencies_en"],["Q0561",0,2,13,"Section 'eu-LISA'",1,"Where are eu-LISA's headquarters and its operational management located?",["Headquarters in Tallinn (Estonia); operational management in Strasbourg (France)","Headquarters in Strasbourg (France); operational management in Tallinn (Estonia)","Headquarters in Riga (Latvia); operational management in Luxembourg","Headquarters in Tallinn (Estonia); operational management in Brussels (Belgium)"],0,"The page states that eu-LISA's headquarters is in Tallinn (Estonia), while operational management is carried out in Strasbourg (France).","https://home-affairs.ec.europa.eu/agencies_en"],["Q0562",0,2,13,"Section 'Europol'",1,"According to DG HOME, how does Europol differ from national police forces?",["It can arrest suspects only in cross-border cases","It does not have any autonomous investigative or coercive powers","It can open investigations without the consent of Member States","It has exclusive competence for terrorism cases"],1,"The page states that, unlike national police forces, Europol does not have any autonomous investigative or coercive powers.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0563",0,2,13,"Section 'eu-LISA'",0,"For which large-scale IT systems does eu-LISA perform the operational management tasks, as listed by DG HOME?",["SIENA, ECRIS and PNR","ETIAS, SIENA and Europol Information System","EUROSUR, JORA and SIS","SIS, VIS and EURODAC"],3,"The page states that eu-LISA fulfils the operational management tasks for the Schengen Information System, Visa Information System and EURODAC.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0564",0,2,13,"Section 'eu-LISA'",1,"According to DG HOME, what availability must eu-LISA ensure for the IT systems it manages?",["Functioning 24 hours a day, seven days a week","Functioning during national office hours only","Functioning 99% of working days","Functioning on demand during crisis situations"],0,"eu-LISA ensures that the systems are kept functioning 24 hours a day, seven days a week for continuous exchange of data.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0565",0,2,13,"Section 'FRONTEX'",1,"According to DG HOME, what is the purpose of the vulnerability assessments carried out by Frontex?",["To assess the individual vulnerability of asylum applicants arriving at the external borders","To evaluate each Member State's capacity and readiness to face challenges at its external borders","To evaluate the cybersecurity of the national border IT systems connected to SIS and VIS","To rank third countries by migration risk for the purposes of visa liberalisation decisions"],1,"The page states Frontex carries out vulnerability assessments to evaluate the capacity and readiness of each Member State to face challenges at its external borders.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0566",0,2,13,"Section 'FRONTEX'",1,"According to DG HOME, in cooperation with which bodies does Frontex support Member States to detect and prevent organised cross-border crime and terrorism?",["The EUAA and eu-LISA","CEPOL and the EUDA","Europol and Eurojust","OLAF and the EPPO"],2,"The page states Frontex support may include – in cooperation with Europol and Eurojust – detecting and preventing organised cross-border crime and terrorism.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0567",0,2,13,"Section 'FRONTEX'",1,"According to DG HOME, how does Frontex relate to national authorities carrying out coast guard functions?",["It replaces them in territorial waters","It commands them during joint operations at sea","It supports them, together with other EU agencies","It has no role in relation to coast guard functions"],2,"The page states Frontex supports – together with other EU agencies – national authorities of the Member States carrying out coast guard functions.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0568",0,2,13,"Section 'FRONTEX'",1,"According to DG HOME, Frontex promotes, coordinates and develops European border management in line with which two references?",["The 1951 Geneva Refugee Convention and the Dublin system of responsibility","The EU fundamental rights charter and the concept of Integrated Border Management","The Schengen Borders Code and the Return Directive, without other references","The UN Convention on the Law of the Sea and the International SAR Convention"],1,"The page states Frontex works in line with the EU fundamental rights charter and the concept of Integrated Border Management.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0569",0,2,13,"Section 'FRONTEX'",0,"According to DG HOME, which persons does Frontex assist Member States in returning?",["People who have exhausted all legal avenues to legitimise their stay in the EU","All asylum applicants whose applications are still pending at first instance","Beneficiaries of temporary protection whose protection status has expired","EU citizens expelled from another Member State on public policy grounds"],0,"Frontex assists EU countries in returns of people who have exhausted all legal avenues to legitimise their stay within the EU.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0570",0,2,13,"Section 'EUDA'",1,"Which four main actions structure the EUDA's contribution to EU preparedness on drugs?",["Prevent, Detect, Prosecute, Treat","Monitor, Report, Advise, Train","Anticipate, Alert, Respond, Learn","Identify, Assess, Mitigate, Recover"],2,"The page lists the EUDA's four main actions: Anticipate, Alert, Respond and Learn.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0571",0,2,13,"Section 'Related links' and 'EUDA'",2,"The European Union Drugs Agency (EUDA) is the successor of which agency, whose founding Regulation is still linked on the DG HOME agencies page?",["EUROJUST","ECDC","EMSA","EMCDDA"],3,"The page's related links refer to the Regulation on the EMCDDA (European Monitoring Centre for Drugs and Drug Addiction), the agency that became the EUDA.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0572",0,2,13,"Section 'EUAA'",1,"Which of the following tasks is attributed to the EUAA on the DG HOME agencies page?",["Regularly preparing country of origin information reports","Operating the Eurodac central system","Carrying out vulnerability assessments of external borders","Coordinating return operations"],0,"The page states the EUAA acts as an independent centre of expertise on asylum, draws up an annual report and regularly prepares country of origin information reports.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0573",0,2,13,"Section 'CEPOL'",1,"How does CEPOL deliver its mission according to DG HOME?",["It directly employs and deploys all national police instructors across the EU","It accredits national police academies as EU bodies under its own regulation","It conducts joint cross-border investigations as part of its training activities","It brings together a network of law enforcement training institutes in EU countries"],3,"CEPOL brings together a network of training institutes for law enforcement officials in EU countries and supports them in providing training.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0574",0,2,13,"Introductory paragraph",2,"Besides the six decentralised agencies, which executive agency does DG HOME work with?",["The European Health and Digital Executive Agency (HaDEA)","The Research Executive Agency (REA)","The European Research Council Executive Agency (ERCEA)","The European Climate, Infrastructure and Environment Executive Agency (CINEA)"],1,"The page states DG HOME works with 6 decentralised agencies (CEPOL, EUAA, EUDA, eu-LISA, Europol, Frontex) and the Research Executive Agency (REA).","https://home-affairs.ec.europa.eu/agencies_en"],["Q0575",0,2,13,"Section 'eu-LISA'",2,"Besides operational management, which other responsibilities of eu-LISA are listed by DG HOME?",["Issuing alerts in SIS on behalf of Member States and verifying the content of each alert","Deciding on short-stay visa applications through VIS on behalf of the consulates concerned","Adopting security measures and ensuring data security, integrity and data protection compliance","Supervising national data protection authorities and handling complaints from data subjects"],2,"The page states eu-LISA's other responsibilities include adopting the necessary security measures and ensuring data security and integrity and compliance with data protection rules.","https://home-affairs.ec.europa.eu/agencies_en"],["Q0576",0,3,14,"SR Art. 11",0,"Under the EU Staff Regulations, from whom may an official neither seek nor take instructions?",["Any government, authority, organisation or person outside his institution","Only the government of the Member State of which he is a national, when acting officially","Only third-country governments and international organisations","Any person other than the Appointing Authority, including his own hierarchical superiors"],0,"Art. 11 SR requires officials to act solely with the interests of the Union in mind and to neither seek nor take instructions from any government, authority, organisation or person outside their institution.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0577",0,3,14,"SR Art. 11",1,"Under Article 11 of the EU Staff Regulations, an official may accept a gift or payment from an outside source without the Appointing Authority's permission only in which case?",["Gifts of symbolic value below EUR 150 offered by the government of a Member State","Honours and decorations awarded by the Member State of which the official is a national","Payments received for lectures and publications produced during periods of annual leave","Services rendered before appointment or during special leave for military or national service"],3,"Art. 11 SR excepts only services rendered before appointment or during special leave for military or other national service, and in respect of such service.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0578",0,3,14,"SR Art. 11a(2)",0,"Under the EU Staff Regulations, what must an official do if, in the performance of his duties, he has to deal with a matter in which he has a personal interest such as to impair his independence?",["Deal with the matter and record the interest in the file","Inform the Staff Committee within 30 days","Immediately inform the Appointing Authority","Request an opinion from the European Ombudsman"],2,"Art. 11a(2) SR requires the official to immediately inform the Appointing Authority, which may take any appropriate measure, including relieving him of responsibility for the matter.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0579",0,3,14,"SR Art. 12a(3)",1,"Under Article 12a of the EU Staff Regulations, 'psychological harassment' is defined as improper conduct that is:",["Any single act perceived as offensive by a colleague, regardless of the intention or frequency behind it","Repetitive or systematic over a period, intentional, and liable to undermine a person's dignity or integrity","Conduct relating to sex which is unwanted by the person to whom it is directed and offends that person","Any disagreement between a manager and a subordinate regarding work allocation or performance targets"],1,"Art. 12a(3) SR defines psychological harassment as improper conduct over a period, repetitive or systematic, intentional, which may undermine the personality, dignity or physical or psychological integrity of any person.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0580",0,3,14,"SR Art. 12b(1)",0,"Under Article 12b of the EU Staff Regulations, an official wishing to engage in an outside activity must first obtain the Appointing Authority's permission:",["Only if the activity is paid","Whether the activity is paid or unpaid","Only if the activity takes place during working hours","Only if the activity is carried out outside the European Union"],1,"Art. 12b(1) SR requires prior permission of the Appointing Authority for any outside activity, whether paid or unpaid, or any assignment outside the Union.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0581",0,3,14,"SR Art. 12b(1)",1,"Under Article 12b of the EU Staff Regulations, on what grounds may permission to engage in an outside activity be refused?",["Only if it would interfere with the official's duties or is incompatible with the institution's interests","Whenever the Appointing Authority considers the activity unnecessary for the official's career development","Only if the activity generates income above an annual ceiling set by the Staff Committee of the institution","Only if the activity is exercised for a company or association established in a third country"],0,"Under Art. 12b(1) SR permission shall be refused only if the activity interferes with the performance of the official's duties or is incompatible with the interests of the institution.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0582",0,3,14,"SR Art. 15(1)",1,"Under Article 15 of the EU Staff Regulations, when an official intends to stand for public office, which of the following is one of the decisions the Appointing Authority may take?",["Suspend him with full remuneration for the electoral period","Require him to resign from the service before the election","Place him on non-active status until the results are known","Authorise him to discharge his duties on a part-time basis"],3,"Art. 15(1) SR lets the Appointing Authority require leave on personal grounds, grant annual leave, authorise part-time work or allow him to continue as before.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0583",0,3,14,"SR Art. 16",0,"Under Article 16 of the EU Staff Regulations, officials intending to engage in an occupational activity within what period after leaving the service must inform their institution?",["Six months","One year","Two years","Five years"],2,"Art. 16 SR requires officials intending to engage in an occupational activity within two years of leaving the service to inform their institution using a specific form.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0584",0,3,14,"SR Art. 16",2,"Under Article 16 of the EU Staff Regulations, within what period must the Appointing Authority notify its decision on a former official's declared post-service activity, and what is the effect of silence?",["15 working days; silence is deemed implicit refusal","Two months; silence is deemed implicit refusal","30 working days; silence is deemed implicit acceptance","60 calendar days; silence suspends the activity pending a decision"],2,"Art. 16 SR: the Appointing Authority, after consulting the Joint Committee, notifies its decision within 30 working days; absent notification, this is deemed implicit acceptance.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0585",0,3,14,"SR Art. 16",1,"Under Article 16 of the EU Staff Regulations, for how long after leaving the service shall former senior officials in principle be prohibited from lobbying staff of their former institution on matters for which they were responsible?",["6 months","12 months","24 months","36 months"],1,"Art. 16 SR provides that former senior officials shall in principle be prohibited, during the 12 months after leaving the service, from lobbying or advocacy vis-a-vis staff of their former institution on matters they were responsible for in their last three years.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0586",0,3,14,"SR Art. 17",0,"Under Article 17 of the EU Staff Regulations, the obligation to refrain from unauthorised disclosure of information received in the line of duty:",["Continues to bind the official after leaving the service","Ends on the day the official leaves the service","Applies only to information classified as EU SECRET or above","Lapses five years after the information was received"],0,"Art. 17(2) SR states that an official shall continue to be bound by the non-disclosure obligation after leaving the service.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0587",0,3,14,"SR Art. 17a(2)",1,"Under Article 17a of the EU Staff Regulations, an official who intends to publish a matter dealing with the work of the Union must inform the Appointing Authority in advance. What happens if no decision is notified within 30 working days?",["The publication is deemed to have been refused by the institution","The matter is automatically referred to the Joint Committee","The official must wait for an express written authorisation","The Appointing Authority is deemed to have had no objections"],3,"Art. 17a(2) SR provides that if no decision is notified within 30 working days of receipt, the Appointing Authority is deemed to have had no objections.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0588",0,3,14,"SR Art. 19",2,"Under Article 19 of the EU Staff Regulations, an official needs the Appointing Authority's permission to disclose in legal proceedings information known by reason of his duties. In which case does this requirement NOT apply?",["When giving evidence before any national criminal court of the Member State of nationality","When the information concerns a matter closed by the institution more than five years earlier","When the official has already left the service of the institution and receives a pension","When testifying before the Court of Justice of the EU or a Disciplinary Board about a servant"],3,"Art. 19 SR excludes from the permission requirement evidence given before the Court of Justice of the EU or the Disciplinary Board of an institution on a matter concerning a servant or former servant.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0589",0,3,14,"SR Art. 21a(1)",1,"Under Article 21a of the EU Staff Regulations, if an official considers an order irregular and his immediate superior confirms it, what should the official do if he believes the confirmation is not a reasonable response?",["Refuse to execute the order and lodge a complaint directly with the Court of Justice","Report the matter directly to the European Ombudsman","Refer the question in writing to the hierarchical authority immediately above","Request the Staff Committee to suspend the order"],2,"Art. 21a(1) SR requires the official to refer the question in writing to the hierarchical authority immediately above the immediate superior.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0590",0,3,14,"SR Art. 21a(1)-(2)",1,"Under Article 21a of the EU Staff Regulations, an official must carry out orders confirmed in writing by the higher hierarchical authority unless they are:",["Contrary to the official's personal political convictions","Manifestly illegal or in breach of the relevant safety standards","Not approved in advance by the Staff Committee of the institution","Outside the official's job description as set out in the vacancy notice"],1,"Art. 21a SR obliges the official to carry out confirmed orders unless they are manifestly illegal or constitute a breach of the relevant safety standards.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0591",0,3,14,"SR Art. 22a(1)",0,"Under Article 22a of the EU Staff Regulations, an official who becomes aware of facts suggesting possible fraud or corruption detrimental to the Union's interests may inform, among others:",["The European Anti-Fraud Office (OLAF) directly","The national press of his Member State","Europol's European Financial and Economic Crime Centre","The European Data Protection Supervisor"],0,"Art. 22a(1) SR allows reporting to the immediate superior, the Director-General, the Secretary-General or equivalent, or OLAF direct, in writing and without delay.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0592",0,3,14,"SR Art. 22a(3)",1,"Under Article 22a of the EU Staff Regulations, a whistleblowing official is protected against prejudicial effects on the part of the institution provided that he:",["Acted reasonably and honestly","Proves that the reported facts are true","Reported within 30 days of discovering the facts","Obtained the prior consent of his Director-General"],0,"Art. 22a(3) SR protects the official from prejudicial effects provided he acted reasonably and honestly.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0593",0,3,14,"SR Art. 22b(1)",1,"Under Article 22b of the EU Staff Regulations, to which of the following may an official further disclose information on serious irregularities while remaining protected, if the conditions are met?",["A national member of parliament","A journalist of the official's choice","The ambassador of his Member State","The European Ombudsman"],3,"Art. 22b(1) SR covers further disclosure to the President of the Commission, the Court of Auditors, the Council or the European Parliament, or to the European Ombudsman.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0594",0,3,14,"SR Art. 22b(1)(b)",2,"Under Article 22b of the EU Staff Regulations, an official who first reported to OLAF or his institution must be informed of the period allowed to take appropriate action within what time?",["15 working days","30 days","60 days","Four months"],2,"Art. 22b(1)(b) SR provides that the official shall be duly informed of that period of time within 60 days.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0595",0,3,14,"SR Art. 22b(1)",1,"Under Article 22b of the EU Staff Regulations, which is a condition for protection when an official discloses information to the President of the European Parliament?",["He first obtained written authorisation from the Appointing Authority of his institution","He first disclosed it to OLAF or his institution and allowed the period set for action","He disclosed it simultaneously to the press and to OLAF, so as to ensure transparency","He waited at least one year after the facts occurred before making any disclosure"],1,"Art. 22b(1)(a)-(b) SR requires an honest and reasonable belief that the information is substantially true and prior disclosure to OLAF or the institution with the set period allowed to run.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0596",0,3,14,"SR Art. 23",0,"Under Article 23 of the EU Staff Regulations, the privileges and immunities enjoyed by officials are accorded:",["Primarily for the personal protection of officials","Solely in the interests of the Union","In the interests of the official's Member State","To exempt officials from national police regulations"],1,"Art. 23 SR states privileges and immunities are accorded solely in the interests of the Union and do not exempt officials from private obligations or laws and police regulations.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0597",0,3,14,"SR Art. 24",0,"Under Article 24 of the EU Staff Regulations, the 'duty of assistance' means that the Union shall assist an official in particular:",["In proceedings against persons threatening, insulting or attacking him because of his position","In any private civil dispute with neighbours or relatives that is unrelated to his duties","In paying fines imposed by national courts for traffic offences committed during private travel","In disputes concerning private real estate he owns abroad, regardless of the link to his duties"],0,"Art. 24 SR obliges the Union to assist officials, in particular in proceedings against anyone perpetrating threats, insulting or defamatory acts or attacks by reason of the official's position or duties.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0598",0,3,14,"SR Art. 24b",0,"Under Article 24b of the EU Staff Regulations, officials are entitled to:",["Strike without notice at any time and without any deduction from their remuneration","Elect the Appointing Authority of their institution by secret ballot every five years","Veto any amendment to the Staff Regulations through their staff associations","Exercise the right of association, e.g. by joining trade unions or staff associations"],3,"Art. 24b SR gives officials the right of association, in particular to be members of trade unions or staff associations of European officials.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0599",0,3,14,"SR Art. 26",1,"Under Article 26 of the EU Staff Regulations, an official's personal file shall contain no reference to:",["His annual reports on ability, efficiency and conduct in the service","Documents concerning his administrative status and his career history","His political, trade union, philosophical or religious activities and views","His own comments on the reports and documents already filed in it"],2,"Art. 26 SR excludes from the personal file any reference to political, trade union, philosophical or religious activities and views, racial or ethnic origin or sexual orientation.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0600",0,3,14,"SR Art. 26",0,"Under Article 26 of the EU Staff Regulations, how many personal files may exist for each official?",["One per institution in which he has served","One per place of employment","Only one","One administrative and one disciplinary file"],2,"Art. 26 SR states that there shall be only one personal file for each official.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0601",0,3,14,"SR Art. 5(1)",0,"Under Article 5 of the EU Staff Regulations, into which function groups are the posts of officials classified?",["A, B, C and D","AD, AST and AST/SC","I, II, III and IV","AD, AST, CA and SNE"],1,"Art. 5(1) SR classifies posts into an administrators' (AD), an assistants' (AST) and a secretaries and clerks' (AST/SC) function group.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0602",0,3,14,"SR Art. 5(2)",1,"Under Article 5 of the EU Staff Regulations, how many grades do function groups AD, AST and AST/SC comprise respectively?",["Twelve, eleven and six","Sixteen, eleven and six","Twelve, nine and four","Ten, eight and five"],0,"Art. 5(2) SR: AD comprises twelve grades, AST eleven grades and AST/SC six grades.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0603",0,3,14,"SR Art. 31(2)",1,"Under Article 31 of the EU Staff Regulations (without prejudice to Article 29(2)), at which grades may officials be recruited?",["SC 1 to SC 6, AST 1 to AST 11 or AD 5 to AD 16","AST 1 to AST 3 or AD 5 to AD 7 only","SC 2 to SC 4, AST 3 to AST 6 or AD 7 to AD 10","SC 1 to SC 2, AST 1 to AST 4 or AD 5 to AD 8"],3,"Art. 31(2) SR restricts recruitment to grades SC 1 to SC 2, AST 1 to AST 4 or AD 5 to AD 8.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0604",0,3,14,"SR Art. 34(1)",0,"Under Article 34 of the EU Staff Regulations, how long is the probationary period officials must serve before they can be established?",["Six months","Twelve months","Three months","Nine months"],3,"Art. 34(1) SR provides that officials shall serve a nine-month probationary period before they can be established.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0605",0,3,14,"SR Art. 34(1)",1,"Under Article 34 of the EU Staff Regulations, if the probationary period is extended because of sickness, maternity leave or accident, its total length may in no circumstances exceed:",["12 months","18 months","15 months","24 months"],2,"Art. 34(1) SR states that the total length of the probationary period shall in no circumstances exceed 15 months.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0606",0,3,14,"SR Art. 34(3)",1,"Under Article 34 of the EU Staff Regulations, when must the end-of-probation report be made and within what time may the probationer comment?",["On the last day of the probationary period; comments within one month","No later than one month before expiry; comments within eight working days","Two months before expiry of probation; comments within 15 working days","One week before expiry of probation; comments within three working days"],1,"Art. 34(3) SR requires the report one month at the latest before expiry, with the right to submit written comments within eight working days.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0607",0,3,14,"SR Art. 34(4)",2,"Under Article 34 of the EU Staff Regulations, a dismissed probationer who has completed at least six months' but not more than one year's service (and cannot forthwith resume employment elsewhere) is entitled to compensation equal to:",["Two months' basic salary","One month's basic salary","Three months' basic salary","One-third of basic salary per month of probation"],0,"Art. 34(4) SR grants three months' basic salary for more than one year's service, two months' for at least six months' service and one month's for less than six months.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0608",0,3,14,"SR Art. 40(2)",1,"Under Article 40 of the EU Staff Regulations, what is, as a general rule, the maximum total length of leave on personal grounds over an official's entire career?",["12 years","5 years","10 years","15 years"],0,"Art. 40(2) SR limits each period to one year and the total to 12 years over the career, save the listed exceptions allowing unlimited extension.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0609",0,3,14,"SR Art. 42a",1,"Under Article 42a of the EU Staff Regulations, an official is entitled to parental leave of up to how long for every child, and within what period?",["Up to three months per child, within the first six years after birth","Up to one year per child, during the first eight years after birth","Up to six months per family, during the first three years after birth","Up to six months per child, within twelve years of birth or adoption"],3,"Art. 42a SR grants up to six months of parental leave per child, to be taken during the first twelve years after birth or adoption.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0610",0,3,14,"SR Art. 44",1,"Under Article 44 of the EU Staff Regulations, an official automatically advances to the next step in his grade after how long, unless his performance was evaluated as unsatisfactory?",["One year","Three years","Two years","Four years"],2,"Art. 44 SR provides automatic step advancement after two years at one step, unless the last annual report evaluated performance as unsatisfactory.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0611",0,3,14,"SR Art. 45(1)",1,"Under Article 45 of the EU Staff Regulations, promotion is exclusively by selection from among officials who have completed a minimum of how long in their grade?",["One year","Two years","Three years","Five years"],1,"Art. 45(1) SR: promotion is exclusively by selection among officials with at least two years in their grade, after consideration of comparative merits.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0612",0,3,14,"SR Art. 45(2)",1,"Under Article 45 of the EU Staff Regulations, what must officials demonstrate before their first promotion after recruitment?",["A university degree of at least four years","The ability to work in a third language","Completion of a management training course","Five years of professional experience in the institution"],1,"Art. 45(2) SR requires officials to demonstrate, before their first promotion after recruitment, the ability to work in a third language.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0613",0,3,14,"SR Art. 51(1)(a)",2,"Under Article 51 of the EU Staff Regulations, what happens to an official who, on the basis of three consecutive unsatisfactory annual reports, still shows no progress in professional competence?",["He shall be downgraded by one grade","He shall be dismissed immediately","He shall receive a written warning","He shall be placed on non-active status"],0,"Art. 51(1)(a) SR provides for downgrading by one grade; if the following two annual reports are still unsatisfactory, the official shall be dismissed.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0614",0,3,14,"SR Art. 55(2)",0,"Under Article 55 of the EU Staff Regulations, the normal working week ranges from:",["35 to 37.5 hours","37.5 to 40 hours","42 to 45 hours","40 to 42 hours"],3,"Art. 55(2) SR provides that the normal working week shall range from 40 to 42 hours.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0615",0,3,14,"SR Art. 56",1,"Under Article 56 of the EU Staff Regulations, the total overtime an official may be asked to work shall not exceed:",["100 hours in any year","48 hours in any month","150 hours in any six months","200 hours in any six months"],2,"Art. 56 SR limits overtime to 150 hours in any six months, and only in cases of urgency or exceptional pressure of work.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0616",0,3,14,"SR Art. 57",0,"Under Article 57 of the EU Staff Regulations, officials are entitled to annual leave of:",["At least 20 and at most 25 working days per calendar year","Exactly 30 calendar days per year, including public holidays","At least 24 and at most 30 working days per calendar year","At least 26 and at most 36 working days per calendar year"],2,"Art. 57 SR grants annual leave of not less than twenty-four nor more than thirty working days per calendar year.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0617",0,3,14,"SR Annex V, Art. 4",1,"Under Annex V to the EU Staff Regulations, where an official has not used up his annual leave for reasons other than the requirements of the service, how many days may be carried over to the following year?",["Not more than five days","Not more than twelve days","Not more than twenty days","All unused days without limit"],1,"Annex V, Art. 4 SR limits carry-over to twelve days where leave was not used for reasons other than the requirements of the service.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0618",0,3,14,"SR Art. 59(1)",0,"Under Article 59 of the EU Staff Regulations, an official on sick leave must produce a medical certificate if absent for more than:",["Three days","One day","Five days","Fourteen days"],0,"Art. 59(1) SR requires a medical certificate if the official is absent for more than three days, to be sent by the fifth day of absence at the latest.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0619",0,3,14,"SR Art. 86(1)",1,"Under Article 86 of the EU Staff Regulations, who is liable to disciplinary action for failure to comply with obligations under the Staff Regulations?",["Only serving officials, and only for failures committed intentionally","Only officials in function group AD holding managerial responsibilities","Only officials who have completed their probation and been established","An official or former official, whether acting intentionally or negligently"],3,"Art. 86(1) SR makes any failure by an official or former official, intentional or through negligence, liable to disciplinary action.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0620",0,3,14,"SR Annex IX, Art. 9(1)(c)",2,"Under Annex IX to the EU Staff Regulations, for what period may the penalty of deferment of advancement to a higher step be imposed?",["Between 15 days and one year","Between six and 36 months","Up to a maximum of six months","Between one and 23 months"],3,"Annex IX, Art. 9(1)(c) SR provides for deferment of advancement to a higher step for between one and 23 months.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0621",0,3,14,"SR Annex IX, Art. 11",1,"Under Annex IX to the EU Staff Regulations, which penalties may the Appointing Authority impose without consulting the Disciplinary Board?",["Temporary downgrading or relegation in step","Removal from post","A written warning or a reprimand","Classification in a lower function group"],2,"Annex IX, Art. 11 SR allows a written warning or reprimand without consulting the Board, after hearing the official.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0622",0,3,14,"SR Annex IX, Art. 9(3)",0,"Under Annex IX to the EU Staff Regulations, how many disciplinary penalties may a single case of misconduct give rise to?",["Up to two, if the misconduct was intentional","Not more than one","Up to three, at the Board's discretion","As many as the Appointing Authority deems appropriate"],1,"Annex IX, Art. 9(3) SR states that a single case of misconduct shall not give rise to more than one disciplinary penalty.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0623",0,3,14,"SR Annex IX, Art. 13(2)",1,"Under Annex IX to the EU Staff Regulations, how long does an official have, at minimum, from receipt of the report initiating proceedings before the Disciplinary Board to prepare a defence?",["Not less than 15 days","Not less than 8 working days","Not less than 30 days","Not less than two months"],0,"Annex IX, Art. 13(2) SR gives the official not less than 15 days from receipt of the report to prepare a defence.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:01962R0031-20200101"],["Q0624",0,3,14,"SR Annex IX, Art. 24(2)",1,"Under Annex IX to the EU Staff Regulations, within what period must the situation of a suspended official be definitively settled?",["Six months from the date the suspensio
