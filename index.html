 operating the EES?",["Separately for each entry into the Schengen area","As a single period only for holders of multiple-entry visas","Separately for each Member State operating the EES","As a single period for all Member States operating the EES"],3,"Art. 6(1a) provides that the period is calculated as a single period for Member States operating the EES and separately for each Member State not operating it.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0365",0,0,9,"Art. 6(2)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), how are the dates of entry and exit treated for calculating the duration of stay?",["The date of entry is counted as a day of stay but the date of exit is not counted","The day after entry is the first day and the day before exit is the last day of stay","The date of entry is the first day and the date of exit the last day of stay","Only full 24-hour periods spent on the territory are counted as days of stay"],2,"Art. 6(2) considers the date of entry as the first day and the date of exit as the last day of stay.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0366",0,0,9,"Art. 6(2)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which periods are NOT taken into account in calculating the duration of a short stay?",["Periods of stay under a multiple-entry short-stay visa issued for business","Periods of stay authorised under a residence permit or a long-stay visa","Periods spent in transit at an international airport of a Member State","Periods of stay as a tourist in a Member State not yet operating the EES"],1,"Art. 6(2) excludes periods authorised under a residence permit or long-stay visa from the calculation.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0367",0,0,9,"Art. 6(3) and Annex I",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), according to Annex I, which document may support the purpose of a tourism journey as regards return?",["A return or round-trip ticket","A certificate of enrolment at a teaching institute","A bank guarantee issued by the host","An invitation from a firm to attend a conference"],0,"Annex I(c)(iii) lists a return or round-trip ticket as supporting documentation regarding return for tourism or private journeys.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0368",0,0,9,"Art. 6(4)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), by reference to what are means of subsistence to be assessed?",["The monthly minimum wage in the traveller's country of residence, pro rata per day","A single EU-wide daily amount set annually by the Commission for all Member States","The average cost of a four-star hotel in the capital of the Member State of entry","Average prices for board and lodging in budget accommodation, multiplied by days stayed"],3,"Art. 6(4) refers to average prices for board and lodging in budget accommodation multiplied by the number of days; Member States notify reference amounts.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0369",0,0,9,"Art. 6(5)(a)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), a third-country national who does not fulfil all entry conditions but holds a residence permit issued by a Member State may be authorised to enter other Member States for what purpose?",["A stay of up to 30 days for tourism in any other Member State","Lodging an application for a long-stay visa in another Member State","Transit, to reach the Member State which issued the residence permit","Taking up employment in a neighbouring Member State for up to 90 days"],2,"Art. 6(5)(a) allows transit to reach the issuing Member State, unless the person is on a national alert list with instructions to refuse entry or transit.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0370",0,0,9,"Art. 6(5)(c)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), on which grounds may a Member State authorise entry of a third-country national who does not fulfil one or more entry conditions?",["Commercial interest, promotion of tourism or the principle of reciprocity","Humanitarian grounds, national interest or international obligations","Payment of a security deposit at the border covering the costs of return","Family visits, participation in sporting events or educational exchanges"],1,"Art. 6(5)(c) allows entry on humanitarian grounds, grounds of national interest or because of international obligations.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0371",0,0,9,"Art. 6a(3)(f)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), data on which of the following persons are NOT to be entered in the EES?",["Nationals of Andorra, Monaco and San Marino","Visa-exempt third-country nationals admitted for a short stay","Third-country nationals refused entry for a short stay","Family members of a Union citizen who do not hold a residence card"],0,"Art. 6a(3)(f) excludes nationals of Andorra, Monaco and San Marino and holders of Vatican passports from EES registration.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0372",0,0,9,"Art. 7(1)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what must border guards fully respect in the performance of their duties, in particular in cases involving vulnerable persons?",["Commercial confidentiality","The instructions of carriers","The principle of reciprocity","Human dignity"],3,"Art. 7(1) requires border guards to fully respect human dignity, in particular for vulnerable persons, with proportionate measures.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0373",0,0,9,"Art. 7(2)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), on which of the following grounds does Article 7(2) prohibit border guards from discriminating while carrying out border checks?",["Purpose of travel","Type of visa held","Sexual orientation","Means of transport"],2,"Art. 7(2) prohibits discrimination on grounds of sex, racial or ethnic origin, religion or belief, disability, age or sexual orientation.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0374",0,0,9,"Art. 8(2)(a)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which databases must in particular be consulted when verifying the travel document of a person enjoying the right of free movement?",["The ECRIS-TCN, the SIS and the Europol Information System, consulted in that order","The SIS, Interpol's SLTD and national databases on lost, stolen or invalidated documents","The VIS, Eurodac and the EES, together with national databases on residence permits","Only the national databases of the Member State of entry and the Interpol SLTD database"],1,"Art. 8(2)(a) lists the SIS, Interpol's SLTD database and national databases on stolen, misappropriated, lost and invalidated travel documents.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0375",0,0,9,"Art. 8(2a)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), where systematic database checks on persons enjoying free movement would have a disproportionate impact on traffic flow, what may a Member State decide?",["To carry out those checks on a targeted basis at specified crossing points, after a risk assessment","To ask Frontex to carry out the database checks on its behalf for the duration of the peak","To replace systematic database checks with checks carried out by carriers before boarding","To suspend all database checks at the busiest crossing points for up to 30 days without notification"],0,"Art. 8(2a) allows targeted database checks at specified border crossing points following a risk assessment, transmitted to the Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0376",0,0,9,"Art. 8(3)(a)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what type of checks are third-country nationals subject to on entry and exit?",["Minimum checks","Random checks","Targeted checks only","Thorough checks"],3,"Art. 8(3) provides that third-country nationals shall be subject to thorough checks on entry and exit.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0377",0,0,9,"Art. 8(3)(a)(iiia)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what does the thorough check on entry include, by consulting the EES, for persons subject to EES registration?",["That the person holds travel medical insurance covering the whole stay, and that the visa fee was paid","That the person has no record in ECRIS-TCN, and that no return decision is pending in another Member State","That the maximum authorised stay is not reached or exceeded and, for one- or two-entry visas, entries respected","That an ETIAS authorisation was issued at least 96 hours before travel, and that it covers all Member States"],2,"Art. 8(3)(a)(iiia) requires verification via the EES of the maximum duration of authorised stay and of the number of authorised entries for one- or two-entry visas.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0378",0,0,9,"Art. 8(3)(b)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), if the third-country national holds a short-stay visa, which system is consulted to verify the holder's identity and the authenticity of the visa?",["Interpol's SLTD database","The Visa Information System (VIS)","The Schengen Information System (SIS)","Eurodac"],1,"Art. 8(3)(b) requires consultation of the VIS in accordance with Art. 18 of Regulation (EC) No 767/2008.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0379",0,0,9,"Art. 8(4)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what right does a third-country national have regarding the location of thorough checks?",["If facilities exist and if requested, to be checked in a private area","To choose the border guard who carries out the thorough check","To have the checks postponed until the next working day on request","To have the checks carried out only in the presence of a lawyer"],0,"Art. 8(4) provides that, where facilities exist and if requested, thorough checks shall be carried out in a private area.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0380",0,0,9,"Art. 8(5)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), a third-country national subject to a thorough second line check must be informed that he or she may request what?",["A written apology and compensation for delay if no irregularity is found during the check","The suspension of the check pending legal advice and the presence of a consular officer","A copy of the border guards' risk analysis and of the alerts consulted during the check","The name or service number of the border guards, the crossing point and the date of crossing"],3,"Art. 8(5) requires written information indicating that the person may request the name or service number of the border guards, the crossing point name and the crossing date.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0381",0,0,9,"Art. 8(9)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), of what must third-country nationals be informed at border checks under Article 8(9)?",["The data retention period of the VIS","The reference amounts of all Member States","The maximum number of days of authorised stay","The list of all border crossing points of the Member State"],2,"Art. 8(9) requires that third-country nationals be informed of the maximum number of days of authorised stay, by the border guard or via equipment allowing consultation of the web service.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0382",0,0,9,"Art. 8c",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), automated border control systems shall, to the extent possible, be designed so that they can be used by all persons with the exception of whom?",["Holders of diplomatic passports","Children under 12 years of age","Persons over 75 years of age","Minors under 18 years of age"],1,"Art. 8c provides that ABC systems should be usable by all persons except children under 12.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0383",0,0,9,"Art. 8d(2)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), for third-country nationals granted access to a national facilitation programme, which aspects of the thorough entry check may be omitted?",["Verification of the purpose and destination of the stay and of sufficient means of subsistence","Consultation of the SIS and of Interpol's Stolen and Lost Travel Documents database","Verification of identity and nationality and of the authenticity of the travel document","Verification of the visa in the VIS and of the authorised duration of stay in the EES"],0,"Art. 8d(2) allows omitting the aspects referred to in Art. 8(3)(a)(iv) and (v): purpose/destination and means of subsistence.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0384",0,0,9,"Art. 9(1)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), when may border checks at external borders be relaxed?",["During national public holidays when traffic volumes are expected to be higher than usual","Whenever a Member State's border guard staff falls below its planned level at that point","When Frontex recommends it on the basis of a vulnerability assessment of the border section","When unforeseeable events cause excessive waiting times and all resources are exhausted"],3,"Art. 9(1) allows relaxation only in exceptional and unforeseen circumstances where traffic intensity makes waiting time excessive and resources are exhausted.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0385",0,0,9,"Art. 9(2)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), who takes the decision to relax border checks?",["The Minister of the Interior of the Member State concerned","The Executive Director of Frontex, after a risk assessment","The border guard in command at the border crossing point","The European Commission, on a request of the Member State"],2,"Art. 9(2) provides that the decision to relax checks is taken by the border guard in command at the border crossing point.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0386",0,0,9,"Art. 10(2) and Annex III",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which lanes are persons enjoying the right of free movement entitled to use at border crossing points?",["Only the 'EU, EEA, CH' lanes, and never the 'all passports' lanes","'EU, EEA, CH' lanes, and also 'visa not required' and 'all passports' lanes","Only the 'all passports' lanes, unless an automated lane is available","Only automated border control lanes for EU/EEA/CH citizens"],1,"Art. 10(2) entitles them to use Part A ('EU, EEA, CH') lanes and also Part B1 and B2 lanes.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0387",0,0,9,"Annex IV point 2",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), at what maximum interval must the security codes on entry and exit stamps be changed?",["One month","One week","Three months","Six months"],0,"Annex IV point 2 requires security codes on stamps to be changed at regular intervals not exceeding one month.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0388",0,0,9,"Art. 12(1) and (3)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what is the consequence where no individual EES file exists for a third-country national present on the territory, or the record shows no exit after expiry of the authorised stay?",["The automatic issue of a national long-stay visa covering the period of irregular stay","A presumption that the person is an applicant for international protection in that State","An obligation to detain the person immediately pending the adoption of a return decision","A rebuttable presumption that the person does not fulfil the conditions of duration of stay"],3,"Art. 12(1) creates a rebuttable presumption of non-fulfilment of the duration-of-stay conditions; Art. 12(3) allows rebuttal by credible evidence such as transport tickets.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0389",0,0,9,"Art. 12(4)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), where the presumption on the duration of stay is not rebutted, under which instrument may the third-country national be returned?",["Regulation (EU) 2019/1896 (EBCG Regulation)","Regulation (EU) No 604/2013 (Dublin III Regulation)","Directive 2008/115/EC (Return Directive)","Directive 2004/38/EC (Free Movement Directive)"],2,"Art. 12(4) provides for return in accordance with Directive 2008/115/EC.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0390",0,0,9,"Art. 12a(1)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), for how long after the EES started operations must border guards also check stamps in travel documents to verify the duration of stay?",["One year","180 days","90 days","Two years"],1,"Art. 12a(1) requires border guards to take into account stamps in addition to EES data for 180 days after the EES started operations.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0391",0,0,9,"Art. 13(1)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what must happen to a person who has crossed a border illegally and has no right to stay?",["Apprehension and procedures respecting the Return Directive, without prejudice to Articles 3 and 4","An administrative fine followed by release, with an obligation to leave within 30 days","The granting of a temporary residence permit pending a decision of the Member State concerned","Immediate push-back across the border, without any individual assessment or written decision"],0,"Art. 13(1) requires apprehension and procedures respecting the Return Directive, without prejudice to Arts 3 and 4 (including non-refoulement).","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0392",0,0,9,"Art. 13(3)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what does surveillance between border crossing points make use of, to reduce the loss of lives of migrants at or near external borders?",["Advance passenger information","Visa Information System data","Local border traffic permits","Situational pictures"],3,"Art. 13(3) provides that surveillance shall make use of situational pictures to better reduce loss of lives of migrants.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0393",0,0,9,"Art. 14(2)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), how must a refusal of entry be decided?",["Orally by the border guard, with written reasons provided only if an appeal is lodged","By a written notice issued by the carrier which transported the person to the border","By a substantiated decision with precise reasons, on the Annex V Part B standard form","By a decision of a court, to be adopted within 48 hours of the person's arrival"],2,"Art. 14(2) requires a substantiated decision stating precise reasons, given via the Annex V Part B standard form, taking effect immediately.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0394",0,0,9,"Art. 14(3)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), does lodging an appeal against a refusal of entry have suspensive effect?",["Yes, it always has suspensive effect","No, it does not have suspensive effect","Yes, if it is lodged within 24 hours","Only where the person is an unaccompanied minor"],1,"Art. 14(3) states that lodging an appeal shall not have suspensive effect on a decision to refuse entry.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0395",0,0,9,"Art. 14(5)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), to whom do Member States submit yearly statistics on persons refused entry?",["The Commission (Eurostat)","The Council (SCIFA committee)","The European Parliament (LIBE)","The Frontex Situation Centre"],0,"Art. 14(5) requires yearly submission of statistics on refusals of entry to the Commission (Eurostat) under Regulation (EC) No 862/2007.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0396",0,0,9,"Annex V Part B",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), on the standard form for refusal of entry, what does ground (F) indicate?",["The person is subject to an SIS alert for the purposes of refusing entry","The person has a false, counterfeit or forged travel document","The person does not have sufficient means of subsistence for the stay","The person has already stayed 90 days in the preceding 180-day period"],3,"In Annex V Part B, reason (F) is that the person has already stayed for 90 days in the preceding 180-day period.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0397",0,0,9,"Annex V Part A point 2",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), if a third-country national refused entry was brought to the border by a carrier, what must the local authority order?",["The person to be detained at the border pending a decision of the Commission on the person's admission","The carrier to pay an administrative fine, after which the person may be released into the territory","The carrier to take charge of the person and return him or her without delay to an admitting third country","Frontex to organise a return operation at the carrier's expense within 30 days of the refusal"],2,"Annex V Part A point 2(a) requires the carrier to take charge and transport the person to an appropriate third country, in line with Art. 26 of the Schengen Convention and Directive 2001/51/EC.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0398",0,0,9,"Art. 16(1)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which specialised training must border guards' curricula include?",["Asylum adjudication, so that border guards may decide on applications at the border","Detecting and dealing with situations involving vulnerable persons, such as unaccompanied minors","Maritime search and rescue at sea for all border guards, including those at land and air borders","Customs tariff classification and the detection of goods subject to excise duties"],1,"Art. 16(1) requires curricula including specialised training on vulnerable persons such as unaccompanied minors and victims of trafficking.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0399",0,0,9,"Art. 17(2)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), who coordinates operational cooperation between Member States in the field of management of external borders?",["The European Border and Coast Guard Agency","The EU Agency for large-scale IT systems (eu-LISA)","The Council's Standing Committee on Internal Security","The European Union Agency for Law Enforcement Cooperation"],0,"Art. 17(2) provides that operational cooperation between Member States in external border management shall be coordinated by the Agency.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0400",0,0,9,"Annex VI 3.1.2",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), when must a ship's master transmit the crew and passenger lists, as a rule?",["At the latest 48 hours before arriving in the port","Upon docking in the port","At the latest 12 hours before arriving in the port","At the latest 24 hours before arriving in the port"],3,"Annex VI point 3.1.2 requires lists at the latest 24 hours before arrival, or when leaving the previous port if the voyage is shorter.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0401",0,0,9,"Annex VI 3.2.2",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what applies to a cruise ship whose itinerary comprises exclusively ports in the territory of the Member States?",["Thorough checks on all passengers and crew at each port of call within the Member States","Checks on crew members only, carried out every 24 hours on the basis of the crew list","No border checks; it may dock at ports that are not crossing points, with risk-based checks only","Exit checks at the first port of departure and entry checks at the final port of arrival"],2,"Annex VI point 3.2.2 provides that no border checks are carried out on such cruise ships, with checks only where justified by a risk assessment.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0402",0,0,9,"Annex VII point 4.3",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), before refusing entry to a holder of a diplomatic, official or service passport, what must border guards do?",["Obtain a court order confirming that the person's immunity does not apply at the border","Consult the appropriate national authorities, also where an SIS alert exists","Obtain the prior authorisation of the Commission and of the Member State of destination","Notify the embassy of the person's State, but only after the refusal has been decided"],1,"Annex VII point 4.3 states that such holders may not be refused entry without first consulting the appropriate national authorities, even with an SIS alert.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0403",0,0,9,"Annex VII point 6.2",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), in the case of accompanied minors, what must the border guard check?",["That the persons accompanying minors have parental care or legal guardianship over them","That the minor has a return ticket in his or her own name and an individual travel document","That both parents are physically present and present their own valid travel documents","That the minor holds a separate visa issued by the consulate of the Member State of destination"],0,"Annex VII point 6.2 requires checking that accompanying persons have parental care or legal guardianship, especially where only one adult accompanies the minor.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0404",0,0,9,"Annex VII point 5.2",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), how are cross-border workers well known to border guards and not revealed by an initial check to be subject of an alert checked?",["By thorough checks carried out each time they cross the external border","Only by checks carried out by their employer and reported to the border guards","They are completely exempt from any checks once registered as frontier workers","By random checks only, with thorough checks from time to time without warning"],3,"Annex VII point 5.2 provides for random checks, with thorough checks carried out from time to time, without warning and at irregular intervals.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0405",0,0,9,"Art. 21a(2)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), as amended in 2024, which institution adopts the implementing regulation providing for temporary restrictions on travel to the Member States in a large-scale public health emergency?",["Each Member State individually, after notifying the Commission","The European Parliament and the Council jointly, by co-decision","The Council, on the basis of a proposal by the Commission","The Commission, after consulting the ECDC and the Member States"],2,"Art. 21a(2) empowers the Council, on a Commission proposal, to adopt an implementing Regulation on temporary travel restrictions at external borders.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0406",0,0,9,"Art. 21a(3) and Annex XI Part A",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which category is exempted from restrictions on entry in a large-scale public health emergency regardless of the purpose of travel (Article 21a(3))?",["Holders of single-entry Schengen visas issued before the emergency","Persons enjoying the right of free movement under Union law","Tourists from visa-exempt countries holding a return ticket","Business travellers holding an invitation letter from an EU company"],1,"Art. 21a(3)(a) exempts persons enjoying free movement, and long-term residents and others with a right to reside, independent of the purpose of their travel.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0407",0,0,9,"Art. 22",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), how may internal borders be crossed?",["At any point without a border check on persons, irrespective of nationality","Only at designated crossing points, where minimum checks apply to all persons","At any point, but only by Union citizens; others must use crossing points","At any point, subject to presentation of an identity card on request"],0,"Art. 22 provides that internal borders may be crossed at any point without a border check, irrespective of nationality.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0408",0,0,9,"Art. 23(a)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), police checks in internal border areas are not considered equivalent to border checks when, among other conditions, they:",["Are carried out systematically on all persons crossing the border at the same location","Are announced to the Commission and the neighbouring Member State four weeks in advance","Are carried out only at fixed points on the border line, on a permanent basis","Do not have border control as an objective and are clearly distinct from external border checks"],3,"Art. 23(a) lists conditions including no border control objective, being based on police information, and being clearly distinct from systematic external border checks, based on a risk assessment.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0409",0,0,9,"Art. 23a(1)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), the 2024 transfer procedure for third-country nationals apprehended in internal border areas does NOT apply to which persons?",["Persons apprehended during joint police patrols of both Member States","Persons without a right to stay in the apprehending Member State","Applicants for and beneficiaries of international protection","Third-country nationals who arrived directly from the other Member State"],2,"Art. 23a(1) excludes applicants (Regulation (EU) 2024/1348) and beneficiaries of international protection (Regulation (EU) 2024/1347) from the procedure.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0410",0,0,9,"Annex XII Part A point 6",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), within what time must a transfer of a person apprehended in internal border areas take place under Article 23a?",["Within 72 hours of the apprehension","Immediately and within 24 hours at the latest","Within 7 days of the notification to the receiving State","Within 48 hours of the transfer decision"],1,"Annex XII Part A point 6 requires the transfer to take place immediately and within 24 hours at the latest.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0411",0,0,9,"Art. 25(1)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), as amended in 2024, which of the following is expressly listed as a possible serious threat justifying reintroduction of internal border control?",["Large-scale or high-profile international events","Strikes in the transport sector","A decline in the Member State's border guard staffing","Seasonal increases in tourist arrivals"],0,"Art. 25(1)(d) lists large-scale or high-profile international events, alongside terrorism and organised crime, public health emergencies and sudden large-scale unauthorised movements.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0412",0,0,9,"Art. 25(2)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), border control at internal borders may be reintroduced only as what?",["A measure decided by Frontex","A routine preventive measure","A permanent measure subject to annual review","A measure of last resort"],3,"Art. 25(2) states that border control at internal borders shall be reintroduced only as a measure of last resort.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0413",0,0,9,"Art. 25a(3)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), in the case of an unforeseeable threat requiring immediate action, for how long may border control initially remain in place, and what is the maximum total duration?",["No longer than 2 months, prolongable up to a maximum of 1 year","No longer than 30 days, prolongable up to a maximum of 6 months","No longer than 1 month, prolongable up to a maximum of 3 months","No longer than 10 days, prolongable up to a maximum of 2 months"],2,"Art. 25a(3) limits immediate reintroduction to 1 month, prolongable up to a maximum of three months.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0414",0,0,9,"Art. 25a(4)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), in the case of a foreseeable threat, at the latest how long before the planned reintroduction of internal border control must the Member State notify?",["2 weeks","4 weeks","10 days","6 weeks"],1,"Art. 25a(4) requires notification at the latest 4 weeks before the planned reintroduction (or as soon as possible if known later).","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0415",0,0,9,"Art. 25a(5)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), for a foreseeable threat, what is the maximum duration of internal border control, subject to the major exceptional situation procedure?",["2 years","6 months","3 years","1 year"],0,"Art. 25a(5) allows reintroduction for up to six months, renewable, with a maximum duration of 2 years, subject to Art. 25a(6).","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0416",0,0,9,"Art. 25a(6)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), in a major exceptional situation, after the 2-year maximum, how may internal border control be further prolonged?",["By a single additional period of up to 2 years, subject to a Commission opinion","Only by a unanimous Council decision, for a non-renewable period of up to 12 months","By successive periods of up to 1 year each, without any overall maximum duration","Up to 6 more months, then possibly a further and final additional period of up to 6 months"],3,"Art. 25a(6) allows an additional period of up to 6 months and, where needed, a further and final additional period of up to 6 months.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0417",0,0,9,"Art. 27a(3)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), when must the Commission issue an opinion on the necessity and proportionality of internal border control prolonged under Article 25a(4)?",["When the prolongation leads to 6 months of border control in total","When the border control has lasted for 2 years in total without interruption","When the prolongation leads to 12 months of border control in total","Only when a Member State directly affected by the control requests it"],2,"Art. 27a(3) requires a Commission opinion when prolongation leads to 12 months of border control in total.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0418",0,0,9,"Art. 28(2)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), for what period may a Council implementing decision authorising reintroduction of border control due to a large-scale public health emergency apply?",["Up to 30 days, renewable once for a further period of up to 30 days","Up to 6 months, renewable for further periods of up to 6 months","Up to 1 year, non-renewable, after which a new proposal is needed","Up to 3 months, renewable for further 3-month periods up to 2 years"],1,"Art. 28(2) provides for a period of up to 6 months, renewable for further periods of up to 6 months as long as the emergency persists.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0419",0,0,9,"Art. 29(1)",2,"Under the Schengen Borders Code (Regulation (EU) 2016/399), where persistent serious deficiencies in external border control put the overall functioning of the area at risk, internal border control may be reintroduced for up to six months and prolonged how many times?",["No more than three times, for further periods of up to six months","Indefinitely, for as long as the serious deficiencies persist","Only once, for a further period of up to one year in total","No more than twice, for further periods of up to three months each"],0,"Art. 29(1) provides for up to six months, prolongable no more than three times for further periods of up to six months.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0420",0,0,9,"Art. 29(2)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), under Article 29, which institution recommends that Member States reintroduce border control at internal borders?",["The European Parliament, on a proposal from the Council","The Management Board of Frontex, after a vulnerability assessment","The Commission alone, by means of an implementing act","The Council, on a proposal from the Commission"],3,"Art. 29(2) provides that the Council may, as a last resort, recommend reintroduction, on the basis of a Commission proposal.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0421",0,0,9,"Art. 33(1)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), within what time of lifting internal border control must a Member State present a report to the European Parliament, Council and Commission?",["Within 10 days","Within 6 months","Within 4 weeks","Within 3 months"],2,"Art. 33(1) requires a report within 4 weeks of the lifting of internal border control.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0422",0,0,9,"Art. 33(6)",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), what is the name of the report the Commission presents at least once per year on the functioning of the area without internal border control?",["The 'Schengen Scoreboard report'","The 'State of Schengen report'","The 'Schengen Barometer report'","The 'Annual Risk Analysis report'"],1,"Art. 33(6) requires the Commission to report at least once a year on the functioning of the area without internal border control ('State of Schengen report').","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0423",0,0,9,"Art. 43(2)",1,"Under the Schengen Borders Code (Regulation (EU) 2016/399), under the evaluation mechanism of Regulation (EU) No 1053/2013, how often is every Member State evaluated at least?",["Every five years","Every three years","Every seven years","Every two years"],0,"Art. 43(2) states that every Member State is evaluated at least every five years.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0424",0,0,9,"Art. 44",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), which Regulation did it repeal?",["Regulation (EC) No 810/2009","Regulation (EU) No 1052/2013","Regulation (EC) No 2007/2004","Regulation (EC) No 562/2006"],3,"Art. 44 repeals Regulation (EC) No 562/2006; references to it are read as references to Regulation (EU) 2016/399.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0425",0,0,9,"Art. 41",0,"Under the Schengen Borders Code (Regulation (EU) 2016/399), the special rules applying to which cities are not affected by the Regulation?",["Monaco and San Marino","Büsingen and Campione d'Italia","Ceuta and Melilla","Gibraltar and Andorra la Vella"],2,"Art. 41 states that the Regulation does not affect special rules applying to Ceuta and Melilla.","https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A02016R0399-20251012"],["Q0426",0,0,10,"Schengen area – composition",0,"According to the European Commission (DG HOME) Schengen pages, how many countries make up the Schengen area?",["26 countries: 22 EU Member States and 4 non-EU countries","27 countries: all EU Member States","29 countries: 25 EU Member States and 4 non-EU countries","30 countries: 26 EU Member States and 4 non-EU countries"],2,"The Schengen area page states that the area is composed of 29 countries: 25 EU Member States and 4 non-EU countries.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area_en"],["Q0427",0,0,10,"Schengen area – composition",0,"According to the European Commission (DG HOME) Schengen pages, which four non-EU countries are part of the Schengen area?",["Iceland, Liechtenstein, Monaco and the United Kingdom","Iceland, Norway, Switzerland and Liechtenstein","Norway, Switzerland, Monaco and San Marino","Iceland, Norway, Switzerland and Andorra"],1,"The page lists Iceland, Norway, Switzerland and Liechtenstein as the 4 non-EU Schengen countries.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area_en"],["Q0428",0,0,10,"Schengen area – enlargement",0,"According to the European Commission (DG HOME) Schengen pages, which were the last countries to join the Schengen area, on 1 January 2025?",["Bulgaria and Romania","Croatia and Bulgaria","Croatia and Cyprus","Romania and Cyprus"],0,"The Schengen area page states Bulgaria and Romania were the last countries to join, on 1 January 2025.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area_en"],["Q0429",0,0,10,"Schengen area – Cyprus and Ireland",1,"According to the European Commission (DG HOME) Schengen pages, what is the status of Ireland with regard to Schengen?",["It participates in Schengen, but internal border controls with it have not yet been lifted by the Council","It applies all Schengen rules, including the SIS, except the common visa policy and the Visa Code","It became a full Schengen member in 2023, after a successful Schengen evaluation of its external borders","It may opt out under the Schengen Protocol, but takes part in the SIS and police and judicial cooperation"],3,"The page explains Ireland's opt-out under the Schengen Protocol, while it participates in the SIS and judicial and police cooperation.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area_en"],["Q0430",0,0,10,"Schengen area – Cyprus and Ireland",1,"According to the European Commission (DG HOME) Schengen pages, what is the situation of Cyprus with regard to Schengen?",["It fully joined the Schengen area without internal border controls on 1 January 2024","It has a permanent opt-out from the Schengen rules under a Protocol annexed to the Treaties","It participates in Schengen, but internal border controls have not yet been abolished by the Council","It applies only the common visa policy and is not connected to the Schengen Information System"],2,"The Schengen area page states Cyprus participates in Schengen cooperation but internal border controls have not yet been abolished by the Council.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area_en"],["Q0431",0,0,10,"Benefits of Schengen",1,"According to the European Commission (DG HOME) Schengen pages, approximately how many people cross internal borders every day?",["Over 10 million","Over 3.5 million","Over 1 million","Over 450 million"],1,"The page states that every day over 3.5 million people cross internal borders.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area_en"],["Q0432",0,0,10,"Travelling to and within the Schengen area",1,"According to the European Commission (DG HOME) Schengen pages, if a Schengen country temporarily reintroduces internal border controls, whom must it inform?",["The Council (thus other Schengen States), the European Parliament, the Commission and the public","Frontex and Europol, which coordinate the controls with the neighbouring Member States","Only the European Commission, which then informs the other Schengen countries and the Council","Only the neighbouring Member States directly affected, through bilateral diplomatic channels"],0,"The page states that the country must inform the Council, the European Parliament, the Commission and the public.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area_en"],["Q0433",0,0,10,"Well-functioning Schengen – cross-border police cooperation",1,"According to the European Commission (DG HOME) Schengen pages, which mechanisms are cited as part of cross-border police cooperation under Schengen?",["Extradition and mutual recognition of judgments","Return operations and readmission agreements","Joint border checks and common visas","Cross-border surveillance and hot pursuit"],3,"The Schengen area page cites the right of cross-border surveillance and hot pursuit.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area_en"],["Q0434",0,0,10,"History of Schengen",0,"According to the European Commission (DG HOME) Schengen pages, where was the Schengen Agreement signed in 1985?",["In the European Parliament in Strasbourg","In the Berlaymont building in Brussels","On board a vessel on the River Moselle","In the city hall of Luxembourg"],2,"The History page states the project started in 1985 on board a vessel on the River Moselle, shared by Luxembourg, Germany and France.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/history-schengen_en"],["Q0435",0,0,10,"History of Schengen",0,"According to the European Commission (DG HOME) Schengen pages, which five countries signed the Schengen Agreement in 1985?",["Belgium, Germany, Luxembourg, the Netherlands and Austria","Belgium, France, Germany, Luxembourg and the Netherlands","France, Germany, Italy, Spain and Portugal","Belgium, France, Germany, Italy and Luxembourg"],1,"The History page lists Belgium, France, Germany, Luxembourg and the Netherlands.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/history-schengen_en"],["Q0436",0,0,10,"History of Schengen – Timeline",1,"According to the European Commission (DG HOME) Schengen pages, in which year did the Schengen Convention enter into force and the Schengen area get created?",["1995","1990","1999","1985"],0,"The timeline shows the Schengen Convention entering into force and the area being created in 1995.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/history-schengen_en"],["Q0437",0,0,10,"History of Schengen",1,"According to the European Commission (DG HOME) Schengen pages, which Treaty incorporated the Schengen rules into EU law?",["The Treaty of Lisbon (2007)","The Treaty of Maastricht (1992)","The Treaty of Nice (2001)","The Treaty of Amsterdam (1997)"],3,"The History page states the 1997 Treaty of Amsterdam incorporated the Schengen rules into EU law.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/history-schengen_en"],["Q0438",0,0,10,"History of Schengen – Timeline",2,"According to the European Commission (DG HOME) Schengen pages, in which year were internal border controls abolished with Croatia?",["2025","2020","2023","2013"],2,"The timeline lists the abolition of internal border controls with Croatia in 2023.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/history-schengen_en"],["Q0439",0,0,10,"Criteria for countries to join Schengen",2,"According to the European Commission (DG HOME) Schengen pages, once a new EU Member State's Schengen evaluation confirms readiness, what is needed to abolish internal border controls?",["A Commission implementing act, adopted after consulting the Schengen evaluation committee","A Council decision, representing agreement of all Member States applying the Schengen rules","A referendum in the acceding State, followed by notification to the Council and Commission","A vote of the European Parliament by absolute majority, following a Commission proposal"],1,"The page states the Council must take a decision, representing agreement by all EU Member States applying the Schengen rules.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/history-schengen_en"],["Q0440",0,0,10,"Schengen Governance",1,"According to the European Commission (DG HOME) Schengen pages, what are the two main pillars of Schengen governance?",["The Schengen Cycle, with the Schengen Council at its heart, and the Schengen Evaluation and Monitoring Mechanism","The Schengen Borders Code, with the Practical Handbook at its heart, and the Visa Code with its handbooks","The State of Schengen report, adopted by the Commission, and the Schengen Information System","Frontex, with the Standing Corps at its heart, and eu-LISA with the large-scale IT systems it manages"],0,"The Schengen Governance page identifies the Schengen Cycle and the Schengen Evaluation and Monitoring Mechanism.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/schengen-governance_en"],["Q0441",0,0,10,"History of Schengen – Timeline",2,"According to the European Commission (DG HOME) Schengen pages, in which year did the first meeting of the Schengen Council take place, establishing the Schengen Cycle?",["2015","2024","2019","2022"],3,"The timeline lists 2022 for the first Schengen Council meeting and establishment of the Schengen Cycle.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/history-schengen_en"],["Q0442",0,0,10,"Cases requiring action due to unforeseeable events (Art. 25a(1-3) SBC)",1,"According to the European Commission (DG HOME) Schengen pages, for how long may a Member State immediately reintroduce internal border control without prior notification for an unforeseeable threat?",["6 months","3 months","1 month","10 days"],2,"The page states border control may be reintroduced immediately for 1 month without prior notification, with an overall limit of 3 months.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/temporary-reintroduction-border-control_en"],["Q0443",0,0,10,"Cases requiring action due to foreseeable events (Art. 25a(4-6) SBC)",2,"According to the European Commission (DG HOME) Schengen pages, in a major exceptional situation, what is the maximum total duration internal border controls for a foreseeable threat can reach?",["Two years","Three years","Eighteen months","Five years"],1,"The page explains the 2-year maximum may be extended by 6 months plus a final 6 months, bringing the total up to three years.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/temporary-reintroduction-border-control_en"],["Q0444",0,0,10,"Cases where exceptional circumstances put the Schengen area at risk (Art. 29 SBC)",1,"According to the European Commission (DG HOME) Schengen pages, what is the maximum period of reintroduced border controls under Article 29 SBC?",["Two years","Three years","Six months","One year"],0,"The page states such reintroductions are limited to six months, prolongable no more than three times, for a maximum of two years.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-area/temporary-reintroduction-border-control_en"],["Q0445",0,0,10,"Duration of short-stay visas",2,"According to the European Commission (DG HOME) Schengen pages, to which agreement does the old definition of short stay (3 months during a 6-month period following the date of first entry) continue to apply?",["The visa waiver agreement between the EU and the United States","The visa facilitation agreement between the EU and Ukraine","The local border traffic agreement between Romania and Moldova","The visa waiver agreement between the EU and Brazil"],3,"The Border crossing page states the old definition continues to apply to the EU-Brazil visa waiver agreement.","https://home-affairs.ec.europa.eu/policies/schengen/border-crossing_en"],["Q0446",0,0,10,"Local border traffic regime",1,"According to the European Commission (DG HOME) Schengen pages, what does the local border traffic regime enable?",["Frontex to deploy standing corps teams in border regions without the host Member State's consent","Member States to reintroduce internal border controls in their border regions without notification","Border residents to cross external borders frequently without a Schengen visa, under bilateral agreements","Any visa-exempt traveller to stay up to 180 days in the border regions of a neighbouring Member State"],2,"The page explains that the regime enables bilateral agreements so border residents can cross without a Schengen visa.","https://home-affairs.ec.europa.eu/policies/schengen/border-crossing_en"],["Q0447",0,0,10,"Frontex",1,"According to the European Commission (DG HOME) Schengen pages, which Regulation governs joint operations at sea coordinated by Frontex, setting rules on interception, rescue and disembarkation?",["Regulation (EU) No 2016/399","Regulation (EU) No 656/2014","Regulation (EU) No 2018/1240","Regulation (EU) No 2019/1896"],1,"The Border crossing page states joint operations at sea are governed by Regulation EU/656/2014.","https://home-affairs.ec.europa.eu/policies/schengen/border-crossing_en"],["Q0448",0,0,10,"What is EU visa policy?",0,"According to the European Commission (DG HOME) Schengen pages, which procedures apply to visas for stays exceeding 90 days?",["National procedures","The EU Visa Code","The ETIAS Regulation","The Schengen Borders Code"],0,"The Visa policy page states that visas for stays exceeding 90 days are subject to national procedures.","https://home-affairs.ec.europa.eu/policies/schengen/visa-policy_en"],["Q0449",0,0,10,"Countries whose nationals require a visa",1,"According to the European Commission (DG HOME) Schengen pages, where is the list of countries whose nationals require a visa to be found?",["Annex I of the Visa Code (Regulation (EC) No 810/2009)","Annex II of Regulation (EU) 2018/1806","Annex XI of the Schengen Borders Code","Annex I of Regulation (EU) 2018/1806"],3,"The page refers to Annex I of Regulation (EU) 2018/1806 for visa-required countries (Annex II for exempt ones).","https://home-affairs.ec.europa.eu/policies/schengen/visa-policy_en"],["Q0450",0,0,10,"Visa code",2,"According to the European Commission (DG HOME) Schengen pages, what is the 'visa leverage mechanism' in the Visa Code?",["A mechanism allowing visa fees to be lowered for third countries with high tourism to the EU","A mechanism allowing visas to be issued at the external border during peak travel seasons","A mechanism allowing restrictive visa measures where a country does not cooperate on readmissions","A mechanism suspending visa-free travel when a third country's citizens frequently overstay"],2,"The Visa policy page explains that, if a country does not cooperate sufficiently on readmissions, restrictive measures on visa processing and fees can be imposed.","https://home-affairs.ec.europa.eu/policies/schengen/visa-policy_en"],["Q0451",0,0,10,"Suspension of visa-free travel",2,"According to the European Commission (DG HOME) Schengen pages, under the visa suspension mechanism as amended by Regulation (EU) 2025/2441, how long may a suspension initially last and by how much can it be extended?",["Up to 6 months, extendable for a further 12 months","Up to 12 months, extendable for a further 24 months","Up to 9 months, extendable for a further 18 months","Up to 24 months, extendable for a further 12 months"],1,"The page states the suspension can initially last up to 12 months and may be extended for a further 24 months.","https://home-affairs.ec.europa.eu/policies/schengen/visa-policy_en"],["Q0452",0,0,10,"Visa reciprocity",1,"According to the European Commission (DG HOME) Schengen pages, with which visa-free third country has the EU not yet achieved full visa reciprocity?",["The United States","Australia and New Zealand","Japan and South Korea","Canada and Mexico"],0,"The Visa policy page states reciprocity has been achieved with all visa-free third countries except the United States.","https://home-affairs.ec.europa.eu/policies/schengen/visa-policy_en"],["Q0453",0,0,10,"Visa facilitation agreements",1,"According to the European Commission (DG HOME) Schengen pages, which visa facilitation agreement is currently fully suspended?",["The agreement with Ukraine","The agreement with Georgia","The agreement with Belarus","The agreement with Russia"],3,"The page states 2 agreements are suspended: Russia (full suspension) and Belarus (partial suspension).","https://home-affairs.ec.europa.eu/policies/schengen/visa-policy_en"],["Q0454",0,0,10,"How much does a visa cost?",0,"According to the European Commission (DG HOME) Schengen pages, what is the standard Schengen visa fee for adults?",["€60","€80","€90","€120"],2,"The Applying for a Schengen visa page lists €90 for adults and €45 for children aged 6-12.","https://home-affairs.ec.europa.eu/policies/schengen/visa-policy/applying-schengen-visa_en"],["Q0455",0,0,10,"When to apply",1,"According to the European Commission (DG HOME) Schengen pages, within which window must a Schengen visa application be submitted?",["At least 7 days before the intended journey and no earlier than 1 year beforehand","At least 15 days before the intended journey and no earlier than 6 months beforehand","At least 30 days before the intended journey and no earlier than 3 months beforehand","At least 45 days before the intended journey and no earlier than 9 months beforehand"],1,"The page states applications must be submitted at least 15 days before travel and no earlier than 6 months beforehand.","https://home-affairs.ec.europa.eu/policies/schengen/visa-policy/applying-schengen-visa_en"],["Q0456",0,0,10,"How long does the application take to process?",1,"According to the European Commission (DG HOME) Schengen pages, what is the normal processing time for a Schengen visa application, and to how many days may it be extended?",["15 days, extendable up to 45 days","15 days, extendable up to 90 days","30 days, extendable up to 60 days","10 days, extendable up to 30 days"],0,"The page states the normal processing time is 15 days, extendable up to 45 days.","https://home-affairs.ec.europa.eu/policies/schengen/visa-policy/applying-schengen-visa_en"],["Q0457",0,0,10,"Entry/Exit System (EES)",0,"According to the European Commission (DG HOME) Schengen pages, what does the EES replace as of 10 April 2026?",["The Schengen Information System","The Visa Information System","The ETIAS travel authorisation","The stamping of passports"],3,"The EES page states that as of 10 April 2026 the EES replaces the stamping of passports, allowing automatic detection of overstayers.","https://home-affairs.ec.europa.eu/policies/schengen/smart-borders/entry-exit-system_en"],["Q0458",0,0,10,"Entry/Exit System (EES)",1,"According to the European Commission (DG HOME) Schengen pages, which data does the EES register?",["Criminal records of third-country nationals and the alerts on persons wanted for arrest","Travel authorisation data of visa-exempt travellers and the results of automated risk screening","Name, travel document data, biometrics, date and place of entry and exit, and refusals of entry","Visa application data, ten fingerprints of all applicants and the decisions taken by consulates"],2,"The EES page lists name, travel document data, biometrics, date and place of entry and exit, and refusals of entry.","https://home-affairs.ec.europa.eu/policies/schengen/smart-borders/entry-exit-system_en"],["Q0459",0,0,10,"What is ETIAS",1,"According to the European Commission (DG HOME) Schengen pages, what is the newly set ETIAS travel authorisation fee?",["EUR 35","EUR 20","EUR 7","EUR 12"],1,"The ETIAS page states the fee has been set at EUR 20 instead of the previous EUR 7.","https://home-affairs.ec.europa.eu/policies/schengen/smart-borders/european-travel-information-authorisation-system_en"],["Q0460",0,0,10,"Smart Borders",1,"According to the European Commission (DG HOME) Schengen pages, travellers from how many visa-exempt countries will need an ETIAS travel authorisation?",["59","61","45","29"],0,"The Smart Borders page describes ETIAS as a travel authorisation for non-EU nationals from 59 visa-exempt countries travelling to 30 European countries.","https://home-affairs.ec.europa.eu/policies/schengen/smart-borders_en"],["Q0461",0,0,10,"SIRENE cooperation",0,"According to the European Commission (DG HOME) Schengen pages, what does SIRENE stand for?",["Schengen Information Regional Exchange Network for Europe","Schengen Inquiry and Response for National Enforcement","Security Information and Rapid Exchange Network of Europol","Supplementary Information Request at the National Entries"],3,"The SIRENE cooperation page states SIRENE stands for supplementary information request at the national entries; bureaux operate 24/7.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-information-system/sirene-cooperation_en"],["Q0462",0,0,10,"Alerts and data in SIS",2,"According to the European Commission (DG HOME) Schengen pages, what is the minimum data set for an SIS alert on a person?",["Name, place of birth, DNA profile, the reason for the alert and the expiry date of the alert","Name, photograph, travel document number, home address and the date the alert was issued","Name, year of birth, reference to the decision giving rise to the alert, and action to be taken","Name, full date of birth, nationality, fingerprints and the identity of the issuing authority"],2,"The Alerts and data in SIS page lists name, year of birth, reference to the decision and the action to be taken.","https://home-affairs.ec.europa.eu/policies/schengen/schengen-information-system/alerts-and-data-sis_en"],["Q0463",0,0,10,"How is my data in VIS protected?",1,"According to the European Commission (DG HOME) Schengen pages, for how long are data kept in the Visa Information System?",["Three years","Five years","One year","Ten years"],1,"The VIS page states data are kept for five years, starting from visa expiry or the relevant decision date.","https://home-affairs.ec.europa.eu/policies/schengen/visa-information-system_en"],["Q0464",0,0,10,"Operational structure – National Coordination Centre",1,"According to the European Commission (DG HOME) Schengen pages, in EUROSUR, what does each Member State's National Coordination Centre (NCC) maintain?",["The national situational picture","The common pre-frontier intelligence picture for all Member States","The European situational picture","The EUROSUR Fusion Services"],0,"The EUROSUR page states each NCC maintains the national situational picture; Frontex maintains the European situational picture.","https://home-affairs.ec.europa.eu/policies/schengen/eurosur_en"],["Q0465",0,0,10,"Effective management of external borders",1,"According to the European Commission (DG HOME) Schengen pages, of how many components is European integrated border management made up?",["12","8","10","15"],3,"The page states European integrated border management is made up of 15 components with border control centrally positioned.","https://home-affairs.ec.europa.eu/policies/schengen/effective-management-external-borders_en"],["Q0466",0,0,11,"Q&A, General questions 'What is the Pact on Migration and Asylum?'; News 12 June 2026",0,"From which date has the Pact on Migration and Asylum been in application across the EU?",["1 January 2026","12 June 2025","1 July 2026","12 June 2026"],3,"The Pact was adopted in 2024 and, after a two-year transition period, entered into application on 12 June 2026.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0467",0,0,11,"Q&A, General questions 'What is the Pact on Migration and Asylum?'",0,"How many legislative files make up the Pact on Migration and Asylum, adopted in 2024?",["Ten","Five","Eight","Twelve"],0,"The Q&A states that the Pact consists of 10 legislative files designed to strengthen and harmonise the EU approach to migration and asylum.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0468",0,0,11,"Legislative files in a nutshell, Screening Regulation 'What is new?'",0,"Under the Screening Regulation of the Pact, within what time must screening at the external borders be completed?",["7 days","3 days","5 days","10 days"],0,"Screening must be completed within 7 days at the external borders (and 3 days for persons apprehended within the territory).","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0469",0,0,11,"Legislative files in a nutshell, Screening Regulation 'What is new?'",1,"Under the Screening Regulation, within what time must the screening of persons apprehended within the territory of a Member State be completed?",["7 days","3 days","24 hours","5 days"],1,"The Screening Regulation sets 3 days for screening of persons apprehended within the territory, versus 7 days at the external borders.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0470",0,0,11,"Questions and answers on the Pact, 'How does screening work under the new system?'",0,"Which set of checks must be carried out under the Screening Regulation on non-EU nationals who cross the EU external border illegally?",["Identity, language, employability and health checks","Identity, security, health and vulnerability checks","Security, financial means, family-link and accommodation checks","Criminal record, language, vulnerability and age checks"],1,"The Screening Regulation requires preliminary health and vulnerability checks and identity and security checks, after which the person is channelled to the appropriate procedure.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0471",0,0,11,"Questions and answers on the Pact, 'How does screening work under the new system?'",1,"To which States does the Screening Regulation apply?",["All EU Member States except Ireland, plus Norway, Liechtenstein, Switzerland and Iceland","All 27 EU Member States, but none of the four Schengen Associated Countries","All EU Member States except Denmark and Ireland, plus Norway and Iceland only","All EU Member States, plus the United Kingdom under a separate readmission agreement"],0,"The Q&A specifies that the Screening Regulation applies to all Schengen States, i.e. all EU Member States apart from Ireland and the four Schengen Associated Countries.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0472",0,0,11,"Questions and answers on the Pact, 'Before the Pact / New system' table – Secure external borders",1,"Under the Pact, Member States are obliged to set up an independent mechanism to monitor respect for fundamental rights during which stages?",["Resettlement and humanitarian admission operations","Dublin transfers between Member States only","Voluntary departure and reintegration programmes","Screening and the asylum border procedure"],3,"The Pact introduces an obligation to set up independent monitoring to ensure respect of fundamental rights during screening and border procedures.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0473",0,0,11,"Legislative files in a nutshell, Asylum and Migration Management Regulation",0,"Which instrument does the Asylum and Migration Management Regulation (AMMR) replace?",["The Schengen Borders Code","The Dublin III Regulation","The Return Directive","The Qualification Directive"],1,"The AMMR replaces the 'Dublin III Regulation' and improves the system for determining the Member State responsible for asylum applications.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0474",0,0,11,"Legislative files in a nutshell, AMMR 'Clear Responsibility'",1,"Under the AMMR, within what time must a take-back request be submitted after receiving a Eurodac hit?",["2 months","1 month","6 weeks","2 weeks"],3,"The AMMR shortens deadlines, e.g. a take-back request must be submitted within 2 weeks after a Eurodac hit instead of 2 months.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0475",0,0,11,"Questions and answers on the Pact, 'How are abuses – such as absconding or secondary movements – prevented?'",1,"Under the AMMR, what happens if a Member State fails to send a 'take-back' notification on time?",["No shift of responsibility occurs, so a transfer can still be organised at any time","Responsibility shifts automatically to the Member State where the applicant is present","The applicant may then choose which Member State will examine the application","The Commission designates the responsible Member State by an implementing act"],0,"Unlike the previous rules, there is no shift of responsibility if a take-back notification is not sent on time, so authorities can organise a transfer at any time.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0476",0,0,11,"Legislative files in a nutshell, AMMR 'Clear Responsibility'",1,"Under the AMMR, what is a consequence for an applicant who does not comply with the obligation to apply in, and remain in, the Member State of first entry until the responsible Member State is determined?",["Automatic detention for the whole duration of the asylum procedure","Only basic needs are provided rather than the full reception conditions","Immediate removal to the country of origin without examination of the claim","A permanent ban on applying for international protection anywhere in the EU"],1,"The nutshell explains that non-compliance leads to important consequences, like providing only for basic needs rather than the full reception conditions.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0477",0,0,11,"Legislative files in a nutshell, AMMR 'Mandatory but flexible solidarity'",0,"Under the AMMR solidarity mechanism, by what date each year does the Commission adopt the annual report, the implementing decision on migratory pressure and the proposal establishing the Solidarity Pool?",["15 October","1 June","30 September","31 December"],0,"Every year by 15 October the Commission adopts the annual report, the implementing decision and a proposal for a Council Implementing Act on the Solidarity Pool.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0478",0,0,11,"Legislative files in a nutshell, AMMR 'Mandatory but flexible solidarity'",1,"Under the AMMR, which institution adopts the implementing act establishing the annual Solidarity Pool, and by when?",["The Commission, by 15 October","The European Parliament, by 30 October","The European Council, by 1 June","The Council, before the end of the year"],3,"Based on the Commission proposal, the Council adopts before the end of the year a Council Implementing Act establishing the Solidarity Pool.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0479",0,0,11,"Legislative files in a nutshell, AMMR 'Mandatory but flexible solidarity'",1,"Under the AMMR, which of the following is a type of solidarity contribution Member States may choose for the Solidarity Pool?",["Alternative solidarity measures, such as staff and in-kind support","Deployment of national armed forces to another Member State's border","Temporary reintroduction of internal border controls on behalf of another State","Issuing visas on behalf of the benefitting Member State"],0,"Member States may contribute through relocations, financial contributions or alternative solidarity measures (staff and in-kind support).","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0480",0,0,11,"Legislative files in a nutshell, AMMR 'Mandatory but flexible solidarity'",2,"How does the AMMR describe a 'significant migratory situation'?",["A situation of mass arrivals that renders the Member State's asylum, reception or return system non-functional","A situation in which a third country or hostile actor instrumentalises migrants to destabilise a Member State","A situation less severe than migratory pressure, reflecting the cumulative effect of current and previous annual arrivals","An abnormal, unforeseeable event such as a natural disaster that prevents compliance with asylum rules"],2,"The nutshell defines a significant migratory situation as less severe than migratory pressure, taking into account the cumulative effect of current and previous annual arrivals; Member States in it can request a deduction of their contributions.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0481",0,0,11,"Questions and answers on the Pact, 'What is a responsibility offset? When can these be used?'",2,"Under the AMMR, what is a 'responsibility offset'?",["A financial payment by which a Member State is released from all of its solidarity obligations for one full year","The transfer of a beneficiary of international protection to a third country with which the EU has concluded an agreement","The Member State where the applicant is present examines the claim instead of transferring them back","A reduction of the benefitting Member State's adequate border procedure capacity in exchange for receiving relocations"],2,"A responsibility offset covers applicants who moved in an unauthorised way: the Member State where they are present examines the application instead of sending them back, and this counts as solidarity.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0482",0,0,11,"Legislative files in a nutshell, AMMR 'Mandatory but flexible solidarity'",2,"Under the AMMR, when do responsibility offsets become mandatory?",["When financial contributions fall below EUR 600 million","When the Council fails to adopt the Solidarity Pool before year-end","When a Member State is declared to be in a force majeure situation","When relocation pledges are insufficient"],3,"The nutshell states that responsibility offsets become mandatory if relocation pledges are insufficient.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0483",0,0,11,"Legislative files in a nutshell, AMMR 'Mandatory but flexible solidarity'",1,"Under the AMMR, who oversees and supports the entire solidarity process?",["The Executive Director of the EU Agency for Asylum","An EU Solidarity Coordinator in the Commission","The Fundamental Rights Officer of Frontex","The rotating Presidency of the Council of the EU"],1,"The nutshell indicates that the process will be overseen and supported by an EU Solidarity Coordinator in the Commission.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0484",0,0,11,"Questions and answers on the Pact, 'How does the Commission calculate Member States' contributions?'",2,"What minimum annual thresholds at EU level does the AMMR set for the Solidarity Pool?",["20 000 relocations and EUR 400 million in financial contributions","50 000 relocations and EUR 1 billion in financial contributions","30 000 relocations and EUR 300 million in financial contributions","30 000 relocations and EUR 600 million in financial contributions"],3,"The AMMR foresees minimum thresholds of 30 000 relocations and EUR 600 million for financial contributions at EU level per year.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0485",0,0,11,"Questions and answers on the Pact, 'How does the Commission calculate Member States' contributions?'",0,"On what basis is each contributing Member State's 'fair share' of solidarity calculated under the AMMR?",["Number of asylum applications and GDP","Territorial size and population","GDP and population","Length of external borders and GDP"],2,"The Commission's proposal indicates each contributing Member State's fair share based on the GDP and population of each country.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0486",0,0,11,"Questions and answers on the Pact, 'What is financial solidarity? How is it channelled?'",2,"How are financial solidarity contributions under the AMMR channelled to benefitting Member States?",["As direct bilateral transfers between the national treasuries of the Member States","Through the Frontex budget, as operational grants managed by the Agency","Through the European Social Fund Plus and the ERDF, via cohesion programmes","As external assigned revenue under AMIF and BMVI, via changes to national programmes"],3,"Contributions are paid to the EU budget as external assigned revenue under AMIF and BMVI and channelled by the Commission via modification of the benefitting States' programmes.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0487",0,0,11,"Questions and answers on the Pact, 'What is financial solidarity? ... Can it support activities in third countries?'",2,"Under which fund can AMMR financial solidarity contributions also support actions in third countries?",["The Asylum, Migration and Integration Fund (AMIF)","The Border Management and Visa Policy Instrument (BMVI)","The Internal Security Fund (ISF)","The EU Solidarity Fund (EUSF)"],0,"The Q&A specifies that, in the case of the AMIF, financial contributions can also support actions in third countries.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0488",0,0,11,"Questions and answers on the Pact, 'What is the border procedure?'",0,"The mandatory asylum border procedure applies to applicants who are nationals of countries with an EU-wide recognition rate at or below which threshold?",["25%","33%","50%","20%"],3,"The mandatory border procedure applies to nationals of countries with low recognition rates (20% or lower), among other cases.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0489",0,0,11,"Questions and answers on the Pact, 'What is the border procedure?'",0,"What is the standard maximum duration of the asylum border procedure, including the appeal?",["6 weeks","8 weeks","24 weeks","12 weeks"],3,"The border procedure can only last 12 weeks and includes the entire appeal procedure.","https://home-affairs.ec.europa.eu/policies/migration-and-asylum/pact-migration-and-asylum_en"],["Q0490",0,0,11,"Questions and answers on the Pact, 'What is the border procedure?'",1,"What happens if no decision is taken within the time limit of the asylum border procedure?",["The application is deemed implicitly withdrawn and the file is close
